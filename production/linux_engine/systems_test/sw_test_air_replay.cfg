        [lua]
            code=<<
                local n = 0
                for _i, side in ipairs{ 1, 2 } do
                    for _j, id in ipairs(sw_systems.air.sortie_order) do n = n + sw_systems.air.charges(side, id) end
                end
                local ranks = 0
                for _i, u in ipairs(wesnoth.units.find_on_map{}) do ranks = ranks + (tonumber(u.variables.sw_rank_shown) or 0) end
                std_print("SW_TEST: INFO air sorties left " .. n .. " of 5, rank insignia shown " .. ranks)
            >>
        [/lua]
        [endlevel]
