#textdomain wesnoth-Star_Wars_Thrawn_Trilogy
# Engine replay test for off-map air support and rank insignia (run with -u
# by run_systems_tests.py --suite replay). Two AI sides fight a ground battle
# for six turns: both hold strafing and bombing runs (hit rolls on the synced
# RNG, telegraphed bombs, AI avoidance), anti-air on both sides, and units
# close to promotion and AMLA ranks. Digests of all state (including air
# charges, inbound strikes and ranks) are recorded with wesnoth.sync and
# re-verified while the engine replays the game. Staged only for tests.

#define SW_AIR_REPLAY_CHECKPOINT
    [lua]
        code=<<
            local d = sw_systems.digest()
            local rec = wesnoth.sync.evaluate_single(function() return { digest = d } end)
            local mode = wesnoth.current.user_is_replaying and "replay" or "original"
            if rec.digest ~= d then
                wesnoth.log("error", "SW_REPLAY digest mismatch at turn " .. wesnoth.current.turn .. ": recorded " ..
                    tostring(rec.digest) .. " now " .. d)
                std_print("SW_TEST: FAIL replay digest turn " .. wesnoth.current.turn .. " (" .. mode .. ")")
            else
                local ins = {}
                for _i, dd in ipairs(sw_systems.doctrine.enabled_sides()) do table.insert(ins, "side" .. dd.side .. "=" .. dd.insight) end
                std_print("SW_TEST: PASS replay digest turn " .. wesnoth.current.turn .. " (" .. mode .. ") " .. d ..
                    " contacts=" .. #wml.array_access.get("sw_ew_contacts") .. " decoys=" .. #wml.array_access.get("sw_ew_decoys") ..
                    " insight " .. table.concat(ins, ","))
            end
        >>
    [/lua]
#enddef

