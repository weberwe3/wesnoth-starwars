#textdomain wesnoth-Star_Wars_Thrawn_Trilogy
# Test-only scenario for the sensors/EW and Thrawn Doctrine systems. Staged
# into the add-on by run_systems_tests.py --suite intel; never shipped in a
# campaign. Open grass map (hills at 10,13, forest at 12,13). Side 1
# (republic) plays under fog so contacts beyond sight can be tested; side 2
# (imperial) has no fog; side 3 (pirates) is an empty AI side.
[scenario]
    id=sw_test_intel
    name= _ "Intelligence systems test"
    next_scenario=null
    turns=-1
    victory_when_enemies_defeated=no
    map_file=sw_test_intel.map
    {SW_TACTICAL_SYSTEMS}
    [time]
        id=sw_test_noon
        name= _ "Noon"
        lawful_bonus=0
    [/time]
    [side]
        side=1
        controller=human
        team_name=republic
        defeat_condition=never
        no_leader=yes
        fog=yes
        shroud=no
        gold=0
    [/side]
    [side]
        side=2
        controller=human
        team_name=imperial
        defeat_condition=never
        no_leader=yes
        fog=no
        shroud=no
        gold=0
    [/side]
    [side]
        side=3
        controller=ai
        team_name=pirates
        defeat_condition=never
        no_leader=yes
        fog=no
        shroud=no
        gold=0
    [/side]
[/scenario]
