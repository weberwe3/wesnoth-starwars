#textdomain wesnoth-Star_Wars_Thrawn_Trilogy
# Test-only scenario for the Force and overwatch systems. Staged into the
# add-on by run_systems_tests.py; never shipped in a campaign. Flat open map
# (no fog, no time-of-day bonus) with one impassable hex at 12,4.
[scenario]
    id=sw_test_systems
    name= _ "Systems test"
    next_scenario=null
    turns=-1
    victory_when_enemies_defeated=no
    map_file=sw_test_systems.map
    {SW_TACTICAL_SYSTEMS}
    [time]
        id=sw_test_noon
        name= _ "Noon"
        lawful_bonus=0
    [/time]
    [side]
        side=1
        controller=human
        team_name=republic
        defeat_condition=never
        no_leader=yes
        fog=no
        shroud=no
        gold=0
    [/side]
    [side]
        side=2
        controller=human
        team_name=imperial
        defeat_condition=never
        no_leader=yes
        fog=no
        shroud=no
        gold=0
    [/side]
[/scenario]
