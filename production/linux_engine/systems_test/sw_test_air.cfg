#textdomain wesnoth-Star_Wars_Thrawn_Trilogy
# Test-only scenario for off-map air support and rank insignia. Staged into
# the add-on by run_systems_tests.py --suite air; never shipped. Open grass
# map with a forest block at 14-17,11-13; two human sides without fog (side 2
# is handed to the AI for one turn) and an empty AI side.
[scenario]
    id=sw_test_air
    name= _ "Air support test"
    next_scenario=null
    turns=-1
    victory_when_enemies_defeated=no
    map_file=sw_test_air.map
    {SW_TACTICAL_SYSTEMS}
    [time]
        id=sw_test_noon
        name= _ "Noon"
        lawful_bonus=0
    [/time]
    [side]
        side=1
        controller=human
        team_name=republic
        defeat_condition=never
        no_leader=yes
        fog=no
        shroud=no
        gold=0
    [/side]
    [side]
        side=2
        controller=human
        team_name=imperial
        defeat_condition=never
        no_leader=yes
        fog=no
        shroud=no
        gold=0
    [/side]
    [side]
        side=3
        controller=ai
        team_name=pirates
        defeat_condition=never
        no_leader=yes
        fog=no
        shroud=no
        gold=0
    [/side]
    # Hero withdrawal (balance review): the test hero is pulled out instead
    # of dying; the stand-in for a mission-critical hero loses the scenario
    # only if the plugin lets it die (it never does).
    {SW_HERO_WITHDRAWS sw_test_withdrawer}
    {SW_HERO_WITHDRAWS sw_test_withdrawer2}
[/scenario]
