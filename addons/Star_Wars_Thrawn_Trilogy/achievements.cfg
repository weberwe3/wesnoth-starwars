    {SW_ACHIEVEMENT sw_unbroken units/sw-hero-khabarakh/standing.png ( _ "No One Left Behind") {SW_UNBROKEN_RULE}}
    {SW_ACH_PROGRESS sw_ace units/sw-unit-nr-awing/standing.png ( _ "Ace of the Dark Force") {SW_ACE_RULE} 40}
    [achievement]
        id=sw_swift
        icon={SW_ACH_ICON attacks/sw-blaster-pistol.png}
        name= _ "Hit and Run"
        description={SW_SWIFT_RULE}
        {SW_ACH_SWIFT sw_dfr_01_the_noghri_prisoner ( _ "The Noghri Prisoner")}
        {SW_ACH_SWIFT sw_dfr_02_honoghr ( _ "Honoghr")}
        {SW_ACH_SWIFT sw_dfr_03_jomark ( _ "Jomark")}
        {SW_ACH_SWIFT sw_dfr_04_the_senators_men ( _ "The Senator's Men")}
        {SW_ACH_SWIFT sw_dfr_06_the_mad_jedi ( _ "The Mad Jedi")}
        {SW_ACH_SWIFT sw_dfr_07_the_dark_force ( _ "The Dark Force")}
        {SW_ACH_SWIFT sw_dfr_08_aboard_the_katana ( _ "Aboard the Katana")}
        {SW_ACH_SWIFT sw_dfr_09_battle_for_the_fleet ( _ "Battle for the Fleet")}
