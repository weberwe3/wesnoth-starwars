# Trilogy-wide and tactics achievements (any campaign counts).
[achievement_group]
    display_name= _ "Star Wars: Thrawn Trilogy — Tactics"
    content_for=Star_Wars_Thrawn_Trilogy_Tactics

    {SW_ACHIEVEMENT sw_trilogy units/sw-unit-im-star-destroyer/standing.png ( _ "The Thrawn Trilogy") ( _ "Complete all three campaigns.")}
    {SW_ACH_PROGRESS sw_force attacks/sw-lightsaber-green.png ( _ "Trust the Force") ( _ "Use Force powers 25 times.") 25}
    {SW_ACH_PROGRESS sw_overwatch attacks/sw-blaster-rifle.png ( _ "Hold the Line") ( _ "Put units on overwatch 20 times.") 20}
    {SW_ACH_PROGRESS sw_sweep misc/sw-contact.png ( _ "Eyes in the Dark") ( _ "Run 10 sensor sweeps.") 10}
    {SW_ACH_PROGRESS sw_air attacks/sw-concussion-bomb.png ( _ "Call It In") ( _ "Call air support 8 times.") 8}
[/achievement_group]

#undef SW_ACH_ICON
#undef SW_ACHIEVEMENT
#undef SW_ACH_PROGRESS
#undef SW_ACH_SWIFT
#undef SW_SWIFT_RULE
#undef SW_UNBROKEN_RULE
#undef SW_ACE_RULE
