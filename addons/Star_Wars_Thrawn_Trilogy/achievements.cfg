[achievement_group]
    display_name= _ "Star Wars: The Last Command"
    content_for=Star_Wars_Thrawn_Trilogy_The_Last_Command

    {SW_ACHIEVEMENT sw_complete units/sw-hero-mara/standing.png ( _ "The Last Command") ( _ "Complete The Last Command.")}
    {SW_ACHIEVEMENT sw_hard units/sw-hero-luuke/standing.png ( _ "Beyond the Last Command") ( _ "Complete The Last Command on Hard.")}
    {SW_ACHIEVEMENT sw_unbroken units/sw-hero-lando/standing.png ( _ "No One Left Behind") {SW_UNBROKEN_RULE}}
    {SW_ACH_PROGRESS sw_ace units/sw-unit-nr-ywing/standing.png ( _ "Ace of Bilbringi") {SW_ACE_RULE} 40}
    [achievement]
        id=sw_swift
        icon={SW_ACH_ICON attacks/sw-blaster-pistol.png}
        name= _ "Hit and Run"
        description={SW_SWIFT_RULE}
        {SW_ACH_SWIFT sw_tlc_01_the_siege_of_coruscant ( _ "The Siege of Coruscant")}
        {SW_ACH_SWIFT sw_tlc_03_the_palace_infiltrators ( _ "The Palace Infiltrators")}
        {SW_ACH_SWIFT sw_tlc_04_landfall_on_wayland ( _ "Landfall on Wayland")}
