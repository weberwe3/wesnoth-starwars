#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Achievements, shown in the main menu's Achievements screen. The engine reads
# this file from the add-on root (src/achievements.cpp) whether or not the
# add-on is active, so icons use paths from the user-data root.
# Awarded by lua/sw_achievements.lua; a group's content_for is its campaign id.

#define SW_ACH_ICON FILE
"data/add-ons/Star_Wars_Thrawn_Trilogy/images/{FILE}"#enddef

#define SW_ACHIEVEMENT ID ICON NAME DESC
    [achievement]
        id={ID}
        icon={SW_ACH_ICON {ICON}}
        name={NAME}
        description={DESC}
    [/achievement]
#enddef

#define SW_ACH_PROGRESS ID ICON NAME DESC MAX
    [achievement]
        id={ID}
        icon={SW_ACH_ICON {ICON}}
        name={NAME}
        description={DESC}
        max_progress={MAX}
    [/achievement]
#enddef

#define SW_ACH_SWIFT MISSION NAME
    [sub_achievement]
        id={MISSION}
        icon={SW_ACH_ICON attacks/sw-blaster-pistol.png}
        description= _ "Swift victory: " + {NAME}
    [/sub_achievement]
#enddef

#define SW_SWIFT_RULE
_ "Win each mission below with at least a third of its turns unused (missions you must hold until the last turn are not included)."#enddef

#define SW_UNBROKEN_RULE
_ "Complete the campaign without any hero withdrawing wounded."#enddef

#define SW_ACE_RULE
_ "Destroy 40 enemy starfighters or warships in this campaign's space battles. Kills carry over between playthroughs."#enddef

[achievement_group]
    display_name= _ "Star Wars: Heir to the Empire"
    content_for=Star_Wars_Thrawn_Trilogy

    {SW_ACHIEVEMENT sw_complete units/sw-hero-xwing-luke/standing.png ( _ "Heir to the Empire") ( _ "Complete Heir to the Empire.")}
    {SW_ACHIEVEMENT sw_hard units/sw-hero-thrawn/standing.png ( _ "The Grand Admiral's Equal") ( _ "Complete Heir to the Empire on Hard.")}
    {SW_ACHIEVEMENT sw_unbroken units/sw-hero-leia/standing.png ( _ "No One Left Behind") {SW_UNBROKEN_RULE}}
    {SW_ACH_PROGRESS sw_ace units/sw-unit-nr-xwing/standing.png ( _ "Ace of Sluis Van") {SW_ACE_RULE} 40}
    [achievement]
        id=sw_swift
        icon={SW_ACH_ICON attacks/sw-blaster-pistol.png}
        name= _ "Hit and Run"
        description={SW_SWIFT_RULE}
        {SW_ACH_SWIFT sw_hte_01_ysalamiri_harvest ( _ "The Grand Admiral's Harvest")}
        {SW_ACH_SWIFT sw_hte_02_ambush_at_bpfassh ( _ "Ambush at Bpfassh")}
        {SW_ACH_SWIFT sw_hte_05_prisoner_of_myrkr ( _ "Prisoner of Myrkr")}
        {SW_ACH_SWIFT sw_hte_06_raid_on_karrdes_base ( _ "Raid on Karrde's Base")}
        {SW_ACH_SWIFT sw_hte_07_the_forest_crossing ( _ "The Forest Crossing")}
        {SW_ACH_SWIFT sw_hte_09_sluis_van_shipyards ( _ "The Sluis Van Shipyards")}
    [/achievement]
[/achievement_group]

