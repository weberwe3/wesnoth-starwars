[terrain_type]
    symbol_image=sw/bunker
    id=sw_bunker_apron
    name= _ "Fortified Position"
    editor_name= _ "Duracrete Bunker (castle)"
    string=Qcb
    aliasof=Ct
    recruit_onto=yes
    editor_group=sw
[/terrain_type]

[terrain_type]
    symbol_image=sw/landing-pad-keep
    id=sw_landing_pad
    name= _ "Landing Pad"
    editor_name= _ "Landing Pad (keep)"
    string=Qkp
    aliasof=Ct
    recruit_from=yes
    recruit_onto=yes
    editor_group=sw
[/terrain_type]

[terrain_type]
    symbol_image=sw/landing-pad
    id=sw_landing_apron
    name= _ "Landing Apron"
    editor_name= _ "Landing Apron (castle)"
    string=Qcp
    aliasof=Ct
    recruit_onto=yes
    editor_group=sw
[/terrain_type]

{NEW:BASE Qid sw/interior-deck}
{NEW:BASE Qib sw/bulkhead}
{NEW:BASE Qit sw/throne-floor}
{NEW:BASE Qkb sw/bunker-keep}
{NEW:BASE Qcb sw/bunker}
{NEW:BASE Qkp sw/landing-pad-keep}
{NEW:BASE Qcp sw/landing-pad}

