# Lore terrains, phase 2b: settlements (art: production/tools/gen_lore_object_art.py;
# Codex variants may replace it via gen_codex_village_art.py after review). Each copies the mainline village
# semantics from installed terrain.cfg: aliasof=_bas, Vt; heals=8;
# gives_income=yes. Chosen per map by hte_mapkit.VILLAGE_RESKIN.
#   ^Vhc on outdoor ground -> ^Vsd prefab domes    ^Vhc on interior floor -> ^Vsp supply depot
#   ^Vht on Kashyyyk wood  -> ^Vsw Wookiee dwelling ^Vht in Wayland jungle -> ^Vsy native huts
#   ^Vhh on Honoghr        -> ^Vsn Noghri dukha     ^Vhh elsewhere         -> ^Vsd prefab domes
#   ^Vh  -> ^Vsf colonist farmstead   ^Vl -> ^Vso hunter's outpost   ^Vct -> ^Vsc Imperial field camp
