# Half the hexes use the second tree variant.
{NEW:VILLAGE *^Fsm sw/forest-myrkr2 FLAG=overlay PROB=50}
{NEW:VILLAGE *^Fsm sw/forest-myrkr FLAG=overlay}

[terrain_type]
