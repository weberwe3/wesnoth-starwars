# Lore terrains, phase 2c: planet forests (art: production/tools/gen_lore_object_art.py). Same
# semantics as the mainline forest overlays they replace on those planets
# (installed terrain.cfg: ^Ftr, ^Fet, ^Fds, ^Fp alias _bas,Ft). Applied per
# map by hte_mapkit.PLANET_FORESTS; other maps keep mainline forests.
# Two variants each (IMAGE.png, IMAGE2.png, picked at random per hex), drawn like a village overlay so
# units stand in front of the trees.
[terrain_type]
    symbol_image=sw/forest-wroshyr
    id=sw_wroshyr_forest
    name= _ "Forest"
    editor_name= _ "Wroshyr Forest (Kashyyyk)"
    string=^Fsw
    aliasof=_bas,Ft
    editor_group=sw
[/terrain_type]
# Half the hexes use the second tree variant.
{NEW:VILLAGE *^Fsw sw/forest-wroshyr2 FLAG=overlay PROB=50}
{NEW:VILLAGE *^Fsw sw/forest-wroshyr FLAG=overlay}

[terrain_type]
