#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Custom space terrains. Loaded at top level before any scenario (terrain
# types must exist when map_data is parsed). Images are original procedural
# tiles from production/tools/gen_terrain_art.py under images/terrain/sw/.
#
# Movement rule (installed data/core/terrain.cfg alias semantics):
# - Open space aliases Qt (unwalkable): only starfighter/capital movetypes in
#   units/hte_00_movetypes.cfg can cross it; foot units cannot.
# - Asteroid fields alias Mt (mountains): starfighters pay 2 MP and get 60%
#   defense; capital ships cannot enter.
# - Station decks alias Gt; hangar bays and launch rails alias Ct and allow
#   recruiting in space scenarios.
#
# Variants: NEW:BASE draws IMAGE@V, so IMAGE.png, IMAGE2.png ... IMAGE11.png
# (and NEW:VILLAGE IMAGE2..7.png) are picked at random per hex. Extra
# variants are just numbered files (production/tools/gen_codex_tile_variety.py).

[terrain_type]
    symbol_image=sw/space
    id=sw_open_space
    name= _ "Open Space"
    editor_name= _ "Open Space"
    string=Qsp
    aliasof=Qt
    editor_group=sw
[/terrain_type]

[terrain_type]
    symbol_image=sw/asteroids
    id=sw_asteroid_field
    name= _ "Asteroid Field"
    editor_name= _ "Asteroid Field"
    string=Qsa
    aliasof=Mt
    editor_group=sw
[/terrain_type]

[terrain_type]
    symbol_image=sw/deck
    id=sw_station_deck
    name= _ "Station Deck"
    editor_name= _ "Station Deck"
    string=Qsd
    aliasof=Gt
    editor_group=sw
[/terrain_type]

[terrain_type]
    symbol_image=sw/hangar
    id=sw_hangar_bay
    name= _ "Hangar Bay"
    editor_name= _ "Hangar Bay"
    string=Qsk
    aliasof=Ct
    recruit_from=yes
    recruit_onto=yes
    editor_group=sw
[/terrain_type]

[terrain_type]
    symbol_image=sw/deck2
    id=sw_launch_rail
    name= _ "Launch Rail"
    editor_name= _ "Launch Rail"
    string=Qsc
    aliasof=Ct
    recruit_onto=yes
    editor_group=sw
[/terrain_type]

{NEW:BASE Qsp sw/space}
{NEW:BASE Qsa sw/asteroids}
{NEW:BASE Qsd sw/deck}
{NEW:BASE Qsc sw/launch-rail}
{NEW:BASE Qsk sw/hangar}

