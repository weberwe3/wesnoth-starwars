# Ground clutter: small pebbles, rocks, stones and stray weeds scattered over
# about one dirt hex in five (art: production/tools/gen_codex_interior_art.py
# DECALS). Purely visual; the terrain type is unchanged. Drawn below
# transitions (layer -800, under mainline's -500 transition layer) so
# neighbouring terrain still blends over it. Each rule sets sw_decal, so a hex
# gets at most one; the engine's terrain RNG is seeded by map position, so it
# is the same for every player.
#define SW_DIRT_DECAL IMAGE PROB
    [terrain_graphics]
        [tile]
            x,y=0,0
            type=Re,Rb,Rd
            no_flag=sw_decal
            set_flag=sw_decal
            [image]
                name={IMAGE}
                layer=-800
            [/image]
        [/tile]
        probability={PROB}
    [/terrain_graphics]
#enddef
{SW_DIRT_DECAL sw/decal-pebbles.png 7}
{SW_DIRT_DECAL sw/decal-weed.png 6}
{SW_DIRT_DECAL sw/decal-stones.png 5}
{SW_DIRT_DECAL sw/decal-rock.png 5}
#undef SW_DIRT_DECAL

# Space details: faint nebulae, gas clouds, star clusters and distant galaxies
# scattered over a few open-space hexes, so space
# battles are not a uniform black field (art: Codex,
# production/tools/gen_codex_space_decals.py). Purely visual; the terrain type
# is unchanged. Same layering and one-per-hex flag as the dirt decals; the
# terrain RNG is seeded by map position, so every player sees the same sky.
#define SW_SPACE_DECAL IMAGE PROB
    [terrain_graphics]
        [tile]
            x,y=0,0
            type=Qsp
            no_flag=sw_decal
            set_flag=sw_decal
            [image]
                name={IMAGE}
                layer=-800
                # Larger than a hex: centred on it.
                center=36,36
            [/image]
        [/tile]
        probability={PROB}
    [/terrain_graphics]
#enddef
# Mirrored and rotated copies (image path functions) so repeats look different.
{SW_SPACE_DECAL sw/space-decal-3.png 1}
{SW_SPACE_DECAL "sw/space-decal-3.png~FL(horiz)" 1}
{SW_SPACE_DECAL sw/space-decal-1.png 1}
{SW_SPACE_DECAL "sw/space-decal-1.png~FL(vert)~ROTATE(90)" 1}
{SW_SPACE_DECAL "sw/space-decal-5.png~FL(horiz)" 1}
{SW_SPACE_DECAL sw/space-decal-4.png 1}
#undef SW_SPACE_DECAL

# Wall relief (environment review 2026-10-10): interior walls were flat
# textures level with the floor, so a wall read as another kind of floor.
# Where a wall meets floor, the wall hex shows its vertical face along its
# south edges (darker, with a bright lip where the top ends) and a light rim
# along its north edges, and the floor south of it takes the wall's shadow.
# Walls next to walls get no edge, so a run of wall reads as one raised
# mass. Art: production/tools/gen_wall_relief.py, from each wall's own
# texture. Purely visual. @R0 is the direction of the neighbouring hex.
#define SW_NOT_WALL
!,Qwt,Qwc,Qwp,Qwr,Qib,X*,_off^_usr#enddef
#define SW_WALL_RELIEF WALL FAMILY
    [terrain_graphics]
        map="
, *
* , 2
, 1
* , *
, *"
        [tile]
            pos=1
            type={WALL}
            [image]
                name=sw/wall-relief-{FAMILY}-@R0.png
                layer=-400
            [/image]
        [/tile]
        [tile]
            pos=2
            type={SW_NOT_WALL}
        [/tile]
        rotations=ne,se,s,sw,nw,n
    [/terrain_graphics]
#enddef
{SW_WALL_RELIEF Qwt timber}
{SW_WALL_RELIEF Qwc colony}
{SW_WALL_RELIEF Qwp palace}
{SW_WALL_RELIEF Qwr rock}
{SW_WALL_RELIEF Qib bulkhead}
#undef SW_WALL_RELIEF
[terrain_graphics]
    map="
, *
* , 2
, 1
* , *
, *"
    [tile]
        pos=1
        type={SW_NOT_WALL}
        [image]
            name=sw/wall-shadow-@R0.png
            layer=-450
        [/image]
    [/tile]
    [tile]
        pos=2
        type=Qwt,Qwc,Qwp,Qwr,Qib
    [/tile]
    rotations=ne,se,s,sw,nw,n
[/terrain_graphics]
#undef SW_NOT_WALL
