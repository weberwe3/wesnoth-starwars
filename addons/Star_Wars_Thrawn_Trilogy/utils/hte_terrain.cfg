#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Custom space terrains. Loaded at top level before any scenario (terrain
# types must exist when map_data is parsed). Images are original procedural
# tiles from production/tools/gen_terrain_art.py under images/terrain/sw/.
#
# Movement rule (installed data/core/terrain.cfg alias semantics):
# - Open space aliases Qt (unwalkable): only starfighter/capital movetypes in
#   units/hte_00_movetypes.cfg can cross it; foot units cannot.
# - Asteroid fields alias Mt (mountains): starfighters pay 2 MP and get 60%
#   defense; capital ships cannot enter.
# - Station decks alias Gt; hangar bays and launch rails alias Ct and allow
#   recruiting in space scenarios.

[terrain_type]
    symbol_image=sw/space
    id=sw_open_space
    name= _ "Open Space"
    editor_name= _ "Open Space"
    string=Qsp
    aliasof=Qt
    editor_group=sw
[/terrain_type]

[terrain_type]
    symbol_image=sw/asteroids
    id=sw_asteroid_field
    name= _ "Asteroid Field"
    editor_name= _ "Asteroid Field"
    string=Qsa
    aliasof=Mt
    editor_group=sw
[/terrain_type]

[terrain_type]
    symbol_image=sw/deck
    id=sw_station_deck
    name= _ "Station Deck"
    editor_name= _ "Station Deck"
    string=Qsd
    aliasof=Gt
    editor_group=sw
[/terrain_type]

[terrain_type]
    symbol_image=sw/hangar
    id=sw_hangar_bay
    name= _ "Hangar Bay"
    editor_name= _ "Hangar Bay"
    string=Qsk
    aliasof=Ct
    recruit_from=yes
    recruit_onto=yes
    editor_group=sw
[/terrain_type]

[terrain_type]
    symbol_image=sw/deck2
    id=sw_launch_rail
    name= _ "Launch Rail"
    editor_name= _ "Launch Rail"
    string=Qsc
    aliasof=Ct
    recruit_onto=yes
    editor_group=sw
[/terrain_type]

{NEW:BASE Qsp sw/space}
{NEW:BASE Qsa sw/asteroids}
{NEW:BASE Qsd sw/deck}
{NEW:BASE Qsc sw/deck}
{NEW:BASE Qsk sw/hangar}

# Lore terrains, phase 1: interiors, keeps and castles. Each one replaces a
# medieval mainline terrain with Star Wars art and copies that terrain's alias
# and recruit flags from installed data/core/terrain.cfg, so movement,
# defense and recruiting are unchanged:
#   Isr stone floor  -> Qid durasteel deck     (aliasof=Gt)
#   Xos stone wall   -> Qib bulkhead wall      (aliasof=Xt)
#   Urc rug          -> Qit throne-room floor  (aliasof=Gt)
#   Kh  keep         -> Qkb command bunker     (aliasof=Ct, recruit_from, recruit_onto)
#   Ch  castle       -> Qcb bunker apron       (aliasof=Ct, recruit_onto)
#   Ke  encampment keep -> Qkp landing pad     (aliasof=Ct, recruit_from, recruit_onto)
#   Ce  encampment   -> Qcp landing apron      (aliasof=Ct, recruit_onto)
# Maps keep their semantic codes in production/tools and are written with
# these codes by hte_mapkit.LORE_RESKIN.

[terrain_type]
    symbol_image=sw/interior-deck
    id=sw_durasteel_deck
    name= _ "Durasteel Deck"
    editor_name= _ "Durasteel Deck"
    string=Qid
    aliasof=Gt
    editor_group=sw
[/terrain_type]

[terrain_type]
    symbol_image=sw/bulkhead
    id=sw_bulkhead
    name= _ "Bulkhead"
    editor_name= _ "Bulkhead Wall"
    string=Qib
    aliasof=Xt
    editor_group=sw
[/terrain_type]

[terrain_type]
    symbol_image=sw/throne-floor
    id=sw_throne_floor
    name= _ "Throne Room Floor"
    editor_name= _ "Polished Stone Floor"
    string=Qit
    aliasof=Gt
    editor_group=sw
[/terrain_type]

[terrain_type]
    symbol_image=sw/bunker-keep
    id=sw_command_bunker
    name= _ "Command Bunker"
    editor_name= _ "Command Bunker (keep)"
    string=Qkb
    aliasof=Ct
    recruit_from=yes
    recruit_onto=yes
