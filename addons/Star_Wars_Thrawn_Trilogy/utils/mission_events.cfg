#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Utility macros for mission events and scenario-level gameplay mechanics.
# These macros are intended to be called from within [event] handlers or
# other WML context where side and map coordinates are known at runtime.
# Variable lifetime: all macro parameters are local to the expansion site
# and do not persist beyond the WML statement that invokes the macro.

# Macro: sw_deploy_reinforcement
# Deploys a reinforcement unit on the map for the specified side at the
# given coordinates. Intended for use inside [event] handlers such as
# "prestart", "start", "turn end", or custom event triggers.
#
# Parameters:
#   SIDE       - The side number (1-based) that the reinforcement belongs to.
#   UNIT_TYPE  - The internal unit type ID (e.g. "sw_unit_stormtrooper").
#   X          - The map x-coordinate (1-based) for unit placement.
#   Y          - The map y-coordinate (1-based) for unit placement.
#   HITPOINTS  - (optional) Starting hitpoints as a percentage (1-100).
#               Defaults to 100%.
#
# Example usage inside an event:
#   {sw_deploy_reinforcement 2 sw_unit_stormtrooper 15 7 50}
#
# Note: This macro expands to a single [unit] tag. Place it within an
# [event] block; the unit appears on the map when the event fires.
# The engine auto-assigns a unique unit id; call it by type or side
# rather than by id when referencing the unit later.
#define sw_deploy_reinforcement SIDE UNIT_TYPE X Y HITPOINTS
[unit]
    type={UNIT_TYPE}
    side={SIDE}
    x={X}
    y={Y}
    hitpoints={HITPOINTS}%
    # Reinforcements appear via event trigger; no lingering global variables.
[/unit]
#enddef

# Macro: sw_deploy_reinforcement_simple
# A streamlined variant that defaults HITPOINTS to 100%.
# Parameters: SIDE, UNIT_TYPE, X, Y are all required.
#define sw_deploy_reinforcement_simple SIDE UNIT_TYPE X Y
    {sw_deploy_reinforcement {SIDE} {UNIT_TYPE} {X} {Y} 100}
#enddef

# Macro: sw_one_time_moveto_event
# Sets a scenario variable when a specified unit moves onto a specific hex.
# This event fires only once (first_time_only), on the first qualifying moveto,
# making it suitable for objective terminals. It only records activation; the
# consuming scenario owns any dialogue, victory, defeat, or other outcome logic.
# Parameters:
#   UNIT_ID - The unique unit id (as set by [unit] or via label) that will trigger the event.
#   X       - Target x-coordinate (1-based).
#   Y       - Target y-coordinate (1-based).
#   VAR_NAME - Scenario variable set to 1 when the terminal is activated.
#              Initialize or clear this flag in the consuming scenario when its
#              lifecycle ends; this macro deliberately does not clear it.
#define sw_one_time_moveto_event UNIT_ID X Y VAR_NAME
[event]
    name=moveto
    first_time_only=yes
    [filter]
        id={UNIT_ID}
        x={X}
        y={Y}
    [/filter]
    [set_variable]
        name={VAR_NAME}
        value=1
    [/set_variable]
[/event]
#enddef
