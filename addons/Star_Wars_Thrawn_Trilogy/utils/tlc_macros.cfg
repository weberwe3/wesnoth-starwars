#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Campaign III (The Last Command) shared macros.

# Cloaked-asteroid hazard. At the end of side 1's turn every side-1 unit next
# to a cloaked asteroid (any side, any id) takes DAMAGE. The asteroid is not
# revealed by this; it stays hidden until something runs into it.
# Never lethal, so a mission cannot be lost to an unseen hazard alone.
#define SW_CLOAKED_ASTEROID_HAZARD DAMAGE
    [event]
        name=side 1 turn end
        id=sw_cloaked_asteroid_hazard
        first_time_only=no
        [harm_unit]
            [filter]
                side=1
                [filter_adjacent]
                    type=sw_unit_ob_cloaked_asteroid
                [/filter_adjacent]
            [/filter]
            amount={DAMAGE}
            damage_type=impact
            kill=no
            animate=yes
        [/harm_unit]
    [/event]
#enddef

#define SW_CLOAKED_ASTEROID X Y
    [unit]
        type=sw_unit_ob_cloaked_asteroid
        x,y={X},{Y}
        [modifications]
            {TRAIT_LOYAL}
        [/modifications]
    [/unit]
#enddef
