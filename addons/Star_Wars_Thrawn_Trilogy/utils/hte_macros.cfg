#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Shared Campaign I (Heir to the Empire) scenario macros.
# Loaded inside the CAMPAIGN_STAR_WARS_THRAWN_TRILOGY block before scenarios.

# ---------------------------------------------------------------------------
# Heroes
# ---------------------------------------------------------------------------

# Place a named hero for side 1 at X,Y. If the hero already exists on the
# recall list (carried over from an earlier mission) it is recalled there;
# otherwise a fresh loyal instance is created. Heroes never get random traits.
# Use in a prestart event.
#define SW_HERO ID TYPE NAME X Y
    [if]
        [have_unit]
            id={ID}
            search_recall_list=yes
        [/have_unit]
        [then]
            [recall]
                id={ID}
                x,y={X},{Y}
                show=no
            [/recall]
            # A hero withdrawn from a space mission comes back in its starfighter
            # form; restore the form this mission uses.
            [if]
                [have_unit]
                    id={ID}
                    [not]
                        type={TYPE}
                    [/not]
                [/have_unit]
                [then]
                    [transform_unit]
                        id={ID}
                        transform_to={TYPE}
                    [/transform_unit]
                [/then]
            [/if]
        [/then]
        [else]
            [unit]
                id={ID}
                type={TYPE}
                name={NAME}
                side=1
                x,y={X},{Y}
                random_traits=no
                [modifications]
                    {TRAIT_LOYAL_HERO}
                [/modifications]
            [/unit]
        [/else]
    [/if]
#enddef

# Same as SW_HERO but for a side-1 hero that leads (can recruit).
#define SW_HERO_LEADER ID TYPE NAME X Y
    {SW_HERO {ID} {TYPE} {NAME} {X} {Y}}
    [modify_unit]
        [filter]
            id={ID}
        [/filter]
        canrecruit=yes
    [/modify_unit]
#enddef

# Remove side-1 heroes that do not take part in this mission from the recall
# list, so the player cannot recall them out of story order. They are kept in
# the sw_stashed_heroes array (which carries over between scenarios) and
# brought back by SW_RESTORE_HEROES. IDS is a comma-separated id list.
#define SW_STASH_HEROES IDS
    [store_unit]
        [filter]
            side=1
            id={IDS}
        [/filter]
        variable=sw_stash_buffer
        kill=yes
    [/store_unit]
    [foreach]
        array=sw_stash_buffer
        [do]
            [set_variables]
                name=sw_stashed_heroes
                mode=append
                to_variable=this_item
            [/set_variables]
        [/do]
    [/foreach]
    {CLEAR_VARIABLE sw_stash_buffer}
#enddef

# Return every stashed hero to the side-1 recall list. Call at victory.
#define SW_RESTORE_HEROES
    [foreach]
        array=sw_stashed_heroes
        [do]
            [unstore_unit]
                variable=this_item
                x,y=recall,recall
            [/unstore_unit]
        [/do]
    [/foreach]
    {CLEAR_VARIABLE sw_stashed_heroes}
#enddef

# Before a new mission is entered, make sure stashed heroes are returned and
# all side-1 heroes are full HP. Used in victory events.
#define SW_VICTORY_HOUSEKEEPING
    {SW_RESTORE_HEROES}
    # Leaders carried over with canrecruit=yes would be taken as the next
    # mission's side leader in place of the one its [side] names. Clear the
    # flag on every side-1 unit (map and recall list) so each scenario's own
    # [side] leader definition decides who leads.
    [modify_unit]
        [filter]
            side=1
            canrecruit=yes
        [/filter]
        canrecruit=no
    [/modify_unit]
#enddef

# Make a hero's death lose the mission.
#define SW_HERO_DEATH_IS_DEFEAT ID
    [event]
        name=last breath
        id=sw_defeat_on_death_{ID}
        [filter]
            id={ID}
        [/filter]
        [message]
            speaker=unit
            message= _ "I can't go on..."
        [/message]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
#enddef

# A secondary hero who falls is pulled out of the fight instead of dying
# (balance review 2026-10-04, docs/balance/MISSION_BALANCE_REVIEW.md): only the
# mission's critical heroes (SW_HERO_DEATH_IS_DEFEAT) lose it. The cost is real
# -- the hero and its firepower are gone for the rest of the mission -- but one
# bad enemy turn no longer ends it.
# Engine rule (src/actions/attack.cpp, unit_killed): if WML removes the dying
# unit during "last breath", the death is cancelled. The hero is healed and
# moved to sw_stashed_heroes (so it cannot be recalled this mission);
# SW_RESTORE_HEROES returns it to the recall list at victory. [harm_unit] and
# [kill] fire the same event, so Force powers and hazards withdraw it too.
#define SW_HERO_WITHDRAWS ID
    [event]
        name=last breath
        id=sw_withdraw_on_death_{ID}
        [filter]
            id={ID}
        [/filter]
        [message]
            speaker=unit
            message= _ "I'm hit bad... pulling out!"
        [/message]
        [floating_text]
            x,y=$x1,$y1
            text="<span color='#ffb060'>" + _ "withdrawn" + "</span>"
        [/floating_text]
        [store_unit]
            [filter]
                id={ID}
            [/filter]
            variable=sw_withdraw_buffer
            kill=yes
        [/store_unit]
        {VARIABLE sw_withdraw_buffer.hitpoints $sw_withdraw_buffer.max_hitpoints}
        [set_variables]
            name=sw_stashed_heroes
            mode=append
            to_variable=sw_withdraw_buffer
        [/set_variables]
        {CLEAR_VARIABLE sw_withdraw_buffer}
    [/event]
#enddef

# The same for a hero who fights on side 1 for this mission only (dropped at
# victory): it simply leaves the battlefield and is not kept anywhere.
#define SW_HERO_WITHDRAWS_TEMPORARY ID
    [event]
        name=last breath
        id=sw_withdraw_on_death_{ID}
        [filter]
            id={ID}
        [/filter]
        [message]
            speaker=unit
            message= _ "I'm hit bad... pulling out!"
        [/message]
        [floating_text]
            x,y=$x1,$y1
            text="<span color='#ffb060'>" + _ "withdrawn" + "</span>"
        [/floating_text]
        [store_unit]
            [filter]
                id={ID}
            [/filter]
            variable=sw_withdraw_buffer
            kill=yes
        [/store_unit]
        {CLEAR_VARIABLE sw_withdraw_buffer}
    [/event]
#enddef

# ---------------------------------------------------------------------------
# Speech helpers
# ---------------------------------------------------------------------------

# A line spoken by a character who is not on the map, shown with a portrait.
#define SW_REMOTE_MESSAGE IMAGE CAPTION TEXT
    [message]
        speaker=narrator
        image={IMAGE}
        caption={CAPTION}
        message={TEXT}
    [/message]
#enddef

#define SW_THRAWN_SAYS TEXT
    {SW_REMOTE_MESSAGE portraits/sw-hero-thrawn.png ( _ "Grand Admiral Thrawn") ({TEXT})}
#enddef

# ---------------------------------------------------------------------------
# Ysalamiri
# ---------------------------------------------------------------------------

# Mark ysalamiri at the given coordinate lists. Every hex within RADIUS of one
# of them becomes part of the sw_ysalamiri_zone array that the Force abilities
# and deflection special of Force-users test against (see units/hte_heroes.cfg).
# Each affected hex is tinted so the player can see the bubble.
#define SW_YSALAMIRI_ZONE XS YS RADIUS
    # Fixed ysalamiri (in their nutrient frames on trees) at each XS,YS pair:
    # registers static Force-null sources with the Force system
    # (lua/sw_force.lua), which draws the violet field, suppresses Force
    # powers inside it and keeps sw_ysalamiri_zone in step for WML filters.
    # Mobile fields come from units with [dummy] id=sw_ability_ysalamiri.
    [store_locations]
        x={XS}
        y={YS}
        variable=sw_ysalamiri_new_sources
    [/store_locations]
    [set_variable]
        name=sw_ysalamiri_new_radius
        value={RADIUS}
    [/set_variable]
    [lua]
        code=<<
            local radius = tonumber(wml.variables.sw_ysalamiri_new_radius) or 2
            for _, loc in ipairs(wml.array_access.get("sw_ysalamiri_new_sources")) do
                sw_systems.force.add_static_source(loc.x, loc.y, radius)
                wesnoth.interface.add_item_image(loc.x, loc.y, "misc/sw-ysalamiri.png")
            end
        >>
    [/lua]
    {CLEAR_VARIABLE sw_ysalamiri_new_sources,sw_ysalamiri_new_radius}
#enddef

# Force, overwatch, sensors/EW and Thrawn Doctrine (lua/sw_systems.lua). Placed at the top level
# of every [scenario]: the [lua] runs on new games and on every load and
# registers the event handlers and right-click menus; all state is saved in
# WML and unit variables.
#define SW_TACTICAL_SYSTEMS
    [lua]
        code=<< wesnoth.dofile("~add-ons/Star_Wars_Thrawn_Trilogy/lua/sw_systems.lua") >>
    [/lua]
#enddef

# Thrawn Doctrine for a side (lua/sw_doctrine.lua) with default tiers,
# placed at the top level of a [scenario]. Campaign balance: at most one
# Insight-gaining observation per category per turn (the system default is
# two), so the Grand Admiral adapts over a mission rather than in its first
# turns. For other settings use the tag directly:
# [sw_doctrine] action=enable side= cap= turn_limit= watch= [tier]...[/tier].
#define SW_THRAWN_DOCTRINE SIDE
    [event]
        name=prestart
        id=sw_thrawn_doctrine_{SIDE}
        [sw_doctrine]
            action=enable
            side={SIDE}
            turn_limit=1
        [/sw_doctrine]
    [/event]
#enddef

# Cultural and Art Intelligence: Thrawn's staff studies captured art,
# archives or interrogations. Grants Insight to SIDE (up to its cap) and
# logs the SOURCE (art, archive, intelligence, conversation, objective).
#define SW_DOCTRINE_GRANT SIDE AMOUNT SOURCE TEXT
    [sw_doctrine]
        action=grant
        side={SIDE}
        amount={AMOUNT}
        source={SOURCE}
        text={TEXT}
    [/sw_doctrine]
#enddef

# Off-map air support (lua/sw_air.lua): grant SIDE COUNT sorties of type
# SORTIE (strafe or bombing) flown by unit type CRAFT. Use inside a prestart
# (or later) event.
#define SW_AIR_SUPPORT SIDE SORTIE COUNT CRAFT
    [sw_air_support]
        side={SIDE}
        sortie={SORTIE}
        count={COUNT}
        craft={CRAFT}
    [/sw_air_support]
#enddef

#define SW_NOTE_AIR_SUPPORT
    [note]
        description= _ "Air support: right-click a hex that a forward observer (commanders, sergeants, commandos, scouts) can see within range and choose <b>Call air support</b>. One sortie per turn; it uses the observer's attack."
    [/note]
#enddef

#define SW_NOTE_ENEMY_AIR
    [note]
        description= _ "Imperial starfighters may strafe or bomb your positions. Bombing runs are marked with orange circles a turn ahead — move out. Cover, anti-air units such as E-Web teams, and jamming spoil their aim."
    [/note]
#enddef

# The whole battlefield is a ysalamiri null field (no Force anywhere), e.g.
# Karrde's compound on Myrkr. Use inside a prestart (or later) event.
#define SW_YSALAMIRI_WORLD
    [lua]
        code=<< sw_systems.force.set_world_field(true) >>
    [/lua]
#enddef

#define SW_CLEAR_YSALAMIRI_ZONE
    {CLEAR_VARIABLE sw_ysalamiri_zone}
#enddef

# ---------------------------------------------------------------------------
# Objectives helpers
# ---------------------------------------------------------------------------

#define SW_NOTE_GOLD_CARRYOVER
    [note]
        description= _ "40% of finishing gold carries over to the next mission."
    [/note]
#enddef

# Off-map strafing run: harm every unit of side SIDE standing in the hexes
# matched by LOCATION_FILTER, with an explosion graphic on each.
#define SW_STRAFING_RUN SIDE DAMAGE LOCATION_FILTER
    [store_locations]
        {LOCATION_FILTER}
        variable=sw_strafe_hexes
    [/store_locations]
    [foreach]
        array=sw_strafe_hexes
        [do]
            [item]
                x,y=$this_item.x,$this_item.y
                halo=halo/fire-aura.png
            [/item]
        [/do]
    [/foreach]
    [delay]
        time=400
    [/delay]
    [harm_unit]
        [filter]
            side={SIDE}
            [filter_location]
                find_in=sw_strafe_hexes
            [/filter_location]
        [/filter]
        amount={DAMAGE}
        damage_type=fire
        kill=no
        animate=yes
    [/harm_unit]
    [foreach]
        array=sw_strafe_hexes
        [do]
            [remove_item]
                x,y=$this_item.x,$this_item.y
            [/remove_item]
        [/do]
    [/foreach]
    {CLEAR_VARIABLE sw_strafe_hexes}
#enddef

# Original music (production/tools/gen_codex_music_scores.py). Placed at the top level of a
# [scenario]: the first [music] replaces Wesnoth's default fantasy playlist,
# the second is appended so the mission alternates between two moods.
# Mission music: the original score (production/tools/gen_codex_music_scores.py). PRIMARY
# starts at once; SECONDARY and THIRD join the playlist, which the engine
# shuffles. Do not add {DEFAULT_MUSIC_PLAYLIST} after this: its first track
# replaces the playlist (again at prestart), so the mission would play only
# mainline fantasy music. The victory and defeat screens get short stingers.
#define SW_MUSIC PRIMARY SECONDARY THIRD
    victory_music=sw-victory.ogg
    defeat_music=sw-defeat.ogg
    [music]
        name={PRIMARY}.ogg
        immediate=yes
    [/music]
    [music]
        name={SECONDARY}.ogg
        append=yes
        ms_before=4000
    [/music]
    [music]
        name={THIRD}.ogg
        append=yes
        ms_before=4000
    [/music]
#enddef

# Field Manual: a right-click menu item, available in every mission, that
# explains the add-on's custom systems in plain terms (scope section 8:
# communicate custom systems clearly). Each topic describes the mechanic as
# implemented: abilities in units/*.cfg, terrains in utils/hte_terrain.cfg,
# hazards in utils/*_macros.cfg.
#define SW_FIELD_MANUAL_TOPIC LABEL TEXT
            [option]
                label={LABEL}
                [command]
                    [message]
                        speaker=narrator
                        image=misc/sw-objective.png
                        caption= _ "Field Manual"
                        message={TEXT}
                    [/message]
                [/command]
            [/option]
#enddef
#define SW_FIELD_MANUAL
    [event]
        name=prestart
        [set_menu_item]
            id=sw_field_manual
            description= _ "Field Manual"
            [command]
                [message]
                    speaker=narrator
                    image=misc/sw-objective.png
                    caption= _ "Field Manual"
                    message= _ "Which section of the field manual?"
                    {SW_FIELD_MANUAL_TOPIC ( _ "The Force and ysalamiri") ( _ "Force users carry Force Points (FP), shown as blue pips beside them. They regain a few each turn. Right-click a Force user and choose <b>The Force…</b>. Every power is listed with what it does, its FP cost, its range, how long it takes to recover and whether it uses your attack. Powers you cannot use right now are greyed out with the reason.

<b>Force Push</b> (2 FP, range 2, uses your attack): hurls an enemy one hex straight away from you. <b>Force Pull</b> (2 FP, range 3, uses your attack): drags an enemy at least two hexes away one hex toward you. When you pick a target, an arrow on the map shows which way it will go. If a unit, a wall or the edge of the battlefield is in the way, bold text warns that the pushed enemy will slam into it for 6 impact damage and stay where it is.

<b>Force Speed</b> (2 FP, once per turn): 2 extra movement points this turn. <b>Force Sense</b> (1 FP, once per turn): reveals every living enemy within 4 hexes until your next turn, even in fog or deep forest, and strips hiding creatures such as Noghri of their stealth. Living presences up to 8 hexes away are marked as unknown contacts. Droids, technological cloaks and anything inside a ysalamiri field cannot be sensed. <b>Mind Trick</b> (3 FP, range 2): a weak-minded enemy of level 2 or below cannot move or attack on its next turn; leaders and Force users resist. <b>Force Choke</b> (3 FP, range 3): 10 arcane damage, dark side only. <b>Blaster Deflection</b> works by itself: it turns aside an overwatch volley for 1 FP.

A ysalamiri pushes the Force back in a bubble around itself, drawn as a faint violet tint with a violet outline at its edge. A Force user inside shows a violet slashed ring: no powers, no deflection, no regeneration, and no Force agility or healing. Nothing inside can be targeted by a Force power either. A carried ysalamiri moves its bubble with its bearer. On Myrkr, the ysalamiri homeworld, the whole planet is such a field and no one can touch the Force.")}
                    {SW_FIELD_MANUAL_TOPIC ( _ "Overwatch") ( _ "Right-click a soldier and choose <b>Overwatch</b> to give up this turn's attack and watch instead. A gold crosshair marks the unit, with one bar per reaction left. Until its next turn, an enemy that moves within its range and in plain sight draws reaction fire. The moving unit stops when fired on but keeps its remaining moves.

Hidden units cannot be targeted. Each watcher fires at most once per enemy move order. Overwatch ends at the start of its side's next turn. Enemy units hold overwatch too when they end a turn without attacking.")}
                    {SW_FIELD_MANUAL_TOPIC ( _ "Blaster fire") ( _ "The colour of a bolt tells you who is shooting: red for the Imperial Remnant and other dark forces, blue or green for the New Republic and its allies, orange for independent smugglers.

Some craft keep their own colours: TIE starfighters and Star Destroyer turbolasers fire green, and X-wing, Y-wing and A-wing lasers fire red. Stun settings fire blue rings, and ion cannons fire a pale blue discharge that slows what it hits. The muzzle flash when a unit fires is always the colour of its shot.")}
                    {SW_FIELD_MANUAL_TOPIC ( _ "Space battles") ( _ "Open space can only be crossed by starfighters and capital ships; ground troops stay aboard. Asteroid fields cost starfighters extra movement but give them cover, and capital ships cannot enter them.

New squadrons launch from hangar bays and launch rails, which work like a keep and castle.")}
                    {SW_FIELD_MANUAL_TOPIC ( _ "Bases and settlements") ( _ "Command bunkers and shuttle landing pads are keeps: a leader standing on one can call in reinforcements onto the surrounding bunker aprons or landing aprons.

Settlements, supply depots, Wookiee dwellings, native villages, Noghri dukhas, farmsteads, hunters' outposts and Imperial field camps count as villages: they heal units and earn credits each turn for whoever holds them. Each kind looks different from planet to planet and from hex to hex, but they all work the same.

Buildings have their own floors and walls: timber lodges, duracrete colony buildings, palace halls and tunnels cut into rock, as well as starship decks. Floors are open ground. Walls and bulkheads cannot be crossed and block a guard's line of sight. <b>Cargo crates</b> are cover: a unit behind them gets castle-level defence, or the floor's if that is better. Forests, settlements and crates also make intruders harder for guards to spot.")}
                    {SW_FIELD_MANUAL_TOPIC ( _ "Heroes") ( _ "Named heroes cannot be replaced. Each mission names its critical heroes in the objectives: if one of them falls, the mission is lost.

Other heroes who fall are not killed. They withdraw from the fight badly wounded, marked <i>withdrawn</i>, and are gone for the rest of the mission along with their firepower. They return, healed, for the next mission. The objectives list who withdraws. Heroes who survive also continue to the next mission.")}
                    {SW_FIELD_MANUAL_TOPIC ( _ "Stealth and hidden hazards") ( _ "Noghri commandos are invisible in forest or at night, unless an enemy with <i>keen senses</i> is within two hexes of them. They are revealed when an enemy moves next to them.

Cloaked asteroids stay hidden until your sensors identify them or something runs into them, and a ship that ends its turn next to one takes damage, though never enough to destroy it. Sensors cannot track living stealth such as the Noghri's; Force Sense and keen senses can.")}
                    {SW_FIELD_MANUAL_TOPIC ( _ "Infiltration and guards") ( _ "Some missions are about getting in unseen. Guards start <b>unaware</b>: they hold their posts or walk a short patrol and do not attack or give chase. A guard spots your unit if it has a clear line of sight to it within 3 hexes (4 for vornskrs). Cover (forest, crates, settlements or any hex giving 50% defence or more) and night each cut that by 1. Fighting this turn makes noise and adds 1. A unit next to a guard is always seen. Walls block sight.

A guard that spots you becomes <b>alert</b> (""!"") and shouts, alerting every guard within 4 hexes. Alert guards fight normally. A guard just beyond seeing distance shows ""?"". Some actions, such as taking a prize the guards protect, raise the alarm for everyone.

Right-click a unit next to an unaware guard and choose <b>Silent takedown</b> to knock the guard out with your attack. Any other unaware guard who can see the spot is alerted. Vornskrs cannot be taken down. Amber-tinted hexes with an amber rim show what each unaware guard can see right now. They are only visible to you. A guard's hexes disappear the moment it is alerted or falls. Choose <b>Show or hide guard sight</b> to turn them off or back on.")}
                    {SW_FIELD_MANUAL_TOPIC ( _ "Sensors and cloaking") ( _ "Your sensors build a picture of enemies you cannot see. An amber dashed hex with a question mark is an unknown contact. An amber hex with a symbol is classified by type: capital ship (wedge), starfighter (X), vehicle, infantry, creature, or object. A red hex with corner brackets is identified but out of sight. Red brackets around a visible ship mean you have burned through its cloak. Right-click a marked hex and choose <b>Sensor contact</b> to see the strength of the reading and what it is made of.

Sensor strength is the observer's sensors, minus 1 for every 2 hexes of distance, minus enemy jamming, plus the target's signature, minus its cloak and cover. Asteroid fields, forests, settlements and mountains give cover. A reading of 0 is a contact, 3 classifies it, and 6 identifies it. Being next to a unit always identifies it. A cloaked unit stays hidden until your team identifies it, and its cloak drops for a turn when it fires.

Units with active sensors can make an <b>Active sensor sweep</b> instead of attacking: until their next turn they add their sweep rating and see 2 hexes further, but they become easier to detect. Jammers (ECM, yellow waves) weaken enemy sensors near them and near what they protect, but are loud themselves; counter-jamming (ECCM) cancels jamming. Some ships launch <b>sensor decoys</b> that read as real contacts until enemy sensors see through them or a unit comes next to them. Treat unconfirmed contacts with suspicion.")}
                    {SW_FIELD_MANUAL_TOPIC ( _ "Weapon ranges and aimed shots") ( _ "Ranged weapons reach beyond the next hex. Each weapon shows its reach as a special, such as <i>range 2</i>, beside its damage and strikes. Pistols and other close weapons reach only adjacent targets. Rifles, carbines, bowcasters and Han Solo's DL-44 reach 2 hexes. A Jedi's blaster deflection turns bolts back at a shooter up to 2 hexes away (it only answers fire, never starts it). E-Web repeaters, AT-ST cannons, guided torpedoes and capital-ship batteries reach 3. Every hex beyond the first costs 10% chance to hit, except for guided torpedoes.

To attack from range, select your unit and click an enemy within reach. A defender can only shoot back if its own weapon reaches that far, so a rifleman two hexes from a pistol-armed enemy fires without reply.

Rifles, carbines, bowcasters, bows and the DL-44 also offer an <b>aimed shot</b>: one shot fewer, but +20% to hit. Aiming takes a moment, so it needs at least two hexes of distance and only works when you attack. Choose it in the attack dialog when the target is in cover or far away.

To see a unit's reach, right-click it (yours or an enemy you can see) and choose <b>Show attack range</b>. Solid markers show the hexes it can hit from where it stands. Dotted markers show the hexes it could hit after moving: with the moves it has left for your own units, a full move for anyone else's. The markers clear when that unit moves, at the start of the next turn, or with <b>Hide attack range</b>. Enemy riflemen and gunners use their range too, firing from a distance your weapons may not reach.")}
                    {SW_FIELD_MANUAL_TOPIC ( _ "Flanking") ( _ "Surround an enemy before you strike. When you attack, every one of your units (or your allies') standing next to the target on its <b>far side</b>, away from the attacker, gives +10% chance to hit, up to +20%. For a melee attack these are the three hexes directly behind the target; for a shot from range, the hexes behind it along the line of fire. The attack dialog shows <i>flanking +10%</i> or <i>flanking +20%</i> when it applies.

Only armed units flank, and flanking helps only the attacker, never return fire. Units beside the attacker do not count. The enemy flanks too, so keep your flanks covered and don't let a unit be surrounded.")}
                    {SW_FIELD_MANUAL_TOPIC ( _ "Air support") ( _ "Starfighters support ground battles from off the map. When your side has sorties, right-click a hex that one of your forward observers can see (or tracks on sensors) within range and choose <b>Call air support</b>. Forward observers are commanders such as Han, Leia and Lando, sergeants, commandos and scouts; calling uses the observer's attack, and only one sortie flies per turn.

A <b>strafing run</b> strikes at once along four hexes leading away from the observer: three shots of 6 at every unit there. A <b>bombing run</b> marks the target and the six hexes around it with orange circles and lands at the start of your next turn: two bombs of 9 at every unit there, with +10% accuracy. Sorties hit friend and foe alike, so mind your own troops. Each shot's chance to hit depends on the target's terrain cover; enemy anti-air within range lowers accuracy by 20% each (40% at most), and enemy jamming over the target lowers it by 10% per point. Sorties never finish off a unit: they soften, your troops finish. The enemy may have sorties too; get out of a marked area before it lands.")}
                    {SW_FIELD_MANUAL_TOPIC ( _ "Ranks") ( _ "Veterans wear their rank. A unit that rises past its highest level gains a rank — Veteran, Seasoned veteran, Elite — shown as insignia on the unit: gold chevrons for the New Republic, the red-and-blue rank plaque for the Imperial Remnant, brass studs for independents, violet marks for dark Jedi. Promoted units such as sergeants and smuggler veterans start at the first rank. Many units and heroes also change their look as Seasoned veterans and Elites, earning heavier armour, capes and cloaks, or squadron colours. Each rank also brings the usual +3 maximum hit points and a full heal.")}
                    {SW_FIELD_MANUAL_TOPIC ( _ "Thrawn's doctrine") ( _ "Grand Admiral Thrawn learns his enemies. His forces gain Insight from what they observe: how you move, the weapons you use, the targets you choose, your reinforcements, your formations and your tactics. Repeating yourself teaches him faster. Captured art, archives and intelligence can teach him too. Red pips over his commander show how far his doctrine has come.

At set levels of Insight his forces gain, in order: an intelligence summary, pattern recognition, sensor doctrine (better identification and counter-jamming, and more decoys seen through), prediction of the units you are likely to attack next, and coordinated fire (+10% to hit the kinds of unit he has studied in action). Right-click his commander and choose <b>Tactical status</b> to see his current Insight and active effects. Insight never shows him what his sensors cannot detect, so cloaks and jamming still work against him. Vary your tactics.")}
                    [option]
                        label= _ "Close the manual"
                    [/option]
                [/message]
            [/command]
        [/set_menu_item]
    [/event]
#enddef

# Unarmed sprite sets (owner direction 2026-10-06). A hero who loses his
# weapon in a mission shows his unarmed variation (units/<slug>-unarmed/,
# generated by production/tools/gen_hte_units.py, UNARMED_VARIATIONS) until he
# gets it back. These only switch the art; the mission's own [object] still
# swaps the attacks. A variation outlasts [remove_object], so call SW_ARMED
# when the weapon is recovered and again at victory.
#define SW_UNARMED ID
    [modify_unit]
        [filter]
            id={ID}
        [/filter]
        variation=unarmed
    [/modify_unit]
#enddef

#define SW_ARMED ID
    [modify_unit]
        [filter]
            id={ID}
        [/filter]
        variation=
    [/modify_unit]
    # Back to the hero's rank design, if it has earned one (lua/sw_rank.lua).
    [lua]
        code=<< local args = ... for _i, u in ipairs(wesnoth.units.find_on_map{ id = args.id }) do sw_systems.rank.apply_design(u) end >>
        [args]
            id={ID}
        [/args]
    [/lua]
#enddef

# Story-slide backdrop: a painted setting image (images/story/, generated by
# production/tools/gen_codex_story_backdrops.py) behind the slide's text.
#define SW_STORY_BACKDROP KEY
    [background_layer]
        image=story/sw-story-{KEY}.jpg
        base_layer=yes
    [/background_layer]
#enddef
