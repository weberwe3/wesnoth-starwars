#textdomain wesnoth-Star_Wars_Thrawn_Trilogy
# A compact space breakout: the command flight must reach the plotted vector.

[scenario]
    id=sw_08_space_breakout
    name= _ "Space Breakout"
    map_data="Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg"
    turns=9
    victory_when_enemies_defeated=no

    [label]
        x=9
        y=3
        text= _ "Jump Vector"
    [/label]

    [side]
        side=1
        controller=human
        team_name=player
        user_team_name= _ "New Republic Breakout Force"
        type=Thrawn_Phalanx
        id=sw_space_breakout_leader
        name= _ "New Republic Flight Commander"
        x=1
        y=2
        canrecruit=yes
        gold=80
        recruit=Thrawn_Phalanx

        # This single-hex flight is the escorted command element.
        [unit]
            type=sw_unit_nr_starwing_escape
            id=sw_space_breakout_command_flight
            name= _ "New Republic Starwing Command Flight"
            x=2
            y=3
            canrecruit=no
        [/unit]
    [/side]

    [side]
        side=2
        controller=ai
        team_name=enemy
        user_team_name= _ "Imperial Remnant Pursuit"
        type=Thrawn_Phalanx
        id=sw_space_breakout_imperial_leader
        name= _ "Imperial Remnant Squadron Leader"
        x=9
        y=6
        canrecruit=yes
        gold=80
        recruit=Thrawn_Phalanx

        [unit]
            type=sw_unit_im_venator_interceptor
            id=sw_space_breakout_interceptors
            name= _ "Imperial Remnant Interceptor Squadron"
            x=6
            y=2
            canrecruit=no
        [/unit]
        [unit]
            type=sw_unit_im_torpedo_bomber_squadron
            id=sw_space_breakout_bombers
            name= _ "Imperial Remnant Torpedo-Bomber Squadron"
            x=7
            y=5
            canrecruit=no
        [/unit]
    [/side]

    # Objectives are installed at runtime so the player sees the actual mission state.
    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                description= _ "Move the New Republic Starwing Command Flight to the Jump Vector"
                condition=win
            [/objective]
            [objective]
                description= _ "The New Republic Starwing Command Flight is destroyed"
                condition=lose
            [/objective]
            [objective]
                description= _ "Turns run out"
                condition=lose
            [/objective]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_space_breakout_leader
            message= _ "The convoy is clear, but the Remnant has fighters in our wake. Command Flight, take the jump vector and keep your formation tight."
        [/message]
        [message]
            speaker=sw_space_breakout_command_flight
            message= _ "Vector received. We will hold together until the hyperdrive window opens."
        [/message]
    [/event]

    # Reaching the marked hex is the sole victory condition; enemy squadrons need not be destroyed.
    [event]
        name=moveto
        [filter]
            id=sw_space_breakout_command_flight
            x=9
            y=3
        [/filter]
        [message]
            speaker=sw_space_breakout_command_flight
            message= _ "Jump vector locked. Breakout complete—scatter to the rendezvous."
        [/message]
        [endlevel]
            result=victory
        [/endlevel]
    [/event]

    # The protected flight's loss immediately fails the mission.
    [event]
        name=die
        [filter]
            id=sw_space_breakout_command_flight
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=time over
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]
