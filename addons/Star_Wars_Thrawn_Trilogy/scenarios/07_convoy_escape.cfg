#textdomain wesnoth-Star_Wars_Thrawn_Trilogy
# A single-hex convoy extraction under Imperial Remnant pursuit.

[scenario]
    id=sw_07_convoy_escape
    name= _ "Convoy Escape"
    map_data="Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg^Fp,Gg^Fp,Gg,Gg,Gg^Fp,Gg^Fp,Gg^Fp,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg^Fp,Gg^Fp,Gg,Gg,Gg^Fp,Gg^Fp,Gg^Fp,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg"
    turns=10
    victory_when_enemies_defeated=no

    [label]
        x=9
        y=3
        text= _ "Extraction Zone"
    [/label]

    [side]
        side=1
        controller=human
        team_name=player
        user_team_name= _ "New Republic Evacuation Column"
        type=sw_unit_nr_hero_commander
        id=sw_convoy_escape_commander
        name= _ "New Republic Commander"
        x=1
        y=3
        canrecruit=yes
        gold=0
        [unit]
            # Normal Wesnoth units occupy one logical hex; this transport is the required cargo.
            type=sw_unit_nr_evacuation_transport
            id=sw_convoy_escape_transport
            name= _ "New Republic Evacuation Transport"
            x=2
            y=3
            side=1
        [/unit]
    [/side]

    [side]
        side=2
        controller=ai
        team_name=enemy
        user_team_name= _ "Imperial Remnant Pursuit"
        type=Thrawn_Phalanx
        id=sw_convoy_escape_pursuit_leader
        name= _ "Imperial Remnant Pursuit Leader"
        x=8
        y=3
        canrecruit=yes
        gold=0
        [unit]
            type=Thrawn_Phalanx
            id=sw_convoy_escape_pursuer
            name= _ "Imperial Remnant Pursuer"
            x=6
            y=3
            side=2
        [/unit]
    [/side]

    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                description= _ "Move the New Republic Evacuation Transport to the Extraction Zone"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of the New Republic Evacuation Transport"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of the New Republic Commander"
                condition=lose
            [/objective]
            [objective]
                description= _ "Turns run out"
                condition=lose
            [/objective]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_convoy_escape_commander
            message= _ "The patrol schedules bought us a route, not safety. Keep the evacuation transport moving; the extraction beacon is our only way past the Remnant cordon."
        [/message]
    [/event]

    # Victory occurs only when the required single-hex transport enters the marked hex.
    [event]
        name=moveto
        [filter]
            id=sw_convoy_escape_transport
            x=9
            y=3
        [/filter]
        [message]
            speaker=sw_convoy_escape_transport
            message= _ "Extraction beacon confirmed. The passengers are aboard the departing shuttle."
        [/message]
        [endlevel]
            result=victory
        [/endlevel]
    [/event]

    [event]
        name=die
        [filter]
            id=sw_convoy_escape_transport
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=die
        [filter]
            id=sw_convoy_escape_commander
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=time over
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]
