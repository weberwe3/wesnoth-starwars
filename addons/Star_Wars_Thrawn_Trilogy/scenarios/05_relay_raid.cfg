#textdomain wesnoth-Star_Wars_Thrawn_Trilogy
# A self-contained New Republic raid against an Imperial Remnant relay site.

[scenario]
    id=sw_05_relay_raid
    name= _ "Relay Raid"
    map_data="Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg^Fp,Gg^Fp,Gg,Gg,Gg^Fp,Gg^Fp,Gg
Gg,Gg^Fp,Cc,Cc,Cc,Cc,Gg^Fp,Gg
Gg,Gg,Gg,Cc,Ch,Cc,Gg,Gg
Gg,Gg^Fp,Gg^Fp,Gg,Gg,Gg^Fp,Gg^Fp,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg"
    turns=10
    victory_when_enemies_defeated=no

    [label]
        x=5
        y=4
        text= _ "Imperial Communications Relay"
    [/label]

    [side]
        side=1
        controller=human
        team_name=player
        user_team_name= _ "New Republic Raid Team"
        type=sw_unit_nr_hero_commander
        id=sw_relay_raid_leader
        name= _ "New Republic Commander"
        x=1
        y=3
        canrecruit=yes
        gold=70
        recruit=sw_unit_nr_hero_commander,Thrawn_Phalanx
        [unit]
            type=Thrawn_Phalanx
            id=sw_relay_raid_scout
            name= _ "Raid Team Scout"
            x=2
            y=3
            side=1
        [/unit]
    [/side]

    [side]
        side=2
        controller=ai
        team_name=enemy
        user_team_name= _ "Imperial Remnant Relay Guard"
        type=Thrawn_Phalanx
        id=sw_relay_guard_leader
        name= _ "Relay Garrison Commander"
        x=6
        y=3
        canrecruit=yes
        gold=85
        recruit=Thrawn_Phalanx
        [unit]
            type=Thrawn_Phalanx
            id=sw_relay_guard_one
            name= _ "Relay Guard"
            x=5
            y=3
            side=2
        [/unit]
        [unit]
            type=Thrawn_Phalanx
            id=sw_relay_guard_two
            name= _ "Relay Guard"
            x=7
            y=4
            side=2
        [/unit]
    [/side]

    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                description= _ "Move the New Republic Commander onto the Imperial Communications Relay"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of the New Republic Commander"
                condition=lose
            [/objective]
            [objective]
                description= _ "Turns run out"
                condition=lose
            [/objective]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_relay_raid_leader
            message= _ "That relay is feeding our movements to the Imperial Remnant. Reach its control node and cut the signal before their patrols close in."
        [/message]
    [/event]

    # Reaching the marked relay hex represents planting a slicer spike and
    # severing the garrison's battlefield communications.
    [event]
        name=moveto
        [filter]
            id=sw_relay_raid_leader
            x=5
            y=4
        [/filter]
        [message]
            speaker=sw_relay_raid_leader
            message= _ "The relay is silent. New Republic forces can move before the Remnant restores its net."
        [/message]
        [endlevel]
            result=victory
        [/endlevel]
    [/event]

    # The raid fails immediately if its actual side leader is defeated.
    [event]
        name=die
        [filter]
            id=sw_relay_raid_leader
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=time over
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]
