#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Campaign III, mission 3 - The Palace Infiltrators (defense).
# Key hexes (gen_tlc_maps.py m03): Leia's keep 9,9; nursery 22,9; infiltrator
# entries on the west edge 1,3 / 1,9 / 1,15, about four turns from the
# nursery, so Leia's position lies between them and the twins. (An AI soak
# showed infiltrators from the east and north reaching the nursery on turn 2.) An infiltrator reaching the nursery is
# a defeat; defeating every infiltrator after the last wave is victory.
# Variables: sw_tlc03_spawned / _killed / _last_wave (cleared at victory).

[scenario]
    id=sw_tlc_03_the_palace_infiltrators
    name= _ "The Palace Infiltrators"
    next_scenario=sw_tlc_04_landfall_on_wayland
    map_file=tlc_03_the_palace_infiltrators.map
    {SW_MUSIC sw-tension sw-heroic}
    {SW_FIELD_MANUAL}
    {SW_TACTICAL_SYSTEMS}
    {QUANTITY turns 16 14 13}
    victory_when_enemies_defeated=no
    {INDOORS}
    {DEFAULT_MUSIC_PLAYLIST}

    [story]
        [part]
            {SW_STORY_BACKDROP city-world}
            story= _ "Leia's twins, Jacen and Jaina, were born in the Imperial Palace on Coruscant, behind more guards than any children in the galaxy."
        [/part]
        [part]
            {SW_STORY_BACKDROP palace-night}
            story= _ "It was not enough. On a night when half the guard was at the orbital defenses, Imperial infiltrators came through the service corridors."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        save_id=sw_player
        persistent=yes
        defeat_condition=never
        team_name=republic
        user_team_name= _ "Palace Guard"
        id=sw_hero_leia
        type=sw_hero_leia
        name= _ "Leia Organa Solo"
        canrecruit=yes
        random_traits=no
        recruit=sw_unit_nr_trooper,sw_unit_nr_commando,sw_unit_nr_field_medic,sw_unit_im_noghri
        {QUANTITY gold 140 115 95}
        fog=yes
    [/side]

    [side]
        side=2
        controller=ai
        no_leader=yes
        team_name=imperial
        user_team_name= _ "Imperial Infiltrators"
        gold=0
        income=0
        [ai]
            aggression=0.7
            [goal]
                name=target_location
                [criteria]
                    x,y=22,9
                [/criteria]
                value=8
            [/goal]
        [/ai]
    [/side]

    [event]
        name=prestart
        [set_recruit]
            side=1
            recruit=sw_unit_nr_trooper,sw_unit_nr_commando,sw_unit_nr_field_medic,sw_unit_im_noghri
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_leia
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_STASH_HEROES sw_hero_luke,sw_hero_wedge,sw_hero_karrde,sw_hero_mara}
        {SW_HERO sw_hero_chewbacca sw_hero_chewbacca ( _ "Chewbacca") 10 9}
        {SW_HERO sw_hero_khabarakh sw_hero_khabarakh ( _ "Khabarakh") 9 10}
        [set_variable]
            name=sw_tlc03_spawned
            value=0
        [/set_variable]
        [set_variable]
            name=sw_tlc03_killed
            value=0
        [/set_variable]
        [item]
            x,y=22,9
            image=misc/sw-objective.png
        [/item]
        [label]
            x,y=22,9
            text= _ "Nursery"
        [/label]
        [objectives]
            side=1
            [objective]
                description= _ "Defeat every infiltrator"
                condition=win
            [/objective]
            [objective]
                description= _ "An infiltrator reaches the nursery"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of Leia"
                condition=lose
            [/objective]
            [note]
                description= _ "If Chewbacca or Khabarakh falls, that hero withdraws from the fight badly wounded and returns for the next mission."
            [/note]
            {TURNS_RUN_OUT}
            {SW_NOTE_GOLD_CARRYOVER}
            [note]
                description= _ "The Noghri now guard the Lady Vader: Noghri Commandos can be recruited."
            [/note]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_hero_khabarakh
            message= _ "My lady. Movement in the service corridors. Not palace staff. They move the way we were trained to move."
        [/message]
        [message]
            speaker=sw_hero_leia
            message= _ "They're after the twins. Chewie, the nursery door. Khabarakh, find them before they find us."
        [/message]
    [/event]

#define SW_TLC03_INFILTRATOR X Y
    [unit]
        side=2
        type=sw_unit_im_infiltrator
        x,y={X},{Y}
    [/unit]
    [set_variable]
        name=sw_tlc03_spawned
        add=1
    [/set_variable]
#enddef

    [event]
        name=turn 1
        {SW_TLC03_INFILTRATOR 1 3}
        {SW_TLC03_INFILTRATOR 1 15}
#ifndef EASY
        {SW_TLC03_INFILTRATOR 1 9}
#endif
    [/event]
    [event]
        name=turn 4
        {SW_TLC03_INFILTRATOR 1 9}
        {SW_TLC03_INFILTRATOR 1 3}
    [/event]
    [event]
        name=turn 7
        {SW_TLC03_INFILTRATOR 1 15}
        {SW_TLC03_INFILTRATOR 1 9}
#ifdef HARD
        {SW_TLC03_INFILTRATOR 1 3}
#endif
        [set_variable]
            name=sw_tlc03_last_wave
            value=yes
        [/set_variable]
    [/event]
#undef SW_TLC03_INFILTRATOR

    [event]
        name=moveto
        [filter]
            side=2
            x,y=22,9
        [/filter]
        [message]
            speaker=sw_hero_leia
            message= _ "No!"
        [/message]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=die
        first_time_only=no
        [filter]
            type=sw_unit_im_infiltrator
        [/filter]
        [set_variable]
            name=sw_tlc03_killed
            add=1
        [/set_variable]
        [if]
            [variable]
                name=sw_tlc03_last_wave
                boolean_equals=yes
            [/variable]
            [variable]
                name=sw_tlc03_killed
                greater_than_equal_to=$sw_tlc03_spawned
            [/variable]
            [then]
                [message]
                    speaker=sw_hero_leia
                    message= _ "That's all of them. Han is going to hear about this the moment he lands, and then he'll want to go to Wayland too."
                [/message]
                [message]
                    speaker=sw_hero_khabarakh
                    message= _ "Then we will all go, my lady. The Noghri have a debt to pay at Mount Tantiss."
                [/message]
                [endlevel]
                    result=victory
                    bonus=yes
                    {NEW_GOLD_CARRYOVER 40}
                [/endlevel]
            [/then]
        [/if]
    [/event]

    [event]
        name=victory
        {SW_VICTORY_HOUSEKEEPING}
        {CLEAR_VARIABLE sw_tlc03_spawned,sw_tlc03_killed,sw_tlc03_last_wave}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_leia}
    {SW_HERO_WITHDRAWS sw_hero_chewbacca}
    {SW_HERO_WITHDRAWS sw_hero_khabarakh}
[/scenario]
