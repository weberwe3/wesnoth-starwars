#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Campaign III, mission 6 - The Gates of Mount Tantiss (assault).
# Key hexes (gen_tlc_maps.py m06): Han's keep 3,10; garrison keep 21,10;
# shield generator (side 2 structure) 24,10. Destroying it is victory.

[scenario]
    id=sw_tlc_06_the_gates_of_tantiss
    name= _ "The Gates of Mount Tantiss"
    next_scenario=sw_tlc_07_the_cloning_vats
    map_file=tlc_06_the_gates_of_tantiss.map
    {QUANTITY turns 18 16 15}
    victory_when_enemies_defeated=no
    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [story]
        [part]
            story= _ "Han brought the Falcon in under the mountain's sensors with Leia, Lando, Chewbacca, and a team of Noghri commandos. The natives had shown them the road to the gate."
        [/part]
        [part]
            story= _ "Inside, Luke and Mara were already climbing toward the throne room. Outside, someone had to bring down the shield."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        save_id=sw_player
        persistent=yes
        defeat_condition=never
        team_name=republic
        user_team_name= _ "Assault Team"
        id=sw_hero_han
        type=sw_hero_han
        name= _ "Han Solo"
        canrecruit=yes
        random_traits=no
        recruit=sw_unit_nr_trooper,sw_unit_nr_commando,sw_unit_nr_eweb_team,sw_unit_nr_field_medic,sw_unit_im_noghri,sw_unit_wy_myneyrshi
        {QUANTITY gold 190 160 140}
        fog=no
    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial
        user_team_name= _ "Tantiss Garrison"
        id=sw_tlc06_commander
        type=sw_unit_im_officer
        name= _ "General Covell"
        canrecruit=yes
        recruit=sw_unit_im_stormtrooper,sw_unit_im_clone_trooper,sw_unit_im_royal_guard,sw_unit_im_at_st
        {QUANTITY gold 170 220 270}
        {QUANTITY income 6 9 12}
        [ai]
            aggression=0.5
            passive_leader=yes
            [goal]
                name=protect_location
                [criteria]
                    x,y=24,10
                [/criteria]
                protect_radius=4
                value=4
            [/goal]
        [/ai]
        [unit]
            id=sw_tlc06_generator
            type=sw_unit_ob_shield_generator
            x,y=24,10
        [/unit]
        [unit]
            type=sw_unit_im_at_st
            x,y=17,9
        [/unit]
        [unit]
            type=sw_unit_im_clone_trooper
            x,y=17,11
        [/unit]
    [/side]

    [event]
        name=prestart
        [set_recruit]
            side=1
            recruit=sw_unit_nr_trooper,sw_unit_nr_commando,sw_unit_nr_eweb_team,sw_unit_nr_field_medic,sw_unit_im_noghri,sw_unit_wy_myneyrshi
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_han
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_STASH_HEROES sw_hero_luke,sw_hero_mara,sw_hero_wedge,sw_hero_karrde}
        {SW_HERO sw_hero_leia sw_hero_leia ( _ "Leia Organa Solo") 4 10}
        {SW_HERO sw_hero_lando sw_hero_lando ( _ "Lando Calrissian") 3 11}
        {SW_HERO sw_hero_chewbacca sw_hero_chewbacca ( _ "Chewbacca") 4 9}
        {SW_HERO sw_hero_khabarakh sw_hero_khabarakh ( _ "Khabarakh") 2 10}
        [objectives]
            side=1
            [objective]
                description= _ "Destroy the shield generator at the mountain gate"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Han, Leia, Lando, Chewbacca, or Khabarakh"
                condition=lose
            [/objective]
            {TURNS_RUN_OUT}
            {SW_NOTE_GOLD_CARRYOVER}
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_hero_han
            message= _ "That's the gate, and that's the shield generator beside it. Take it down and we can walk in."
        [/message]
        [message]
            speaker=sw_hero_leia
            message= _ "Luke's inside already. I can feel him, and something else. Something that feels like him and isn't."
        [/message]
    [/event]

    [event]
        name=die
        [filter]
            id=sw_tlc06_generator
        [/filter]
        [message]
            speaker=sw_hero_lando
            message= _ "Shield's down! Gate's open!"
        [/message]
        [message]
            speaker=sw_hero_han
            message= _ "Chewie, Lando, with me. We're going for the cloning vats. Leia, keep the gate."
        [/message]
        [endlevel]
            result=victory
            bonus=yes
            {NEW_GOLD_CARRYOVER 40}
        [/endlevel]
    [/event]

    [event]
        name=victory
        {SW_VICTORY_HOUSEKEEPING}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_han}
    {SW_HERO_DEATH_IS_DEFEAT sw_hero_leia}
    {SW_HERO_DEATH_IS_DEFEAT sw_hero_lando}
    {SW_HERO_DEATH_IS_DEFEAT sw_hero_chewbacca}
    {SW_HERO_DEATH_IS_DEFEAT sw_hero_khabarakh}
[/scenario]
