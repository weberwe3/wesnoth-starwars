#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Campaign III, mission 1 - The Siege of Coruscant (space).
# Key hexes (gen_tlc_maps.py m01): Wedge's hangar 4,11; minelayers 26,6 and
# 26,16; ten cloaked asteroids already seeded in the middle of the map.
# Each minelayer drops another cloaked asteroid every second turn.
# Variables: sw_tlc01_minelayers_killed (cleared at victory).

[scenario]
    id=sw_tlc_01_the_siege_of_coruscant
    name= _ "The Siege of Coruscant"
    next_scenario=sw_tlc_02_the_smugglers_council
    map_file=tlc_01_the_siege_of_coruscant.map
    {SW_MUSIC sw-space sw-heroic}
    {SW_FIELD_MANUAL}
    {SW_TACTICAL_SYSTEMS}
    # Thrawn commands side 2 in person: his forces learn the player's habits.
    {SW_THRAWN_DOCTRINE 2}
    [event]
        name=start
        id=sw_doctrine_grant_start
        {SW_DOCTRINE_GRANT 2 10 intelligence ( _ "Delta Source reports from inside the Imperial Palace describe the defence plans for Coruscant.")}
    [/event]
    {QUANTITY turns 18 16 15}
    victory_when_enemies_defeated=no
    {UNDERGROUND}
    {DEFAULT_MUSIC_PLAYLIST}

    [story]
        [part]
            story= _ "The Grand Admiral did not attack Coruscant. He did something worse. His ships slipped into orbit, released something, and left."
        [/part]
        [part]
            story= _ "Sensors could find nothing. Then a freighter broke apart on an invisible rock, and the New Republic understood: the capital was surrounded by cloaked asteroids, and no one knew how many."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        save_id=sw_player
        persistent=yes
        defeat_condition=never
        team_name=republic
        user_team_name= _ "Coruscant Defense"
        id=sw_hero_wedge
        type=sw_hero_wedge
        name= _ "Wedge Antilles"
        canrecruit=yes
        random_traits=no
        recruit=sw_unit_nr_xwing,sw_unit_nr_awing,sw_unit_nr_ywing
        {QUANTITY gold 190 160 140}
        fog=no
    [/side]

    [side]
        side=2
        controller=ai
        no_leader=yes
        team_name=imperial
        user_team_name= _ "Imperial Minelaying Group"
        gold=0
        income=0
        [ai]
            aggression=0.6
        [/ai]
        [unit]
            id=sw_tlc01_minelayer_n
            type=sw_unit_im_minelayer
            name= _ "Minelayer Aurek"
            x,y=26,6
            ai_special=guardian
        [/unit]
        [unit]
            id=sw_tlc01_minelayer_s
            type=sw_unit_im_minelayer
            name= _ "Minelayer Besh"
            x,y=26,16
            ai_special=guardian
        [/unit]
        [unit]
            type=sw_unit_im_tie_fighter
            x,y=24,8
        [/unit]
        [unit]
            type=sw_unit_im_tie_fighter
            x,y=24,14
        [/unit]
#ifndef EASY
        [unit]
            type=sw_unit_im_tie_interceptor
            x,y=25,11
        [/unit]
#endif
    [/side]

    [side]
        side=3
        controller=ai
        no_leader=yes
        team_name=imperial
        user_team_name= _ "Cloaked Asteroids"
        gold=0
        income=0
        {SW_CLOAKED_ASTEROID 12 4}
        {SW_CLOAKED_ASTEROID 14 9}
        {SW_CLOAKED_ASTEROID 13 15}
        {SW_CLOAKED_ASTEROID 17 6}
        {SW_CLOAKED_ASTEROID 18 12}
        {SW_CLOAKED_ASTEROID 16 18}
        {SW_CLOAKED_ASTEROID 20 9}
        {SW_CLOAKED_ASTEROID 21 15}
        {SW_CLOAKED_ASTEROID 11 11}
        {SW_CLOAKED_ASTEROID 19 3}
    [/side]

    [event]
        name=prestart
        [set_recruit]
            side=1
            recruit=sw_unit_nr_xwing,sw_unit_nr_awing,sw_unit_nr_ywing
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_wedge
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_HERO sw_hero_luke sw_hero_xwing_luke ( _ "Luke Skywalker") 5 11}
        [transform_unit]
            id=sw_hero_luke
            transform_to=sw_hero_xwing_luke
        [/transform_unit]
        [set_variable]
            name=sw_tlc01_minelayers_killed
            value=0
        [/set_variable]
        [objectives]
            side=1
            [objective]
                description= _ "Destroy both Imperial minelayers"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Wedge Antilles"
                condition=lose
            [/objective]
            [note]
                description= _ "If Luke falls, he withdraws from the fight badly wounded and returns for the next mission."
            [/note]
            {TURNS_RUN_OUT}
            [note]
                description= _ "Cloaked asteroids are invisible. A ship that ends its turn next to one takes 8 damage. Each minelayer releases another asteroid every second turn."
            [/note]
        [/objectives]
    [/event]

    {SW_CLOAKED_ASTEROID_HAZARD 8}

    [event]
        name=start
        [message]
            speaker=sw_hero_wedge
            message= _ "We can't see the rocks, but we can see the ships dropping them. Two minelayers, east of the cordon."
        [/message]
        [message]
            speaker=sw_hero_luke
            message= _ "I can feel where some of the asteroids are, Wedge. Faintly. Fly where I fly."
        [/message]
    [/event]

    # Minelayers seed more asteroids every second turn.
    [event]
        name=turn 3,turn 5,turn 7,turn 9,turn 11,turn 13
        first_time_only=no
        [store_unit]
            [filter]
                type=sw_unit_im_minelayer
            [/filter]
            variable=sw_tlc01_layers
        [/store_unit]
        [foreach]
            array=sw_tlc01_layers
            [do]
                [unit]
                    side=3
                    type=sw_unit_ob_cloaked_asteroid
                    x,y=$($this_item.x - 2),$this_item.y
                [/unit]
            [/do]
        [/foreach]
        {CLEAR_VARIABLE sw_tlc01_layers}
    [/event]

    [event]
        name=die
        first_time_only=no
        [filter]
            type=sw_unit_im_minelayer
        [/filter]
        [set_variable]
            name=sw_tlc01_minelayers_killed
            add=1
        [/set_variable]
        [if]
            [variable]
                name=sw_tlc01_minelayers_killed
                greater_than_equal_to=2
            [/variable]
            [then]
                [message]
                    speaker=sw_hero_wedge
                    message= _ "Both minelayers down. The cordon stops growing. Now someone just has to sweep the rocks that are already up there."
                [/message]
                [endlevel]
                    result=victory
                    bonus=yes
                    {NEW_GOLD_CARRYOVER 40}
                [/endlevel]
            [/then]
        [/if]
    [/event]

    [event]
        name=victory
        [transform_unit]
            id=sw_hero_luke
            transform_to=sw_hero_luke
        [/transform_unit]
        {SW_VICTORY_HOUSEKEEPING}
        {CLEAR_VARIABLE sw_tlc01_minelayers_killed}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_wedge}
    {SW_HERO_WITHDRAWS sw_hero_luke}
[/scenario]
