#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Campaign III, mission 2 - The Smugglers' Council (fortress defense).
# Key hexes (gen_tlc_maps.py m02): Karrde's keep 12,10 in the fortress;
# Imperial keep 23,10. Five smuggler chiefs (side 3) sit in the courtyard.
# Variables: sw_tlc02_chiefs_lost (cleared at victory).

[scenario]
    id=sw_tlc_02_the_smugglers_council
    name= _ "The Smugglers' Council"
    next_scenario=sw_tlc_03_the_palace_infiltrators
    map_file=tlc_02_the_smugglers_council.map
    {SW_MUSIC sw-heroic sw-tension}
    {SW_FIELD_MANUAL}
    {SW_TACTICAL_SYSTEMS}
    {QUANTITY turns 16 15 14}
    victory_when_enemies_defeated=no
    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [story]
        [part]
            {SW_STORY_BACKDROP spaceport}
            story= _ "Talon Karrde had stayed neutral as long as neutrality paid. The Empire had stopped paying. He called the chiefs of the smuggling organizations to an old fortress on a dead world and asked them to choose a side."
        [/part]
        [part]
            {SW_STORY_BACKDROP spaceport}
            story= _ "Someone among them had already chosen. The Imperial landing craft arrived before the first toast."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        save_id=sw_player
        persistent=yes
        defeat_condition=never
        team_name=republic
        user_team_name= _ "Karrde's Organization"
        id=sw_hero_karrde
        type=sw_hero_karrde
        name= _ "Talon Karrde"
        canrecruit=yes
        random_traits=no
        # Balance review 2026-10-04: pistols reach 1 hex, the Empire's rifles 2
        # and the AT-ST 3, so an all-smuggler garrison was shot apart without
        # reply. An E-Web crew (black-market heavy repeater, 3 hexes) gives the
        # fortress a ranged anchor.
        recruit=sw_unit_sm_smuggler,sw_unit_sm_veteran,sw_unit_nr_eweb_team
        {QUANTITY gold 150 120 100}
        fog=no
    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial
        user_team_name= _ "Imperial Raid"
        id=sw_tlc02_commander
        type=sw_unit_im_officer
        name= _ "Colonel Mardek"
        canrecruit=yes
        recruit=sw_unit_im_stormtrooper,sw_unit_im_clone_trooper,sw_unit_im_scout_trooper,sw_unit_im_at_st
        # Balance review 2026-10-04: Normal 200/9 -> 170/7 (Easy 150/6 -> 130/5);
        # Hard unchanged.
        {QUANTITY gold 130 170 250}
        {QUANTITY income 5 7 12}
        [ai]
            aggression=0.6
        [/ai]
        [unit]
            type=sw_unit_im_at_st
            x,y=21,8
        [/unit]
        [unit]
            type=sw_unit_im_clone_trooper
            x,y=21,12
        [/unit]
    [/side]

    [side]
        side=3
        controller=ai
        no_leader=yes
        team_name=republic
        user_team_name= _ "Smuggler Chiefs"
        gold=0
        income=0
#define SW_TLC02_CHIEF ID NAME X Y
        [unit]
            id={ID}
            type=sw_unit_sm_veteran
            name={NAME}
            x,y={X},{Y}
            ai_special=guardian
            random_traits=no
        [/unit]
#enddef
        {SW_TLC02_CHIEF sw_tlc02_chief_1 ( _ "Mazzic") 10 8}
        {SW_TLC02_CHIEF sw_tlc02_chief_2 ( _ "Ellor") 14 8}
        {SW_TLC02_CHIEF sw_tlc02_chief_3 ( _ "Gillespee") 10 12}
        {SW_TLC02_CHIEF sw_tlc02_chief_4 ( _ "Clyngunn") 14 12}
        {SW_TLC02_CHIEF sw_tlc02_chief_5 ( _ "Par'tah") 12 13}
#undef SW_TLC02_CHIEF
    [/side]

    [event]
        name=prestart
        [set_recruit]
            side=1
            recruit=sw_unit_sm_smuggler,sw_unit_sm_veteran
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_karrde
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_STASH_HEROES sw_hero_luke,sw_hero_wedge}
        {SW_HERO sw_hero_mara sw_hero_mara ( _ "Mara Jade") 13 10}
        [set_variable]
            name=sw_tlc02_chiefs_lost
            value=0
        [/set_variable]
        [objectives]
            side=1
            [objective]
                description= _ "Hold the fortress until the last turn"
                condition=win
            [/objective]
            [objective]
                description= _ "Defeat Colonel Mardek"
                condition=win
            [/objective]
            [objective]
                description= _ "Three smuggler chiefs killed"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of Karrde"
                condition=lose
            [/objective]
            [note]
                description= _ "If Mara falls, she withdraws from the fight badly wounded and returns for the next mission."
            [/note]
            {SW_NOTE_GOLD_CARRYOVER}
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_tlc02_chief_1
            message= _ "Imperials! Karrde, you swore this place was clean!"
        [/message]
        [message]
            speaker=sw_hero_karrde
            message= _ "It was, when I chose it. Someone at this table brought them. We'll find out who later. For now, the walls are thick and the doors are few."
        [/message]
        [message]
            speaker=sw_hero_mara
            message= _ "I'll take the east gate. Try not to lose any chiefs while I'm busy."
        [/message]
    [/event]

    [event]
        name=die
        first_time_only=no
        [filter]
            side=3
        [/filter]
        [set_variable]
            name=sw_tlc02_chiefs_lost
            add=1
        [/set_variable]
        [if]
            [variable]
                name=sw_tlc02_chiefs_lost
                greater_than_equal_to=3
            [/variable]
            [then]
                [message]
                    speaker=sw_hero_karrde
                    message= _ "Too many of them are gone. There is no council left to save."
                [/message]
                [endlevel]
                    result=defeat
                [/endlevel]
            [/then]
        [/if]
    [/event]

    [event]
        name=last breath
        [filter]
            id=sw_tlc02_commander
        [/filter]
        [fire_event]
            name=sw_tlc02_win
        [/fire_event]
    [/event]

    [event]
        name=time over
        [fire_event]
            name=sw_tlc02_win
        [/fire_event]
    [/event]

    [event]
        name=sw_tlc02_win
        [message]
            speaker=sw_hero_karrde
            message= _ "The Empire tried to break us and failed. I think that settles the vote. Mara, send word to Coruscant: the smugglers are in."
        [/message]
        [message]
            speaker=sw_hero_mara
            message= _ "And I'm going to Wayland. I know where the Emperor kept his storehouse. I was there once, a long time ago."
        [/message]
        [endlevel]
            result=victory
            bonus=yes
            {NEW_GOLD_CARRYOVER 40}
        [/endlevel]
    [/event]

    [event]
        name=victory
        {SW_VICTORY_HOUSEKEEPING}
        {CLEAR_VARIABLE sw_tlc02_chiefs_lost}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_karrde}
    {SW_HERO_WITHDRAWS sw_hero_mara}
[/scenario]
