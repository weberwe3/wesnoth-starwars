#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Campaign III, mission 9 - The Bilbringi Shipyards (space assault).
# Key hexes (gen_tlc_maps.py m09): Wedge's hangar 3,11; shipyard command
# keep 27,11; four shipyard platforms at x=22; a screen of cloaked
# asteroids around x=13-16. Victory: three platforms destroyed.
# Variables: sw_tlc09_platforms (cleared at victory).

[scenario]
    id=sw_tlc_09_bilbringi
    name= _ "The Bilbringi Shipyards"
    next_scenario=sw_tlc_10_the_last_command
    map_file=tlc_09_bilbringi.map
    {SW_MUSIC sw-space sw-heroic}
    {SW_FIELD_MANUAL}
    {SW_TACTICAL_SYSTEMS}
    {QUANTITY turns 18 16 15}
    victory_when_enemies_defeated=no
    {UNDERGROUND}
    {DEFAULT_MUSIC_PLAYLIST}

    [story]
        [part]
            story= _ "With the cloning vats gone, the Grand Admiral could no longer grow new crews. The New Republic struck at the shipyards that built his ships."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        save_id=sw_player
        persistent=yes
        defeat_condition=never
        team_name=republic
        user_team_name= _ "New Republic Strike Force"
        id=sw_hero_wedge
        type=sw_hero_wedge
        name= _ "Wedge Antilles"
        canrecruit=yes
        random_traits=no
        recruit=sw_unit_nr_xwing,sw_unit_nr_awing,sw_unit_nr_ywing
        {QUANTITY gold 210 180 160}
        fog=no
    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial
        user_team_name= _ "Bilbringi Command"
        id=sw_tlc09_command
        type=sw_unit_im_star_destroyer
        name= _ "Death's Head"
        canrecruit=yes
        recruit=sw_unit_im_tie_fighter,sw_unit_im_tie_interceptor,sw_unit_im_tie_bomber
        {QUANTITY gold 140 190 240}
        {QUANTITY income 6 9 12}
        [ai]
            passive_leader=yes
            aggression=0.6
        [/ai]
#define SW_TLC09_PLATFORM X Y
        [unit]
            type=sw_unit_ob_shipyard_platform
            x,y={X},{Y}
        [/unit]
#enddef
        {SW_TLC09_PLATFORM 22 4}
        {SW_TLC09_PLATFORM 22 9}
        {SW_TLC09_PLATFORM 22 14}
        {SW_TLC09_PLATFORM 22 19}
#undef SW_TLC09_PLATFORM
    [/side]

    [side]
        side=3
        controller=ai
        no_leader=yes
        team_name=imperial
        user_team_name= _ "Cloaked Asteroids"
        gold=0
        income=0
        {SW_CLOAKED_ASTEROID 14 5}
        {SW_CLOAKED_ASTEROID 15 9}
        {SW_CLOAKED_ASTEROID 14 13}
        {SW_CLOAKED_ASTEROID 15 17}
        {SW_CLOAKED_ASTEROID 16 11}
        {SW_CLOAKED_ASTEROID 13 2}
        {SW_CLOAKED_ASTEROID 16 20}
    [/side]

    [event]
        name=prestart
        [set_recruit]
            side=1
            recruit=sw_unit_nr_xwing,sw_unit_nr_awing,sw_unit_nr_ywing
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_wedge
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_STASH_HEROES sw_hero_karrde,sw_hero_leia,sw_hero_chewbacca,sw_hero_khabarakh,sw_hero_han,sw_hero_lando,sw_hero_mara}
        {SW_HERO sw_hero_luke sw_hero_xwing_luke ( _ "Luke Skywalker") 4 11}
        [transform_unit]
            id=sw_hero_luke
            transform_to=sw_hero_xwing_luke
        [/transform_unit]
        [set_variable]
            name=sw_tlc09_platforms
            value=0
        [/set_variable]
        [objectives]
            side=1
            [objective]
                description= _ "Destroy three shipyard platforms"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Wedge Antilles or Luke Skywalker"
                condition=lose
            [/objective]
            {TURNS_RUN_OUT}
            {SW_NOTE_GOLD_CARRYOVER}
            [note]
                description= _ "A screen of cloaked asteroids guards the yards. Ships that end their turn next to one take 8 damage."
            [/note]
        [/objectives]
    [/event]

    {SW_CLOAKED_ASTEROID_HAZARD 8}

    [event]
        name=start
        [message]
            speaker=sw_hero_wedge
            message= _ "He's using his own trick against us: an asteroid screen in front of the yards. Luke?"
        [/message]
        [message]
            speaker=sw_hero_luke
            message= _ "I can sense some of them. Follow my lead through the gaps."
        [/message]
    [/event]

    [event]
        name=die
        first_time_only=no
        [filter]
            type=sw_unit_ob_shipyard_platform
        [/filter]
        [set_variable]
            name=sw_tlc09_platforms
            add=1
        [/set_variable]
        [if]
            [variable]
                name=sw_tlc09_platforms
                greater_than_equal_to=3
            [/variable]
            [then]
                [message]
                    speaker=sw_hero_wedge
                    message= _ "Three platforms gone. The yards won't be building anything for a long time."
                [/message]
                [message]
                    speaker=sw_hero_luke
                    message= _ "Wedge, new contacts on the long-range scopes. The Chimaera. Thrawn is coming himself."
                [/message]
                [endlevel]
                    result=victory
                    bonus=yes
                    {NEW_GOLD_CARRYOVER 40}
                [/endlevel]
            [/then]
        [/if]
    [/event]

    [event]
        name=victory
        {SW_VICTORY_HOUSEKEEPING}
        {CLEAR_VARIABLE sw_tlc09_platforms}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_wedge}
    {SW_HERO_DEATH_IS_DEFEAT sw_hero_luke}
[/scenario]
