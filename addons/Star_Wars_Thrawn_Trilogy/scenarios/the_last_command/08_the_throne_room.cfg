#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Campaign III, mission 8 - The Throne Room (boss battle).
# Key hexes (gen_tlc_maps.py m08): Luke and Mara start 3,8; C'baoth on the
# throne 17,8; Luuke 14,8. A ysalamiri bubble (radius 2 around 11,8) covers
# the middle of the hall: no Force abilities on either side inside it.
# Victory: both C'baoth and Luuke defeated.

[scenario]
    id=sw_tlc_08_the_throne_room
    name= _ "The Throne Room"
    next_scenario=sw_tlc_09_bilbringi
    map_file=tlc_08_the_throne_room.map
    {SW_MUSIC sw-imperial sw-tension}
    {SW_FIELD_MANUAL}
    {SW_TACTICAL_SYSTEMS}
    {QUANTITY turns 16 14 13}
    victory_when_enemies_defeated=no
    {INDOORS}
    {DEFAULT_MUSIC_PLAYLIST}

    [story]
        [part]
            {SW_STORY_BACKDROP throne-room}
            story= _ "At the heart of the mountain was the Emperor's throne room, and on the throne sat Joruus C'baoth."
        [/part]
        [part]
            {SW_STORY_BACKDROP throne-room}
            story= _ "Beside him stood a young man with Luke Skywalker's face, holding a lightsaber that burned like Luke's. C'baoth had grown him from the hand Luke lost at Bespin."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        save_id=sw_player
        persistent=yes
        defeat_condition=never
        team_name=republic
        user_team_name= _ "Luke and Mara"
        id=sw_hero_luke
        type=sw_hero_luke
        name= _ "Luke Skywalker"
        canrecruit=yes
        random_traits=no
        recruit=
        gold=0
        income=0
        fog=no
    [/side]

    [side]
        side=2
        controller=ai
        no_leader=yes
        team_name=cbaoth
        user_team_name= _ "Joruus C'baoth"
        gold=0
        income=0
        # Balance review 2026-10-04: on Easy/Normal C'baoth sends his clone
        # first. He and the Royal Guards hold the throne (guardian: they strike
        # only what comes within reach) until Luuke falls, then all of them
        # attack. Everyone charging at once at aggression 0.9 cost Mara or
        # Luke on turn 1-2 in every test. Hard keeps the all-out attack.
        [ai]
#ifdef HARD
            aggression=0.9
#else
            aggression=0.6
#endif
        [/ai]
        [unit]
            id=sw_hero_cbaoth
            type=sw_hero_cbaoth
            name= _ "Joruus C'baoth"
            x,y=17,8
            random_traits=no
#ifndef HARD
            ai_special=guardian
#endif
        [/unit]
        [unit]
            id=sw_hero_luuke
            type=sw_hero_luuke
            name= _ "Luuke"
            x,y=14,8
            random_traits=no
        [/unit]
        [unit]
            type=sw_unit_im_royal_guard
            x,y=16,6
#ifndef HARD
            ai_special=guardian
#endif
        [/unit]
        [unit]
            type=sw_unit_im_royal_guard
            x,y=16,10
#ifndef HARD
            ai_special=guardian
#endif
        [/unit]
    [/side]

    [event]
        name=prestart
        [set_recruit]
            side=1
            recruit=
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_luke
            [/filter]
            canrecruit=yes
        [/modify_unit]
        [transform_unit]
            id=sw_hero_luke
            transform_to=sw_hero_luke
        [/transform_unit]
        {SW_STASH_HEROES sw_hero_wedge,sw_hero_karrde,sw_hero_leia,sw_hero_chewbacca,sw_hero_khabarakh,sw_hero_han,sw_hero_lando}
        {SW_HERO sw_hero_mara sw_hero_mara ( _ "Mara Jade") 3 9}
        {SW_YSALAMIRI_ZONE 11 8 2}
        [objectives]
            side=1
            [objective]
                description= _ "Defeat Joruus C'baoth and his clone Luuke"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Luke"
                condition=lose
            [/objective]
            [note]
                description= _ "If Mara falls, she withdraws from the fight badly wounded and returns for the next mission."
            [/note]
            {TURNS_RUN_OUT}
            [note]
                description= _ "Mara brought a ysalamiri. Inside the violet hexes no one can use the Force: not Luke, not the clone, not C'baoth."
            [/note]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_hero_cbaoth
            message= _ "Skywalker. You came back to me, as I said you would. Meet the apprentice you refused to be."
        [/message]
        [message]
            speaker=sw_hero_luuke
            message= _ "..."
        [/message]
        [message]
            speaker=sw_hero_mara
            message= _ "I know why I've wanted to kill you, Skywalker. It was never you. It was always him."
        [/message]
        [message]
            speaker=sw_hero_luke
            message= _ "Then let's finish it. Together."
        [/message]
    [/event]

#ifndef HARD
    # While Luuke lives, C'baoth and the Royal Guards do not leave the throne:
    # they strike only what comes next to them (C'baoth's lightning reaches 2).
    # A guardian still moves to attack anything within one move, which pulled
    # the guards into the clone duel; holding them in place keeps it a duel.
    [event]
        name=side 2 turn
        first_time_only=no
        [if]
            [have_unit]
                id=sw_hero_luuke
            [/have_unit]
            [then]
                [modify_unit]
                    [filter]
                        side=2
                        [not]
                            id=sw_hero_luuke
                        [/not]
                    [/filter]
                    moves=0
                [/modify_unit]
            [/then]
        [/if]
    [/event]
#endif

    # The clone has fallen: C'baoth and his guards leave the throne.
    [event]
        name=die
        [filter]
            id=sw_hero_luuke
        [/filter]
        [modify_unit]
            [filter]
                side=2
            [/filter]
            [status]
                guardian=no
            [/status]
        [/modify_unit]
        [message]
            speaker=sw_hero_cbaoth
            message= _ "You destroy what I made for you? Then I will unmake you myself!"
        [/message]
    [/event]

    [event]
        name=die
        first_time_only=no
        [filter]
            id=sw_hero_cbaoth,sw_hero_luuke
        [/filter]
        [if]
            [have_unit]
                id=sw_hero_cbaoth,sw_hero_luuke
                [not]
                    x,y=$x1,$y1
                [/not]
            [/have_unit]
            [else]
                [message]
                    speaker=sw_hero_mara
                    message= _ "It's done. The voice that kept telling me to kill you is gone."
                [/message]
                [message]
                    speaker=sw_hero_luke
                    message= _ "And the mountain is coming down. Let's go."
                [/message]
                [endlevel]
                    result=victory
                    bonus=yes
                    {NEW_GOLD_CARRYOVER 40}
                [/endlevel]
            [/else]
        [/if]
    [/event]

    [event]
        name=victory
        {SW_CLEAR_YSALAMIRI_ZONE}
        {SW_VICTORY_HOUSEKEEPING}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_luke}
    {SW_HERO_WITHDRAWS sw_hero_mara}
[/scenario]
