#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Campaign III, mission 7 - The Cloning Vats (sabotage).
# Key hexes (gen_tlc_maps.py m07): entry keep 3,9; eight cloning cylinders
# (side 2 structures); reinforcements from the far end 23,9.
# Variables: sw_tlc07_cylinders_left (cleared at victory).

[scenario]
    id=sw_tlc_07_the_cloning_vats
    name= _ "The Cloning Vats"
    next_scenario=sw_tlc_08_the_throne_room
    map_file=tlc_07_the_cloning_vats.map
    {SW_MUSIC sw-tension sw-imperial}
    {QUANTITY turns 18 16 15}
    victory_when_enemies_defeated=no
    {INDOORS}
    {DEFAULT_MUSIC_PLAYLIST}

    [story]
        [part]
            story= _ "Deep in the mountain stood rows of tall glass cylinders, each one growing a soldier for the Grand Admiral's fleet."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        save_id=sw_player
        persistent=yes
        defeat_condition=never
        team_name=republic
        user_team_name= _ "Assault Team"
        id=sw_hero_han
        type=sw_hero_han
        name= _ "Han Solo"
        canrecruit=yes
        random_traits=no
        recruit=sw_unit_nr_trooper,sw_unit_nr_commando,sw_unit_im_noghri
        {QUANTITY gold 150 120 100}
        fog=yes
    [/side]

    [side]
        side=2
        controller=ai
        no_leader=yes
        team_name=imperial
        user_team_name= _ "Vat Guards"
        gold=0
        income=0
        [ai]
            aggression=0.6
        [/ai]
#define SW_TLC07_CYLINDER X Y
        [unit]
            type=sw_unit_ob_cloning_cylinder
            x,y={X},{Y}
        [/unit]
#enddef
        {SW_TLC07_CYLINDER 10 3}
        {SW_TLC07_CYLINDER 13 5}
        {SW_TLC07_CYLINDER 17 4}
        {SW_TLC07_CYLINDER 21 6}
        {SW_TLC07_CYLINDER 10 15}
        {SW_TLC07_CYLINDER 13 13}
        {SW_TLC07_CYLINDER 17 14}
        {SW_TLC07_CYLINDER 21 12}
#undef SW_TLC07_CYLINDER
        [unit]
            type=sw_unit_im_royal_guard
            x,y=15,9
        [/unit]
        [unit]
            type=sw_unit_im_clone_trooper
            x,y=12,9
        [/unit]
        [unit]
            type=sw_unit_im_clone_trooper
            x,y=19,9
        [/unit]
#ifndef EASY
        [unit]
            type=sw_unit_im_royal_guard
            x,y=22,9
        [/unit]
#endif
    [/side]

    [event]
        name=prestart
        [set_recruit]
            side=1
            recruit=sw_unit_nr_trooper,sw_unit_nr_commando,sw_unit_im_noghri
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_han
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_STASH_HEROES sw_hero_luke,sw_hero_mara,sw_hero_wedge,sw_hero_karrde,sw_hero_leia,sw_hero_khabarakh}
        {SW_HERO sw_hero_lando sw_hero_lando ( _ "Lando Calrissian") 4 9}
        {SW_HERO sw_hero_chewbacca sw_hero_chewbacca ( _ "Chewbacca") 4 10}
        [objectives]
            side=1
            [objective]
                description= _ "Destroy all eight cloning cylinders"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Han, Lando, or Chewbacca"
                condition=lose
            [/objective]
            [note]
                description= _ "Imperial Remnant clone reinforcements arrive on turns 5 and 9."
            [/note]
            {TURNS_RUN_OUT}
            {SW_NOTE_GOLD_CARRYOVER}
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_hero_lando
            message= _ "Han. Look at them. Rows of them. That's where the clones are coming from."
        [/message]
        [message]
            speaker=sw_hero_han
            message= _ "Not after today. Wreck every one of those tanks."
        [/message]
    [/event]

    [event]
        name=turn 5,turn 9
        first_time_only=no
        [unit]
            side=2
            type=sw_unit_im_clone_trooper
            x,y=23,9
        [/unit]
        [unit]
            side=2
            type=sw_unit_im_clone_trooper
            x,y=23,8
        [/unit]
    [/event]

    [event]
        name=die
        first_time_only=no
        [filter]
            type=sw_unit_ob_cloning_cylinder
        [/filter]
        [store_unit]
            [filter]
                type=sw_unit_ob_cloning_cylinder
            [/filter]
            variable=sw_tlc07_left
        [/store_unit]
        # The dying cylinder is still counted during its die event.
        [if]
            [variable]
                name=sw_tlc07_left.length
                less_than_equal_to=1
            [/variable]
            [then]
                [message]
                    speaker=sw_hero_han
                    message= _ "That's the last of them. Now let's find Luke before this mountain comes down on all of us."
                [/message]
                [endlevel]
                    result=victory
                    bonus=yes
                    {NEW_GOLD_CARRYOVER 40}
                [/endlevel]
            [/then]
        [/if]
        {CLEAR_VARIABLE sw_tlc07_left}
    [/event]

    [event]
        name=victory
        {SW_VICTORY_HOUSEKEEPING}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_han}
    {SW_HERO_DEATH_IS_DEFEAT sw_hero_lando}
    {SW_HERO_DEATH_IS_DEFEAT sw_hero_chewbacca}
[/scenario]
