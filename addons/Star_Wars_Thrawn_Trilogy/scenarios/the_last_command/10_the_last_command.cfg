#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Campaign III, mission 10 - The Last Command (trilogy finale).
# Key hexes (gen_tlc_maps.py m10): Wedge's hangar 3,11; Chimaera 27,11;
# escort Star Destroyers 25,4 and 25,18.
# On turn 10 (scripted) the Grand Admiral falls aboard the Chimaera and
# Captain Pellaeon orders the retreat: victory. Destroying both escorts first
# also wins. Turn 4: Thrawn's reserve interceptors appear behind the strike
# force; turn 6: Karrde's smugglers arrive as reinforcements.

[scenario]
    id=sw_tlc_10_the_last_command
    name= _ "The Last Command"
    next_scenario=null
    map_file=tlc_10_the_last_command.map
    {SW_MUSIC sw-space sw-heroic sw-thrawn}
    {SW_FIELD_MANUAL}
    {SW_TACTICAL_SYSTEMS}
    # Thrawn commands side 2 in person: his forces learn the player's habits.
    {SW_THRAWN_DOCTRINE 2}
    {QUANTITY turns 14 14 14}
    victory_when_enemies_defeated=no
    {UNDERGROUND}

    [story]
        [part]
            {SW_STORY_BACKDROP shipyard}
            story= _ "The Grand Admiral brought his fleet to Bilbringi to destroy the New Republic's strike force. It was a good plan. His plans were always good."
        [/part]
        [part]
            {SW_STORY_BACKDROP bridge}
            story= _ "On the bridge of the Chimaera, his Noghri bodyguard Rukh stood behind him, as he always did. Rukh had heard from his own people what the Empire had done to Honoghr."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        save_id=sw_player
        persistent=yes
        defeat_condition=never
        team_name=republic
        user_team_name= _ "New Republic Strike Force"
        id=sw_hero_wedge
        type=sw_hero_wedge
        name= _ "Wedge Antilles"
        canrecruit=yes
        random_traits=no
        recruit=sw_unit_nr_xwing,sw_unit_nr_awing,sw_unit_nr_ywing
        {QUANTITY gold 220 190 170}
        fog=no
    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial
        user_team_name= _ "Chimaera"
        id=sw_tlc10_chimaera
        type=sw_unit_im_star_destroyer
        name= _ "Chimaera"
        canrecruit=yes
        recruit=sw_unit_im_tie_fighter,sw_unit_im_tie_interceptor,sw_unit_im_tie_bomber
        {QUANTITY gold 160 210 260}
        {QUANTITY income 8 11 14}
        [ai]
            passive_leader=yes
            aggression=0.7
            [goal]
                name=target
                [criteria]
                    id=sw_hero_wedge
                [/criteria]
                value=3
            [/goal]
        [/ai]
    [/side]

    [side]
        side=3
        controller=ai
        team_name=imperial
        user_team_name= _ "Stormhawk"
        id=sw_tlc10_escort_n
        type=sw_unit_im_star_destroyer
        name= _ "Stormhawk"
        canrecruit=yes
        recruit=sw_unit_im_tie_fighter,sw_unit_im_tie_bomber
        {QUANTITY gold 80 110 140}
        {QUANTITY income 3 5 7}
        [ai]
            passive_leader=yes
        [/ai]
    [/side]

    [side]
        side=4
        controller=ai
        team_name=imperial
        user_team_name= _ "Nemesis"
        id=sw_tlc10_escort_s
        type=sw_unit_im_star_destroyer
        name= _ "Nemesis"
        canrecruit=yes
        recruit=sw_unit_im_tie_fighter,sw_unit_im_tie_bomber
        {QUANTITY gold 80 110 140}
        {QUANTITY income 3 5 7}
        [ai]
            passive_leader=yes
        [/ai]
    [/side]

    [event]
        name=prestart
        [set_recruit]
            side=1
            recruit=sw_unit_nr_xwing,sw_unit_nr_awing,sw_unit_nr_ywing
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_wedge
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_STASH_HEROES sw_hero_karrde,sw_hero_leia,sw_hero_chewbacca,sw_hero_khabarakh,sw_hero_han,sw_hero_lando,sw_hero_mara}
        {SW_HERO sw_hero_luke sw_hero_xwing_luke ( _ "Luke Skywalker") 4 11}
        [transform_unit]
            id=sw_hero_luke
            transform_to=sw_hero_xwing_luke
        [/transform_unit]
        [objectives]
            side=1
            [objective]
                description= _ "Hold the line until the Imperial fleet breaks (turn 10)"
                condition=win
            [/objective]
            [objective]
                description= _ "Destroy both escort Star Destroyers, Stormhawk and Nemesis"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Wedge Antilles"
                condition=lose
            [/objective]
            [note]
                description= _ "If Luke falls, he withdraws from the fight badly wounded and returns for the next mission."
            [/note]
            {TURNS_RUN_OUT}
        [/objectives]
    [/event]

    [event]
        name=start
        {SW_THRAWN_SAYS ( _ "Their formation favors the left. A habit from their pilots' training on Corellia. Captain, shift the screen.")}
        [message]
            speaker=sw_hero_wedge
            message= _ "He's reading us again. All right, Rogues: no habits today. Break and attack."
        [/message]
    [/event]

    [event]
        name=die
        first_time_only=no
        [filter]
            id=sw_tlc10_escort_n,sw_tlc10_escort_s
        [/filter]
        [if]
            [have_unit]
                id=sw_tlc10_escort_n,sw_tlc10_escort_s
                [not]
                    x,y=$x1,$y1
                [/not]
            [/have_unit]
            [else]
                [fire_event]
                    name=sw_tlc10_the_end
                [/fire_event]
            [/else]
        [/if]
    [/event]

    [event]
        name=turn 10
        [fire_event]
            name=sw_tlc10_the_end
        [/fire_event]
    [/event]

    [event]
        name=sw_tlc10_the_end
        [message]
            speaker=narrator
            caption= _ "Bridge of the Chimaera"
            message= _ "Rukh stepped forward in silence. When it was over, the Grand Admiral sat back in his command chair and looked at the tactical display one last time."
        [/message]
        {SW_THRAWN_SAYS ( _ "The Noghri. Of course. Every culture shows itself in time... and I never studied my own guard.")}
        [message]
            speaker=narrator
            image=portraits/sw-hero-pellaeon.png
            caption= _ "Captain Pellaeon"
            message= _ "Signal the fleet. All ships, disengage and withdraw to the rendezvous. ... That is an order."
        [/message]
        [message]
            speaker=sw_hero_wedge
            message= _ "They're breaking off. All of them. Luke, what just happened over there?"
        [/message]
        [message]
            speaker=sw_hero_luke
            message= _ "I don't know. But I felt it end. Whatever he was planning, it's over."
        [/message]
        [endlevel]
            result=victory
            end_text= _ "The Grand Admiral is dead, and the Imperial Remnant falls back into the dark. For now, the New Republic endures.

Thank you for playing the Thrawn Trilogy."
            end_text_duration=5000
            bonus=no
            carryover_report=no
        [/endlevel]
    [/event]

    [event]
        name=victory
        [transform_unit]
            id=sw_hero_luke
            transform_to=sw_hero_luke
        [/transform_unit]
        {SW_VICTORY_HOUSEKEEPING}
    [/event]

    # Turn 4: Thrawn's hidden reserve. TIE interceptors appear behind the
    # strike force, at the corners beside Wedge's hangar.
#define SW_TLC10_RESERVE X Y
        [unit]
            side=2
            type=sw_unit_im_tie_interceptor
            x,y={X},{Y}
            animate=yes
        [/unit]
#enddef
    [event]
        name=turn 4
        {SW_THRAWN_SAYS ( _ "Their training tells them the space behind them is safe. Captain, release the reserve.")}
        {SW_TLC10_RESERVE 1 1}
        {SW_TLC10_RESERVE 1 22}
#ifndef EASY
        {SW_TLC10_RESERVE 3 1}
#endif
#ifdef HARD
        {SW_TLC10_RESERVE 3 22}
#endif
        [message]
            speaker=sw_hero_wedge
            message= _ "Interceptors on our six! They were sitting dark behind us the whole time. Rogues, watch your backs!"
        [/message]
    [/event]
#undef SW_TLC10_RESERVE

    # Turn 6: Karrde's smugglers join the battle on the player's side.
#define SW_TLC10_SMUGGLER TYPE X Y
        [unit]
            side=1
            type={TYPE}
            x,y={X},{Y}
            animate=yes
        [/unit]
#enddef
    [event]
        name=turn 6
        {SW_TLC10_SMUGGLER sw_unit_nr_ywing 1 10}
        {SW_TLC10_SMUGGLER sw_unit_nr_xwing 1 12}
#ifdef EASY
        {SW_TLC10_SMUGGLER sw_unit_nr_ywing 1 11}
#endif
        {SW_REMOTE_MESSAGE portraits/sw-hero-karrde.png ( _ "Talon Karrde") ( _ "Commander Antilles, this is Karrde. The smugglers you once chased across half the galaxy would like a word with the Grand Admiral. Where do you want us?")}
        [message]
            speaker=sw_hero_wedge
            message= _ "Karrde! Ion cannons on those escorts. Never thought I'd be glad to see a smuggler run."
        [/message]
    [/event]
#undef SW_TLC10_SMUGGLER

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_wedge}
    {SW_HERO_WITHDRAWS sw_hero_luke}
[/scenario]
