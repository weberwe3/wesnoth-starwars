#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Campaign III, mission 4 - Landfall on Wayland (escape across jungle).
# Key hexes (gen_tlc_maps.py m04): crash site 3,10; river crossing x=24-27,
# y=9-11. Mara Jade fights on side 1 from here to the end of the campaign.

#define SW_TLC04_CROSSING
x=24-27
y=9-11
#enddef

[scenario]
    id=sw_tlc_04_landfall_on_wayland
    name= _ "Landfall on Wayland"
    next_scenario=sw_tlc_05_the_natives_of_wayland
    map_file=tlc_04_landfall_on_wayland.map
    {SW_MUSIC sw-jungle sw-tension}
    {SW_FIELD_MANUAL}
    {SW_TACTICAL_SYSTEMS}
    {QUANTITY turns 18 16 15}
    victory_when_enemies_defeated=no
    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [story]
        [part]
            {SW_STORY_BACKDROP jungle-mountain}
            story= _ "Mara Jade remembered Wayland from the Emperor's service: a jungle world, a mountain, and inside the mountain a storehouse of everything the Emperor had wanted to keep."
        [/part]
        [part]
            {SW_STORY_BACKDROP jungle-mountain}
            story= _ "She and Luke came in low and fast. Not low and fast enough. Their ship went down in the jungle a day's march from the mountain."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        save_id=sw_player
        persistent=yes
        defeat_condition=never
        team_name=republic
        user_team_name= _ "Luke and Mara"
        id=sw_hero_luke
        type=sw_hero_luke
        name= _ "Luke Skywalker"
        canrecruit=yes
        random_traits=no
        recruit=
        gold=0
        income=0
        fog=yes
    [/side]

    [side]
        side=2
        controller=ai
        no_leader=yes
        team_name=imperial
        user_team_name= _ "Tantiss Garrison"
        gold=0
        income=0
        [ai]
            aggression=0.5
        [/ai]
        [unit]
            type=sw_unit_im_scout_trooper
            x,y=12,5
        [/unit]
        [unit]
            type=sw_unit_im_scout_trooper
            x,y=15,15
        [/unit]
        [unit]
            type=sw_unit_im_stormtrooper
            x,y=20,9
        [/unit]
        [unit]
            type=sw_unit_im_stormtrooper
            x,y=21,11
        [/unit]
#ifndef EASY
        [unit]
            type=sw_unit_im_clone_trooper
            x,y=22,10
        [/unit]
#endif
    [/side]

    [event]
        name=prestart
        [set_recruit]
            side=1
            recruit=
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_luke
            [/filter]
            canrecruit=yes
        [/modify_unit]
        [transform_unit]
            id=sw_hero_luke
            transform_to=sw_hero_luke
        [/transform_unit]
        {SW_STASH_HEROES sw_hero_wedge,sw_hero_karrde,sw_hero_leia,sw_hero_chewbacca,sw_hero_khabarakh}
        {SW_HERO sw_hero_mara sw_hero_mara ( _ "Mara Jade") 3 11}
        [label]
            x,y=25,10
            text= _ "River Crossing"
        [/label]
        [objectives]
            side=1
            [objective]
                description= _ "Luke reaches the river crossing (with Mara, if she is still in the fight)"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Luke"
                condition=lose
            [/objective]
            [note]
                description= _ "If Mara falls, she withdraws from the fight badly wounded and returns for the next mission."
            [/note]
            [note]
                description= _ "Garrison patrols arrive from the north and south edges on turns 5 and 9."
            [/note]
            {TURNS_RUN_OUT}
            {SW_NOTE_GOLD_CARRYOVER}
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_hero_mara
            message= _ "Well, we're on Wayland. The mountain's east, past the river. The garrison will have seen us come down."
        [/message]
        [message]
            speaker=sw_hero_luke
            message= _ "Then we don't wait for them. Mara, I can sense C'baoth from here. He knows we're coming."
        [/message]
    [/event]

    [event]
        name=turn 5,turn 9
        first_time_only=no
        [unit]
            side=2
            type=sw_unit_im_scout_trooper
            x,y=14,1
        [/unit]
        [unit]
            side=2
            type=sw_unit_im_stormtrooper
            x,y=14,20
        [/unit]
    [/event]

    [event]
        name=moveto
        first_time_only=no
        [filter]
            id=sw_hero_luke,sw_hero_mara
            [filter_location]
                {SW_TLC04_CROSSING}
            [/filter_location]
        [/filter]
        [if]
            [have_unit]
                id=sw_hero_luke
                [filter_location]
                    {SW_TLC04_CROSSING}
                [/filter_location]
            [/have_unit]
            # Mara at the crossing too, unless she has withdrawn wounded.
            [and]
                [have_unit]
                    id=sw_hero_mara
                    [filter_location]
                        {SW_TLC04_CROSSING}
                    [/filter_location]
                [/have_unit]
                [or]
                    [not]
                        [have_unit]
                            id=sw_hero_mara
                        [/have_unit]
                    [/not]
                [/or]
            [/and]
            [then]
                [message]
                    speaker=sw_hero_mara
                    message= _ "Across. There are natives in these hills, and they don't like the garrison any more than we do."
                [/message]
                [endlevel]
                    result=victory
                    bonus=yes
                    {NEW_GOLD_CARRYOVER 40}
                [/endlevel]
            [/then]
        [/if]
    [/event]

    [event]
        name=victory
        {SW_VICTORY_HOUSEKEEPING}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_luke}
    {SW_HERO_WITHDRAWS sw_hero_mara}
[/scenario]

#undef SW_TLC04_CROSSING
