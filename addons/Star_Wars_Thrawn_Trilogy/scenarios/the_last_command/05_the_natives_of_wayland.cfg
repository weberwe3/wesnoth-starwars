#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Campaign III, mission 5 - The Natives of Wayland (alliance battle).
# Key hexes (gen_tlc_maps.py m05): Luke starts 3,10; garrison outpost keep
# 22,10; Myneyrshi villages 6,4 / 13,3 (north), Psadan villages 6,16 / 13,17
# (south), garrison-held village 24,15.
#
# Design audit 2026-10-17 (docs/design/SCENARIO_AUDIT.md): this played as a
# second two-heroes-alone jungle crossing right after Landfall on Wayland,
# with the natives appearing at the map corners. Now the war parties stand at
# their own villages from turn 1, defending them, and join the advance on
# turn 2 (Hard: 4); the garrison raids those villages ("they pay the garrison
# ... or they burn"). Signature decision: help the villages hold, or strike the
# outpost while the garrison is out raiding. Same native units as before.
# Variables: sw_tlc05_allies_kept (bonus flag, read by lua/sw_bonus.lua at
# victory, so it is not cleared here).

[scenario]
    id=sw_tlc_05_the_natives_of_wayland
    name= _ "The Natives of Wayland"
    next_scenario=sw_tlc_06_the_gates_of_tantiss
    map_file=tlc_05_the_natives_of_wayland.map
    {SW_MUSIC sw-jungle sw-heroic sw-battle}
    {SW_FIELD_MANUAL}
    {SW_TACTICAL_SYSTEMS}
    # Optional objective (lua/sw_bonus.lua).
    {SW_BONUS flag sw_tlc05_allies_kept 40}
    {QUANTITY turns 16 15 14}
    victory_when_enemies_defeated=no
    {DEFAULT_SCHEDULE}

    [story]
        [part]
            {SW_STORY_BACKDROP jungle-mountain}
            story= _ "Wayland's two native peoples, the four-armed Myneyrshi and the armored Psadans, had no love for each other and less for anyone from off-world. The Emperor's garrison had taught them that."
        [/part]
        [part]
            {SW_STORY_BACKDROP jungle-mountain}
            story= _ "Mara had an idea for earning their trust: break the outpost that taxed their villages."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        save_id=sw_player
        persistent=yes
        defeat_condition=never
        team_name=republic
        user_team_name= _ "Luke and Mara"
        id=sw_hero_luke
        type=sw_hero_luke
        name= _ "Luke Skywalker"
        canrecruit=yes
        random_traits=no
        recruit=
        gold=0
        income=0
        fog=yes
    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial
        user_team_name= _ "Garrison Outpost"
        id=sw_tlc05_commander
        type=sw_unit_im_officer
        name= _ "Captain Brasck"
        canrecruit=yes
        recruit=sw_unit_im_stormtrooper,sw_unit_im_scout_trooper
        # Balance review 2026-10-04: Normal 110/5 -> 90/4 (Easy 80/3 -> 70/3).
        {QUANTITY gold 70 90 140}
        {QUANTITY income 3 4 7}
        [ai]
            aggression=0.5
            passive_leader=yes
            # The garrison collects its tribute: raid the native villages.
            [goal]
                name=target_location
                [criteria]
                    x=6,13,6,13
                    y=4,3,16,17
                [/criteria]
                value=3
            [/goal]
        [/ai]
        [unit]
            type=sw_unit_im_stormtrooper
            x,y=19,9
        [/unit]
        [unit]
            type=sw_unit_im_stormtrooper
            x,y=19,11
        [/unit]
    [/side]

    [side]
        side=3
        controller=ai
        no_leader=yes
        team_name=republic
        user_team_name= _ "Wayland Natives"
        gold=0
        income=0
        # Each war party holds its own villages. They defend their homes from
        # turn 1 (guardian) and join the advance on turn 2 (Hard: 4).
#define SW_TLC05_NATIVE ID TYPE X Y
        [unit]
            id={ID}
            type={TYPE}
            x,y={X},{Y}
            ai_special=guardian
        [/unit]
#enddef
        {SW_TLC05_NATIVE sw_tlc05_native_1 sw_unit_wy_myneyrshi 6 4}
        {SW_TLC05_NATIVE sw_tlc05_native_2 sw_unit_wy_myneyrshi 13 3}
        {SW_TLC05_NATIVE sw_tlc05_native_3 sw_unit_wy_psadan 6 16}
        {SW_TLC05_NATIVE sw_tlc05_native_4 sw_unit_wy_psadan 13 17}
#ifdef EASY
        {SW_TLC05_NATIVE sw_tlc05_native_5 sw_unit_wy_myneyrshi 7 5}
#endif
#undef SW_TLC05_NATIVE
    [/side]

    [event]
        name=prestart
        [set_recruit]
            side=1
            recruit=
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_luke
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_STASH_HEROES sw_hero_wedge,sw_hero_karrde,sw_hero_leia,sw_hero_chewbacca,sw_hero_khabarakh}
        {SW_HERO sw_hero_mara sw_hero_mara ( _ "Mara Jade") 3 11}
        [objectives]
            side=1
            [objective]
                description= _ "Defeat Captain Brasck at the garrison outpost"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Luke"
                condition=lose
            [/objective]
            [note]
                description= _ "If Mara falls, she withdraws from the fight badly wounded and returns for the next mission."
            [/note]
            [note]
#ifdef HARD
                description= _ "The Myneyrshi (north) and the Psadans (south) defend their villages, which the garrison raids for tribute. If you fight the garrison, their warriors join your advance on turn 4."
#else
                description= _ "The Myneyrshi (north) and the Psadans (south) defend their villages, which the garrison raids for tribute. If you fight the garrison, their warriors join your advance on turn 2."
#endif
            [/note]
            {TURNS_RUN_OUT}
            {SW_NOTE_GOLD_CARRYOVER}
            {SW_BONUS_OBJECTIVE ( _ "Lose none of the native warriors") 40}
        [/objectives]
    [/event]

    [event]
        name=prestart
        id=sw_tlc05_allies
        [set_variable]
            name=sw_tlc05_allies_kept
            value=yes
        [/set_variable]
    [/event]

    # The bonus is lost when any native warrior falls.
    [event]
        name=die
        [filter]
            side=3
        [/filter]
        [set_variable]
            name=sw_tlc05_allies_kept
            value=no
        [/set_variable]
        [message]
            speaker=sw_hero_mara
            message= _ "They lost one of their warriors. They'll remember who stood beside them, and who didn't."
        [/message]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_hero_mara
            message= _ "The outpost is east. The villages around it pay the garrison in food and labor, or they burn."
        [/message]
        [message]
            speaker=sw_hero_luke
            message= _ "Then we start there. The villagers are watching us. Let's give them something worth seeing."
        [/message]
    [/event]

    # Balance review 2026-10-04: two heroes alone against the garrison lost
    # Luke or Mara by turn 3 in every test, so the natives join on turn 2
    # (Hard: turn 4). Until then they hold their villages.
    [event]
#ifdef HARD
        name=turn 4
#else
        name=turn 2
#endif
        [modify_unit]
            [filter]
                side=3
            [/filter]
            [status]
                guardian=no
            [/status]
        [/modify_unit]
        [message]
            speaker=narrator
            caption= _ "Myneyrshi War Leader"
            message= _ "Outsiders who fight the mountain's soldiers. Strange. The Psadans have come too. Strange again. We will fight beside you, today."
        [/message]
    [/event]

    [event]
        name=last breath
        [filter]
            id=sw_tlc05_commander
        [/filter]
        [message]
            speaker=sw_hero_luke
            message= _ "The outpost is ours. Mara, I've reached Han. He's bringing Leia, Lando, Chewie, and a shipload of Noghri."
        [/message]
        [message]
            speaker=sw_hero_mara
            message= _ "Good. The natives know a way to the mountain's main gate. We'll need every one of them."
        [/message]
        [endlevel]
            result=victory
            bonus=yes
            {NEW_GOLD_CARRYOVER 40}
        [/endlevel]
    [/event]

    [event]
        name=victory
        {SW_VICTORY_HOUSEKEEPING}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_luke}
    {SW_HERO_WITHDRAWS sw_hero_mara}
[/scenario]
