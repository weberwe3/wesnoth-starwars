#textdomain wesnoth-Star_Wars_Thrawn_Trilogy
# Campaign I finale: the command flight must escape through the plotted jump vector.

[scenario]
    id=sw_12_breakout_at_the_rendezvous
    name= _ "Breakout at the Rendezvous"
    map_data="Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg"
    turns=8
    victory_when_enemies_defeated=no

    [label]
        x=9
        y=3
        text= _ "Hyperspace Vector"
    [/label]

    [side]
        side=1
        controller=human
        team_name=player
        user_team_name= _ "New Republic Breakout Force"
        type=sw_unit_nr_hero_commander
        id=sw_rendezvous_breakout_commander
        name= _ "New Republic Flight Commander"
        x=1
        y=2
        canrecruit=yes
        gold=50
        recruit=Thrawn_Phalanx
        # This ordinary Wesnoth unit represents the single-hex command flight.
        [unit]
            type=sw_unit_nr_starwing_escape
            id=sw_rendezvous_command_flight
            name= _ "New Republic Starwing Command Flight"
            x=2
            y=3
            canrecruit=no
        [/unit]
    [/side]

    [side]
        side=2
        controller=ai
        team_name=enemy
        user_team_name= _ "Imperial Remnant Pursuit"
        type=Thrawn_Phalanx
        id=sw_rendezvous_pursuit_leader
        name= _ "Imperial Remnant Squadron Leader"
        x=9
        y=6
        canrecruit=yes
        gold=55
        recruit=Thrawn_Phalanx
        [unit]
            type=sw_unit_im_venator_interceptor
            id=sw_rendezvous_interceptor_screen
            name= _ "Imperial Remnant Interceptor Screen"
            x=6
            y=2
            canrecruit=no
        [/unit]
    [/side]

    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                description= _ "Move the New Republic Starwing Command Flight to the Hyperspace Vector"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of the New Republic Flight Commander"
                condition=lose
            [/objective]
            [objective]
                description= _ "Destruction of the New Republic Starwing Command Flight"
                condition=lose
            [/objective]
            [objective]
                description= _ "Turns run out"
                condition=lose
            [/objective]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_rendezvous_breakout_commander
            message= _ "The rendezvous bought us one clear vector. Hold the Remnant long enough for the command flight to make the jump."
        [/message]
        [message]
            speaker=sw_rendezvous_pursuit_leader
            message= _ "Their astrogation solution is narrow. Force them off that line, and the New Republic leaves this system empty-handed."
        [/message]
    [/event]

    # Victory is tied to the named flight reaching the plotted exit, never to eliminating the enemy force.
    [event]
        name=moveto
        [filter]
            id=sw_rendezvous_command_flight
            x=9
            y=3
        [/filter]
        [message]
            speaker=sw_rendezvous_breakout_commander
            message= _ "Vector locked. Jump now—Campaign I ends with the fleet beyond the Imperial Remnant's reach."
        [/message]
        [endlevel]
            result=victory
        [/endlevel]
    [/event]

    [event]
        name=die
        [filter]
            id=sw_rendezvous_breakout_commander
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=die
        [filter]
            id=sw_rendezvous_command_flight
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=time over
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]
