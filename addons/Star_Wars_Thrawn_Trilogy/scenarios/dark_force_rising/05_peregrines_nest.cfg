#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Campaign II, mission 5 - The Peregrine's Nest (base defense).
# Key hexes (gen_dfr_maps.py m05): Han's keep 21,10; shield generator 25,10;
# Imperial keep 3,10. An Imperial unit on the generator hex is a defeat.

[scenario]
    id=sw_dfr_05_peregrines_nest
    name= _ "The Peregrine's Nest"
    next_scenario=sw_dfr_06_the_mad_jedi
    map_file=dfr_05_peregrines_nest.map
    {SW_MUSIC sw-heroic sw-tension}
    {QUANTITY turns 16 15 14}
    victory_when_enemies_defeated=no
    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [story]
        [part]
            story= _ "Senator Garm Bel Iblis had left the Rebellion years before Endor, unwilling to trade one ruler for another. Since then he had fought the Empire alone, with a private army and a fleet of Dreadnaughts."
        [/part]
        [part]
            story= _ "He knew about the Katana fleet too. Before he could say how much, the Empire found his base."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        save_id=sw_player
        persistent=yes
        defeat_condition=never
        team_name=republic
        user_team_name= _ "Bel Iblis's Base"
        id=sw_hero_han
        type=sw_hero_han
        name= _ "Han Solo"
        canrecruit=yes
        random_traits=no
        recruit=sw_unit_nr_trooper,sw_unit_bi_commando,sw_unit_nr_field_medic,sw_unit_nr_eweb_team
        {QUANTITY gold 160 130 110}
        fog=no
    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial
        user_team_name= _ "Imperial Assault"
        id=sw_dfr05_commander
        type=sw_unit_im_officer
        name= _ "Major Tierce"
        canrecruit=yes
        recruit=sw_unit_im_stormtrooper,sw_unit_im_clone_trooper,sw_unit_im_scout_trooper,sw_unit_im_at_st
        {QUANTITY gold 160 210 260}
        {QUANTITY income 6 9 12}
        [ai]
            aggression=0.6
            [goal]
                name=target_location
                [criteria]
                    x,y=25,10
                [/criteria]
                value=5
            [/goal]
        [/ai]
        [unit]
            type=sw_unit_im_at_st
            x,y=5,9
        [/unit]
        [unit]
            type=sw_unit_im_clone_trooper
            x,y=5,11
        [/unit]
    [/side]

    [event]
        name=prestart
        [set_recruit]
            side=1
            recruit=sw_unit_nr_trooper,sw_unit_bi_commando,sw_unit_nr_field_medic,sw_unit_nr_eweb_team
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_han
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_STASH_HEROES sw_hero_leia,sw_hero_chewbacca,sw_hero_khabarakh,sw_hero_luke}
        {SW_HERO sw_hero_lando sw_hero_lando ( _ "Lando Calrissian") 22 10}
        {SW_HERO sw_hero_bel_iblis sw_hero_bel_iblis ( _ "Garm Bel Iblis") 24 10}
        [unit]
            side=1
            type=sw_unit_bi_commando
            x,y=19,9
            [modifications]
                {TRAIT_LOYAL}
            [/modifications]
        [/unit]
        [unit]
            side=1
            type=sw_unit_bi_commando
            x,y=19,11
            [modifications]
                {TRAIT_LOYAL}
            [/modifications]
        [/unit]
        [item]
            x,y=25,10
            image=misc/sw-objective.png
        [/item]
        [label]
            x,y=25,10
            text= _ "Shield Generator"
        [/label]
        [objectives]
            side=1
            [objective]
                description= _ "Hold the shield generator through the last turn"
                condition=win
            [/objective]
            [objective]
                description= _ "Defeat Major Tierce"
                condition=win
            [/objective]
            [objective]
                description= _ "An Imperial unit reaches the shield generator"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of Han, Lando, or Bel Iblis"
                condition=lose
            [/objective]
            {SW_NOTE_GOLD_CARRYOVER}
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_hero_bel_iblis
            message= _ "So the Grand Admiral has found my nest. Captain Solo, I'd hoped to make my introductions over a drink."
        [/message]
        [message]
            speaker=sw_hero_han
            message= _ "We'll do the drink after. What do you need?"
        [/message]
        [message]
            speaker=sw_hero_bel_iblis
            message= _ "The shield generator. If it falls, their walkers will flatten this base before my ships can lift. Hold the canyon mouth."
        [/message]
    [/event]

    [event]
        name=moveto
        [filter]
            side=2
            x,y=25,10
        [/filter]
        [message]
            speaker=sw_hero_bel_iblis
            message= _ "They're at the generator. Abandon the base!"
        [/message]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=last breath
        [filter]
            id=sw_dfr05_commander
        [/filter]
        [fire_event]
            name=sw_dfr05_win
        [/fire_event]
    [/event]

    [event]
        name=time over
        [fire_event]
            name=sw_dfr05_win
        [/fire_event]
    [/event]

    [event]
        name=sw_dfr05_win
        [message]
            speaker=sw_hero_bel_iblis
            message= _ "They're falling back. Well fought. Now, about the Katana fleet: I know where it is not. Someone else claims to know where it is."
        [/message]
        [message]
            speaker=sw_hero_lando
            message= _ "Let me guess. Someone who'll want paying."
        [/message]
        [endlevel]
            result=victory
            bonus=yes
            {NEW_GOLD_CARRYOVER 40}
        [/endlevel]
    [/event]

    [event]
        name=victory
        {SW_VICTORY_HOUSEKEEPING}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_han}
    {SW_HERO_DEATH_IS_DEFEAT sw_hero_lando}
    {SW_HERO_DEATH_IS_DEFEAT sw_hero_bel_iblis}
[/scenario]
