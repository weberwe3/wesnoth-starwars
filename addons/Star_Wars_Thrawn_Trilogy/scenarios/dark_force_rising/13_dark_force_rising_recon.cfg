#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

#ifdef CAMPAIGN_STAR_WARS_DARK_FORCE_RISING
# Campaign II opens independently: success ends this reconnaissance rather
# than transitioning to a scenario owned by Campaign I.
[scenario]
    id=sw_13_dark_force_rising_recon
    name= _ "Dark Force Rising: Reconnaissance"
    map_data="Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg^Fp,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg^Fp,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Kh"
    turns=12
    victory_when_enemies_defeated=no

    [label]
        x=8
        y=3
        text= _ "Sensor Ridge"
    [/label]

    [side]
        side=1
        controller=human
        team_name=player
        user_team_name= _ "New Republic Reconnaissance Team"
        type=sw_unit_nr_hero_commander
        id=sw_dfr_recon_commander
        name= _ "New Republic Recon Commander"
        x=1
        y=2
        canrecruit=yes
        gold=55
        recruit=sw_unit_nr_recon_squad
        [unit]
            type=sw_unit_nr_recon_squad
            id=sw_dfr_pathfinder_team
            name= _ "Pathfinder Team"
            x=2
            y=3
            canrecruit=no
        [/unit]
    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial_remnant
        user_team_name= _ "Imperial Remnant Patrol"
        type=sw_unit_im_recon_squad
        id=sw_dfr_patrol_leader
        name= _ "Imperial Remnant Patrol Leader"
        x=9
        y=6
        canrecruit=yes
        gold=45
        recruit=sw_unit_im_rem_stormtrooper
    [/side]

    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                description= _ "Move the Pathfinder Team to Sensor Ridge"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of the New Republic Recon Commander"
                condition=lose
            [/objective]
            [objective]
                description= _ "Turns run out"
                condition=lose
            [/objective]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_dfr_recon_commander
            message= _ "The ridge has a clear view of the patrol routes. Pathfinder Team, mark their sensors and withdraw when the data is secure."
        [/message]
    [/event]

    # Only the assigned reconnaissance unit can complete the objective.
    [event]
        name=moveto
        [filter]
            id=sw_dfr_pathfinder_team
            x=8
            y=3
        [/filter]
        [message]
            speaker=sw_dfr_pathfinder_team
            message= _ "Sensor pattern recorded. We have the route map."
        [/message]
        [endlevel]
            result=victory
            bonus=yes
            carryover_report=yes
        [/endlevel]
    [/event]

    # The commander is an actual side leader; losing that leader ends the mission.
    [event]
        name=die
        [filter]
            id=sw_dfr_recon_commander
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=time over
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]
#endif
