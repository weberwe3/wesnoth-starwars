#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

#ifdef CAMPAIGN_STAR_WARS_DARK_FORCE_RISING
[scenario]
    id=sw_21_restore_the_beacon
    name= _ "Restore the Beacon"
    map_data="Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg^Fp,Gg,Gg,Gg^Fp,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg^Fp,Gg,Gg
Gg,Gg^Fp,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Kh"
    turns=10
    victory_when_enemies_defeated=no

    [label]
        x=8
        y=3
        text= _ "Beacon Terminal"
    [/label]

    [side]
        side=1
        controller=human
        team_name=sw_new_republic
        user_team_name= _ "New Republic Restoration Detail"
        type=sw_unit_nr_hero_commander
        id=sw_beacon_commander
        name= _ "New Republic Commander"
        x=1
        y=3
        canrecruit=yes
        gold=0
        recruit=
        [unit]
            # The mission engineer is a normal single-hex unit required for victory.
            type=sw_unit_nr_field_engineer_team
            id=sw_beacon_field_engineer_team
            name= _ "New Republic Field Engineer Team"
            x=2
            y=3
            canrecruit=no
        [/unit]
    [/side]

    [side]
        side=2
        controller=ai
        team_name=sw_imperial_remnant
        user_team_name= _ "Imperial Remnant Interdiction Force"
        type=sw_unit_im_rem_stormtrooper
        id=sw_beacon_imperial_leader
        name= _ "Imperial Remnant Interdiction Commander"
        x=9
        y=5
        canrecruit=yes
        gold=0
        recruit=
        [unit]
            type=sw_unit_im_rem_stormtrooper
            id=sw_beacon_remnant_patrol_one
            name= _ "Imperial Remnant Patrol"
            x=7
            y=3
            canrecruit=no
        [/unit]
        [unit]
            type=sw_unit_im_recon_squad
            id=sw_beacon_remnant_patrol_two
            name= _ "Imperial Remnant Scout"
            x=8
            y=4
            canrecruit=no
        [/unit]
    [/side]

    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                description= _ "Move the New Republic Field Engineer Team to the Beacon Terminal"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of the New Republic Commander"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of the New Republic Field Engineer Team"
                condition=lose
            [/objective]
            [objective]
                description= _ "Turns run out"
                condition=lose
            [/objective]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_beacon_commander
            message= _ "The ravine bought us a moment. Get the beacon online before the Remnant closes the perimeter."
        [/message]
        [message]
            speaker=sw_beacon_field_engineer_team
            message= _ "We only need terminal access. Keep their patrols off our tools and the signal will carry."
        [/message]
    [/event]

    # Only the assigned engineers can restore the marked beacon terminal.
    [event]
        name=moveto
        [filter]
            id=sw_beacon_field_engineer_team
            x=8
            y=3
        [/filter]
        [message]
            speaker=sw_beacon_field_engineer_team
            message= _ "Beacon synchronized. New Republic channels are live again."
        [/message]
        [endlevel]
            result=victory
            bonus=yes
            carryover_report=yes
        [/endlevel]
    [/event]

    # The commander is a side leader, but the mission also makes the loss explicit.
    [event]
        name=die
        [filter]
            id=sw_beacon_commander
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=die
        [filter]
            id=sw_beacon_field_engineer_team
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=time over
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]
#endif
