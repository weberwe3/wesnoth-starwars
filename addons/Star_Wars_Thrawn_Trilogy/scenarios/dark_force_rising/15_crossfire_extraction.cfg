#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

#ifdef CAMPAIGN_STAR_WARS_DARK_FORCE_RISING
[scenario]
    id=sw_15_crossfire_extraction
    name= _ "Crossfire Extraction"
    map_data="Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg^Fp,Gg^Fp,Gg,Gg,Gg,Gg^Fp,Gg^Fp,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg^Fp,Gg^Fp,Gg,Gg,Gg,Gg^Fp,Gg^Fp,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Kh"
    turns=9
    victory_when_enemies_defeated=no

    [label]
        x=9
        y=5
        text= _ "New Republic Extraction Zone"
    [/label]

    [side]
        side=1
        controller=human
        team_name=player
        user_team_name= _ "New Republic Extraction Team"
        type=sw_unit_nr_hero_commander
        id=sw_crossfire_commander
        name= _ "New Republic Commander"
        x=1
        y=3
        canrecruit=yes
        gold=0
        recruit=
        [unit]
            type=sw_unit_nr_slicer_team
            id=sw_crossfire_slicer_team
            name= _ "New Republic Slicer Team"
            x=2
            y=3
            canrecruit=no
        [/unit]
    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial_remnant
        user_team_name= _ "Imperial Remnant Patrol"
        type=sw_unit_im_recon_squad
        id=sw_crossfire_patrol_leader
        name= _ "Imperial Patrol Leader"
        x=8
        y=1
        canrecruit=yes
        gold=0
        recruit=
        [unit]
            type=sw_unit_im_patrol_speeder
            id=sw_crossfire_patrol_speeder
            name= _ "Imperial Patrol Speeder"
            x=6
            y=3
            canrecruit=no
        [/unit]
        [unit]
            type=sw_unit_im_rem_stormtrooper
            id=sw_crossfire_patrol_trooper
            name= _ "Imperial Patrol Trooper"
            x=7
            y=4
            canrecruit=no
        [/unit]
    [/side]

    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                description= _ "Move the New Republic Commander and surviving Slicer Team to the New Republic Extraction Zone"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of the New Republic Commander"
                condition=lose
            [/objective]
            [objective]
                description= _ "Loss of the New Republic Slicer Team"
                condition=lose
            [/objective]
            [objective]
                description= _ "Turns run out"
                condition=lose
            [/objective]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_crossfire_commander
            message= _ "The relay data has drawn a patrol. Keep the Slicer Team moving; our extraction zone is beyond the crossfire."
        [/message]
    [/event]

    # Either survivor may arrive last; victory only triggers once both occupy the labeled zone.
    [event]
        name=moveto
        [filter]
            side=1
            x=9
            y=5
        [/filter]
        [if]
            [have_unit]
                id=sw_crossfire_commander
                x=9
                y=5
            [/have_unit]
            [have_unit]
                id=sw_crossfire_slicer_team
                x=9
                y=5
            [/have_unit]
            [then]
                [endlevel]
                    result=victory
                    bonus=yes
                    carryover_report=yes
                [/endlevel]
            [/then]
        [/if]
    [/event]

    [event]
        name=die
        [filter]
            id=sw_crossfire_commander
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=die
        [filter]
            id=sw_crossfire_slicer_team
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=time over
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]
#endif
