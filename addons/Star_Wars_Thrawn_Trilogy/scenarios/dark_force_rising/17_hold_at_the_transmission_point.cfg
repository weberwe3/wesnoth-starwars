#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

#ifdef CAMPAIGN_STAR_WARS_DARK_FORCE_RISING
[scenario]
    id=sw_17_hold_at_the_transmission_point
    name= _ "Hold at the Transmission Point"
    map_data="Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Kh
Gg,Gg^Fp,Gg,Gg,Gg,Gg,Gg^Fp,Gg,Gg
Gg,Gg,Gg,Gg,Gg^Fp,Gg^Fp,Gg,Gg,Gg
Gg,Gg,Kh,Gg,Gg^Fp,Gg^Fp,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg^Fp,Gg,Gg,Gg,Gg^Fp,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg"
    turns=8
    victory_when_enemies_defeated=no

    [label]
        x=6
        y=3
        text= _ "Transmission Point"
    [/label]

    [side]
        side=1
        controller=human
        team_name=player
        user_team_name= _ "New Republic Defense Detail"
        type=sw_unit_nr_hero_commander
        id=sw_transmission_commander
        name= _ "New Republic Commander"
        x=3
        y=4
        canrecruit=yes
        gold=0
        recruit=
        [unit]
            type=sw_unit_nr_slicer_team
            id=sw_transmission_slicer_team
            name= _ "Slicer Team"
            x=4
            y=4
            canrecruit=no
        [/unit]
        [unit]
            type=sw_unit_nr_perimeter_guard_squad
            id=sw_transmission_perimeter_guard_squad
            name= _ "Perimeter Guard Squad"
            x=5
            y=4
            canrecruit=no
        [/unit]
    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial_remnant
        user_team_name= _ "Imperial Remnant Assault Force"
        type=sw_unit_im_recon_squad
        id=sw_transmission_imperial_captain
        name= _ "Imperial Remnant Assault Captain"
        x=9
        y=1
        canrecruit=yes
        gold=90
        income=4
        recruit=sw_unit_im_rem_stormtrooper
    [/side]

    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                description= _ "Hold the Transmission Point perimeter until the end of turn 8"
                condition=win
            [/objective]
            [objective]
                description= _ "The New Republic Commander, Slicer Team, and Perimeter Guard Squad must occupy their marked defensive positions"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of the New Republic Commander"
                condition=lose
            [/objective]
            [objective]
                description= _ "Loss of the Slicer Team"
                condition=lose
            [/objective]
            [objective]
                description= _ "Turns run out before the perimeter is held"
                condition=lose
            [/objective]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_transmission_commander
            message= _ "The fleet has our burst. Now we keep this relay alive long enough for the route to lock in. Take the marked positions."
        [/message]
        [message]
            speaker=sw_transmission_slicer_team
            message= _ "The transmission is hopping through civilian relays. If the Remnant reaches the array, every hop goes dark."
        [/message]
        [message]
            speaker=sw_transmission_imperial_captain
            message= _ "Close on the relay. Their signal is a flare; extinguish it before their reinforcements find the sector."
        [/message]
    [/event]

    [event]
        name=die
        [filter]
            id=sw_transmission_commander
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=die
        [filter]
            id=sw_transmission_slicer_team
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    # The timeout itself resolves the mission, avoiding a competing time-over defeat.
    [event]
        name=time over
        [if]
            [have_unit]
                id=sw_transmission_commander
                x=5
                y=3
            [/have_unit]
            [have_unit]
                id=sw_transmission_slicer_team
                x=6
                y=3
            [/have_unit]
            [have_unit]
                id=sw_transmission_perimeter_guard_squad
                x=6
                y=4
            [/have_unit]
            [then]
                [message]
                    speaker=sw_transmission_slicer_team
                    message= _ "Route locked. The relay is handing the warning to the fleet now."
                [/message]
                [endlevel]
                    result=victory
                    bonus=no
                    carryover_report=yes
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result=defeat
                [/endlevel]
            [/else]
        [/if]
    [/event]
[/scenario]
#endif
