#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

#ifdef CAMPAIGN_STAR_WARS_DARK_FORCE_RISING
[scenario]
    id=sw_19_break_the_blockade
    name= _ "Break the Blockade"
    map_data="Gg,Gg,Gg^Fp,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Kh
Gg,Gg^Fp,Gg^Fp,Gg,Gg,Gg^Fp,Gg,Gg,Gg^Fp,Gg,Gg
Gg,Gg,Gg,Gg^Fp,Gg,Gg,Gg,Gg^Fp,Gg,Gg,Gg
Gg,Gg^Fp,Gg,Gg,Gg^Fp,Gg,Gg,Gg,Gg^Fp,Gg,Gg
Gg,Gg,Gg^Fp,Gg,Gg,Gg^Fp,Gg,Gg,Gg,Gg^Fp,Gg
Gg,Gg^Fp,Gg,Gg,Gg^Fp,Gg,Gg,Gg^Fp,Gg,Gg,Gg
Kh,Gg,Gg,Gg^Fp,Gg,Gg,Gg,Gg,Gg^Fp,Gg,Gg"
    turns=12
    victory_when_enemies_defeated=no

    [label]
        x=11
        y=3,4,5
        text= _ "Evacuation Exit"
    [/label]

    [side]
        side=1
        controller=human
        team_name=player
        user_team_name= _ "New Republic Evacuation Detail"
        type=sw_unit_nr_hero_commander
        id=sw_blockade_commander
        name= _ "New Republic Commander"
        x=1
        y=4
        canrecruit=yes
        gold=0
        recruit=
        [unit]
            # The evacuation transport remains a normal, single-hex Wesnoth unit.
            type=sw_unit_nr_evacuation_transport
            id=sw_blockade_transport
            name= _ "New Republic Evacuation Transport"
            x=2
            y=4
            canrecruit=no
        [/unit]
    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial_remnant
        user_team_name= _ "Imperial Remnant Blockade"
        type=sw_unit_im_blockade_walker
        id=sw_blockade_walker
        name= _ "Imperial Remnant Blockade Walker"
        x=8
        y=4
        canrecruit=yes
        gold=40
        income=2
        recruit=sw_unit_im_rem_stormtrooper
        [unit]
            type=sw_unit_im_recon_squad
            id=sw_blockade_spotter
            name= _ "Imperial Remnant Spotter Squad"
            x=10
            y=3
            canrecruit=no
        [/unit]
    [/side]

    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                description= _ "Move the New Republic Commander and Evacuation Transport to the Evacuation Exit"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of the New Republic Commander"
                condition=lose
            [/objective]
            [objective]
                description= _ "Destruction of the New Republic Evacuation Transport"
                condition=lose
            [/objective]
            [objective]
                description= _ "Turns run out"
                condition=lose
            [/objective]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_blockade_commander
            message= _ "The walker has sealed the road, but its firing lanes leave a narrow gap. Keep the transport moving to the exit beacon."
        [/message]
        [message]
            speaker=sw_blockade_walker
            message= _ "New Republic convoy identified. This corridor is under Imperial Remnant control; no transport passes intact."
        [/message]
    [/event]

    # Any arrival at the exit checks that both required survivors are safely there.
    [event]
        name=moveto
        [filter]
            side=1
            x=11
            y=3,4,5
        [/filter]
        [if]
            [have_unit]
                id=sw_blockade_commander
                x=11
                y=3,4,5
            [/have_unit]
            [have_unit]
                id=sw_blockade_transport
                x=11
                y=3,4,5
            [/have_unit]
            [then]
                [message]
                    speaker=sw_blockade_commander
                    message= _ "The transport is through. Break contact and follow it beyond the blockade!"
                [/message]
                [endlevel]
                    result=victory
                    bonus=yes
                    carryover_report=yes
                [/endlevel]
            [/then]
        [/if]
    [/event]

    [event]
        name=die
        [filter]
            id=sw_blockade_commander
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=die
        [filter]
            id=sw_blockade_transport
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=time over
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]
#endif
