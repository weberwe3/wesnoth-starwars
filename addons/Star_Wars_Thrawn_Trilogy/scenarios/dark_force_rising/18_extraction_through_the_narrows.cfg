#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

#ifdef CAMPAIGN_STAR_WARS_DARK_FORCE_RISING
[scenario]
    id=sw_18_extraction_through_the_narrows
    name= _ "Extraction Through the Narrows"
    map_data="Gg,Gg,Gg^Fp,Gg,Gg,Gg,Gg,Gg,Kh
Gg,Gg^Fp,Gg^Fp,Gg,Gg^Fp,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg^Fp,Gg^Fp,Gg,Gg^Fp,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg^Fp,Gg,Gg,Gg
Gg,Gg^Fp,Gg,Gg,Gg^Fp,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg^Fp,Gg,Gg
Kh,Gg,Gg,Gg^Fp,Gg,Gg,Gg,Gg,Gg"
    turns=10
    victory_when_enemies_defeated=no

    [label]
        x=9
        y=4
        text= _ "Extraction Zone"
    [/label]

    [side]
        side=1
        controller=human
        team_name=player
        user_team_name= _ "New Republic Escape Detail"
        type=sw_unit_nr_hero_commander
        id=sw_narrows_commander
        name= _ "New Republic Commander"
        x=1
        y=4
        canrecruit=yes
        gold=0
        recruit=
        [unit]
            type=sw_unit_nr_pathfinder_squad
            id=sw_narrows_pathfinder_squad
            name= _ "Pathfinder Squad"
            x=2
            y=4
            canrecruit=no
        [/unit]
    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial_remnant
        user_team_name= _ "Imperial Remnant Pursuit Force"
        type=sw_unit_im_recon_squad
        id=sw_narrows_imperial_captain
        name= _ "Imperial Remnant Pursuit Captain"
        x=9
        y=1
        canrecruit=yes
        gold=80
        income=4
        recruit=sw_unit_im_rem_stormtrooper
    [/side]

    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                description= _ "Move the New Republic Commander and Pathfinder Squad to the Extraction Zone"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of the New Republic Commander"
                condition=lose
            [/objective]
            [objective]
                description= _ "Loss of the Pathfinder Squad"
                condition=lose
            [/objective]
            [objective]
                description= _ "Turns run out"
                condition=lose
            [/objective]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_narrows_commander
            message= _ "The relay bought us a route, not safety. Pathfinder Squad, lead us through the Narrows to the pickup beacon."
        [/message]
        [message]
            speaker=sw_narrows_pathfinder_squad
            message= _ "The ravines break their sightlines, Commander. Stay close and we can reach the extraction zone before they seal it."
        [/message]
        [message]
            speaker=sw_narrows_imperial_captain
            message= _ "They are running for the beacon. Cut through the Narrows and leave their rescue craft nothing to collect."
        [/message]
    [/event]

    # Moving either required survivor into the marked extraction zone checks both survivors.
    [event]
        name=moveto
        [filter]
            side=1
            x=9
            y=3,4,5
        [/filter]
        [if]
            [have_unit]
                id=sw_narrows_commander
                x=9
                y=3,4,5
            [/have_unit]
            [have_unit]
                id=sw_narrows_pathfinder_squad
                x=9
                y=3,4,5
            [/have_unit]
            [then]
                [message]
                    speaker=sw_narrows_pathfinder_squad
                    message= _ "Beacon confirmed. The extraction craft has us; move now!"
                [/message]
                [endlevel]
                    result=victory
                    bonus=yes
                    carryover_report=yes
                [/endlevel]
            [/then]
        [/if]
    [/event]

    [event]
        name=die
        [filter]
            id=sw_narrows_commander
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=die
        [filter]
            id=sw_narrows_pathfinder_squad
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=time over
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]
#endif
