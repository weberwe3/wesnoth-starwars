#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Campaign II, mission 10 - Honoghr's Choice (finale).
# Key hexes (gen_dfr_maps.py m10): clan house keep 13,9; Imperial landing
# zones 2,9 (west) and 25,9 (east, turn 4).
# On turn 6 the Noghri clans rise: Noghri warriors join as side 3 allies and
# the player may recruit Noghri Commandos.
#
# Design audit round 2 (2026-10-17, docs/design/CAMPAIGN_DESIGN_REVIEW.md
# section 2): all three campaign finales were "hold until the last turn, or
# kill X". This one is now a defense that turns into a counterattack:
#   1. Hold the clan house. The clans answer only to Leia in their dukha:
#      from turn 6 on, the first player turn that starts with her on 13,9.
#   2. Then break the detachment: defeat Commander Sorrell. Outlasting the
#      turn limit no longer wins; the clans did not rise to watch.
# Defeating Sorrell before the clans rise still wins (the declaration plays at
# victory). Variables: sw_dfr10_risen (cleared at victory).

[scenario]
    id=sw_dfr_10_honoghrs_choice
    name= _ "Honoghr's Choice"
    next_scenario=null
    map_file=dfr_10_honoghrs_choice.map
    {SW_MUSIC sw-heroic sw-tension sw-battle}
    {SW_FIELD_MANUAL}
    {SW_TACTICAL_SYSTEMS}
    {QUANTITY turns 15 14 13}
    victory_when_enemies_defeated=no
    {DEFAULT_SCHEDULE}

    [story]
        [part]
            {SW_STORY_BACKDROP brown-world}
            story= _ "Leia returned to Honoghr with a sample of the soil and a droid's maintenance records. The decontamination droids had never been cleaning the land. They had been keeping it poisoned, so that the Noghri would need the Empire forever."
        [/part]
        [part]
            {SW_STORY_BACKDROP brown-world}
            story= _ "She stood in the clan house at Nystao and told them. Before the clans could answer, an Imperial shuttle landed to take her away."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        save_id=sw_player
        persistent=yes
        defeat_condition=never
        team_name=republic
        user_team_name= _ "Leia and the Noghri"
        id=sw_hero_leia
        type=sw_hero_leia
        name= _ "Leia Organa Solo"
        canrecruit=yes
        random_traits=no
        recruit=sw_unit_wk_warrior
        {QUANTITY gold 140 110 90}
        fog=no
    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial
        user_team_name= _ "Imperial Detachment"
        id=sw_dfr10_commander
        type=sw_unit_im_officer
        name= _ "Commander Sorrell"
        canrecruit=yes
        recruit=sw_unit_im_stormtrooper,sw_unit_im_clone_trooper
        {QUANTITY gold 140 180 220}
        {QUANTITY income 5 8 11}
        [ai]
            aggression=0.6
            [goal]
                name=target
                [criteria]
                    id=sw_hero_leia
                [/criteria]
                value=5
            [/goal]
        [/ai]
        [unit]
            type=sw_unit_im_clone_trooper
            x,y=4,8
        [/unit]
        [unit]
            type=sw_unit_im_clone_trooper
            x,y=4,10
        [/unit]
    [/side]

    [side]
        side=3
        controller=ai
        no_leader=yes
        team_name=republic
        user_team_name= _ "Noghri Clans"
        gold=0
        income=0
    [/side]

    [event]
        name=prestart
        [set_recruit]
            side=1
            recruit=sw_unit_wk_warrior
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_leia
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_STASH_HEROES sw_hero_luke,sw_hero_han,sw_hero_lando,sw_hero_bel_iblis}
        {SW_HERO sw_hero_chewbacca sw_hero_chewbacca ( _ "Chewbacca") 13 10}
        {SW_HERO sw_hero_khabarakh sw_hero_khabarakh ( _ "Khabarakh") 12 9}
        # Prop art: Clan House of Nystao (Codex, production/tools/gen_codex_interior_art.py).
        [item]
            x,y=13,9
            image=misc/sw-prop-clan-house.png
        [/item]
        [label]
            x,y=13,9
            text= _ "Clan House of Nystao"
        [/label]
        [objectives]
            side=1
            [objective]
                description= _ "Keep Leia in the Clan House of Nystao until the clans give their answer (turn 6 or later)"
                condition=win
                [show_if]
                    [not]
                        [variable]
                            name=sw_dfr10_risen
                            boolean_equals=yes
                        [/variable]
                    [/not]
                [/show_if]
            [/objective]
            [objective]
                description= _ "Defeat Commander Sorrell and break his detachment"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Leia"
                condition=lose
            [/objective]
            {TURNS_RUN_OUT}
            [note]
                description= _ "If Chewbacca or Khabarakh falls, that hero withdraws from the fight badly wounded and returns for the next mission."
            [/note]
            [note]
                description= _ "A second Imperial shuttle lands east of the village on turn 4. The clans answer only to Leia in their clan house: from turn 6, at the start of the first turn she is there, their warriors join you and you may recruit Noghri. Then take the fight to Sorrell, west of the village."
            [/note]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_hero_khabarakh
            message= _ "The clans are still debating, my lady. They will not move until they have decided. We must hold the dukha until then."
        [/message]
        [message]
            speaker=sw_hero_leia
            message= _ "Then we hold it. Chewie, the west door."
        [/message]
    [/event]

    [event]
        name=turn 4
        [unit]
            side=2
            type=sw_unit_im_stormtrooper
            x,y=25,9
        [/unit]
        [unit]
            side=2
            type=sw_unit_im_clone_trooper
            x,y=25,8
        [/unit]
#ifndef EASY
        [unit]
            side=2
            type=sw_unit_im_clone_trooper
            x,y=25,10
        [/unit]
#endif
        [message]
            speaker=sw_hero_khabarakh
            message= _ "A second shuttle, east of the village!"
        [/message]
    [/event]

    [event]
        name=side 1 turn
        first_time_only=no
        [filter_condition]
            [variable]
                name=turn_number
                greater_than_equal_to=6
            [/variable]
            [not]
                [variable]
                    name=sw_dfr10_risen
                    boolean_equals=yes
                [/variable]
            [/not]
        [/filter_condition]
        [if]
            [not]
                [have_unit]
                    id=sw_hero_leia
                    x,y=13,9
                [/have_unit]
            [/not]
            [then]
                [message]
                    speaker=sw_hero_khabarakh
                    message= _ "The clans have gathered, my lady, but they will hear you only in the dukha."
                [/message]
                [return][/return]
            [/then]
        [/if]
        [set_variable]
            name=sw_dfr10_risen
            value=yes
        [/set_variable]
#define SW_DFR10_NOGHRI X Y
        [unit]
            side=3
            type=sw_unit_im_noghri
            x,y={X},{Y}
            animate=yes
        [/unit]
#enddef
        {SW_DFR10_NOGHRI 10 7}
        {SW_DFR10_NOGHRI 16 7}
        {SW_DFR10_NOGHRI 10 12}
        {SW_DFR10_NOGHRI 16 12}
#ifdef EASY
        {SW_DFR10_NOGHRI 13 5}
#endif
#undef SW_DFR10_NOGHRI
        [set_recruit]
            side=1
            recruit=sw_unit_wk_warrior,sw_unit_im_noghri
        [/set_recruit]
        [fire_event]
            name=sw_dfr10_declaration
        [/fire_event]
        [message]
            speaker=sw_hero_leia
            message= _ "Sorrell won't leave while he still has an army. Then we take it from him."
        [/message]
        [show_objectives][/show_objectives]
    [/event]

    # The clans' answer, given once: on turn 6, or at victory if Sorrell falls
    # first (design audit 2026-10-17: an early win skipped the campaign's
    # payoff).
    [event]
        name=sw_dfr10_declaration
        [message]
            speaker=narrator
            caption= _ "Maitrakh of Clan Kihm'bar"
            image=portraits/sw-hero-khabarakh.png
            message= _ "The clans have spoken. We served the Empire for a generation because it told us we owed it our lives. It lied. The Lady Vader is under our protection."
        [/message]
        [message]
            speaker=sw_hero_leia
            message= _ "Thank you. You don't owe me anything. But I'll be glad of the help."
        [/message]
    [/event]

    [event]
        name=last breath
        [filter]
            id=sw_dfr10_commander
        [/filter]
        [fire_event]
            name=sw_dfr10_win
        [/fire_event]
    [/event]

    [event]
        name=sw_dfr10_win
        [fire_event]
            name=sw_dfr10_declaration
        [/fire_event]
        [message]
            speaker=sw_hero_khabarakh
            message= _ "The Empire will learn of this. And every Noghri who guards the Grand Admiral will learn of it too."
        [/message]
        [message]
            speaker=sw_hero_leia
            message= _ "Then he's about to discover what it's like to be watched by his own bodyguards."
        [/message]
        # Thrawn must not learn of the break yet (the end text says so, and
        # Campaign III pays it off): he hears only silence from Honoghr.
        {SW_THRAWN_SAYS ( _ "Commander Sorrell's detachment is overdue from Honoghr? Note it, Captain. The Noghri have never failed us. Wayland matters more now.")}
        [endlevel]
            result=victory
            end_text= _ "The Noghri have learned the truth, and the Grand Admiral has lost the people who served him best, though he does not know it yet. His clones are still growing on a world called Wayland.

The war ends in Campaign III: The Last Command."
            end_text_duration=5000
            bonus=yes
            carryover_report=no
        [/endlevel]
    [/event]

    [event]
        name=victory
        {SW_VICTORY_HOUSEKEEPING}
        {CLEAR_VARIABLE sw_dfr10_risen}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_leia}
    {SW_HERO_WITHDRAWS sw_hero_chewbacca}
    {SW_HERO_WITHDRAWS sw_hero_khabarakh}
[/scenario]
