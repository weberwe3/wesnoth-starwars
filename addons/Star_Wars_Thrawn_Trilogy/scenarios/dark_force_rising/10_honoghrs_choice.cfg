#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Campaign II, mission 10 - Honoghr's Choice (finale).
# Key hexes (gen_dfr_maps.py m10): clan house keep 13,9; Imperial landing
# zones 2,9 (west) and 25,9 (east, turn 4).
# On turn 6 the Noghri clans rise: Noghri warriors join as side 3 allies and
# the player may recruit Noghri Commandos.

[scenario]
    id=sw_dfr_10_honoghrs_choice
    name= _ "Honoghr's Choice"
    next_scenario=null
    map_file=dfr_10_honoghrs_choice.map
    {SW_MUSIC sw-heroic sw-tension}
    {QUANTITY turns 15 14 13}
    victory_when_enemies_defeated=no
    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [story]
        [part]
            story= _ "Leia returned to Honoghr with a sample of the soil and a droid's maintenance records. The decontamination droids had never been cleaning the land. They had been keeping it poisoned, so that the Noghri would need the Empire forever."
        [/part]
        [part]
            story= _ "She stood in the clan house at Nystao and told them. Before the clans could answer, an Imperial shuttle landed to take her away."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        save_id=sw_player
        persistent=yes
        defeat_condition=never
        team_name=republic
        user_team_name= _ "Leia and the Noghri"
        id=sw_hero_leia
        type=sw_hero_leia
        name= _ "Leia Organa Solo"
        canrecruit=yes
        random_traits=no
        recruit=sw_unit_wk_warrior
        {QUANTITY gold 140 110 90}
        fog=no
    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial
        user_team_name= _ "Imperial Detachment"
        id=sw_dfr10_commander
        type=sw_unit_im_officer
        name= _ "Commander Sorrell"
        canrecruit=yes
        recruit=sw_unit_im_stormtrooper,sw_unit_im_clone_trooper
        {QUANTITY gold 140 180 220}
        {QUANTITY income 5 8 11}
        [ai]
            aggression=0.6
            [goal]
                name=target
                [criteria]
                    id=sw_hero_leia
                [/criteria]
                value=5
            [/goal]
        [/ai]
        [unit]
            type=sw_unit_im_clone_trooper
            x,y=4,8
        [/unit]
        [unit]
            type=sw_unit_im_clone_trooper
            x,y=4,10
        [/unit]
    [/side]

    [side]
        side=3
        controller=ai
        no_leader=yes
        team_name=republic
        user_team_name= _ "Noghri Clans"
        gold=0
        income=0
    [/side]

    [event]
        name=prestart
        [set_recruit]
            side=1
            recruit=sw_unit_wk_warrior
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_leia
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_STASH_HEROES sw_hero_luke,sw_hero_han,sw_hero_lando,sw_hero_bel_iblis}
        {SW_HERO sw_hero_chewbacca sw_hero_chewbacca ( _ "Chewbacca") 13 10}
        {SW_HERO sw_hero_khabarakh sw_hero_khabarakh ( _ "Khabarakh") 12 9}
        [label]
            x,y=13,9
            text= _ "Clan House of Nystao"
        [/label]
        [objectives]
            side=1
            [objective]
                description= _ "Hold out until the clans decide (end of the last turn)"
                condition=win
            [/objective]
            [objective]
                description= _ "Defeat Commander Sorrell"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Leia, Chewbacca, or Khabarakh"
                condition=lose
            [/objective]
            {SW_NOTE_GOLD_CARRYOVER}
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_hero_khabarakh
            message= _ "The clans are still debating, my lady. They will not move until they have decided. We must hold the dukha until then."
        [/message]
        [message]
            speaker=sw_hero_leia
            message= _ "Then we hold it. Chewie, the west door."
        [/message]
    [/event]

    [event]
        name=turn 4
        [unit]
            side=2
            type=sw_unit_im_stormtrooper
            x,y=25,9
        [/unit]
        [unit]
            side=2
            type=sw_unit_im_clone_trooper
            x,y=25,8
        [/unit]
#ifndef EASY
        [unit]
            side=2
            type=sw_unit_im_clone_trooper
            x,y=25,10
        [/unit]
#endif
        [message]
            speaker=sw_hero_khabarakh
            message= _ "A second shuttle, east of the village!"
        [/message]
    [/event]

    [event]
        name=turn 6
#define SW_DFR10_NOGHRI X Y
        [unit]
            side=3
            type=sw_unit_im_noghri
            x,y={X},{Y}
            animate=yes
        [/unit]
#enddef
        {SW_DFR10_NOGHRI 10 7}
        {SW_DFR10_NOGHRI 16 7}
        {SW_DFR10_NOGHRI 10 12}
        {SW_DFR10_NOGHRI 16 12}
#ifdef EASY
        {SW_DFR10_NOGHRI 13 5}
#endif
#undef SW_DFR10_NOGHRI
        [set_recruit]
            side=1
            recruit=sw_unit_wk_warrior,sw_unit_im_noghri
        [/set_recruit]
        [message]
            speaker=narrator
            caption= _ "Maitrakh of Clan Kihm'bar"
            image=portraits/sw-hero-khabarakh.png
            message= _ "The clans have spoken. We served the Empire for a generation because it told us we owed it our lives. It lied. The Lady Vader is under our protection."
        [/message]
        [message]
            speaker=sw_hero_leia
            message= _ "Thank you. You don't owe me anything. But I'll be glad of the help."
        [/message]
    [/event]

    [event]
        name=last breath
        [filter]
            id=sw_dfr10_commander
        [/filter]
        [fire_event]
            name=sw_dfr10_win
        [/fire_event]
    [/event]

    [event]
        name=time over
        [fire_event]
            name=sw_dfr10_win
        [/fire_event]
    [/event]

    [event]
        name=sw_dfr10_win
        [message]
            speaker=sw_hero_khabarakh
            message= _ "The Empire will learn of this. And every Noghri who guards the Grand Admiral will learn of it too."
        [/message]
        [message]
            speaker=sw_hero_leia
            message= _ "Then he's about to discover what it's like to be watched by his own bodyguards."
        [/message]
        {SW_THRAWN_SAYS ( _ "The Noghri have broken with us? ... Interesting. Then it is time to finish this war quickly, before they learn how much they know.")}
        [endlevel]
            result=victory
            bonus=yes
            carryover_report=no
        [/endlevel]
    [/event]

    [event]
        name=victory
        {SW_VICTORY_HOUSEKEEPING}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_leia}
    {SW_HERO_DEATH_IS_DEFEAT sw_hero_chewbacca}
    {SW_HERO_DEATH_IS_DEFEAT sw_hero_khabarakh}
[/scenario]
