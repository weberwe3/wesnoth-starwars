#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Campaign II, mission 4 - The Senator's Men.
# Key hexes (gen_dfr_maps.py m04): Han's keep 2,16; landing pad 25,2;
# Imperial agents' keep 24,17; commando entry 13,1 (turn 4).

[scenario]
    id=sw_dfr_04_the_senators_men
    name= _ "The Senator's Men"
    next_scenario=sw_dfr_05_peregrines_nest
    map_file=dfr_04_the_senators_men.map
    {SW_MUSIC sw-heroic sw-tension}
    {SW_FIELD_MANUAL}
    {SW_TACTICAL_SYSTEMS}
    {QUANTITY turns 16 14 13}
    victory_when_enemies_defeated=no
    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [story]
        [part]
            story= _ "Han and Lando followed rumors of the lost Katana fleet from one smugglers' port to the next. Someone was always a step ahead of them."
        [/part]
        [part]
            story= _ "On a crowded spaceport world, the someone turned out to be Imperial Intelligence, and they were not interested in talking."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        save_id=sw_player
        persistent=yes
        defeat_condition=never
        team_name=republic
        user_team_name= _ "Han and Lando"
        id=sw_hero_han
        type=sw_hero_han
        name= _ "Han Solo"
        canrecruit=yes
        random_traits=no
        recruit=sw_unit_nr_trooper,sw_unit_nr_commando,sw_unit_nr_field_medic,sw_unit_nr_eweb_team
        {QUANTITY gold 140 120 100}
        fog=yes
    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial
        user_team_name= _ "Imperial Intelligence"
        id=sw_dfr04_agent_leader
        type=sw_unit_im_officer
        name= _ "Agent Sellem"
        canrecruit=yes
        recruit=sw_unit_im_stormtrooper,sw_unit_im_scout_trooper
        {QUANTITY gold 100 140 180}
        {QUANTITY income 3 5 7}
        [ai]
            aggression=0.6
            [goal]
                name=target
                [criteria]
                    id=sw_hero_han
                [/criteria]
                value=4
            [/goal]
        [/ai]
        [unit]
            type=sw_unit_im_stormtrooper
            x,y=20,15
        [/unit]
        [unit]
            type=sw_unit_im_stormtrooper
            x,y=14,8
        [/unit]
        [unit]
            type=sw_unit_im_scout_trooper
            x,y=10,6
        [/unit]
    [/side]

    [side]
        side=3
        controller=ai
        no_leader=yes
        team_name=republic
        user_team_name= _ "Bel Iblis's Commandos"
        gold=0
        income=0
    [/side]

    [event]
        name=prestart
        [set_recruit]
            side=1
            recruit=sw_unit_nr_trooper,sw_unit_nr_commando,sw_unit_nr_field_medic,sw_unit_nr_eweb_team
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_han
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_STASH_HEROES sw_hero_leia,sw_hero_chewbacca,sw_hero_khabarakh,sw_hero_luke}
        {SW_HERO sw_hero_lando sw_hero_lando ( _ "Lando Calrissian") 3 16}
        [item]
            x,y=25,2
            image=misc/sw-objective.png
        [/item]
        [label]
            x,y=25,2
            text= _ "Millennium Falcon"
        [/label]
        [objectives]
            side=1
            [objective]
                description= _ "Han reaches the Millennium Falcon"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Han or Lando"
                condition=lose
            [/objective]
            [note]
                description= _ "Senator Bel Iblis's commandos arrive at the north edge on turn 4 and fight on your side."
            [/note]
            {TURNS_RUN_OUT}
            {SW_NOTE_GOLD_CARRYOVER}
            {SW_NOTE_AIR_SUPPORT}
        [/objectives]
        # Air support (lua/sw_air.lua). A flight from Bel Iblis's forces: one X-wing strafing run.
        {SW_AIR_SUPPORT 1 strafe 1 sw_unit_nr_xwing}
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_hero_lando
            message= _ "Stormtroopers at both ends of the street, Han. I think our informant sold us twice."
        [/message]
        [message]
            speaker=sw_hero_han
            message= _ "Then we go through the middle. The Falcon's at the north pad. Stay low."
        [/message]
    [/event]

    [event]
        name=turn 4
        [unit]
            side=3
            id=sw_dfr04_irenez
            type=sw_unit_bi_commando
            name= _ "Captain Irenez"
            x,y=13,1
            random_traits=no
        [/unit]
        [unit]
            side=3
            type=sw_unit_bi_commando
            x,y=12,1
        [/unit]
        [unit]
            side=3
            type=sw_unit_bi_commando
            x,y=14,1
        [/unit]
#ifdef EASY
        [unit]
            side=3
            type=sw_unit_bi_commando
            x,y=11,1
        [/unit]
#endif
        [message]
            speaker=sw_dfr04_irenez
            message= _ "Captain Solo, the Senator sends his regards. We'll hold the north street. Get to your ship."
        [/message]
        [message]
            speaker=sw_hero_han
            message= _ "Senator? Which senator?"
        [/message]
        [message]
            speaker=sw_dfr04_irenez
            message= _ "One you used to know. He'll explain, if you live long enough to meet him."
        [/message]
    [/event]

    [event]
        name=moveto
        [filter]
            id=sw_hero_han
            x,y=25,2
        [/filter]
        [message]
            speaker=sw_hero_lando
            message= _ "Those commandos are signaling. They want us to follow them out-system."
        [/message]
        [message]
            speaker=sw_hero_han
            message= _ "Then we follow. Carefully."
        [/message]
        [endlevel]
            result=victory
            bonus=yes
            {NEW_GOLD_CARRYOVER 40}
        [/endlevel]
    [/event]

    [event]
        name=victory
        {SW_VICTORY_HOUSEKEEPING}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_han}
    {SW_HERO_DEATH_IS_DEFEAT sw_hero_lando}
[/scenario]
