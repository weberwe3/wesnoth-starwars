#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Campaign II, mission 1 - The Noghri Prisoner.
# Design: production/campaigns/dark_force_rising/DESIGN.md.
# Capture mechanic: after any attack, if Khabarakh is at or below a third of
# his maximum hit points he surrenders (victory). Killing him is a defeat.
# At victory Khabarakh moves to side 1's recall list as an allied hero.

[scenario]
    id=sw_dfr_01_the_noghri_prisoner
    name= _ "The Noghri Prisoner"
    next_scenario=sw_dfr_02_honoghr
    map_file=dfr_01_the_noghri_prisoner.map
    {SW_MUSIC sw-tension sw-heroic}
    {SW_FIELD_MANUAL}
    {SW_TACTICAL_SYSTEMS}
    {QUANTITY turns 14 12 11}
    victory_when_enemies_defeated=no
    {SECOND_WATCH}
    {DEFAULT_MUSIC_PLAYLIST}

    [story]
        [part]
            {SW_STORY_BACKDROP bridge}
            story= _ "The Grand Admiral's fleet grows stronger every month, and the New Republic still does not know how he finds its people so easily."
        [/part]
        [part]
            {SW_STORY_BACKDROP tree-city}
            story= _ "On Kashyyyk the Noghri come for Leia again. This time she means to take one of them alive and ask him why."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        save_id=sw_player
        persistent=yes
        defeat_condition=never
        team_name=republic
        user_team_name= _ "New Republic"
        id=sw_hero_leia
        type=sw_hero_leia
        name= _ "Leia Organa Solo"
        canrecruit=yes
        random_traits=no
        recruit=sw_unit_wk_warrior,sw_unit_wk_lookout,sw_unit_nr_field_medic
        {QUANTITY gold 130 110 90}
        fog=yes
    [/side]

    [side]
        side=2
        controller=ai
        no_leader=yes
        team_name=imperial
        user_team_name= _ "Noghri Strike Team"
        gold=0
        income=0
        [ai]
            aggression=0.7
            [goal]
                name=target
                [criteria]
                    id=sw_hero_leia
                [/criteria]
                value=6
            [/goal]
        [/ai]
        [unit]
            id=sw_hero_khabarakh
            type=sw_hero_khabarakh
            name= _ "Khabarakh"
            x,y=3,8
            random_traits=no
#ifndef HARD
            ai_special=guardian
#endif
        [/unit]
        [unit]
            type=sw_unit_im_noghri
            x,y=2,10
#ifndef HARD
            ai_special=guardian
#endif
        [/unit]
        [unit]
            type=sw_unit_im_noghri
            x,y=4,10
#ifndef HARD
            ai_special=guardian
#endif
        [/unit]
#ifndef EASY
        [unit]
            type=sw_unit_im_noghri
            x,y=2,7
#ifndef HARD
            ai_special=guardian
#endif
        [/unit]
#endif
    [/side]

    # Balance review 2026-10-04: the strike team reached Leia on turn 2 in
    # every test, before her Wookiee recruits could screen her. On Easy/Normal
    # the Noghri stalk in place for the first turn (guardian: they strike only
    # what comes within reach) and close in from turn 2 on.
#ifndef HARD
    [event]
        name=turn 2
        [modify_unit]
            [filter]
                side=2
            [/filter]
            [status]
                guardian=no
            [/status]
        [/modify_unit]
    [/event]
#endif

    [event]
        name=prestart
        [set_recruit]
            side=1
            recruit=sw_unit_wk_warrior,sw_unit_wk_lookout,sw_unit_nr_field_medic
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_leia
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_HERO sw_hero_chewbacca sw_hero_chewbacca ( _ "Chewbacca") 15 10}
        [objectives]
            side=1
            [objective]
                description= _ "Capture Khabarakh: reduce him to a third of his hit points or less"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Khabarakh"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of Leia"
                condition=lose
            [/objective]
            [note]
                description= _ "If Chewbacca falls, he withdraws from the fight badly wounded and returns for the next mission."
            [/note]
            {TURNS_RUN_OUT}
            {SW_NOTE_GOLD_CARRYOVER}
            [note]
                description= _ "Wookiee Lookouts reveal Noghri within two hexes."
            [/note]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_hero_leia
            message= _ "They're here again. I can feel it, the same way I felt them on Bpfassh."
        [/message]
        [message]
            speaker=sw_hero_chewbacca
            message= _ "<i>(Chewbacca growls low and long.)</i>"
        [/message]
        [message]
            speaker=sw_hero_leia
            message= _ "No, Chewie. Not this time. I want one of them alive. Their leader, if we can manage it."
        [/message]
    [/event]

    [event]
        name=turn 4
        [unit]
            side=2
            type=sw_unit_im_noghri
            x,y=1,4
        [/unit]
        [unit]
            side=2
            type=sw_unit_im_noghri
            x,y=1,14
        [/unit]
    [/event]

    # Capture check after every attack involving Khabarakh.
    [event]
        name=attack end
        first_time_only=no
        [filter_second]
            id=sw_hero_khabarakh
        [/filter_second]
        [fire_event]
            name=sw_dfr01_check_capture
        [/fire_event]
    [/event]
    [event]
        name=attack end
        first_time_only=no
        [filter]
            id=sw_hero_khabarakh
        [/filter]
        [fire_event]
            name=sw_dfr01_check_capture
        [/fire_event]
    [/event]

    [event]
        name=sw_dfr01_check_capture
        first_time_only=no
        [store_unit]
            [filter]
                id=sw_hero_khabarakh
            [/filter]
            variable=sw_dfr01_k
        [/store_unit]
        [if]
            [variable]
                name=sw_dfr01_k.length
                greater_than=0
            [/variable]
            [variable]
                name=sw_dfr01_k.hitpoints
                less_than_equal_to="$($sw_dfr01_k.max_hitpoints / 3)"
            [/variable]
            [then]
                [message]
                    speaker=sw_hero_khabarakh
                    message= _ "Enough. I yield, and I will answer you. But not here, with my team watching from the trees."
                [/message]
                [message]
                    speaker=sw_hero_leia
                    message= _ "Then we'll talk in private. Chewie, call the others off."
                [/message]
                [endlevel]
                    result=victory
                    bonus=yes
                    {NEW_GOLD_CARRYOVER 40}
                [/endlevel]
            [/then]
        [/if]
        {CLEAR_VARIABLE sw_dfr01_k}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_khabarakh}
    {SW_HERO_DEATH_IS_DEFEAT sw_hero_leia}
    {SW_HERO_WITHDRAWS sw_hero_chewbacca}

    [event]
        name=victory
        # Khabarakh becomes side 1's ally for the missions on Honoghr.
        [store_unit]
            [filter]
                id=sw_hero_khabarakh
            [/filter]
            variable=sw_dfr01_k
            kill=yes
        [/store_unit]
        [set_variable]
            name=sw_dfr01_k.side
            value=1
        [/set_variable]
        [set_variable]
            name=sw_dfr01_k.hitpoints
            value=$sw_dfr01_k.max_hitpoints
        [/set_variable]
        [unstore_unit]
            variable=sw_dfr01_k
            x,y=recall,recall
        [/unstore_unit]
        {CLEAR_VARIABLE sw_dfr01_k}
        {SW_VICTORY_HOUSEKEEPING}
    [/event]
[/scenario]
