#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Campaign II, mission 8 - Aboard the Katana (interior assault).
# Key hexes (gen_dfr_maps.py m08): airlock keep 3,9; bridge 24,9.
# Clone stormtroopers hold the corridors; more board from the bow.

[scenario]
    id=sw_dfr_08_aboard_the_katana
    name= _ "Aboard the Katana"
    next_scenario=sw_dfr_09_battle_for_the_fleet
    map_file=dfr_08_aboard_the_katana.map
    {SW_MUSIC sw-tension sw-heroic}
    {SW_FIELD_MANUAL}
    {QUANTITY turns 18 16 15}
    victory_when_enemies_defeated=no
    {INDOORS}
    {DEFAULT_MUSIC_PLAYLIST}

    [story]
        [part]
            story= _ "The Katana herself, flagship of the lost fleet, still hung at the head of the line. Imperial assault shuttles had reached her first."
        [/part]
        [part]
            story= _ "The soldiers inside did not move like ordinary stormtroopers. They moved like one man, copied many times."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        save_id=sw_player
        persistent=yes
        defeat_condition=never
        team_name=republic
        user_team_name= _ "Boarding Party"
        id=sw_hero_luke
        type=sw_hero_luke
        name= _ "Luke Skywalker"
        canrecruit=yes
        random_traits=no
        recruit=sw_unit_nr_trooper,sw_unit_nr_commando,sw_unit_nr_field_medic
        {QUANTITY gold 140 110 90}
        fog=yes
    [/side]

    [side]
        side=2
        controller=ai
        no_leader=yes
        team_name=imperial
        user_team_name= _ "Clone Boarding Troops"
        gold=0
        income=0
        [ai]
            aggression=0.6
            [goal]
                name=protect_location
                [criteria]
                    x,y=24,9
                [/criteria]
                protect_radius=4
                value=3
            [/goal]
        [/ai]
#define SW_DFR08_CLONE X Y
        [unit]
            type=sw_unit_im_clone_trooper
            x,y={X},{Y}
        [/unit]
#enddef
        {SW_DFR08_CLONE 11 9}
        {SW_DFR08_CLONE 16 9}
        {SW_DFR08_CLONE 21 8}
        {SW_DFR08_CLONE 21 10}
        {SW_DFR08_CLONE 23 9}
        {SW_DFR08_CLONE 16 4}
#ifndef EASY
        {SW_DFR08_CLONE 11 14}
        {SW_DFR08_CLONE 22 7}
#endif
#undef SW_DFR08_CLONE
        [unit]
            id=sw_dfr08_clone_officer
            type=sw_unit_im_stormtrooper_sergeant
            name= _ "Clone Commander"
            x,y=24,9
        [/unit]
    [/side]

    [event]
        name=prestart
        [set_recruit]
            side=1
            recruit=sw_unit_nr_trooper,sw_unit_nr_commando,sw_unit_nr_field_medic
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_luke
            [/filter]
            canrecruit=yes
        [/modify_unit]
        [transform_unit]
            id=sw_hero_luke
            transform_to=sw_hero_luke
        [/transform_unit]
        {SW_STASH_HEROES sw_hero_leia,sw_hero_khabarakh,sw_hero_bel_iblis}
        {SW_HERO sw_hero_han sw_hero_han ( _ "Han Solo") 4 9}
        {SW_HERO sw_hero_lando sw_hero_lando ( _ "Lando Calrissian") 3 10}
        {SW_HERO sw_hero_chewbacca sw_hero_chewbacca ( _ "Chewbacca") 4 8}
        [label]
            x,y=24,9
            text= _ "Bridge"
        [/label]
        [objectives]
            side=1
            [objective]
                description= _ "Luke reaches the Katana's bridge"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Luke, Han, Lando, or Chewbacca"
                condition=lose
            [/objective]
            {TURNS_RUN_OUT}
            {SW_NOTE_GOLD_CARRYOVER}
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_hero_han
            message= _ "Imperials got here first. How many of them are there?"
        [/message]
        [message]
            speaker=sw_hero_luke
            message= _ "Han, I can barely feel them. It's like they're all the same person."
        [/message]
        [message]
            speaker=sw_hero_lando
            message= _ "Clones. That's how he's been filling all those new ships so fast. We need that bridge."
        [/message]
    [/event]

    [event]
        name=turn 5,turn 9
        first_time_only=no
        [unit]
            side=2
            type=sw_unit_im_clone_trooper
            x,y=21,2
        [/unit]
        [unit]
            side=2
            type=sw_unit_im_clone_trooper
            x,y=21,16
        [/unit]
    [/event]

    [event]
        name=moveto
        [filter]
            id=sw_hero_luke
            x,y=24,9
        [/filter]
        [message]
            speaker=sw_hero_luke
            message= _ "Bridge secured. Slaving the fleet controls to this console now."
        [/message]
        [message]
            speaker=sw_hero_han
            message= _ "Good, because the scopes just lit up. Two Star Destroyers, coming in fast. Guess who."
        [/message]
        [endlevel]
            result=victory
            bonus=yes
            {NEW_GOLD_CARRYOVER 40}
        [/endlevel]
    [/event]

    [event]
        name=victory
        {SW_VICTORY_HOUSEKEEPING}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_luke}
    {SW_HERO_DEATH_IS_DEFEAT sw_hero_han}
    {SW_HERO_DEATH_IS_DEFEAT sw_hero_lando}
    {SW_HERO_DEATH_IS_DEFEAT sw_hero_chewbacca}
[/scenario]
