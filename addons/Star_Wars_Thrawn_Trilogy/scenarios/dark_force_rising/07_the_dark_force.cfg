#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Campaign II, mission 7 - The Dark Force (race to board derelicts).
# Key hexes (gen_dfr_maps.py m07): Wedge's hangar 3,11; Imperial hangar 28,11;
# eight drifting Dreadnaughts in the middle of the map.
#
# Boarding mechanic: the Dreadnaughts belong to side 3, allied to both
# fleets (team_name lists both) so neither side shoots them. A boarding
# shuttle that ends its move next to a free side-3 Dreadnaught starts
# docking (ship variables sw_dock_side, sw_dock_by); at the start of that
# side's next turn the ship changes to its side if the shuttle is still
# alive and alongside. Docking takes a turn so it can be stopped (owner
# report 2026-10-16: three ships were taken before the Imperial shuttles had
# moved once). Imperial shuttles are steered by goto orders, and a boarding
# party is already under way at the start (1/2/3 shuttles with escorts).
# Victory: three Dreadnaughts on side 1. Defeat: four on side 2.

#define SW_DFR07_COUNT SIDE VAR
    [store_unit]
        [filter]
            side={SIDE}
            type=sw_unit_ob_dreadnaught
        [/filter]
        variable=sw_dfr07_tmp
    [/store_unit]
    [set_variable]
        name={VAR}
        value=$sw_dfr07_tmp.length
    [/set_variable]
    {CLEAR_VARIABLE sw_dfr07_tmp}
#enddef

[scenario]
    id=sw_dfr_07_the_dark_force
    name= _ "The Dark Force"
    next_scenario=sw_dfr_08_aboard_the_katana
    map_file=dfr_07_the_dark_force.map
    {SW_MUSIC sw-space sw-tension sw-thrawn}
    {SW_FIELD_MANUAL}
    {SW_TACTICAL_SYSTEMS}
    # Optional objective (lua/sw_bonus.lua).
    {SW_BONUS no_losses - 50}
    {QUANTITY turns 18 16 15}
    victory_when_enemies_defeated=no
    {UNDERGROUND}

    [story]
        [part]
            {SW_STORY_BACKDROP spaceport}
            story= _ "Talon Karrde sold the location of the Katana fleet to the New Republic. He had already sold it to someone else, who had sold it to the Grand Admiral."
        [/part]
        [part]
            {SW_STORY_BACKDROP ghost-fleet}
            story= _ "Two hundred Dreadnaughts drift in the dark, their crews long dead. Whoever docks with them first can fly them home."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        save_id=sw_player
        persistent=yes
        defeat_condition=never
        team_name=republic
        user_team_name= _ "New Republic Task Force"
        id=sw_hero_wedge
        type=sw_hero_wedge
        name= _ "Wedge Antilles"
        canrecruit=yes
        random_traits=no
        recruit=sw_unit_nr_xwing,sw_unit_nr_awing,sw_unit_nr_ywing,sw_unit_nr_boarding_shuttle
        {QUANTITY gold 190 160 140}
        fog=no
    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial
        user_team_name= _ "Imperial Boarding Force"
        id=sw_dfr07_carrier
        type=sw_unit_im_star_destroyer
        name= _ "Peremptory"
        canrecruit=yes
        recruit=sw_unit_im_tie_fighter,sw_unit_im_tie_interceptor,sw_unit_im_boarding_shuttle
        {QUANTITY gold 150 200 250}
        {QUANTITY income 6 9 12}
        [ai]
            passive_leader=yes
            aggression=0.7
            recruitment_pattern=fighter,fighter,mixed fighter
        [/ai]
    [/side]

    [side]
        side=3
        controller=ai
        no_leader=yes
        team_name=republic,imperial
        user_team_name= _ "Katana Fleet (derelict)"
        gold=0
        income=0
        [ai]
            aggression=-1
            caution=1
        [/ai]
#define SW_DFR07_DREAD X Y
        [unit]
            type=sw_unit_ob_dreadnaught
            x,y={X},{Y}
            [modifications]
                {TRAIT_LOYAL}
                [object]
                    # Derelicts cannot maneuver until a crew is aboard.
                    [effect]
                        apply_to=movement
                        set=0
                    [/effect]
                [/object]
            [/modifications]
        [/unit]
#enddef
        {SW_DFR07_DREAD 12 5}
        {SW_DFR07_DREAD 18 5}
        {SW_DFR07_DREAD 11 9}
        {SW_DFR07_DREAD 19 9}
        {SW_DFR07_DREAD 12 14}
        {SW_DFR07_DREAD 18 14}
        {SW_DFR07_DREAD 15 8}
        {SW_DFR07_DREAD 15 15}
#undef SW_DFR07_DREAD
    [/side]

    [event]
        name=prestart
        [set_recruit]
            side=1
            recruit=sw_unit_nr_xwing,sw_unit_nr_awing,sw_unit_nr_ywing,sw_unit_nr_boarding_shuttle
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_wedge
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_STASH_HEROES sw_hero_leia,sw_hero_chewbacca,sw_hero_khabarakh,sw_hero_han,sw_hero_lando,sw_hero_bel_iblis}
        {SW_HERO sw_hero_luke sw_hero_xwing_luke ( _ "Luke Skywalker") 4 11}
        [transform_unit]
            id=sw_hero_luke
            transform_to=sw_hero_xwing_luke
        [/transform_unit]
        [unit]
            side=1
            type=sw_unit_nr_boarding_shuttle
            x,y=4,10
        [/unit]
        # A TIE picket already patrols the derelicts, so a shuttle docking
        # in the west has to be escorted or the picket cleared first.
#define SW_DFR07_PICKET TYPE X Y
        [unit]
            side=2
            type={TYPE}
            x,y={X},{Y}
            [modifications]
                {TRAIT_LOYAL}
            [/modifications]
        [/unit]
#enddef
        {SW_DFR07_PICKET sw_unit_im_tie_fighter 14 7}
        {SW_DFR07_PICKET sw_unit_im_tie_fighter 14 12}
#ifndef EASY
        {SW_DFR07_PICKET sw_unit_im_tie_fighter 13 10}
#endif
#ifdef HARD
        {SW_DFR07_PICKET sw_unit_im_tie_interceptor 16 6}
        {SW_DFR07_PICKET sw_unit_im_tie_interceptor 16 13}
#endif
#undef SW_DFR07_PICKET
        # The Peremptory's first boarding party is already under way: two
        # moves (6 MP) from the nearest derelicts, so it docks on the Imperial
        # turn 2 and secures on turn 3, and Luke (turn 2) or A-wings recruited
        # on turn 1 (turn 3) can intercept it.
        [unit]
            side=2
            type=sw_unit_im_boarding_shuttle
            x,y=27,6
        [/unit]
        [unit]
            side=2
            type=sw_unit_im_tie_fighter
            x,y=26,6
        [/unit]
#ifndef EASY
        [unit]
            side=2
            type=sw_unit_im_boarding_shuttle
            x,y=27,16
        [/unit]
        [unit]
            side=2
            type=sw_unit_im_tie_fighter
            x,y=26,16
        [/unit]
#endif
#ifdef HARD
        [unit]
            side=2
            type=sw_unit_im_boarding_shuttle
            x,y=28,8
        [/unit]
        [unit]
            side=2
            type=sw_unit_im_tie_interceptor
            x,y=27,8
        [/unit]
#endif
        [objectives]
            side=1
            [objective]
                description= _ "Secure three Dreadnaughts (dock a Boarding Shuttle next to one for a turn)"
                condition=win
            [/objective]
            [objective]
                description= _ "The Empire secures four Dreadnaughts"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of Wedge Antilles"
                condition=lose
            [/objective]
            [note]
                description= _ "If Luke falls, he withdraws from the fight badly wounded and returns for the next mission."
            [/note]
            {TURNS_RUN_OUT}
            {SW_NOTE_GOLD_CARRYOVER}
            [note]
                description= _ "Docking takes a turn: a shuttle that ends its move next to a free Dreadnaught secures it at the start of its side's next turn, if it is still alive and alongside."
            [/note]
            [note]
                description= _ "A TIE picket patrols the derelicts, an Imperial boarding party is already on its way, and more assault shuttles will follow. Escort your shuttles, and shoot theirs down before they finish docking."
            [/note]
            {SW_BONUS_OBJECTIVE ( _ "Lose no units") 50}
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_hero_wedge
            message= _ "There they are. Dreadnaughts, dozens of them, all in a line. And a Star Destroyer already launching shuttles."
        [/message]
        [message]
            speaker=sw_hero_luke
            message= _ "Fighters, screen our shuttles. Boarding crews, dock with anything you can reach."
        [/message]
    [/event]

    # Steer every new Imperial assault shuttle at the nearest free Dreadnaught
    # that no other Imperial shuttle is already heading for.
    [event]
        name=recruit,unit placed
        first_time_only=no
        [filter]
            type=sw_unit_im_boarding_shuttle
        [/filter]
        [lua]
            code=<< sw_dfr07.aim(wesnoth.units.get(wml.variables.x1, wml.variables.y1)) >>
        [/lua]
    [/event]

    # Docking (lua below): a shuttle that ends a move next to a free
    # derelict starts docking with it.
    [event]
        name=moveto
        first_time_only=no
        [filter]
            type=sw_unit_nr_boarding_shuttle,sw_unit_im_boarding_shuttle
            [filter_adjacent]
                side=3
                type=sw_unit_ob_dreadnaught
            [/filter_adjacent]
        [/filter]
        [lua]
            code=<< sw_dfr07.dock(wml.variables.x1, wml.variables.y1) >>
        [/lua]
    [/event]

    # At the start of each side's turn its finished dockings secure their
    # ships; then the win and loss counts are checked.
    [event]
        name=side turn
        first_time_only=no
        [lua]
            code=<< sw_dfr07.secure(wesnoth.current.side) >>
        [/lua]
        {SW_DFR07_COUNT 1 sw_dfr07_ours}
        {SW_DFR07_COUNT 2 sw_dfr07_theirs}
        [if]
            [variable]
                name=sw_dfr07_ours
                greater_than_equal_to=3
            [/variable]
            [then]
                [message]
                    speaker=sw_hero_wedge
                    message= _ "Three Dreadnaughts are ours and answering their helms. That's our share of the Dark Force, people."
                [/message]
                [message]
                    speaker=sw_hero_luke
                    message= _ "Wedge, the flagship is still unclaimed. If its slave circuits are intact, it controls the rest. I'm taking a team aboard."
                [/message]
                [endlevel]
                    result=victory
                    bonus=yes
                    {NEW_GOLD_CARRYOVER 40}
                [/endlevel]
            [/then]
        [/if]
        [if]
            [variable]
                name=sw_dfr07_theirs
                greater_than_equal_to=4
            [/variable]
            [then]
                [message]
                    speaker=sw_hero_wedge
                    message= _ "They've got too many of them. Pull back!"
                [/message]
                [endlevel]
                    result=defeat
                [/endlevel]
            [/then]
        [/if]
    [/event]

    # The docking rules, defined on every load (globals are not saved).
    [event]
        name=preload
        first_time_only=no
        [lua]
            code=<<
                local _ = wesnoth.textdomain "wesnoth-Star_Wars_Thrawn_Trilogy"
                local SHUTTLES = { sw_unit_nr_boarding_shuttle = true, sw_unit_im_boarding_shuttle = true }
                sw_dfr07 = {}
                local function float(u, text, color)
                    wesnoth.interface.float_label(u.x, u.y, "<span color='" .. color .. "'>" .. tostring(text) .. "</span>")
                end
                local function free_ships()
                    local out = {}
                    for _i, d in ipairs(wesnoth.units.find_on_map{ side = 3, type = "sw_unit_ob_dreadnaught" }) do
                        if not d.variables.sw_dock_side then table.insert(out, d) end
                    end
                    return out
                end
                -- Send an Imperial shuttle to the nearest free ship no other
                -- Imperial shuttle is heading for (any free ship if all are).
                function sw_dfr07.aim(s)
                    if not s then return end
                    local taken = {}
                    for _i, o in ipairs(wesnoth.units.find_on_map{ side = 2, type = "sw_unit_im_boarding_shuttle" }) do
                        local g = o["goto"]
                        local gx, gy = g and (g.x or g[1]), g and (g.y or g[2])
                        if o.id ~= s.id and gx and gx > 0 then taken[gx .. "," .. gy] = true end
                    end
                    local best, best_free
                    for _i, d in ipairs(free_ships()) do
                        local dist = wesnoth.map.distance_between(s.x, s.y, d.x, d.y)
                        if not best or dist < best[2] then best = { d, dist } end
                        if not taken[d.x .. "," .. d.y] and (not best_free or dist < best_free[2]) then best_free = { d, dist } end
                    end
                    local t = (best_free or best or {})[1]
                    if t then s["goto"] = { t.x, t.y } end
                end
                -- Start docking: the shuttle at x,y and the first free derelict beside it.
                function sw_dfr07.dock(x, y)
                    local s = wesnoth.units.get(x, y)
                    if not s or not SHUTTLES[s.type] then return end
                    for _i, d in ipairs(free_ships()) do
                        if wesnoth.map.distance_between(s.x, s.y, d.x, d.y) == 1 then
                            d.variables.sw_dock_side, d.variables.sw_dock_by = s.side, s.id
                            s.moves = 0
                            float(d, _ "Docking — secured next turn", "#ffe080")
                            return
                        end
                    end
                end
                -- A side's finished dockings: the ship joins the side if its
                -- shuttle survived alongside, else the docking is broken off.
                function sw_dfr07.secure(side)
                    for _i, d in ipairs(wesnoth.units.find_on_map{ side = 3, type = "sw_unit_ob_dreadnaught" }) do
                        if d.variables.sw_dock_side == side then
                            local s = wesnoth.units.get(d.variables.sw_dock_by)
                            d.variables.sw_dock_side, d.variables.sw_dock_by = nil, nil
                            if s and s.side == side and wesnoth.map.distance_between(s.x, s.y, d.x, d.y) == 1 then
                                d.side = side
                                float(d, _ "Dreadnaught secured", "#ffe080")
                                -- An Imperial crew moves on to the next free ship.
                                if side == 2 then sw_dfr07.aim(s) end
                            else
                                float(d, _ "Docking broken off", "#ff9080")
                            end
                        end
                    end
                end
            >>
        [/lua]
    [/event]

    [event]
        name=victory
        [store_unit]
            [filter]
                side=1
                type=sw_unit_ob_dreadnaught,sw_unit_nr_boarding_shuttle
            [/filter]
            variable=sw_dfr07_discard
            kill=yes
        [/store_unit]
        [set_variable]
            name=sw_dfr_dreadnaughts_secured
            value=$sw_dfr07_ours
        [/set_variable]
        {CLEAR_VARIABLE sw_dfr07_discard,sw_dfr07_ours,sw_dfr07_theirs}
        [transform_unit]
            id=sw_hero_luke
            transform_to=sw_hero_luke
        [/transform_unit]
        {SW_VICTORY_HOUSEKEEPING}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_wedge}
    {SW_HERO_WITHDRAWS sw_hero_luke}
[/scenario]

#undef SW_DFR07_COUNT
