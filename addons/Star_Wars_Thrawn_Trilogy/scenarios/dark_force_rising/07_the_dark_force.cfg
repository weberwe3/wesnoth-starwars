#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Campaign II, mission 7 - The Dark Force (race to board derelicts).
# Key hexes (gen_dfr_maps.py m07): Wedge's hangar 3,11; Imperial hangar 28,11;
# eight drifting Dreadnaughts in the middle of the map.
#
# Boarding mechanic: the Dreadnaughts belong to side 3, allied to both
# fleets (team_name lists both) so neither side shoots them. A boarding
# shuttle that moves next to a side-3 Dreadnaught claims it: the ship changes
# to the shuttle's side. Imperial shuttles are steered by goto orders.
# Victory: three Dreadnaughts on side 1. Defeat: four on side 2.

#define SW_DFR07_COUNT SIDE VAR
    [store_unit]
        [filter]
            side={SIDE}
            type=sw_unit_ob_dreadnaught
        [/filter]
        variable=sw_dfr07_tmp
    [/store_unit]
    [set_variable]
        name={VAR}
        value=$sw_dfr07_tmp.length
    [/set_variable]
    {CLEAR_VARIABLE sw_dfr07_tmp}
#enddef

[scenario]
    id=sw_dfr_07_the_dark_force
    name= _ "The Dark Force"
    next_scenario=sw_dfr_08_aboard_the_katana
    map_file=dfr_07_the_dark_force.map
    {QUANTITY turns 18 16 15}
    victory_when_enemies_defeated=no
    {UNDERGROUND}
    {DEFAULT_MUSIC_PLAYLIST}

    [story]
        [part]
            story= _ "Talon Karrde sold the location of the Katana fleet to the New Republic. He had already sold it to someone else, who had sold it to the Grand Admiral."
        [/part]
        [part]
            story= _ "Two hundred Dreadnaughts drift in the dark, their crews long dead. Whoever docks with them first can fly them home."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        save_id=sw_player
        persistent=yes
        defeat_condition=never
        team_name=republic
        user_team_name= _ "New Republic Task Force"
        id=sw_hero_wedge
        type=sw_hero_wedge
        name= _ "Wedge Antilles"
        canrecruit=yes
        random_traits=no
        recruit=sw_unit_nr_xwing,sw_unit_nr_awing,sw_unit_nr_ywing,sw_unit_nr_boarding_shuttle
        {QUANTITY gold 190 160 140}
        fog=no
    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial
        user_team_name= _ "Imperial Boarding Force"
        id=sw_dfr07_carrier
        type=sw_unit_im_star_destroyer
        name= _ "Peremptory"
        canrecruit=yes
        recruit=sw_unit_im_tie_fighter,sw_unit_im_tie_interceptor,sw_unit_im_boarding_shuttle
        {QUANTITY gold 150 200 250}
        {QUANTITY income 6 9 12}
        [ai]
            passive_leader=yes
            aggression=0.7
            recruitment_pattern=fighter,fighter,mixed fighter
        [/ai]
    [/side]

    [side]
        side=3
        controller=ai
        no_leader=yes
        team_name=republic,imperial
        user_team_name= _ "Katana Fleet (derelict)"
        gold=0
        income=0
        [ai]
            aggression=-1
            caution=1
        [/ai]
#define SW_DFR07_DREAD X Y
        [unit]
            type=sw_unit_ob_dreadnaught
            x,y={X},{Y}
            [modifications]
                {TRAIT_LOYAL}
                [object]
                    # Derelicts cannot maneuver until a crew is aboard.
                    [effect]
                        apply_to=movement
                        set=0
                    [/effect]
                [/object]
            [/modifications]
        [/unit]
#enddef
        {SW_DFR07_DREAD 12 5}
        {SW_DFR07_DREAD 18 5}
        {SW_DFR07_DREAD 11 9}
        {SW_DFR07_DREAD 19 9}
        {SW_DFR07_DREAD 12 14}
        {SW_DFR07_DREAD 18 14}
        {SW_DFR07_DREAD 15 8}
        {SW_DFR07_DREAD 15 15}
#undef SW_DFR07_DREAD
    [/side]

    [event]
        name=prestart
        [set_recruit]
            side=1
            recruit=sw_unit_nr_xwing,sw_unit_nr_awing,sw_unit_nr_ywing,sw_unit_nr_boarding_shuttle
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_wedge
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_STASH_HEROES sw_hero_leia,sw_hero_chewbacca,sw_hero_khabarakh,sw_hero_han,sw_hero_lando,sw_hero_bel_iblis}
        {SW_HERO sw_hero_luke sw_hero_xwing_luke ( _ "Luke Skywalker") 4 11}
        [transform_unit]
            id=sw_hero_luke
            transform_to=sw_hero_xwing_luke
        [/transform_unit]
        [unit]
            side=1
            type=sw_unit_nr_boarding_shuttle
            x,y=4,10
        [/unit]
        [objectives]
            side=1
            [objective]
                description= _ "Secure three Dreadnaughts (move a Boarding Shuttle next to one)"
                condition=win
            [/objective]
            [objective]
                description= _ "The Empire secures four Dreadnaughts"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of Wedge Antilles or Luke Skywalker"
                condition=lose
            [/objective]
            {TURNS_RUN_OUT}
            {SW_NOTE_GOLD_CARRYOVER}
            [note]
                description= _ "Imperial assault shuttles race for the same ships. Shoot them down before they dock."
            [/note]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_hero_wedge
            message= _ "There they are. Dreadnaughts, dozens of them, all in a line. And a Star Destroyer already launching shuttles."
        [/message]
        [message]
            speaker=sw_hero_luke
            message= _ "Fighters, screen our shuttles. Boarding crews, dock with anything you can reach."
        [/message]
    [/event]

    # Steer every new Imperial assault shuttle at an unclaimed Dreadnaught.
    [event]
        name=recruit,unit placed
        first_time_only=no
        [filter]
            type=sw_unit_im_boarding_shuttle
        [/filter]
        [store_unit]
            [filter]
                side=3
            [/filter]
            variable=sw_dfr07_targets
        [/store_unit]
        [if]
            [variable]
                name=sw_dfr07_targets.length
                greater_than=0
            [/variable]
            [then]
                [set_variable]
                    name=sw_dfr07_pick
                    rand=0..$($sw_dfr07_targets.length - 1)
                [/set_variable]
                [modify_unit]
                    [filter]
                        x,y=$x1,$y1
                    [/filter]
                    goto_x=$sw_dfr07_targets[$sw_dfr07_pick].x
                    goto_y=$sw_dfr07_targets[$sw_dfr07_pick].y
                [/modify_unit]
            [/then]
        [/if]
        {CLEAR_VARIABLE sw_dfr07_targets,sw_dfr07_pick}
    [/event]

    # A shuttle that ends a move next to a derelict claims it for its side.
    [event]
        name=moveto
        first_time_only=no
        [filter]
            type=sw_unit_nr_boarding_shuttle,sw_unit_im_boarding_shuttle
            [filter_adjacent]
                side=3
                type=sw_unit_ob_dreadnaught
            [/filter_adjacent]
        [/filter]
        [store_unit]
            [filter]
                side=3
                [filter_adjacent]
                    x,y=$x1,$y1
                [/filter_adjacent]
            [/filter]
            variable=sw_dfr07_claimed
        [/store_unit]
        [modify_unit]
            [filter]
                x,y=$sw_dfr07_claimed[0].x,$sw_dfr07_claimed[0].y
            [/filter]
            side=$unit.side
        [/modify_unit]
        [floating_text]
            x,y=$sw_dfr07_claimed[0].x,$sw_dfr07_claimed[0].y
            text="<span color='#ffe080'>" + _ "Dreadnaught secured" + "</span>"
        [/floating_text]
        {CLEAR_VARIABLE sw_dfr07_claimed}
        {SW_DFR07_COUNT 1 sw_dfr07_ours}
        {SW_DFR07_COUNT 2 sw_dfr07_theirs}
        [if]
            [variable]
                name=sw_dfr07_ours
                greater_than_equal_to=3
            [/variable]
            [then]
                [message]
                    speaker=sw_hero_wedge
                    message= _ "Three Dreadnaughts are ours and answering their helms. That's our share of the Dark Force, people."
                [/message]
                [message]
                    speaker=sw_hero_luke
                    message= _ "Wedge, the flagship is still unclaimed. If its slave circuits are intact, it controls the rest. I'm taking a team aboard."
                [/message]
                [endlevel]
                    result=victory
                    bonus=yes
                    {NEW_GOLD_CARRYOVER 40}
                [/endlevel]
            [/then]
        [/if]
        [if]
            [variable]
                name=sw_dfr07_theirs
                greater_than_equal_to=4
            [/variable]
            [then]
                [message]
                    speaker=sw_hero_wedge
                    message= _ "They've got too many of them. Pull back!"
                [/message]
                [endlevel]
                    result=defeat
                [/endlevel]
            [/then]
        [/if]
    [/event]

    [event]
        name=victory
        [store_unit]
            [filter]
                side=1
                type=sw_unit_ob_dreadnaught,sw_unit_nr_boarding_shuttle
            [/filter]
            variable=sw_dfr07_discard
            kill=yes
        [/store_unit]
        [set_variable]
            name=sw_dfr_dreadnaughts_secured
            value=$sw_dfr07_ours
        [/set_variable]
        {CLEAR_VARIABLE sw_dfr07_discard,sw_dfr07_ours,sw_dfr07_theirs}
        [transform_unit]
            id=sw_hero_luke
            transform_to=sw_hero_luke
        [/transform_unit]
        {SW_VICTORY_HOUSEKEEPING}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_wedge}
    {SW_HERO_DEATH_IS_DEFEAT sw_hero_luke}
[/scenario]

#undef SW_DFR07_COUNT
