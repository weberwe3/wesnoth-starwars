#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

#ifdef CAMPAIGN_STAR_WARS_DARK_FORCE_RISING
[scenario]
    id=sw_20_flight_through_the_ravine
    name= _ "Flight Through the Ravine"
    map_data="Hh,Hh,Hh,Hh,Hh,Hh,Hh,Hh,Hh
Hh,Hh^Fp,Gg,Gg,Gg,Gg,Gg,Hh,Hh
Gg,Gg,Gg^Fp,Gg,Gg^Fp,Gg,Gg,Gg,Gg
Hh,Hh^Fp,Gg,Gg,Gg,Gg,Gg,Hh,Hh
Hh,Hh,Hh,Hh,Hh,Hh,Hh,Hh,Hh"
    turns=10
    victory_when_enemies_defeated=no

    [label]
        x=9
        y=2,3,4
        text= _ "Ravine Exit"
    [/label]

    [side]
        side=1
        controller=human
        team_name=sw_new_republic
        user_team_name= _ "New Republic Evacuation Detail"
        type=sw_unit_nr_hero_commander
        id=sw_ravine_commander
        name= _ "New Republic Commander"
        x=1
        y=3
        canrecruit=yes
        gold=0
        recruit=
        [unit]
            # The transport is a normal single-hex unit that must remain intact.
            type=sw_unit_nr_evacuation_transport
            id=sw_ravine_transport
            name= _ "Evacuation Transport"
            x=2
            y=3
            canrecruit=no
        [/unit]
    [/side]

    [side]
        side=2
        controller=ai
        team_name=sw_imperial_remnant
        user_team_name= _ "Imperial Remnant Pursuit"
        type=sw_unit_im_recon_squad
        id=sw_ravine_pursuit_leader
        name= _ "Imperial Remnant Pursuit Speeder"
        x=8
        y=2
        canrecruit=yes
        gold=0
        recruit=
        [unit]
            type=sw_unit_im_recon_squad
            id=sw_ravine_pursuit_speeder_one
            name= _ "Imperial Remnant Pursuit Speeder"
            x=7
            y=3
            canrecruit=no
        [/unit]
        [unit]
            type=sw_unit_im_recon_squad
            id=sw_ravine_pursuit_speeder_two
            name= _ "Imperial Remnant Pursuit Speeder"
            x=8
            y=4
            canrecruit=no
        [/unit]
    [/side]

    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                description= _ "Move the New Republic Commander and Evacuation Transport to the Ravine Exit"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of the New Republic Commander"
                condition=lose
            [/objective]
            [objective]
                description= _ "Destruction of the Evacuation Transport"
                condition=lose
            [/objective]
            [objective]
                description= _ "Turns run out"
                condition=lose
            [/objective]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_ravine_commander
            message= _ "The ravine walls will slow their speeders, but the transport cannot stop. Keep it on the valley floor and reach the far marker."
        [/message]
        [message]
            speaker=sw_ravine_pursuit_leader
            message= _ "Pursuit formation, close the gap. The New Republic convoy leaves this ravine as wreckage."
        [/message]
    [/event]

    # Check every friendly arrival so either survivor can move last to the exit.
    [event]
        name=moveto
        [filter]
            side=1
            x=9
            y=2,3,4
        [/filter]
        [if]
            [have_unit]
                id=sw_ravine_commander
                x=9
                y=2,3,4
            [/have_unit]
            [have_unit]
                id=sw_ravine_transport
                x=9
                y=2,3,4
            [/have_unit]
            [then]
                [message]
                    speaker=sw_ravine_commander
                    message= _ "The transport has cleared the ravine. Signal the escorts to scatter into the hills!"
                [/message]
                [endlevel]
                    result=victory
                    bonus=yes
                    carryover_report=yes
                [/endlevel]
            [/then]
        [/if]
    [/event]

    [event]
        name=die
        [filter]
            id=sw_ravine_commander
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=die
        [filter]
            id=sw_ravine_transport
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=time over
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]
#endif
