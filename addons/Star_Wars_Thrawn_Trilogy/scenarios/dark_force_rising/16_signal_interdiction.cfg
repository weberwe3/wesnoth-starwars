#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

#ifdef CAMPAIGN_STAR_WARS_DARK_FORCE_RISING
[scenario]
    id=sw_16_signal_interdiction
    name= _ "Signal Interdiction"
    map_data="Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg^Fp,Gg,Gg,Gg,Gg,Gg^Fp,Gg^Fp,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg^Fp,Gg^Fp,Gg,Gg,Gg,Gg^Fp,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Kh"
    turns=10
    victory_when_enemies_defeated=no
    next_scenario=sw_17_hold_at_the_transmission_point

    [label]
        x=9
        y=5
        text= _ "New Republic Transmission Point"
    [/label]

    [side]
        side=1
        controller=human
        team_name=player
        user_team_name= _ "New Republic Interdiction Team"
        type=sw_unit_nr_hero_commander
        id=sw_signal_commander
        name= _ "New Republic Commander"
        x=1
        y=3
        canrecruit=yes
        gold=0
        recruit=
        [unit]
            type=sw_unit_nr_slicer_team
            id=sw_signal_slicer_team
            name= _ "New Republic Slicer Team"
            x=2
            y=3
            canrecruit=no
        [/unit]
    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial_remnant
        user_team_name= _ "Imperial Remnant Signal Guard"
        type=sw_unit_im_recon_squad
        id=sw_signal_jammer_team
        name= _ "Imperial Remnant Signal Jammer Team"
        x=7
        y=3
        canrecruit=yes
        gold=0
        recruit=
        [unit]
            type=sw_unit_im_rem_stormtrooper
            id=sw_signal_guard_trooper
            name= _ "Imperial Signal Guard"
            x=6
            y=4
            canrecruit=no
        [/unit]
    [/side]

    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                description= _ "Destroy the Imperial Remnant Signal Jammer Team, then move the New Republic Commander and Slicer Team to the New Republic Transmission Point"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of the New Republic Commander"
                condition=lose
            [/objective]
            [objective]
                description= _ "Loss of the New Republic Slicer Team"
                condition=lose
            [/objective]
            [objective]
                description= _ "Turns run out"
                condition=lose
            [/objective]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_signal_commander
            message= _ "That jammer is masking our burst to the fleet. Bring it down, then we transmit from the marked point."
        [/message]
        [message]
            speaker=sw_signal_slicer_team
            message= _ "Once its carrier wave is gone, we can send the relay package before the Remnant retunes its net."
        [/message]
    [/event]

    # Arrival only wins after the named jammer is gone and both mission survivors hold the transmission point.
    [event]
        name=moveto
        [filter]
            side=1
            x=9
            y=5
        [/filter]
        [if]
            [have_unit]
                id=sw_signal_jammer_team
            [/have_unit]
            [then]
                [message]
                    speaker=sw_signal_slicer_team
                    message= _ "The jammer is still flooding the channel. We cannot transmit yet."
                [/message]
            [/then]
            [else]
                [if]
                    [have_unit]
                        id=sw_signal_commander
                        x=9
                        y=5
                    [/have_unit]
                    [have_unit]
                        id=sw_signal_slicer_team
                        x=9
                        y=5
                    [/have_unit]
                    [then]
                        [endlevel]
                            result=victory
                            bonus=yes
                            carryover_report=yes
                        [/endlevel]
                    [/then]
                [/if]
            [/else]
        [/if]
    [/event]

    [event]
        name=die
        [filter]
            id=sw_signal_commander
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=die
        [filter]
            id=sw_signal_slicer_team
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=time over
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]
#endif
