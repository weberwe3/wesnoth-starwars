#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

#ifdef CAMPAIGN_STAR_WARS_DARK_FORCE_RISING
[scenario]
    id=sw_14_relay_station_infiltration
    name= _ "Relay Station Infiltration"
    map_data="Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg^Fp,Gg^Fp,Gg^Fp,Gg^Fp,Gg^Fp,Gg^Fp,Gg,Gg
Gg,Gg,Gg,Gg,Cc,Ch,Cc,Gg,Gg
Gg,Gg^Fp,Gg^Fp,Gg^Fp,Gg^Fp,Gg^Fp,Gg^Fp,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Kh"
    turns=10
    victory_when_enemies_defeated=no

    [label]
        x=6
        y=3
        text= _ "Imperial Relay Terminal"
    [/label]

    [side]
        side=1
        controller=human
        team_name=player
        user_team_name= _ "New Republic Infiltration Team"
        type=sw_unit_nr_hero_commander
        id=sw_relay_station_commander
        name= _ "New Republic Commander"
        x=1
        y=3
        canrecruit=yes
        gold=35
        recruit=sw_unit_nr_recon_squad
        [unit]
            type=sw_unit_nr_slicer_team
            id=sw_relay_station_slicer_team
            name= _ "New Republic Slicer Team"
            x=2
            y=3
            canrecruit=no
        [/unit]
    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial_remnant
        user_team_name= _ "Imperial Remnant Relay Garrison"
        type=sw_unit_im_recon_squad
        id=sw_relay_station_guard_leader
        name= _ "Relay Garrison Leader"
        x=9
        y=6
        canrecruit=yes
        gold=40
        recruit=sw_unit_im_rem_stormtrooper
    [/side]

    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                description= _ "Move the New Republic Slicer Team to the Imperial Relay Terminal"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of the New Republic Commander"
                condition=lose
            [/objective]
            [objective]
                description= _ "Turns run out"
                condition=lose
            [/objective]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_relay_station_commander
            message= _ "The patrol schedule is ours. Slicer Team, reach the relay terminal and copy its Imperial routing data."
        [/message]
    [/event]

    # Only the assigned slicers can access the relay and trigger the extraction mission.
    [event]
        name=moveto
        [filter]
            id=sw_relay_station_slicer_team
            x=6
            y=3
        [/filter]
        [message]
            speaker=sw_relay_station_slicer_team
            message= _ "Relay access secured. The route archive is downloading now."
        [/message]
        [endlevel]
            result=victory
            bonus=yes
            carryover_report=yes
            next_scenario=sw_15_crossfire_extraction
        [/endlevel]
    [/event]

    # The commander is the actual side leader, so this explicit loss is unambiguous.
    [event]
        name=die
        [filter]
            id=sw_relay_station_commander
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=time over
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]
#endif
