#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Campaign II, mission 3 - Jomark.
# Key hexes (gen_dfr_maps.py m03): Luke's keep 6,9; raider keep 24,4;
# C'baoth's island 15,10; villages 13,2 / 4,14 / 18,19.
# Losing two of the three marked villages to the raiders is a defeat.
# Variables: sw_dfr03_villages_lost (cleared at victory).

[scenario]
    id=sw_dfr_03_jomark
    name= _ "Jomark"
    next_scenario=sw_dfr_04_the_senators_men
    map_file=dfr_03_jomark.map
    {QUANTITY turns 16 14 13}
    victory_when_enemies_defeated=no
    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [story]
        [part]
            story= _ "A message reached Luke on Coruscant: a Jedi Master of the Old Republic was alive, living quietly on the lake world Jomark, and wished to meet him."
        [/part]
        [part]
            story= _ "Joruus C'baoth was everything Luke had hoped for, and something more that he could not yet name. On Luke's first morning, raiders landed on the eastern shore."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        save_id=sw_player
        persistent=yes
        defeat_condition=never
        team_name=republic
        user_team_name= _ "Luke Skywalker"
        id=sw_hero_luke
        type=sw_hero_luke
        name= _ "Luke Skywalker"
        canrecruit=yes
        random_traits=no
        recruit=sw_unit_nr_militia
        {QUANTITY gold 90 70 60}
        fog=no
    [/side]

    [side]
        side=2
        controller=ai
        no_leader=yes
        team_name=republic
        user_team_name= _ "Joruus C'baoth"
        gold=0
        income=0
        [ai]
            aggression=0.9
        [/ai]
        [unit]
            id=sw_hero_cbaoth
            type=sw_hero_cbaoth
            name= _ "Joruus C'baoth"
            x,y=15,10
            random_traits=no
        [/unit]
    [/side]

    [side]
        side=3
        controller=ai
        team_name=raiders
        user_team_name= _ "Raiders"
        id=sw_dfr03_raid_boss
        type=sw_unit_sm_veteran
        name= _ "Vorr Tannick"
        canrecruit=yes
        recruit=sw_unit_sm_smuggler,sw_unit_sm_veteran
        {QUANTITY gold 80 120 160}
        {QUANTITY income 2 4 6}
        [ai]
            aggression=0.6
            [goal]
                name=target_location
                [criteria]
                    x=13,4,18
                    y=2,14,19
                [/criteria]
                value=4
            [/goal]
        [/ai]
    [/side]

    [event]
        name=prestart
        [set_recruit]
            side=1
            recruit=sw_unit_nr_militia
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_luke
            [/filter]
            canrecruit=yes
        [/modify_unit]
        [transform_unit]
            id=sw_hero_luke
            transform_to=sw_hero_luke
        [/transform_unit]
        {SW_STASH_HEROES sw_hero_leia,sw_hero_chewbacca,sw_hero_khabarakh,sw_hero_han,sw_hero_lando}
        [set_variable]
            name=sw_dfr03_villages_lost
            value=0
        [/set_variable]
        [capture_village]
            x=13,4,18
            y=2,14,19
            side=1
        [/capture_village]
        [label]
            x,y=15,10
            text= _ "C'baoth's Retreat"
        [/label]
        [objectives]
            side=1
            [objective]
                description= _ "Defeat the raid leader, Vorr Tannick"
                condition=win
            [/objective]
            [objective]
                description= _ "Two of the three lakeshore villages captured by raiders"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of Luke Skywalker"
                condition=lose
            [/objective]
            {TURNS_RUN_OUT}
            {SW_NOTE_GOLD_CARRYOVER}
            [note]
                description= _ "Jomark's villagers volunteer as militia. C'baoth fights as he sees fit."
            [/note]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_hero_cbaoth
            message= _ "Raiders, young Skywalker. Petty thieves who think the shore is undefended. Come, we shall show these people what Jedi are."
        [/message]
        [message]
            speaker=sw_hero_luke
            message= _ "Master C'baoth, the villagers can help. Let's keep them out of the fighting where we can."
        [/message]
        [message]
            speaker=sw_hero_cbaoth
            message= _ "The villagers are mine to protect, and mine to command. Do as you like with yours."
        [/message]
    [/event]

    [event]
        name=capture
        first_time_only=no
        [filter]
            side=3
            [filter_location]
                x=13,4,18
                y=2,14,19
            [/filter_location]
        [/filter]
        [set_variable]
            name=sw_dfr03_villages_lost
            add=1
        [/set_variable]
        [if]
            [variable]
                name=sw_dfr03_villages_lost
                greater_than_equal_to=2
            [/variable]
            [then]
                [message]
                    speaker=sw_hero_cbaoth
                    message= _ "You have failed them, Skywalker. I will remember that."
                [/message]
                [endlevel]
                    result=defeat
                [/endlevel]
            [/then]
        [/if]
    [/event]

    [event]
        name=last breath
        [filter]
            id=sw_dfr03_raid_boss
        [/filter]
        [message]
            speaker=unit
            message= _ "We yield! We yield! Take the cargo, just let us go!"
        [/message]
        [message]
            speaker=sw_hero_cbaoth
            message= _ "Yield? No. Let the lake have them."
        [/message]
        [message]
            speaker=sw_hero_luke
            message= _ "Master, they surrendered! That isn't... that isn't how the Jedi did things."
        [/message]
        [message]
            speaker=sw_hero_cbaoth
            message= _ "You know very little about how the Jedi did things, my young apprentice. That is why you are here."
        [/message]
        [endlevel]
            result=victory
            bonus=yes
            {NEW_GOLD_CARRYOVER 40}
        [/endlevel]
    [/event]

    [event]
        name=victory
        {SW_VICTORY_HOUSEKEEPING}
        {CLEAR_VARIABLE sw_dfr03_villages_lost}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_luke}
[/scenario]
