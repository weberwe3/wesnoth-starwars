#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Campaign II, mission 2 - Honoghr (stealth crossing).
# Key hexes (gen_dfr_maps.py m02): start 3,12; clan house (dukha) 26,9.
# Decontamination droids and a stormtrooper patrol guard the plain.

[scenario]
    id=sw_dfr_02_honoghr
    name= _ "Honoghr"
    next_scenario=sw_dfr_03_jomark
    map_file=dfr_02_honoghr.map
    {SW_MUSIC sw-tension sw-jungle}
    {SW_FIELD_MANUAL}
    {SW_TACTICAL_SYSTEMS}
    {QUANTITY turns 18 16 15}
    victory_when_enemies_defeated=no
    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [story]
        [part]
            story= _ "Khabarakh would say only that the answers were on his homeworld, and that he would take Leia there if she came without soldiers."
        [/part]
        [part]
            story= _ "Honoghr is brown from horizon to horizon. Nothing green grows there. Imperial droids crawl over the fields, cleaning a poison that never seems to leave."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        save_id=sw_player
        persistent=yes
        defeat_condition=never
        team_name=republic
        user_team_name= _ "Leia's Party"
        id=sw_hero_leia
        type=sw_hero_leia
        name= _ "Leia Organa Solo"
        canrecruit=yes
        random_traits=no
        recruit=
        gold=0
        income=0
        fog=yes
    [/side]

    [side]
        side=2
        controller=ai
        no_leader=yes
        team_name=imperial
        user_team_name= _ "Imperial Overseers"
        gold=0
        income=0
#define SW_DFR02_DROID X Y
        [unit]
            type=sw_unit_im_decon_droid
            x,y={X},{Y}
            ai_special=guardian
        [/unit]
#enddef
        {SW_DFR02_DROID 9 5}
        {SW_DFR02_DROID 15 12}
        {SW_DFR02_DROID 21 7}
        {SW_DFR02_DROID 18 16}
#undef SW_DFR02_DROID
        [unit]
            type=sw_unit_im_stormtrooper
            x,y=20,9
        [/unit]
#ifndef EASY
        [unit]
            type=sw_unit_im_stormtrooper
            x,y=22,11
        [/unit]
#endif
    [/side]

    [event]
        name=prestart
        [set_recruit]
            side=1
            recruit=
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_leia
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_STASH_HEROES sw_hero_luke,sw_hero_han,sw_hero_lando}
        {SW_HERO sw_hero_chewbacca sw_hero_chewbacca ( _ "Chewbacca") 3 13}
        {SW_HERO sw_hero_khabarakh sw_hero_khabarakh ( _ "Khabarakh") 4 12}
        [label]
            x,y=26,9
            text= _ "Clan House of Nystao"
        [/label]
        [item]
            x,y=26,9
            image=misc/sw-objective.png
        [/item]
        [objectives]
            side=1
            [objective]
                description= _ "Leia reaches the clan house at Nystao"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Leia"
                condition=lose
            [/objective]
            [note]
                description= _ "If Chewbacca or Khabarakh falls, that hero withdraws from the fight badly wounded and returns for the next mission."
            [/note]
            {TURNS_RUN_OUT}
            [note]
                description= _ "The decontamination droids stay at their posts until someone comes within reach. Avoid open ground near them."
            [/note]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_hero_khabarakh
            message= _ "The Empire watches the plain with its droids. They do not look for us; we are their servants. They will look for you."
        [/message]
        [message]
            speaker=sw_hero_leia
            message= _ "Then we keep to the hills and the riverbed. How far to your clan house?"
        [/message]
        [message]
            speaker=sw_hero_khabarakh
            message= _ "Across the plain, to Nystao. The maitrakh of my clan will decide what happens to you there. And to me."
        [/message]
    [/event]

    [event]
        name=sighted
        [filter]
            type=sw_unit_im_decon_droid
        [/filter]
        [message]
            speaker=sw_hero_leia
            message= _ "Those are the droids. They've been working this ground for forty years? Something doesn't add up."
        [/message]
    [/event]

    [event]
        name=moveto
        [filter]
            id=sw_hero_leia
            x,y=26,9
        [/filter]
        [message]
            speaker=narrator
            caption= _ "Maitrakh of Clan Kihm'bar"
            image=portraits/sw-hero-khabarakh.png
            message= _ "Khabarakh, you bring a human into the dukha? ... Wait. That scent. It is the scent of the Lord Vader himself."
        [/message]
        [message]
            speaker=sw_hero_leia
            message= _ "Darth Vader was my father. I didn't come to claim anything from you. I came to understand."
        [/message]
        [message]
            speaker=narrator
            caption= _ "Maitrakh of Clan Kihm'bar"
            image=portraits/sw-hero-khabarakh.png
            message= _ "Then stay hidden, Lady Vader, and listen. You will hear things that we ourselves do not wish to hear."
        [/message]
        [endlevel]
            result=victory
            bonus=yes
            {NEW_GOLD_CARRYOVER 40}
        [/endlevel]
    [/event]

    [event]
        name=victory
        {SW_VICTORY_HOUSEKEEPING}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_leia}
    {SW_HERO_WITHDRAWS sw_hero_chewbacca}
    {SW_HERO_WITHDRAWS sw_hero_khabarakh}
[/scenario]
