#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Campaign II, mission 9 - Battle for the Fleet (escort).
# Key hexes (gen_dfr_maps.py m09): Wedge's hangar 3,11; Chimaera 15,1;
# Judicator 15,22; captured Dreadnaughts start at 6,9 / 6,11 / 6,13.
# A Dreadnaught that reaches the eastern edge (x >= 29) jumps to safety.
# Victory: two jump. Defeat: two destroyed (so two can no longer jump).
# Variables: sw_dfr09_jumped / sw_dfr09_lost (cleared at victory).

[scenario]
    id=sw_dfr_09_battle_for_the_fleet
    name= _ "Battle for the Fleet"
    next_scenario=sw_dfr_10_honoghrs_choice
    map_file=dfr_09_battle_for_the_fleet.map
    {SW_MUSIC sw-space sw-heroic}
    {QUANTITY turns 18 16 15}
    victory_when_enemies_defeated=no
    {UNDERGROUND}
    {DEFAULT_MUSIC_PLAYLIST}

    [story]
        [part]
            story= _ "With the Katana's bridge in New Republic hands, the slaved Dreadnaughts began to move. The Grand Admiral's Star Destroyers closed from above and below."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        save_id=sw_player
        persistent=yes
        defeat_condition=never
        team_name=republic
        user_team_name= _ "New Republic Task Force"
        id=sw_hero_wedge
        type=sw_hero_wedge
        name= _ "Wedge Antilles"
        canrecruit=yes
        random_traits=no
        recruit=sw_unit_nr_xwing,sw_unit_nr_awing,sw_unit_nr_ywing
        {QUANTITY gold 200 170 150}
        fog=no
    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial
        user_team_name= _ "Chimaera"
        id=sw_dfr09_chimaera
        type=sw_unit_im_star_destroyer
        name= _ "Chimaera"
        canrecruit=yes
        recruit=sw_unit_im_tie_fighter,sw_unit_im_tie_interceptor,sw_unit_im_tie_bomber
        {QUANTITY gold 120 170 220}
        {QUANTITY income 6 9 12}
        [ai]
            passive_leader=yes
            aggression=0.7
            [goal]
                name=target
                [criteria]
                    type=sw_unit_ob_dreadnaught
                [/criteria]
                value=5
            [/goal]
        [/ai]
    [/side]

    [side]
        side=3
        controller=ai
        team_name=imperial
        user_team_name= _ "Judicator"
        id=sw_dfr09_judicator
        type=sw_unit_im_star_destroyer
        name= _ "Judicator"
        canrecruit=yes
        recruit=sw_unit_im_tie_fighter,sw_unit_im_tie_bomber
        {QUANTITY gold 90 130 170}
        {QUANTITY income 4 6 8}
        [ai]
            passive_leader=yes
            aggression=0.7
            [goal]
                name=target
                [criteria]
                    type=sw_unit_ob_dreadnaught
                [/criteria]
                value=5
            [/goal]
        [/ai]
    [/side]

    [event]
        name=prestart
        [set_recruit]
            side=1
            recruit=sw_unit_nr_xwing,sw_unit_nr_awing,sw_unit_nr_ywing
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_wedge
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_STASH_HEROES sw_hero_leia,sw_hero_chewbacca,sw_hero_khabarakh,sw_hero_han,sw_hero_lando,sw_hero_bel_iblis}
        {SW_HERO sw_hero_luke sw_hero_xwing_luke ( _ "Luke Skywalker") 4 11}
        [transform_unit]
            id=sw_hero_luke
            transform_to=sw_hero_xwing_luke
        [/transform_unit]
#define SW_DFR09_DREAD ID NAME X Y
        [unit]
            side=1
            id={ID}
            type=sw_unit_ob_dreadnaught
            name={NAME}
            x,y={X},{Y}
            random_traits=no
            [modifications]
                {TRAIT_LOYAL}
                [object]
                    # Skeleton crews coax two hexes a turn out of the old engines.
                    [effect]
                        apply_to=movement
                        set=2
                    [/effect]
                [/object]
            [/modifications]
        [/unit]
#enddef
        {SW_DFR09_DREAD sw_dfr09_katana ( _ "Katana") 6 11}
        {SW_DFR09_DREAD sw_dfr09_dread_2 ( _ "Valorous") 6 9}
        {SW_DFR09_DREAD sw_dfr09_dread_3 ( _ "Steadfast") 6 13}
#undef SW_DFR09_DREAD
        [set_variable]
            name=sw_dfr09_jumped
            value=0
        [/set_variable]
        [set_variable]
            name=sw_dfr09_lost
            value=0
        [/set_variable]
        [label]
            x,y=30,11
            text= _ "Jump Point"
        [/label]
        [objectives]
            side=1
            [objective]
                description= _ "Two Dreadnaughts reach the eastern edge and jump to safety"
                condition=win
            [/objective]
            [objective]
                description= _ "Two Dreadnaughts destroyed"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of Wedge Antilles or Luke Skywalker"
                condition=lose
            [/objective]
            {TURNS_RUN_OUT}
            {SW_NOTE_GOLD_CARRYOVER}
        [/objectives]
    [/event]

    [event]
        name=start
        {SW_THRAWN_SAYS ( _ "Commendable speed. But slaved ships are only as clever as the one ship that guides them. Target the Katana first, Captain.")}
        [message]
            speaker=sw_hero_wedge
            message= _ "Every fighter on the Dreadnaughts. Bombers will go for the Katana. Don't let them through."
        [/message]
    [/event]

    [event]
        name=moveto
        first_time_only=no
        [filter]
            type=sw_unit_ob_dreadnaught
            side=1
            x=29-30
        [/filter]
        [kill]
            x,y=$x1,$y1
            animate=no
            fire_event=no
        [/kill]
        [set_variable]
            name=sw_dfr09_jumped
            add=1
        [/set_variable]
        [floating_text]
            x,y=$x1,$y1
            text="<span color='#80c0ff'>" + _ "Jumped to lightspeed" + "</span>"
        [/floating_text]
        [if]
            [variable]
                name=sw_dfr09_jumped
                greater_than_equal_to=2
            [/variable]
            [then]
                [fire_event]
                    name=sw_dfr09_win
                [/fire_event]
            [/then]
        [/if]
    [/event]

    [event]
        name=die
        first_time_only=no
        [filter]
            type=sw_unit_ob_dreadnaught
            side=1
        [/filter]
        [set_variable]
            name=sw_dfr09_lost
            add=1
        [/set_variable]
        [if]
            [variable]
                name=sw_dfr09_lost
                greater_than_equal_to=2
            [/variable]
            [then]
                [message]
                    speaker=sw_hero_wedge
                    message= _ "We can't save enough of them. All fighters, break off!"
                [/message]
                [endlevel]
                    result=defeat
                [/endlevel]
            [/then]
        [/if]
    [/event]

    [event]
        name=sw_dfr09_win
        [message]
            speaker=sw_hero_luke
            message= _ "Two of them made the jump. It's not two hundred, Wedge, but he doesn't have them all."
        [/message]
        {SW_THRAWN_SAYS ( _ "A small loss, Captain Pellaeon. We hold the rest of the fleet, and crews for every hull are already growing. Withdraw.")}
        [endlevel]
            result=victory
            bonus=yes
            {NEW_GOLD_CARRYOVER 40}
        [/endlevel]
    [/event]

    [event]
        name=victory
        [store_unit]
            [filter]
                side=1
                type=sw_unit_ob_dreadnaught
            [/filter]
            variable=sw_dfr09_discard
            kill=yes
        [/store_unit]
        {CLEAR_VARIABLE sw_dfr09_discard,sw_dfr09_jumped,sw_dfr09_lost}
        [transform_unit]
            id=sw_hero_luke
            transform_to=sw_hero_luke
        [/transform_unit]
        {SW_VICTORY_HOUSEKEEPING}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_wedge}
    {SW_HERO_DEATH_IS_DEFEAT sw_hero_luke}
[/scenario]
