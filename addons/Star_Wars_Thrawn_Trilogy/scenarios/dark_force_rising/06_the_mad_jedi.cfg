#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Campaign II, mission 6 - The Mad Jedi (escape).
# Key hexes (gen_dfr_maps.py m06): Luke starts 4,9; Mara's ship 26,9;
# C'baoth 9,9. C'baoth cannot be killed here (invulnerable): he is a
# Campaign III antagonist. Every second turn his Force storm strikes a
# random two-column band of the map (never lethal).
# Variables: sw_dfr06_column (scratch), cleared at victory.

[scenario]
    id=sw_dfr_06_the_mad_jedi
    name= _ "The Mad Jedi"
    next_scenario=sw_dfr_07_the_dark_force
    map_file=dfr_06_the_mad_jedi.map
    {SW_MUSIC sw-tension sw-imperial}
    {SW_FIELD_MANUAL}
    {QUANTITY turns 16 14 13}
    victory_when_enemies_defeated=no
    {DUSK}
    {FIRST_WATCH}
    {SECOND_WATCH}
    {DEFAULT_MUSIC_PLAYLIST}

    [story]
        [part]
            story= _ "Weeks on Jomark taught Luke more about C'baoth than about the Force. The old man wanted an apprentice to shape, and he meant to shape Luke whether Luke agreed or not."
        [/part]
        [part]
            story= _ "When Luke tried to leave, the sky over the lake turned black."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        save_id=sw_player
        persistent=yes
        defeat_condition=never
        team_name=republic
        user_team_name= _ "Luke Skywalker"
        id=sw_hero_luke
        type=sw_hero_luke
        name= _ "Luke Skywalker"
        canrecruit=yes
        random_traits=no
        recruit=
        gold=0
        income=0
        fog=no
    [/side]

    [side]
        side=2
        controller=ai
        no_leader=yes
        team_name=cbaoth
        user_team_name= _ "Joruus C'baoth"
        gold=0
        income=0
        [ai]
            aggression=0.8
            [goal]
                name=target
                [criteria]
                    id=sw_hero_luke
                [/criteria]
                value=5
            [/goal]
        [/ai]
        [unit]
            id=sw_hero_cbaoth
            type=sw_hero_cbaoth
            name= _ "Joruus C'baoth"
            x,y=9,9
            random_traits=no
            [status]
                invulnerable=yes
            [/status]
        [/unit]
        [unit]
            type=sw_unit_nr_militia
            x,y=10,6
        [/unit]
        [unit]
            type=sw_unit_nr_militia
            x,y=10,12
        [/unit]
#ifndef EASY
        [unit]
            type=sw_unit_nr_militia
            x,y=17,9
        [/unit]
#endif
    [/side]

    [event]
        name=prestart
        [set_recruit]
            side=1
            recruit=
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_luke
            [/filter]
            canrecruit=yes
        [/modify_unit]
        [transform_unit]
            id=sw_hero_luke
            transform_to=sw_hero_luke
        [/transform_unit]
        {SW_STASH_HEROES sw_hero_leia,sw_hero_chewbacca,sw_hero_khabarakh,sw_hero_han,sw_hero_lando,sw_hero_bel_iblis}
        [label]
            x,y=26,9
            text= _ "Mara's Ship"
        [/label]
        [objectives]
            side=1
            [objective]
                description= _ "Luke reaches Mara Jade's ship"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Luke or Mara"
                condition=lose
            [/objective]
            {TURNS_RUN_OUT}
            [note]
                description= _ "C'baoth cannot be defeated here. Every second turn his Force storm strikes part of the map."
            [/note]
            [note]
                description= _ "The villagers attacking you are under C'baoth's influence."
            [/note]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_hero_cbaoth
            message= _ "You will not leave Jomark, Skywalker. You have not finished learning."
        [/message]
        [message]
            speaker=sw_hero_luke
            message= _ "I've learned enough. You don't want an apprentice, you want a servant."
        [/message]
    [/event]

    [event]
        name=turn 3
        {SW_HERO sw_hero_mara sw_hero_mara ( _ "Mara Jade") 25 9}
        [message]
            speaker=sw_hero_mara
            message= _ "Skywalker! Karrde sent me to warn you about this lunatic. Looks like I'm late. My ship's on the east shore. Move."
        [/message]
        [message]
            speaker=sw_hero_luke
            message= _ "Mara? I thought you wanted me dead."
        [/message]
        [message]
            speaker=sw_hero_mara
            message= _ "I do. By my hand, not his. Now move!"
        [/message]
    [/event]

    [event]
        name=side 1 turn
        first_time_only=no
        # [variable] has no modulo test; compute the parity first.
        [set_variable]
            name=sw_dfr06_parity
            value=$turn_number
        [/set_variable]
        [set_variable]
            name=sw_dfr06_parity
            modulo=2
        [/set_variable]
        [if]
            [variable]
                name=turn_number
                greater_than=1
            [/variable]
            [variable]
                name=sw_dfr06_parity
                numerical_equals=0
            [/variable]
            [then]
                [set_variable]
                    name=sw_dfr06_column
                    rand=6..22
                [/set_variable]
                # Computed separately: parentheses inside a macro argument
                # would break the preprocessor's argument grouping.
                [set_variable]
                    name=sw_dfr06_column2
                    value=$sw_dfr06_column
                [/set_variable]
                [set_variable]
                    name=sw_dfr06_column2
                    add=1
                [/set_variable]
                [message]
                    speaker=sw_hero_cbaoth
                    message= _ "Feel the storm, boy!"
                [/message]
                {SW_STRAFING_RUN 1 9 (
                    x=$sw_dfr06_column,$sw_dfr06_column2
                    y=1-18
                )}
            [/then]
        [/if]
    [/event]

    [event]
        name=moveto
        first_time_only=no
        [filter]
            id=sw_hero_luke
            x,y=26,9
        [/filter]
        [if]
            [have_unit]
                id=sw_hero_mara
            [/have_unit]
            [then]
                [message]
                    speaker=sw_hero_mara
                    message= _ "Strap in. And don't think this makes us friends."
                [/message]
                [message]
                    speaker=sw_hero_cbaoth
                    message= _ "Run, then. You will come back to me, Skywalker. All Jedi come back to me in the end."
                [/message]
                [endlevel]
                    result=victory
                    bonus=yes
                    {NEW_GOLD_CARRYOVER 40}
                [/endlevel]
            [/then]
            [else]
                [message]
                    speaker=sw_hero_luke
                    message= _ "I can't fly this ship myself, and I'm not leaving Mara behind."
                [/message]
            [/else]
        [/if]
    [/event]

    [event]
        name=victory
        [store_unit]
            [filter]
                side=1
                id=sw_hero_mara
            [/filter]
            variable=sw_dfr06_discard
            kill=yes
        [/store_unit]
        {CLEAR_VARIABLE sw_dfr06_discard}
        {SW_VICTORY_HOUSEKEEPING}
        {CLEAR_VARIABLE sw_dfr06_column,sw_dfr06_column2,sw_dfr06_parity}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_luke}
    {SW_HERO_DEATH_IS_DEFEAT sw_hero_mara}
[/scenario]
