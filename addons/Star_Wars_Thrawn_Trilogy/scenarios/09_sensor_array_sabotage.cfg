#textdomain wesnoth-Star_Wars_Thrawn_Trilogy
# A single-hex sabotage mission against an Imperial Remnant sensor array.

[scenario]
    id=sw_09_sensor_array_sabotage
    name= _ "Sensor Array Sabotage"
    map_data="Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg^Fp,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg"
    turns=10
    victory_when_enemies_defeated=no

    [label]
        x=6
        y=3
        text= _ "Imperial Remnant Sensor Array"
    [/label]

    # The New Republic commander is also the required single-hex saboteur.
    [side]
        side=1
        controller=human
        team_name=player
        user_team_name= _ "New Republic Sabotage Team"
        type=Thrawn_Phalanx
        id=sw_sensor_array_saboteur
        name= _ "New Republic Sabotage Commander"
        x=1
        y=3
        canrecruit=yes
        gold=70
        recruit=Thrawn_Phalanx
    [/side]

    [side]
        side=2
        controller=ai
        team_name=enemy
        user_team_name= _ "Imperial Remnant Array Guard"
        type=Thrawn_Phalanx
        id=sw_sensor_array_imperial_leader
        name= _ "Imperial Remnant Array Commander"
        x=9
        y=5
        canrecruit=yes
        gold=70
        recruit=Thrawn_Phalanx
    [/side]

    [event]
        name=prestart
        # This scenario-local flag is set only by the reusable terminal macro.
        [clear_variable]
            name=sw_sensor_array_terminal_active
        [/clear_variable]
        [objectives]
            side=1
            [objective]
                description= _ "Move the New Republic Sabotage Commander onto the Imperial Remnant Sensor Array"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of the New Republic Sabotage Commander"
                condition=lose
            [/objective]
            [objective]
                description= _ "Turns run out"
                condition=lose
            [/objective]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_sensor_array_saboteur
            message= _ "The breakout left the array watching the wrong stars. Reach its control terminal, plant the slicer, and blind the Imperial Remnant before its patrols recover."
        [/message]
        [message]
            speaker=sw_sensor_array_imperial_leader
            message= _ "Keep the sensor dish online. A New Republic raiding party will not turn this sector into a blind spot."
        [/message]
    [/event]

    # Activation is one-time: the macro records terminal use before victory resolves.
    {sw_one_time_moveto_event sw_sensor_array_saboteur 6 3 sw_sensor_array_terminal_active}

    [event]
        name=moveto
        [filter]
            id=sw_sensor_array_saboteur
            x=6
            y=3
        [/filter]
        [if]
            [variable]
                name=sw_sensor_array_terminal_active
                numerical_equals=1
            [/variable]
            [then]
                [message]
                    speaker=sw_sensor_array_saboteur
                    message= _ "Slicer engaged. The array is feeding harmless ghost contacts now; our convoy has the opening it needs."
                [/message]
                [endlevel]
                    result=victory
                [/endlevel]
            [/then]
        [/if]
    [/event]

    # Losing the required saboteur immediately ends the operation.
    [event]
        name=die
        [filter]
            id=sw_sensor_array_saboteur
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=time over
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]
