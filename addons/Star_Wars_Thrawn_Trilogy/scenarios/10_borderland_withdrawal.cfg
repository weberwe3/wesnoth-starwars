#textdomain wesnoth-Star_Wars_Thrawn_Trilogy
# A single-hex withdrawal through the borderlands after the sensor-array raid.

[scenario]
    id=sw_10_borderland_withdrawal
    name= _ "Borderland Withdrawal"
    map_data="Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg"
    turns=12
    victory_when_enemies_defeated=no

    [label]
        x=10
        y=4
        text= _ "New Republic Border"
    [/label]

    # This leader must reach the marked border hex; no unit occupies more than one hex.
    [side]
        side=1
        controller=human
        team_name=player
        user_team_name= _ "New Republic Withdrawal Force"
        type=Thrawn_Phalanx
        id=sw_borderland_commander
        name= _ "New Republic Withdrawal Commander"
        x=1
        y=4
        canrecruit=yes
        gold=80
        recruit=Thrawn_Phalanx
    [/side]

    [side]
        side=2
        controller=ai
        team_name=enemy
        user_team_name= _ "Imperial Remnant Pursuit Force"
        type=Thrawn_Phalanx
        id=sw_borderland_pursuit_commander
        name= _ "Imperial Remnant Pursuit Commander"
        x=9
        y=2
        canrecruit=yes
        gold=80
        recruit=Thrawn_Phalanx
    [/side]

    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                description= _ "Move the New Republic Withdrawal Commander to the New Republic Border"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of the New Republic Withdrawal Commander"
                condition=lose
            [/objective]
            [objective]
                description= _ "Turns run out"
                condition=lose
            [/objective]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_borderland_commander
            message= _ "The sensor array is feeding phantoms, but the Imperial Remnant will soon know the truth. Hold the column together and cross the border."
        [/message]
        [message]
            speaker=sw_borderland_pursuit_commander
            message= _ "Their false contacts bought them minutes, not safety. Seal the border road before the New Republic slips beyond our reach."
        [/message]
    [/event]

    # Withdrawal resolves only when the named commander enters the fixed border hex.
    [event]
        name=moveto
        [filter]
            id=sw_borderland_commander
            x=10
            y=4
        [/filter]
        [message]
            speaker=sw_borderland_commander
            message= _ "Border beacon confirmed. The column is clear of the trap; break pursuit and regroup on the far side."
        [/message]
        [endlevel]
            result=victory
        [/endlevel]
    [/event]

    # Commander loss is explicit because enemy elimination is not this mission's goal.
    [event]
        name=die
        [filter]
            id=sw_borderland_commander
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=time over
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]
