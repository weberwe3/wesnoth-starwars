#textdomain wesnoth-Star_Wars_Thrawn_Trilogy
# A compact Imperial Remnant counterattack following Ground Extraction.
# The command post at x=4,y=3 is the marked position to be held.

[scenario]
    id=sw_04_defensive_hold
    name= _ "Defensive Hold"
    map_data="Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg^Fp,Gg^Fp,Gg,Gg^Fp,Gg^Fp,Gg
Gg,Gg^Fp,Cc,Ch,Cc,Gg^Fp,Gg
Gg,Gg,Cc,Cc,Cc,Gg,Gg
Gg,Gg^Fp,Gg^Fp,Gg,Gg^Fp,Gg^Fp,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg"
    turns=8
    victory_when_enemies_defeated=no
    next_scenario=sw_05_relay_raid

    [label]
        x=4
        y=3
        text= _ "New Republic Command Post"
    [/label]

    [side]
        side=1
        controller=human
        team_name=player
        user_team_name= _ "New Republic Holdout"
        type=sw_unit_nr_hero_commander
        id=sw_hold_leader
        name= _ "Republic Commander"
        x=4
        y=3
        canrecruit=yes
        gold=80
        recruit=sw_unit_nr_hero_commander,Thrawn_Phalanx
        [unit]
            type=Thrawn_Phalanx
            id=sw_hold_phalanx_one
            name= _ "Holdout Squad"
            x=3
            y=3
            side=1
        [/unit]
        [unit]
            type=Thrawn_Phalanx
            id=sw_hold_phalanx_two
            name= _ "Holdout Squad"
            x=5
            y=3
            side=1
        [/unit]
    [/side]

    [side]
        side=2
        controller=ai
        team_name=enemy
        user_team_name= _ "Imperial Remnant Counterattack"
        type=Thrawn_Phalanx
        id=sw_hold_imperial_leader
        name= _ "Remnant Strike Commander"
        x=7
        y=6
        canrecruit=yes
        gold=100
        recruit=Thrawn_Phalanx
        [unit]
            type=Thrawn_Phalanx
            id=sw_hold_imperial_squad_one
            name= _ "Remnant Assault Squad"
            x=6
            y=5
            side=2
        [/unit]
        [unit]
            type=Thrawn_Phalanx
            id=sw_hold_imperial_squad_two
            name= _ "Remnant Assault Squad"
            x=7
            y=4
            side=2
        [/unit]
    [/side]

    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                description= _ "Hold the New Republic Command Post through turn 8"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of the Republic Commander"
                condition=lose
            [/objective]
        [/objectives]
    [/event]

    # A single relief team arrives midway through the fixed hold.
    [event]
        name=turn
        turn=4
        [command]
            {sw_deploy_reinforcement 1 sw_unit_nr_hero_commander 4 4 100}
            [message]
                speaker=sw_hold_leader
                message= _ "Relief team, reinforce the command post. We only need to hold a little longer."
            [/message]
        [/command]
    [/event]

    # The counterattack is survived once the final scheduled turn begins.
    [event]
        name=turn
        turn=8
        [message]
            speaker=sw_hold_leader
            message= _ "The Remnant attack is breaking. The position remains in New Republic hands."
        [/message]
        [endlevel]
            result=victory
        [/endlevel]
    [/event]

    [event]
        name=die
        [filter]
            id=sw_hold_leader
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]
