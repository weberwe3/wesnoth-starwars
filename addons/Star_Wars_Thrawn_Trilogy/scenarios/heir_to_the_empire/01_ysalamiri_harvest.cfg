#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Mission 1 - The Grand Admiral's Harvest (Imperial prologue, Myrkr).
# Design: production/campaigns/heir_to_the_empire/DESIGN.md section 4.1.
# Key hexes come from production/tools/gen_hte_maps.py (m01).
#
# Objective mechanic (variable lifecycle):
#   sw_hte01_trees[]      - four trees {x, y, state}; state is ready, carried,
#                           or delivered. Created in prestart, cleared at victory.
#   sw_hte01_delivered    - count of frames brought to the shuttle.
#   unit.variables.sw_frame / sw_frame_tree - set on the carrying unit; the
#                           tree index lets a dropped frame regrow on its tree.

[scenario]
    id=sw_hte_01_ysalamiri_harvest
    name= _ "The Grand Admiral's Harvest"
    next_scenario=sw_hte_02_ambush_at_bpfassh
    map_file=hte_01_ysalamiri_harvest.map
    {SW_MUSIC sw-imperial sw-tension}
    {SW_FIELD_MANUAL}
    {QUANTITY turns 18 16 14}
    victory_when_enemies_defeated=no
    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [story]
        [part]
            story= _ "Five years after the Battle of Endor, the Empire is a shadow of itself. Its remaining fleets hold a quarter of the galaxy, and the New Republic expects them to collapse."
        [/part]
        [part]
            story= _ "But a Grand Admiral has returned from the Unknown Regions. He has studied the Rebellion's leaders the way he studies art, and he has begun to prepare."
        [/part]
        [part]
            story= _ "His first step leads to Myrkr, a forest world avoided by the Jedi of old and favored by smugglers. Something in its trees blinds the Force."
        [/part]
    [/story]

    # Side 1: the Chimaera's landing party, led by Captain Pellaeon.
    [side]
        side=1
        controller=human
        # Fixed save_id: carryover is matched by save_id, which would otherwise
        # default to the leader id and change whenever the leader changes.
        save_id=sw_player
        persistent=yes
        # Defeat comes only from the scenario's explicit hero-death and
        # objective events. A carried-over leader is recalled with the
        # canrecruit flag it had at the previous victory (cleared there), so
        # the default no_leader_left rule would end the mission at once.
        defeat_condition=never
        team_name=imperial
        user_team_name= _ "Imperial Landing Party"
        id=sw_hero_pellaeon
        type=sw_hero_pellaeon
        name= _ "Gilad Pellaeon"
        canrecruit=yes
        random_traits=no
        recruit=sw_unit_im_stormtrooper,sw_unit_im_scout_trooper
        {QUANTITY gold 140 110 90}
        income=0
        fog=no
    [/side]

    # Side 2: Myrkr's vornskr packs. No leader; packs arrive by events.
    [side]
        side=2
        controller=ai
        no_leader=yes
        team_name=wildlife
        user_team_name= _ "Vornskr Packs"
        gold=0
        income=0
        [ai]
            aggression=0.8
            caution=0.1
        [/ai]
    [/side]

    # Side 3: Talon Karrde's people, tolerating the Empire on their world.
    [side]
        side=3
        controller=ai
        no_leader=yes
        team_name=imperial
        user_team_name= _ "Karrde's Smugglers"
        gold=0
        income=0
        [unit]
            id=sw_hte01_aves
            type=sw_unit_sm_veteran
            name= _ "Aves"
            x,y=14,2
            ai_special=guardian
            random_traits=no
        [/unit]
        [unit]
            type=sw_unit_sm_smuggler
            x,y=13,3
            ai_special=guardian
        [/unit]
        [unit]
            type=sw_unit_sm_smuggler
            x,y=15,3
            ai_special=guardian
        [/unit]
    [/side]

    [event]
        name=prestart
        # Replace (not extend) the recruit list carried over from earlier
        # missions, so Imperial or ground recruits never leak into this one.
        [set_recruit]
            side=1
            recruit=sw_unit_im_stormtrooper,sw_unit_im_scout_trooper
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_pellaeon
            [/filter]
            canrecruit=yes
        [/modify_unit]

        [unit]
            side=1
            type=sw_unit_im_stormtrooper
            x,y=4,9
        [/unit]
        [unit]
            side=1
            type=sw_unit_im_stormtrooper
            x,y=3,10
        [/unit]
        [unit]
            side=1
            type=sw_unit_im_scout_trooper
            x,y=4,10
        [/unit]

        # Initial vornskr packs at both dens.
        [unit]
            side=2
            type=sw_unit_wl_vornskr
            x,y=24,9
        [/unit]
        [unit]
            side=2
            type=sw_unit_wl_vornskr
            x,y=12,17
        [/unit]
#ifdef HARD
        [unit]
            side=2
            type=sw_unit_wl_vornskr
            x,y=23,9
        [/unit]
#endif

        [set_variables]
            name=sw_hte01_trees
            [value]
                x=12
                y=4
                state=ready
            [/value]
            [value]
                x=21
                y=5
                state=ready
            [/value]
            [value]
                x=17
                y=13
                state=ready
            [/value]
            [value]
                x=23
                y=15
                state=ready
            [/value]
        [/set_variables]
        [set_variable]
            name=sw_hte01_delivered
            value=0
        [/set_variable]
        [foreach]
            array=sw_hte01_trees
            [do]
                [item]
                    x,y=$this_item.x,$this_item.y
                    image=misc/sw-ysalamiri.png
                [/item]
                [label]
                    x,y=$this_item.x,$this_item.y
                    text= _ "Ysalamiri"
                    color=170,120,220
                [/label]
            [/do]
        [/foreach]
        [label]
            x,y=3,9
            text= _ "Lambda Shuttle"
        [/label]
        [label]
            x,y=14,2
            text= _ "Smugglers' Camp"
        [/label]

        [objectives]
            side=1
            [objective]
                description= _ "Harvest the four marked ysalamiri and bring each nutrient frame back to the shuttle (its landing pad or the landing apron around it)"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Captain Pellaeon"
                condition=lose
            [/objective]
            {TURNS_RUN_OUT}
            [note]
                description= _ "Move a unit onto a marked tree to take its ysalamiri. A unit can carry only one frame. If the carrier falls, the frame returns to its tree."
            [/note]
            [note]
                description= _ "Karrde's smugglers are allowing the harvest. Leave them alone."
            [/note]
        [/objectives]
    [/event]

    [event]
        name=start
        {SW_THRAWN_SAYS ( _ "Captain, the creatures we need cling to the high branches. Four nutrient frames should be enough to start.")}
        [message]
            speaker=sw_hero_pellaeon
            message= _ "Four lizards on four sticks, Admiral. I hope you will tell me what they are for."
        [/message]
        {SW_THRAWN_SAYS ( _ "Each one pushes back the Force around itself, like a bubble in water. A Jedi standing inside one is an ordinary man. Mind the vornskrs; they hunt anything that touches the Force, and they are not particular about the rest.")}
        [message]
            speaker=sw_hte01_aves
            message= _ "Karrde says take what you came for and go. Our people stay out of your way, and you stay out of ours."
        [/message]
        [message]
            speaker=sw_hero_pellaeon
            message= _ "Understood. Squads, form up. Keep your eyes on the trees."
        [/message]
    [/event]

    # Harvest: a side-1 unit without a frame steps onto a tree that still has one.
    [event]
        name=moveto
        id=sw_hte01_harvest
        first_time_only=no
        [filter]
            side=1
            [not]
                [filter_wml]
                    [variables]
                        sw_frame=yes
                    [/variables]
                [/filter_wml]
            [/not]
        [/filter]
        [foreach]
            array=sw_hte01_trees
            readonly=no
            [do]
                [if]
                    [variable]
                        name=this_item.x
                        numerical_equals=$x1
                    [/variable]
                    [variable]
                        name=this_item.y
                        numerical_equals=$y1
                    [/variable]
                    [variable]
                        name=this_item.state
                        equals=ready
                    [/variable]
                    [then]
                        [set_variable]
                            name=this_item.state
                            value=carried
                        [/set_variable]
                        [set_variable]
                            name=unit.variables.sw_frame
                            value=yes
                        [/set_variable]
                        [set_variable]
                            name=unit.variables.sw_frame_tree
                            value=$i
                        [/set_variable]
                        [unstore_unit]
                            variable=unit
                            find_vacant=no
                        [/unstore_unit]
                        [object]
                            id=sw_frame_badge
                            take_only_once=no
                            silent=yes
                            [filter]
                                x,y=$x1,$y1
                            [/filter]
                            # Drawn into the unit's own sprite (every frame), not as an
                            # overlay: overlays are drawn in the health-bar layer and the
                            # owner saw them vanish from several carriers at once (#303).
                            [effect]
                                apply_to=image_mod
                                add="BLIT(misc/sw-frame-carried.png)"
                            [/effect]
                        [/object]
                        [remove_item]
                            x,y=$x1,$y1
                        [/remove_item]
                        [sound]
                            name=sw-pickup.wav
                        [/sound]
                        [floating_text]
                            x,y=$x1,$y1
                            text="<span color='#c8a0ff'>" + _ "Frame secured" + "</span>"
                        [/floating_text]
                    [/then]
                [/if]
            [/do]
        [/foreach]
    [/event]

    # Delivery: a carrier reaches the shuttle's keep or castle hexes.
    [event]
        name=moveto
        id=sw_hte01_deliver
        first_time_only=no
        [filter]
            side=1
            [filter_wml]
                [variables]
                    sw_frame=yes
                [/variables]
            [/filter_wml]
            [filter_location]
                terrain=Qkp,Qcp
            [/filter_location]
        [/filter]
        [set_variable]
            name=sw_hte01_trees[$unit.variables.sw_frame_tree].state
            value=delivered
        [/set_variable]
        {CLEAR_VARIABLE unit.variables.sw_frame}
        {CLEAR_VARIABLE unit.variables.sw_frame_tree}
        [unstore_unit]
            variable=unit
            find_vacant=no
        [/unstore_unit]
        [remove_object]
            object_id=sw_frame_badge
            [filter]
                x,y=$x1,$y1
            [/filter]
        [/remove_object]
        [set_variable]
            name=sw_hte01_delivered
            add=1
        [/set_variable]
        [sound]
            name=sw-objective.wav
        [/sound]
        [floating_text]
            x,y=$x1,$y1
            text="<span color='#c8a0ff'>" + _ "Frame delivered" + " ($sw_hte01_delivered/4)</span>"
        [/floating_text]
        [if]
            [variable]
                name=sw_hte01_delivered
                greater_than_equal_to=4
            [/variable]
            [then]
                [fire_event]
                    name=sw_hte01_all_delivered
                [/fire_event]
            [/then]
        [/if]
    [/event]

    # A carrier falls: the frame drops and the ysalamiri crawls back up its tree.
    [event]
        name=die
        id=sw_hte01_drop
        first_time_only=no
        [filter]
            side=1
            [filter_wml]
                [variables]
                    sw_frame=yes
                [/variables]
            [/filter_wml]
        [/filter]
        [set_variable]
            name=sw_hte01_trees[$unit.variables.sw_frame_tree].state
            value=ready
        [/set_variable]
        [item]
            x,y=$sw_hte01_trees[$unit.variables.sw_frame_tree].x,$sw_hte01_trees[$unit.variables.sw_frame_tree].y
            image=misc/sw-ysalamiri.png
        [/item]
        [message]
            speaker=sw_hero_pellaeon
            message= _ "We lost a frame! The creature will have gone back to its branch. Send another squad."
        [/message]
    [/event]

    # Vornskr packs return at intervals.
#define SW_HTE01_PACK X Y
    [unit]
        side=2
        type=sw_unit_wl_vornskr
        x,y={X},{Y}
    [/unit]
#enddef
    [event]
        name=turn 3,turn 6,turn 9,turn 12
        first_time_only=no
        {SW_HTE01_PACK 24 9}
        {SW_HTE01_PACK 12 17}
#ifndef EASY
        {SW_HTE01_PACK 24 9}
#endif
    [/event]
#undef SW_HTE01_PACK

    [event]
        name=sighted
        [filter]
            side=2
        [/filter]
        [filter_second]
            side=1
        [/filter_second]
        [message]
            speaker=second_unit
            message= _ "Movement in the brush! Vornskrs!"
        [/message]
    [/event]

    [event]
        name=sw_hte01_all_delivered
        [message]
            speaker=sw_hero_pellaeon
            message= _ "All four frames are aboard, Admiral."
        [/message]
        {SW_THRAWN_SAYS ( _ "Well done, Captain. Now we need a Jedi to test them on, and Intelligence tells me where one will be. Return to the Chimaera.")}
        [endlevel]
            result=victory
            bonus=no
            carryover_percentage=0
            carryover_report=no
            linger_mode=no
        [/endlevel]
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_pellaeon}

    # The Imperial landing party does not carry over into the New Republic
    # missions: remove every side-1 unit, including the recall list.
    [event]
        name=victory
        [store_unit]
            [filter]
                side=1
            [/filter]
            variable=sw_hte01_discard
            kill=yes
        [/store_unit]
        {CLEAR_VARIABLE sw_hte01_discard}
        {CLEAR_VARIABLE sw_hte01_trees}
        {CLEAR_VARIABLE sw_hte01_delivered}
    [/event]
[/scenario]
