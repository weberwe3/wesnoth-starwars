#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Mission 7 - The Forest Crossing (escort / escape).
# Design: production/campaigns/heir_to_the_empire/DESIGN.md section 4.7.
# Key hexes (gen_hte_maps.py m07): crash site 3,12; hunter's cabin 12,11;
# Hyllyard City x=28-30, y=6-15; ysalamiri at 9,13 / 16,5 / 23,12 (radius 2).
# Mara Jade fights on side 1 for this mission only and is removed at victory.

#define SW_HTE07_CITY
x=28-30
y=6-15
#enddef

[scenario]
    id=sw_hte_07_the_forest_crossing
    name= _ "The Forest Crossing"
    next_scenario=sw_hte_08_nomad_city
    map_file=hte_07_the_forest_crossing.map
    {SW_MUSIC sw-tension sw-heroic}
    {SW_FIELD_MANUAL}
    {SW_TACTICAL_SYSTEMS}
    {QUANTITY turns 20 18 17}
    victory_when_enemies_defeated=no
    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [story]
        [part]
            {SW_STORY_BACKDROP dark-forest}
            story= _ "Luke's stolen skiff made it a few kilometers before Mara Jade's shots brought it down. Her own craft followed it into the trees."
        [/part]
        [part]
            {SW_STORY_BACKDROP dark-forest}
            story= _ "Now the two of them are alone in the Myrkr forest with Imperial speeder bikes overhead. Hyllyard City is days away on foot. Mara has made it clear she would rather kill Luke than help him, but neither of them will get there alone."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        # Fixed save_id: carryover is matched by save_id, which would otherwise
        # default to the leader id and change whenever the leader changes.
        save_id=sw_player
        persistent=yes
        # Defeat comes only from the scenario's explicit hero-death and
        # objective events. A carried-over leader is recalled with the
        # canrecruit flag it had at the previous victory (cleared there), so
        # the default no_leader_left rule would end the mission at once.
        defeat_condition=never
        team_name=republic
        user_team_name= _ "Luke and Mara"
        id=sw_hero_luke
        type=sw_hero_luke
        name= _ "Luke Skywalker"
        canrecruit=yes
        random_traits=no
        recruit=
        gold=0
        income=0
        fog=yes
    [/side]

    [side]
        side=2
        controller=ai
        no_leader=yes
        team_name=imperial
        user_team_name= _ "Imperial Hunters"
        gold=0
        income=0
        [ai]
            aggression=0.5
            [goal]
                name=target
                [criteria]
                    id=sw_hero_luke
                [/criteria]
                value=4
            [/goal]
        [/ai]
        [unit]
            type=sw_unit_im_scout_trooper
            x,y=10,6
        [/unit]
        [unit]
            type=sw_unit_im_scout_trooper
            x,y=11,7
        [/unit]
        [unit]
            type=sw_unit_im_stormtrooper
            x,y=15,15
        [/unit]
        [unit]
            type=sw_unit_im_stormtrooper
            x,y=16,15
        [/unit]
        [unit]
            id=sw_hte07_officer
            type=sw_unit_im_officer
            name= _ "Lieutenant Krell"
            x,y=21,8
        [/unit]
        [unit]
            type=sw_unit_im_stormtrooper
            x,y=22,8
        [/unit]
    [/side]

    [side]
        side=3
        controller=ai
        no_leader=yes
        team_name=wildlife
        user_team_name= _ "Vornskrs"
        gold=0
        income=0
        [unit]
            type=sw_unit_wl_vornskr
            x,y=8,4
        [/unit]
        [unit]
            type=sw_unit_wl_vornskr
            x,y=14,10
        [/unit]
        [unit]
            type=sw_unit_wl_vornskr
            x,y=24,16
        [/unit]
    [/side]

    [event]
        name=prestart
        # Replace (not extend) the recruit list carried over from earlier
        # missions, so Imperial or ground recruits never leak into this one.
        [set_recruit]
            side=1
            recruit=
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_luke
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_STASH_HEROES sw_hero_leia,sw_hero_han,sw_hero_chewbacca,sw_hero_lando}
        [transform_unit]
            id=sw_hero_luke
            transform_to=sw_hero_luke
        [/transform_unit]
        [modify_unit]
            [filter]
                id=sw_hero_luke
            [/filter]
            x,y=3,12
        [/modify_unit]
        {SW_HERO sw_hero_mara sw_hero_mara ( _ "Mara Jade") 2 12}
        {SW_YSALAMIRI_ZONE 9,16,23 13,5,12 2}
        [label]
            x,y=28,10
            text= _ "Hyllyard City"
        [/label]
        [label]
            x,y=12,11
            text= _ "Hunter's Cabin"
        [/label]
        [objectives]
            side=1
            [objective]
                description= _ "Luke reaches Hyllyard City, the eastern edge (with Mara, if she is still in the fight)"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Luke"
                condition=lose
            [/objective]
            [note]
                description= _ "If Mara falls, she withdraws from the fight badly wounded and slips away into the forest."
            [/note]
            {TURNS_RUN_OUT}
            {SW_NOTE_GOLD_CARRYOVER}
            [note]
                description= _ "Violet hexes are ysalamiri bubbles: Luke's Force abilities and deflection fail inside them. Vornskrs hunt Force-sensitives and hit Luke harder."
            [/note]
            [note]
                description= _ "Speeder bikes are fast in clearings and slow among the trees."
            [/note]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_hero_mara
            message= _ "Don't get comfortable, Skywalker. The moment we're out of this forest, we settle things."
        [/message]
        [message]
            speaker=sw_hero_luke
            message= _ "You keep saying that. You still haven't said why."
        [/message]
        [message]
            speaker=sw_hero_mara
            message= _ "I have my reasons. Right now, I have Imperial scouts on bikes and a forest full of vornskrs. Walk."
        [/message]
    [/event]

    # A cache at the hunter's cabin: Mara signals two of Karrde's people.
    [event]
        name=moveto
        [filter]
            id=sw_hero_luke,sw_hero_mara
            x,y=12,11
        [/filter]
        [message]
            speaker=sw_hero_mara
            message= _ "Karrde keeps a comm relay here. I can call two of our people who are still in the forest. They'll help us. Not you. Us."
        [/message]
        [unit]
            side=1
            type=sw_unit_sm_smuggler
            x,y=12,12
            [modifications]
                {TRAIT_LOYAL}
            [/modifications]
        [/unit]
        [unit]
            side=1
            type=sw_unit_sm_veteran
            x,y=11,11
            [modifications]
                {TRAIT_LOYAL}
            [/modifications]
        [/unit]
    [/event]

    [event]
        name=turn 6
        [unit]
            side=2
            type=sw_unit_im_scout_trooper
            x,y=15,1
        [/unit]
        [unit]
            side=2
            type=sw_unit_im_scout_trooper
            x,y=17,1
        [/unit]
#ifdef HARD
        [unit]
            side=2
            type=sw_unit_im_scout_trooper
            x,y=19,1
        [/unit]
#endif
        [message]
            speaker=sw_hero_luke
            message= _ "More bikes, coming in from the north."
        [/message]
    [/event]

    [event]
        name=turn 10
        [unit]
            side=2
            type=sw_unit_im_stormtrooper
            x,y=20,20
        [/unit]
        [unit]
            side=2
            type=sw_unit_im_stormtrooper
            x,y=22,20
        [/unit]
        [unit]
            side=3
            type=sw_unit_wl_vornskr
            x,y=26,4
        [/unit]
    [/event]

    [event]
        name=attack
        [filter]
            type=sw_unit_wl_vornskr
        [/filter]
        [filter_second]
            id=sw_hero_luke
        [/filter_second]
        [message]
            speaker=sw_hero_mara
            message= _ "They go for you because they can feel the Force in you. Karrde's tame ones do the same thing. Keep moving."
        [/message]
    [/event]

    [event]
        name=moveto
        first_time_only=no
        [filter]
            id=sw_hero_luke,sw_hero_mara
            [filter_location]
                {SW_HTE07_CITY}
            [/filter_location]
        [/filter]
        [if]
            [have_unit]
                id=sw_hero_luke
                [filter_location]
                    {SW_HTE07_CITY}
                [/filter_location]
            [/have_unit]
            # Mara in the city too, unless she has withdrawn wounded.
            [and]
                [have_unit]
                    id=sw_hero_mara
                    [filter_location]
                        {SW_HTE07_CITY}
                    [/filter_location]
                [/have_unit]
                [or]
                    [not]
                        [have_unit]
                            id=sw_hero_mara
                        [/have_unit]
                    [/not]
                [/or]
            [/and]
            [then]
                [message]
                    speaker=sw_hero_luke
                    message= _ "Hyllyard City. We made it. So, do we settle things now?"
                [/message]
                [message]
                    speaker=sw_hero_mara
                    message= _ "Not today. Karrde will want to hear about this first. Next time, Skywalker."
                [/message]
                [endlevel]
                    result=victory
                    bonus=yes
                    {NEW_GOLD_CARRYOVER 40}
                [/endlevel]
            [/then]
        [/if]
    [/event]

    [event]
        name=victory
        [store_unit]
            [filter]
                side=1
                type=sw_unit_sm_smuggler,sw_unit_sm_veteran,sw_hero_mara
            [/filter]
            variable=sw_hte07_discard
            kill=yes
        [/store_unit]
        {CLEAR_VARIABLE sw_hte07_discard}
        {SW_CLEAR_YSALAMIRI_ZONE}
        {SW_VICTORY_HOUSEKEEPING}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_luke}
    # Balance review 2026-10-04: Mara drew every patrol and fell on turns 3-6 in
    # every test; she now withdraws (temporary ally: not kept) instead.
    {SW_HERO_WITHDRAWS_TEMPORARY sw_hero_mara}
[/scenario]

#undef SW_HTE07_CITY
