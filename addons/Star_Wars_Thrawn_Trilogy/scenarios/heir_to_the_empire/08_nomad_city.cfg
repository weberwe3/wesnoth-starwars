#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Mission 8 - Nomad City (defend against theft, environmental hazard).
# Design: production/campaigns/heir_to_the_empire/DESIGN.md section 4.8.
# Key hexes (gen_hte_maps.py m08): Lando's keep 23,9; raider keep 3,9;
# extraction zone x<=2; mole miner sheds 18,5 / 18,14 / 20,9 / 25,5 / 25,14.
#
# Theft mechanic: when a raider (not a mole miner) steps onto a shed that
# still holds its miner, a hijacked mole miner appears next to it with a goto
# order to the extraction zone (the AI goto candidate action drives it). A
# miner that reaches x<=2 counts as stolen.
# Heat: any unit ending its own side's turn on open sand or dunes takes 4
# damage (never lethal). Rocky outcrops, mountains, and the city are shaded.
# Variables: sw_hte08_sheds[] {x,y,state}, sw_hte08_stolen, sw_hte08_limit
# (all cleared at victory).

[scenario]
    id=sw_hte_08_nomad_city
    name= _ "Nomad City"
    next_scenario=sw_hte_09_sluis_van_shipyards
    map_file=hte_08_nomad_city.map
    {SW_MUSIC sw-heroic sw-tension}
    {SW_FIELD_MANUAL}
    {SW_TACTICAL_SYSTEMS}
    {QUANTITY turns 15 14 13}
    victory_when_enemies_defeated=no
    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [story]
        [part]
            {SW_STORY_BACKDROP mining-city}
            story= _ "On Nkllon, so close to its sun that the dayside would melt an unshielded ship, Lando Calrissian's Nomad City crawls across the surface, staying always in the planet's shadow and mining the rock as it goes."
        [/part]
        [part]
            {SW_STORY_BACKDROP mining-city}
            story= _ "Han brought word of Luke and the smugglers. While they talked, Imperial raiders landed on the sunside. They were not after the metals. They wanted Lando's mole miners."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        # Fixed save_id: carryover is matched by save_id, which would otherwise
        # default to the leader id and change whenever the leader changes.
        save_id=sw_player
        persistent=yes
        # Defeat comes only from the scenario's explicit hero-death and
        # objective events. A carried-over leader is recalled with the
        # canrecruit flag it had at the previous victory (cleared there), so
        # the default no_leader_left rule would end the mission at once.
        defeat_condition=never
        team_name=republic
        user_team_name= _ "Nomad City"
        id=sw_hero_lando
        type=sw_hero_lando
        name= _ "Lando Calrissian"
        canrecruit=yes
        random_traits=no
        recruit=sw_unit_nr_trooper,sw_unit_nr_commando,sw_unit_nr_field_medic,sw_unit_nr_eweb_team
        {QUANTITY gold 150 120 100}
        fog=no
    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial
        user_team_name= _ "Imperial Raiders"
        id=sw_hte08_harbid
        type=sw_unit_im_officer
        name= _ "Captain Harbid"
        canrecruit=yes
        recruit=sw_unit_im_stormtrooper,sw_unit_im_scout_trooper
        {QUANTITY gold 120 160 200}
        {QUANTITY income 4 6 8}
        [ai]
            aggression=0.5
            [goal]
                name=target_location
                [criteria]
                    x=18,18,20,25,25
                    y=5,14,9,5,14
                [/criteria]
                value=4
            [/goal]
        [/ai]
        [unit]
            type=sw_unit_im_scout_trooper
            x,y=5,7
        [/unit]
        [unit]
            type=sw_unit_im_scout_trooper
            x,y=5,11
        [/unit]
    [/side]

    [event]
        name=prestart
        # Replace (not extend) the recruit list carried over from earlier
        # missions, so Imperial or ground recruits never leak into this one.
        [set_recruit]
            side=1
            recruit=sw_unit_nr_trooper,sw_unit_nr_commando,sw_unit_nr_field_medic,sw_unit_nr_eweb_team
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_lando
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_STASH_HEROES sw_hero_leia,sw_hero_chewbacca,sw_hero_luke}
        {SW_HERO sw_hero_han sw_hero_han ( _ "Han Solo") 22 10}
        [set_variables]
            name=sw_hte08_sheds
            [value]
                x,y=18,5
                state=ready
            [/value]
            [value]
                x,y=18,14
                state=ready
            [/value]
            [value]
                x,y=20,9
                state=ready
            [/value]
            [value]
                x,y=25,5
                state=ready
            [/value]
            [value]
                x,y=25,14
                state=ready
            [/value]
        [/set_variables]
        [foreach]
            array=sw_hte08_sheds
            [do]
                [item]
                    x,y=$this_item.x,$this_item.y
                    image=misc/sw-objective.png
                [/item]
                [label]
                    x,y=$this_item.x,$this_item.y
                    text= _ "Mole Miner Shed"
                [/label]
            [/do]
        [/foreach]
        [set_variable]
            name=sw_hte08_stolen
            value=0
        [/set_variable]
        [set_variable]
            name=sw_hte08_limit
            {QUANTITY value 4 3 3}
        [/set_variable]
        [label]
            x,y=1,9
            text= _ "Extraction"
        [/label]
        [objectives]
            side=1
            [objective]
                description= _ "Defeat Captain Harbid"
                condition=win
            [/objective]
            [objective]
                description= _ "Hold out until the end of the last turn"
                condition=win
            [/objective]
            [objective]
                description= _ "Hijacked mole miners reach the extraction zone in the west" + " ($sw_hte08_limit)"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of Lando"
                condition=lose
            [/objective]
            [note]
                description= _ "If Han falls, he withdraws from the fight badly wounded and returns for the next mission."
            [/note]
            {SW_NOTE_GOLD_CARRYOVER}
            {SW_NOTE_ENEMY_AIR}
            [note]
                description= _ "Nkllon's sun: any unit ending its turn on open sand or dunes takes 4 damage. Rock outcrops and the city are shaded."
            [/note]
            [note]
                description= _ "A raider who reaches a shed steals its mole miner. Hijacked miners head straight for the western edge."
            [/note]
        [/objectives]
        # Air support (lua/sw_air.lua). TIE fighters cover the assault on Nomad City: two strafing runs.
        {SW_AIR_SUPPORT 2 strafe 2 sw_unit_im_tie_fighter}
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_hero_lando
            message= _ "Raiders on the sunside, heading for the miner sheds. Somebody wants mole miners badly enough to cook their own troops getting here."
        [/message]
        [message]
            speaker=sw_hero_han
            message= _ "Mole miners? What does the Empire want with mining equipment?"
        [/message]
        [message]
            speaker=sw_hero_lando
            message= _ "I don't know, and I don't like not knowing. Keep them off the sheds, and don't stand around in the sun."
        [/message]
    [/event]

    # Heat damage for the side that just finished its turn.
    [event]
        name=side turn end
        first_time_only=no
        [harm_unit]
            [filter]
                side=$side_number
                [filter_location]
                    terrain=Dd,Hd
                [/filter_location]
            [/filter]
            amount=4
            kill=no
            animate=no
        [/harm_unit]
    [/event]

    # A raider steals a mole miner.
    [event]
        name=moveto
        first_time_only=no
        [filter]
            side=2
            [not]
                type=sw_unit_im_mole_miner
            [/not]
        [/filter]
        [foreach]
            array=sw_hte08_sheds
            readonly=no
            [do]
                [if]
                    [variable]
                        name=this_item.x
                        numerical_equals=$x1
                    [/variable]
                    [variable]
                        name=this_item.y
                        numerical_equals=$y1
                    [/variable]
                    [variable]
                        name=this_item.state
                        equals=ready
                    [/variable]
                    [then]
                        [set_variable]
                            name=this_item.state
                            value=stolen
                        [/set_variable]
                        [remove_item]
                            x,y=$x1,$y1
                        [/remove_item]
                        [unit]
                            side=2
                            type=sw_unit_im_mole_miner
                            x,y=$x1,$y1
                            goto_x=1
                            goto_y=9
                            animate=yes
                        [/unit]
                        [message]
                            speaker=sw_hero_lando
                            message= _ "They've got a mole miner out of the shed! Stop it before it reaches their landing zone!"
                        [/message]
                    [/then]
                [/if]
            [/do]
        [/foreach]
    [/event]

    [event]
        name=moveto
        first_time_only=no
        [filter]
            side=2
            type=sw_unit_im_mole_miner
            x=1-2
        [/filter]
        [kill]
            x,y=$x1,$y1
            animate=no
            fire_event=no
        [/kill]
        [set_variable]
            name=sw_hte08_stolen
            add=1
        [/set_variable]
        [floating_text]
            x,y=$x1,$y1
            text="<span color='#ff6060'>" + _ "Mole miner stolen" + " ($sw_hte08_stolen/$sw_hte08_limit)</span>"
        [/floating_text]
        [if]
            [variable]
                name=sw_hte08_stolen
                greater_than_equal_to=$sw_hte08_limit
            [/variable]
            [then]
                [message]
                    speaker=sw_hero_lando
                    message= _ "That's too many. Whatever they're planning, we just handed them the tools."
                [/message]
                [endlevel]
                    result=defeat
                [/endlevel]
            [/then]
        [/if]
    [/event]

    [event]
        name=last breath
        [filter]
            id=sw_hte08_harbid
        [/filter]
        [message]
            speaker=unit
            message= _ "Withdraw! Take what we have and withdraw!"
        [/message]
        [fire_event]
            name=sw_hte08_win
        [/fire_event]
    [/event]

    [event]
        name=time over
        [fire_event]
            name=sw_hte08_win
        [/fire_event]
    [/event]

    [event]
        name=sw_hte08_win
        [message]
            speaker=sw_hero_han
            message= _ "They're pulling out. Lando, how many miners did they get?"
        [/message]
        [message]
            speaker=sw_hero_lando
            message= _ "$sw_hte08_stolen| of them. And the shipyards at Sluis Van just sent a call for every pilot and miner crew we can spare: a whole relief fleet is docking there for refit."
        [/message]
        [message]
            speaker=sw_hero_han
            message= _ "Mole miners and a shipyard full of warships with skeleton crews. I think I know what they want them for."
        [/message]
        [endlevel]
            result=victory
            bonus=yes
            {NEW_GOLD_CARRYOVER 40}
        [/endlevel]
    [/event]

    [event]
        name=victory
        {SW_VICTORY_HOUSEKEEPING}
        {CLEAR_VARIABLE sw_hte08_sheds,sw_hte08_stolen,sw_hte08_limit}
    [/event]

    {SW_HERO_WITHDRAWS sw_hero_han}
    {SW_HERO_DEATH_IS_DEFEAT sw_hero_lando}
[/scenario]
