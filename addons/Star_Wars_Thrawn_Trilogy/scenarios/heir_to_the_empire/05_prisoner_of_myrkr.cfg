#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Mission 5 - Prisoner of Myrkr (stealth escape).
# Design: production/campaigns/heir_to_the_empire/DESIGN.md section 4.5.
# Karrde's compound (gen_hte_maps.py compound(4,3)):
#   detention cell 6,13 (door 9,13); office 6,5 (door 8,8);
#   vehicle shed 17,9 (door 14,9); gates: east 19,9, north 12,3, west 4,9.
# Ysalamiri frames at 7,6 / 12,9 / 16,11 make the whole compound Force-null.
#
# Luke starts without his lightsaber (object sw_hte05_disarmed replaces it with
# fists, and SW_UNARMED shows his unarmed sprites). Recovering it from the
# office removes that object, restores his armed sprites (SW_ARMED) and raises
# the alarm. Variables: sw_hte05_saber (yes once recovered), cleared at victory.

[scenario]
    id=sw_hte_05_prisoner_of_myrkr
    name= _ "Prisoner of Myrkr"
    next_scenario=sw_hte_06_raid_on_karrdes_base
    map_file=hte_05_prisoner_of_myrkr.map
    {SW_MUSIC sw-tension sw-heroic}
    {SW_FIELD_MANUAL}
    {SW_TACTICAL_SYSTEMS}
    {QUANTITY turns 16 14 13}
    victory_when_enemies_defeated=no
    {SECOND_WATCH}
    {DEFAULT_MUSIC_PLAYLIST}

    [story]
        [part]
            story= _ "The Wild Karrde brought Luke to Myrkr. Talon Karrde was polite, curious, and unwilling to let him go: the Empire is offering a great deal of money for a Jedi."
        [/part]
        [part]
            story= _ "Inside the compound, among the ysalamiri, Luke cannot feel the Force at all. He will have to escape the way anyone else would."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        # Fixed save_id: carryover is matched by save_id, which would otherwise
        # default to the leader id and change whenever the leader changes.
        save_id=sw_player
        persistent=yes
        # Defeat comes only from the scenario's explicit hero-death and
        # objective events. A carried-over leader is recalled with the
        # canrecruit flag it had at the previous victory (cleared there), so
        # the default no_leader_left rule would end the mission at once.
        defeat_condition=never
        team_name=republic
        user_team_name= _ "Luke Skywalker"
        id=sw_hero_luke
        type=sw_hero_luke
        name= _ "Luke Skywalker"
        canrecruit=yes
        random_traits=no
        x,y=6,13
        recruit=
        gold=0
        income=0
        fog=yes
    [/side]

    [side]
        side=2
        controller=ai
        no_leader=yes
        team_name=smugglers
        user_team_name= _ "Karrde's Guards"
        gold=0
        income=0
        fog=yes
#define SW_HTE05_GUARD TYPE X Y
        [unit]
            type={TYPE}
            x,y={X},{Y}
            ai_special=guardian
        [/unit]
#enddef
        {SW_HTE05_GUARD sw_unit_sm_smuggler 10 13}
        {SW_HTE05_GUARD sw_unit_sm_smuggler 8 9}
        {SW_HTE05_GUARD sw_unit_sm_smuggler 13 10}
#ifndef EASY
        {SW_HTE05_GUARD sw_unit_sm_veteran 12 7}
#endif
#ifdef HARD
        {SW_HTE05_GUARD sw_unit_sm_smuggler 16 13}
#endif
        [unit]
            id=sw_hte05_drang
            type=sw_unit_wl_vornskr
            name= _ "Drang"
            x,y=10,5
            ai_special=guardian
        [/unit]
#undef SW_HTE05_GUARD
    [/side]

    [event]
        name=prestart
        # Replace (not extend) the recruit list carried over from earlier
        # missions, so Imperial or ground recruits never leak into this one.
        [set_recruit]
            side=1
            recruit=
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_luke
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_STASH_HEROES sw_hero_leia,sw_hero_han,sw_hero_chewbacca}
        [transform_unit]
            id=sw_hero_luke
            transform_to=sw_hero_luke
        [/transform_unit]
        # Karrde's people took the lightsaber; Luke fights with his fists.
        [object]
            id=sw_hte05_disarmed
            duration=scenario
            silent=yes
            [filter]
                id=sw_hero_luke
            [/filter]
            [effect]
                apply_to=remove_attacks
                name=lightsaber
            [/effect]
            [effect]
                apply_to=new_attack
                name=fists
                description= _ "fists"
                icon=attacks/fist-human.png
                type=impact
                range=melee
                damage=5
                number=2
            [/effect]
        [/object]
        # ...and shows his unarmed sprites until he has it back.
        {SW_UNARMED sw_hero_luke}
        # Ysalamiri live in every tree around Karrde's compound: no Force
        # anywhere in this mission (the frames mark the densest clusters).
        {SW_YSALAMIRI_ZONE 7,12,16 6,9,11 3}
        {SW_YSALAMIRI_WORLD}
        # Stealth (lua/sw_alert.lua): guards start unaware; two walk the yard.
        [sw_alert]
            action=enable
            guard_side=2
            intruder_side=1
        [/sw_alert]
        [sw_alert]
            action=guard
            [filter]
                side=2
                x,y=8,9
            [/filter]
            patrol=11.9,8.9
        [/sw_alert]
        [sw_alert]
            action=guard
            [filter]
                side=2
                x,y=13,10
            [/filter]
            patrol=13.6,13.10
        [/sw_alert]
        [item]
            x,y=6,5
            image=misc/sw-objective.png
        [/item]
        [label]
            x,y=6,5
            text= _ "Karrde's Office"
        [/label]
        [item]
            x,y=5,11
            image=items/box.png
        [/item]
        [label]
            x,y=17,9
            text= _ "Vehicle Shed"
        [/label]
        [objectives]
            side=1
            [objective]
                description= _ "Recover your lightsaber from Karrde's office"
                condition=win
                [show_if]
                    [not]
                        [variable]
                            name=sw_hte05_saber
                            boolean_equals=yes
                        [/variable]
                    [/not]
                [/show_if]
            [/objective]
            [objective]
                description= _ "Reach the vehicle shed with your lightsaber"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Luke Skywalker"
                condition=lose
            [/objective]
            {TURNS_RUN_OUT}
            [note]
                description= _ "The whole compound is inside a ysalamiri bubble: Luke's Force abilities and deflection do not work."
            [/note]
            [note]
                description= _ "Karrde's guards have not noticed you yet. They see 3 hexes, one less at night and one less again when you are in cover (forest, crates, buildings); walls block their view. Amber hexes show where they can see. If one spots you, it shouts and every guard nearby joins the hunt."
            [/note]
            [note]
                description= _ "Right-click next to an unaware guard for a <b>Silent takedown</b> (uses your attack). Any other guard who can see that spot will raise the alarm. Drang the vornskr cannot be surprised."
            [/note]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_hero_luke
            message= _ "Nothing. It's like going deaf. Karrde's lizards are everywhere in this place."
        [/message]
        [message]
            speaker=sw_hero_luke
            message= _ "All right. One guard at the door. My lightsaber will be in Karrde's office. I'm not leaving without it."
        [/message]
    [/event]

    # The supply box in the cell block holds a hold-out blaster.
    [event]
        name=moveto
        [filter]
            id=sw_hero_luke
            x,y=5,11
        [/filter]
        [remove_item]
            x,y=5,11
        [/remove_item]
        [object]
            id=sw_hte05_blaster
            duration=scenario
            silent=yes
            [filter]
                id=sw_hero_luke
            [/filter]
            [effect]
                apply_to=new_attack
                name=hold_out_blaster
                description= _ "hold-out blaster"
                icon=attacks/lightbeam.png
                type=fire
                range=ranged
                damage=6
                number=2
            [/effect]
        [/object]
        [message]
            speaker=sw_hero_luke
            message= _ "Somebody's spare hold-out blaster. Careless of them."
        [/message]
    [/event]

    [event]
        name=moveto
        [filter]
            id=sw_hero_luke
            x,y=6,5
        [/filter]
        [remove_item]
            x,y=6,5
        [/remove_item]
        [remove_object]
            object_id=sw_hte05_disarmed
            [filter]
                id=sw_hero_luke
            [/filter]
        [/remove_object]
        {SW_ARMED sw_hero_luke}
        [set_variable]
            name=sw_hte05_saber
            value=yes
        [/set_variable]
        # Taking the lightsaber from Karrde's office raises the alarm.
        [sw_alert]
            action=alarm
        [/sw_alert]
        [message]
            speaker=sw_hero_luke
            message= _ "There you are."
        [/message]
        [fire_event]
            name=sw_hte05_alarm
        [/fire_event]
    [/event]

    # The alarm: every guard abandons its post, and Mara Jade arrives.
    [event]
        name=sw_hte05_alarm
        [modify_unit]
            [filter]
                side=2
            [/filter]
            ai_special=
        [/modify_unit]
        [unit]
            side=2
            id=sw_hte05_mara
            type=sw_hero_mara
            name= _ "Mara Jade"
            x,y=12,3
            random_traits=no
        [/unit]
        [unit]
            side=2
            type=sw_unit_sm_smuggler
            x,y=13,4
        [/unit]
        [message]
            speaker=sw_hte05_mara
            message= _ "Skywalker's loose! He's in the main house. Nobody shoots him except me."
        [/message]
        [message]
            speaker=sw_hero_luke
            message= _ "She means that. Time to find a vehicle."
        [/message]
        [show_objectives]
        [/show_objectives]
    [/event]

    [event]
        name=moveto
        first_time_only=no
        [filter]
            id=sw_hero_luke
            x,y=17,9
        [/filter]
        [if]
            [variable]
                name=sw_hte05_saber
                boolean_equals=yes
            [/variable]
            [then]
                [message]
                    speaker=sw_hero_luke
                    message= _ "A skiff. Fueled, too. Let's see how far it gets me."
                [/message]
                [message]
                    speaker=narrator
                    image=portraits/sw-hero-mara.png
                    caption= _ "Mara Jade"
                    message= _ "Not far, Skywalker. I'm right behind you."
                [/message]
                [endlevel]
                    result=victory
                    bonus=yes
                    {NEW_GOLD_CARRYOVER 40}
                [/endlevel]
            [/then]
            [else]
                [message]
                    speaker=sw_hero_luke
                    message= _ "Not without my lightsaber."
                [/message]
            [/else]
        [/if]
    [/event]

    [event]
        name=victory
        {SW_CLEAR_YSALAMIRI_ZONE}
        {SW_VICTORY_HOUSEKEEPING}
        {CLEAR_VARIABLE sw_hte05_saber}
        # The saber is required to win; this only guards against carrying the
        # unarmed sprites into the next mission.
        {SW_ARMED sw_hero_luke}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_luke}
[/scenario]
