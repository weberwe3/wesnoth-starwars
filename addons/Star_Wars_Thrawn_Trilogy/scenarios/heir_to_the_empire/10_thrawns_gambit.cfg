#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Mission 10 - Thrawn's Gambit (campaign finale, space battle).
# Design: production/campaigns/heir_to_the_empire/DESIGN.md section 4.10.
# Key hexes (gen_hte_maps.py m10): Wedge's hangar keep 3,11; Chimaera's
# hangar keep 26,8; Judicator's hangar keep 26,15; warships 8,6 / 8,17.
#
# The Grand Admiral withdraws (victory) when the Judicator is destroyed, when
# the Chimaera falls to half strength, or when the defenders hold to the last
# turn with a warship intact. Losing both warships is defeat.
# Turn 5: TIE bombers strike the less-defended warship; turn 8: the
# shipyard picket arrives as reinforcements for the player.
# Variables: sw_hte10_ships_lost, sw_hte10_withdrawn (cleared at victory).

[scenario]
    id=sw_hte_10_thrawns_gambit
    name= _ "Thrawn's Gambit"
    next_scenario=null
    map_file=hte_10_thrawns_gambit.map
    {SW_MUSIC sw-thrawn sw-space sw-imperial}
    {SW_FIELD_MANUAL}
    {SW_TACTICAL_SYSTEMS}
    # Thrawn commands side 2 in person: his forces learn the player's habits.
    {SW_THRAWN_DOCTRINE 2}
    [event]
        name=start
        id=sw_doctrine_grant_start
        {SW_DOCTRINE_GRANT 2 15 art ( _ "Recordings of New Republic victory celebrations, studied aboard the Chimaera, show how its commanders like to win.")}
    [/event]
    {QUANTITY turns 18 17 16}
    victory_when_enemies_defeated=no
    {UNDERGROUND}

    [story]
        [part]
            {SW_STORY_BACKDROP bridge}
            story= _ "The mole miners failed. On the bridge of the Chimaera, Grand Admiral Thrawn watched the last of them break apart and did not seem disappointed."
        [/part]
        [part]
            {SW_STORY_BACKDROP fleet-attack}
            story= _ "Then two Star Destroyers came forward out of the system's edge, launching fighters as they came. If the Empire could not steal the shipyard's warships, it would destroy them where they lay."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        # Fixed save_id: carryover is matched by save_id, which would otherwise
        # default to the leader id and change whenever the leader changes.
        save_id=sw_player
        persistent=yes
        # Defeat comes only from the scenario's explicit hero-death and
        # objective events. A carried-over leader is recalled with the
        # canrecruit flag it had at the previous victory (cleared there), so
        # the default no_leader_left rule would end the mission at once.
        defeat_condition=never
        team_name=republic
        user_team_name= _ "Sluis Van Defense"
        id=sw_hero_wedge
        type=sw_hero_wedge
        name= _ "Wedge Antilles"
        canrecruit=yes
        random_traits=no
        recruit=sw_unit_nr_xwing,sw_unit_nr_awing,sw_unit_nr_ywing
        {QUANTITY gold 180 150 130}
        fog=no
    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial
        user_team_name= _ "Chimaera"
        id=sw_hte10_chimaera
        type=sw_unit_im_star_destroyer
        name= _ "Chimaera"
        canrecruit=yes
        recruit=sw_unit_im_tie_fighter,sw_unit_im_tie_interceptor,sw_unit_im_tie_bomber
        {QUANTITY gold 140 190 240}
        {QUANTITY income 6 9 12}
        [ai]
            passive_leader=yes
            aggression=0.7
            [goal]
                name=target
                [criteria]
                    type=sw_unit_nr_docked_warship
                [/criteria]
                value=5
            [/goal]
        [/ai]
    [/side]

    [side]
        side=3
        controller=ai
        team_name=imperial
        user_team_name= _ "Judicator"
        id=sw_hte10_judicator
        type=sw_unit_im_star_destroyer
        name= _ "Judicator"
        canrecruit=yes
        recruit=sw_unit_im_tie_fighter,sw_unit_im_tie_bomber
        {QUANTITY gold 100 140 180}
        {QUANTITY income 4 6 8}
        [ai]
            passive_leader=yes
            aggression=0.7
        [/ai]
    [/side]

    [event]
        name=prestart
        # Replace (not extend) the recruit list carried over from earlier
        # missions, so Imperial or ground recruits never leak into this one.
        [set_recruit]
            side=1
            recruit=sw_unit_nr_xwing,sw_unit_nr_awing,sw_unit_nr_ywing
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_wedge
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_STASH_HEROES sw_hero_leia,sw_hero_han,sw_hero_chewbacca,sw_hero_lando}
        {SW_HERO sw_hero_luke sw_hero_xwing_luke ( _ "Luke Skywalker") 4 11}
        [transform_unit]
            id=sw_hero_luke
            transform_to=sw_hero_xwing_luke
        [/transform_unit]
#define SW_HTE10_WARSHIP ID NAME X Y
        [unit]
            side=1
            id={ID}
            type=sw_unit_nr_docked_warship
            name={NAME}
            x,y={X},{Y}
            random_traits=no
            [modifications]
                {TRAIT_LOYAL}
            [/modifications]
        [/unit]
#enddef
        # Named after the warships that survived Sluis Van (sw_hte09 victory);
        # a save from before that record existed uses the usual two.
        [if]
            [variable]
                name=sw_hte_warship_south
                equals=""
            [/variable]
            [then]
                [set_variable]
                    name=sw_hte_warship_north
                    value= _ "Liberty's Hope"
                [/set_variable]
                [set_variable]
                    name=sw_hte_warship_south
                    value= _ "Valiant"
                [/set_variable]
            [/then]
        [/if]
        {SW_HTE10_WARSHIP sw_hte10_ship_1 $sw_hte_warship_north 8 6}
        {SW_HTE10_WARSHIP sw_hte10_ship_2 $sw_hte_warship_south 8 17}
#undef SW_HTE10_WARSHIP
        # Saving every warship in the previous battle buys extra crews.
        [if]
            [variable]
                name=sw_hte_warships_saved
                greater_than_equal_to=4
            [/variable]
            [then]
                [gold]
                    side=1
                    amount=40
                [/gold]
            [/then]
        [/if]
        [set_variable]
            name=sw_hte10_ships_lost
            value=0
        [/set_variable]
        [objectives]
            side=1
            [objective]
                description= _ "Destroy the Judicator"
                condition=win
            [/objective]
            [objective]
                description= _ "Damage the Chimaera to half strength"
                condition=win
            [/objective]
            [objective]
                description= _ "Hold until the last turn with at least one warship intact"
                condition=win
            [/objective]
            [objective]
                description= _ "Both warships destroyed"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of Wedge Antilles"
                condition=lose
            [/objective]
            [note]
                description= _ "If Luke falls, he withdraws from the fight badly wounded and returns for the next mission."
            [/note]
            [note]
                description= _ "Star Destroyers are slow and heavily shielded but cannot dodge. Y-wing ion cannons slow them; proton torpedoes hit hard."
            [/note]
        [/objectives]
    [/event]

    [event]
        name=start
        {SW_THRAWN_SAYS ( _ "Captain Pellaeon, launch all fighters. Their pilots are tired and their warships cannot move. Make them choose what to protect.")}
        [message]
            speaker=sw_hero_wedge
            message= _ "Two Star Destroyers. All right, Rogues, the warships can't run, so neither can we."
        [/message]
        [message]
            speaker=sw_hero_luke
            message= _ "Wedge, the second ship is holding back, covering the first. If we hurt one of them badly enough, I don't think he'll risk both."
        [/message]
    [/event]

    [event]
        name=die
        first_time_only=no
        [filter]
            type=sw_unit_nr_docked_warship
        [/filter]
        [set_variable]
            name=sw_hte10_ships_lost
            add=1
        [/set_variable]
        [if]
            [variable]
                name=sw_hte10_ships_lost
                greater_than_equal_to=2
            [/variable]
            [then]
                [endlevel]
                    result=defeat
                [/endlevel]
            [/then]
        [/if]
    [/event]

    [event]
        name=die
        [filter]
            id=sw_hte10_judicator
        [/filter]
        [fire_event]
            name=sw_hte10_withdraw
        [/fire_event]
    [/event]

    # After every attack, check whether the Chimaera has taken half damage.
    [event]
        name=attack end
        first_time_only=no
        [store_unit]
            [filter]
                id=sw_hte10_chimaera
            [/filter]
            variable=sw_hte10_flagship
        [/store_unit]
        [if]
            [variable]
                name=sw_hte10_flagship.length
                greater_than=0
            [/variable]
            [variable]
                name=sw_hte10_flagship.hitpoints
                less_than_equal_to="$($sw_hte10_flagship.max_hitpoints / 2)"
            [/variable]
            [then]
                [fire_event]
                    name=sw_hte10_withdraw
                [/fire_event]
            [/then]
        [/if]
        {CLEAR_VARIABLE sw_hte10_flagship}
    [/event]

    [event]
        name=time over
        [fire_event]
            name=sw_hte10_withdraw
        [/fire_event]
    [/event]

    [event]
        name=sw_hte10_withdraw
        [message]
            speaker=narrator
            image=portraits/sw-hero-pellaeon.png
            caption= _ "Captain Pellaeon"
            message= _ "Admiral, we've lost the initiative here. Shall I commit the reserve?"
        [/message]
        {SW_THRAWN_SAYS ( _ "No, Captain. Withdraw. We have learned a great deal today about how the New Republic defends what it values. And the mole miners were only ever one way to get warships.")}
        {SW_THRAWN_SAYS ( _ "Somewhere out there is a fleet of two hundred Dreadnaughts, lost before the Clone Wars ended. Find me the man who knows where it is.")}
        [message]
            speaker=sw_hero_wedge
            message= _ "They're jumping out. Both of them. We held Sluis Van."
        [/message]
        [message]
            speaker=sw_hero_luke
            message= _ "We held it because he let us. He was testing us, Wedge. This isn't over. I don't think it has even started."
        [/message]
        [endlevel]
            result=victory
            end_text= _ "The Sluis Van shipyards are saved, but the Grand Admiral has learned what he came to learn. Somewhere in the dark, two hundred lost warships are waiting.

The war continues in Campaign II: Dark Force Rising."
            end_text_duration=5000
            bonus=yes
            carryover_report=no
        [/endlevel]
    [/event]

    [event]
        name=victory
        [transform_unit]
            id=sw_hero_luke
            transform_to=sw_hero_luke
        [/transform_unit]
        [if]
            [variable]
                name=sw_hte10_ships_lost
                numerical_equals=0
            [/variable]
            [then]
                {SW_FEAT sw_feat_gambit}
            [/then]
        [/if]
        {SW_VICTORY_HOUSEKEEPING}
        {CLEAR_VARIABLE sw_hte10_ships_lost}
    [/event]

    # Turn 5: Thrawn's flanking strike. TIE bombers jump in beside whichever
    # warship has fewer defenders within 4 hexes (the north one on a tie), so
    # the player cannot pile everything on one ship. One turn of warning.
#define SW_HTE10_GUARDS X Y VAR
        [store_unit]
            [filter]
                side=1
                [not]
                    type=sw_unit_nr_docked_warship
                [/not]
                [filter_location]
                    x,y={X},{Y}
                    radius=4
                [/filter_location]
            [/filter]
            variable={VAR}
            kill=no
        [/store_unit]
#enddef
#define SW_HTE10_FLANK Y
        [unit]
            side=2
            type=sw_unit_im_tie_bomber
            x,y=7,{Y}
            animate=yes
        [/unit]
        [unit]
            side=2
            type=sw_unit_im_tie_bomber
            x,y=9,{Y}
            animate=yes
        [/unit]
#ifndef EASY
        [unit]
            side=2
            type=sw_unit_im_tie_bomber
            x,y=11,{Y}
            animate=yes
        [/unit]
#endif
#ifdef HARD
        [unit]
            side=2
            type=sw_unit_im_tie_interceptor
            x,y=10,{Y}
            animate=yes
        [/unit]
#endif
#enddef
    [event]
        name=turn 5
        {SW_HTE10_GUARDS 8 6 sw_hte10_guard_n}
        {SW_HTE10_GUARDS 8 17 sw_hte10_guard_s}
        [set_variable]
            name=sw_hte10_flank
            value=north
        [/set_variable]
        [if]
            [not]
                [have_unit]
                    id=sw_hte10_ship_1
                [/have_unit]
            [/not]
            [then]
                [set_variable]
                    name=sw_hte10_flank
                    value=south
                [/set_variable]
            [/then]
            [elseif]
                [have_unit]
                    id=sw_hte10_ship_2
                [/have_unit]
                [variable]
                    name=sw_hte10_guard_s.length
                    less_than=$sw_hte10_guard_n.length
                [/variable]
                [then]
                    [set_variable]
                        name=sw_hte10_flank
                        value=south
                    [/set_variable]
                [/then]
            [/elseif]
        [/if]
        {SW_THRAWN_SAYS ( _ "Now, Captain. Send the reserve squadron to the warship they are not watching.")}
        [if]
            [variable]
                name=sw_hte10_flank
                equals=north
            [/variable]
            [then]
                {SW_HTE10_FLANK 1}
                [message]
                    speaker=sw_hero_wedge
                    message= _ "Bombers dropping out of the shipyard traffic, right on top of the $sw_hte_warship_north|! Somebody get over there!"
                [/message]
            [/then]
            [else]
                {SW_HTE10_FLANK 22}
                [message]
                    speaker=sw_hero_wedge
                    message= _ "Bombers coming in under the $sw_hte_warship_south|! He waited until we'd committed. Somebody get down there!"
                [/message]
            [/else]
        [/if]
        {CLEAR_VARIABLE sw_hte10_guard_n,sw_hte10_guard_s,sw_hte10_flank}
    [/event]
#undef SW_HTE10_GUARDS
#undef SW_HTE10_FLANK

    # Turn 8: the shipyard's own picket fighters finish rearming and join in.
#define SW_HTE10_PICKET TYPE X Y
        [unit]
            side=1
            type={TYPE}
            x,y={X},{Y}
            animate=yes
        [/unit]
#enddef
    [event]
        name=turn 8
        [unit]
            side=1
            id=sw_hte10_picket_lead
            type=sw_unit_nr_xwing
            name= _ "Captain Tal Dunn"
            x,y=1,11
            animate=yes
        [/unit]
#ifndef HARD
        {SW_HTE10_PICKET sw_unit_nr_awing 1 9}
#endif
#ifdef EASY
        {SW_HTE10_PICKET sw_unit_nr_ywing 1 13}
#endif
        [message]
            speaker=sw_hte10_picket_lead
            message= _ "Sluis Van picket, rearmed and ready. Sorry we're late, Commander. Where do you want us?"
        [/message]
        [message]
            speaker=sw_hero_wedge
            message= _ "Anywhere there's a TIE. Welcome to the party."
        [/message]
    [/event]
#undef SW_HTE10_PICKET

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_wedge}
    {SW_HERO_WITHDRAWS sw_hero_luke}
[/scenario]
