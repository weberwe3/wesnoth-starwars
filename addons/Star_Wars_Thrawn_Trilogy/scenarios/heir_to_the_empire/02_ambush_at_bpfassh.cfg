#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Mission 2 - Ambush at Bpfassh.
# Design: production/campaigns/heir_to_the_empire/DESIGN.md section 4.2.
# Leia, Han, and Chewbacca must cross the city to the Millennium Falcon while
# an Imperial raid hits Bpfassh and hidden Noghri try to take Leia alive.
# Key hexes (gen_hte_maps.py m02): Leia start 2,16; Falcon pad 25,2;
# Imperial landing zone 7,1; parks 7,11 and 19,15 (Noghri cover).

[scenario]
    id=sw_hte_02_ambush_at_bpfassh
    name= _ "Ambush at Bpfassh"
    next_scenario=sw_hte_03_adrift
    map_file=hte_02_ambush_at_bpfassh.map
    {SW_MUSIC sw-heroic sw-tension sw-battle}
    {SW_FIELD_MANUAL}
    {SW_TACTICAL_SYSTEMS}
    {QUANTITY turns 16 14 13}
    victory_when_enemies_defeated=no
    {DEFAULT_SCHEDULE}

    [story]
        [part]
            story= _ "On Coruscant, the New Republic's leaders argue over trade quotas and old grievances. Leia Organa Solo, pregnant with twins, has come to Bpfassh to steady a nervous system government."
        [/part]
        [part]
            story= _ "Han Solo and Chewbacca came with her. They did not expect the Empire to come too."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        # Fixed save_id: carryover is matched by save_id, which would otherwise
        # default to the leader id and change whenever the leader changes.
        save_id=sw_player
        persistent=yes
        # Defeat comes only from the scenario's explicit hero-death and
        # objective events. A carried-over leader is recalled with the
        # canrecruit flag it had at the previous victory (cleared there), so
        # the default no_leader_left rule would end the mission at once.
        defeat_condition=never
        team_name=republic
        user_team_name= _ "New Republic"
        id=sw_hero_leia
        type=sw_hero_leia
        name= _ "Leia Organa Solo"
        canrecruit=yes
        random_traits=no
        recruit=sw_unit_nr_trooper,sw_unit_nr_commando,sw_unit_nr_field_medic,sw_unit_nr_eweb_team
        {QUANTITY gold 150 120 100}
        fog=yes
    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial
        user_team_name= _ "Imperial Raiders"
        id=sw_hte02_raid_commander
        type=sw_unit_im_officer
        name= _ "Major Brendt"
        canrecruit=yes
        recruit=sw_unit_im_stormtrooper,sw_unit_im_scout_trooper
        {QUANTITY gold 90 130 170}
        {QUANTITY income 2 4 6}
        [ai]
            aggression=0.6
            # Everyone wants the Chief of State; the Noghri most of all.
            [goal]
                name=target
                [criteria]
                    id=sw_hero_leia
                [/criteria]
                value=6
            [/goal]
        [/ai]
        # Noghri commandos hide in the parks along Leia's route.
        [unit]
            id=sw_hte02_noghri_1
            type=sw_unit_im_noghri
            x,y=7,11
        [/unit]
        [unit]
            id=sw_hte02_noghri_2
            type=sw_unit_im_noghri
            x,y=19,15
        [/unit]
#ifndef EASY
        [unit]
            id=sw_hte02_noghri_3
            type=sw_unit_im_noghri
            x,y=24,9
        [/unit]
#endif
    [/side]

    [side]
        side=3
        controller=ai
        no_leader=yes
        team_name=republic
        user_team_name= _ "Bpfassh Militia"
        gold=0
        income=0
        [unit]
            id=sw_hte02_militia_captain
            type=sw_unit_nr_trooper
            name= _ "Captain Tarvan"
            x,y=13,10
            random_traits=no
        [/unit]
        [unit]
            type=sw_unit_nr_militia
            x,y=12,9
        [/unit]
        [unit]
            type=sw_unit_nr_militia
            x,y=14,9
        [/unit]
        [unit]
            type=sw_unit_nr_militia
            x,y=12,11
        [/unit]
        [unit]
            type=sw_unit_nr_militia
            x,y=14,11
        [/unit]
    [/side]

    [event]
        name=prestart
        # Replace (not extend) the recruit list carried over from earlier
        # missions, so Imperial or ground recruits never leak into this one.
        [set_recruit]
            side=1
            recruit=sw_unit_nr_trooper,sw_unit_nr_commando,sw_unit_nr_field_medic,sw_unit_nr_eweb_team
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_leia
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_HERO sw_hero_han sw_hero_han ( _ "Han Solo") 3 16}
        {SW_HERO sw_hero_chewbacca sw_hero_chewbacca ( _ "Chewbacca") 2 15}
        [item]
            x,y=25,2
            image=misc/sw-objective.png
        [/item]
        [label]
            x,y=25,2
            text= _ "Millennium Falcon"
        [/label]
        [label]
            x,y=13,10
            text= _ "Assembly Plaza"
        [/label]
        [objectives]
            side=1
            [objective]
                description= _ "Leia reaches the Millennium Falcon"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Leia"
                condition=lose
            [/objective]
            [note]
                description= _ "If Han or Chewbacca falls, that hero withdraws from the fight badly wounded and returns for the next mission."
            [/note]
            {TURNS_RUN_OUT}
            {SW_NOTE_GOLD_CARRYOVER}
            {SW_NOTE_AIR_SUPPORT}
            [note]
                description= _ "Noghri commandos are invisible in the parks and at night until you move next to them."
            [/note]
        [/objectives]
        # Air support (lua/sw_air.lua). Bpfassh's defence flight answers Leia: one X-wing strafing run.
        {SW_AIR_SUPPORT 1 strafe 1 sw_unit_nr_xwing}
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_hte02_militia_captain
            message= _ "Your Highness, Imperial landing craft in the north district! It's a raid. They're hitting the warehouses and pulling out."
        [/message]
        [message]
            speaker=sw_hero_han
            message= _ "A raid this far inside our territory? I don't like it. Leia, we're going to the Falcon. Now."
        [/message]
        [message]
            speaker=sw_hero_leia
            message= _ "Not without making sure these people can hold. Captain, keep the plaza. We'll go through the east district."
        [/message]
        [message]
            speaker=sw_hero_chewbacca
            message= _ "<i>(Chewbacca growls and checks his bowcaster.)</i>"
        [/message]
    [/event]

    # The first Noghri attack reveals who the raid is really for.
    [event]
        name=attack
        [filter]
            type=sw_unit_im_noghri
        [/filter]
        [message]
            speaker=sw_hero_han
            message= _ "Those aren't stormtroopers. Gray skin, no armor, no sound. Leia, stay behind Chewie!"
        [/message]
        [message]
            speaker=sw_hero_leia
            message= _ "They're not shooting to kill, Han. They want me alive."
        [/message]
    [/event]

    # Turn 3: TIE fighters strafe the plaza row. Damage cannot kill.
    [event]
        name=turn 3
        [message]
            speaker=sw_hte02_militia_captain
            message= _ "TIE fighters, coming in low over the plaza! Take cover!"
        [/message]
        # Scripted TIE pass (lua/sw_air.lua): fixed 8 damage to every New
        # Republic and militia unit on the plaza row, never lethal.
        [sw_air_strike]
            side=2
            sortie=strafe
            craft=sw_unit_im_tie_fighter
            damage=8
            strikes=1
            certain=yes
            enemies_only=yes
            [filter_location]
                y=10
                x=8-20
            [/filter_location]
        [/sw_air_strike]
    [/event]

    # Turn 5: off-duty militia rally to the plaza.
    [event]
        name=turn 5
        [unit]
            side=3
            type=sw_unit_nr_militia
            x,y=12,17
        [/unit]
        [unit]
            side=3
            type=sw_unit_nr_militia
            x,y=13,17
        [/unit]
#ifdef EASY
        [unit]
            side=3
            type=sw_unit_nr_trooper
            x,y=11,17
        [/unit]
#endif
        [message]
            speaker=sw_hte02_militia_captain
            message= _ "More of our people are coming in from the south. We'll hold them, Your Highness!"
        [/message]
    [/event]

    [event]
        name=moveto
        [filter]
            id=sw_hero_leia
            x,y=25,2
        [/filter]
        [message]
            speaker=sw_hero_han
            message= _ "Chewie, get the engines warm! Everybody aboard!"
        [/message]
        [message]
            speaker=sw_hero_leia
            message= _ "Han, those commandos were after me, not the warehouses. Someone knew exactly where I would be."
        [/message]
        [message]
            speaker=sw_hero_han
            message= _ "Then we stop being where people expect. And we tell Luke. Wherever he's got to."
        [/message]
        [endlevel]
            result=victory
            bonus=yes
            {NEW_GOLD_CARRYOVER 40}
        [/endlevel]
    [/event]

    [event]
        name=victory
        {SW_VICTORY_HOUSEKEEPING}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_leia}
    {SW_HERO_WITHDRAWS sw_hero_han}
    {SW_HERO_WITHDRAWS sw_hero_chewbacca}
[/scenario]
