#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Mission 6 - Raid on Karrde's Base (evacuation under assault).
# Design: production/campaigns/heir_to_the_empire/DESIGN.md section 4.6.
# Compound origin 9,4 (gen_hte_maps.py m06): Han's keep 13,7 in the main
# house; Imperial keep 3,10 to the west; evacuation transports on the landing
# field at 27,8 / 27,11 / 27,14.
#
# Challenge (owner report 2026-10-14: won without a single attack, because
# the evacuees walked east, away from every Imperial): an Imperial flanking
# force comes out of the forest north and south of the landing field on
# side 2's turns 2 and 3, and the transports' engines are cold until turn
# 4/5/6 (Easy/Normal/Hard), so Karrde's people must hold the field. Each
# wave appears at the end of side 2's turn, so it acts from the next turn and
# the player sees it first; it spawns about 15 hexes from Han's keep
# (balance review 3.12 keeps Han safe from a one-bad-turn loss).
#
# Variables: sw_hte06_evacuated (count of Karrde's people who reached a
# transport; cleared at victory), sw_hte06_ready (the transports can launch). Karrde and the smugglers are on side 1 only
# for this mission and are removed from the recall list at victory.

#define SW_HTE06_EVAC_HEXES
x=27,27,27
y=8,11,14
#enddef

[scenario]
    id=sw_hte_06_raid_on_karrdes_base
    name= _ "Raid on Karrde's Base"
    next_scenario=sw_hte_07_the_forest_crossing
    map_file=hte_06_raid_on_karrdes_base.map
    {SW_MUSIC sw-battle sw-heroic sw-tension}
    {SW_FIELD_MANUAL}
    {SW_TACTICAL_SYSTEMS}
    # Optional objective (lua/sw_bonus.lua).
    # Mission-specific bonus (design audit round 2): the win needs 3/4/5 of
    # Karrde's six people; holding the field for all of them costs turns and
    # risk.
    {SW_BONUS flag sw_hte06_all_out 50}
    {QUANTITY turns 17 15 14}
    victory_when_enemies_defeated=no
    {DEFAULT_SCHEDULE}

    [story]
        [part]
            {SW_STORY_BACKDROP dark-forest}
            story= _ "Han Solo and Lando Calrissian came to Myrkr following a rumor: Talon Karrde knew where Luke Skywalker was."
        [/part]
        [part]
            {SW_STORY_BACKDROP dark-forest}
            story= _ "Karrde received them warmly and told them nothing. That night Luke escaped, and by morning an Imperial assault force was landing outside the walls, looking for him."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        # Fixed save_id: carryover is matched by save_id, which would otherwise
        # default to the leader id and change whenever the leader changes.
        save_id=sw_player
        persistent=yes
        # Defeat comes only from the scenario's explicit hero-death and
        # objective events. A carried-over leader is recalled with the
        # canrecruit flag it had at the previous victory (cleared there), so
        # the default no_leader_left rule would end the mission at once.
        defeat_condition=never
        team_name=republic
        user_team_name= _ "New Republic and Karrde's People"
        id=sw_hero_han
        type=sw_hero_han
        name= _ "Han Solo"
        canrecruit=yes
        random_traits=no
        recruit=sw_unit_nr_trooper,sw_unit_nr_commando,sw_unit_nr_field_medic,sw_unit_nr_eweb_team
        {QUANTITY gold 150 120 100}
        fog=yes
    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial
        user_team_name= _ "Imperial Assault Force"
        id=sw_hte06_vosk
        type=sw_unit_im_officer
        name= _ "Captain Vosk"
        canrecruit=yes
        recruit=sw_unit_im_stormtrooper,sw_unit_im_scout_trooper,sw_unit_im_at_st
        {QUANTITY gold 120 170 220}
        {QUANTITY income 4 6 8}
        [ai]
            aggression=0.6
        [/ai]
        # The walker starts on the landing apron on Easy and Normal (balance
        # review 2026-10-11, 3.12): from (5,9) its 4 moves and 3-hex cannon
        # reached Han on turn 2 whenever he stepped forward. Hard keeps it
        # forward.
        [unit]
            type=sw_unit_im_at_st
#ifdef HARD
            x,y=5,9
#else
            x,y=2,9
#endif
        [/unit]
        [unit]
            type=sw_unit_im_stormtrooper
            x,y=5,11
        [/unit]
        [unit]
            type=sw_unit_im_stormtrooper
            x,y=6,10
        [/unit]
#ifdef HARD
        [unit]
            type=sw_unit_im_at_st
            x,y=4,12
        [/unit]
#endif
    [/side]

    [event]
        name=prestart
        # Replace (not extend) the recruit list carried over from earlier
        # missions, so Imperial or ground recruits never leak into this one.
        [set_recruit]
            side=1
            recruit=sw_unit_nr_trooper,sw_unit_nr_commando,sw_unit_nr_field_medic,sw_unit_nr_eweb_team
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_han
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_STASH_HEROES sw_hero_leia,sw_hero_chewbacca,sw_hero_luke}
        {SW_HERO sw_hero_lando sw_hero_lando ( _ "Lando Calrissian") 14 7}
        {SW_HERO sw_hero_karrde sw_hero_karrde ( _ "Talon Karrde") 12 7}
#define SW_HTE06_SMUGGLER X Y
        [unit]
            side=1
            type=sw_unit_sm_smuggler
            x,y={X},{Y}
            [modifications]
                {TRAIT_LOYAL}
            [/modifications]
        [/unit]
#enddef
        {SW_HTE06_SMUGGLER 16 8}
        {SW_HTE06_SMUGGLER 17 10}
        {SW_HTE06_SMUGGLER 18 12}
        {SW_HTE06_SMUGGLER 16 12}
        {SW_HTE06_SMUGGLER 12 11}
#undef SW_HTE06_SMUGGLER
        [set_variable]
            name=sw_hte06_evacuated
            value=0
        [/set_variable]
        [set_variable]
            name=sw_hte06_needed
            {QUANTITY value 3 4 5}
        [/set_variable]
        [set_variable]
            name=sw_hte06_ready_turn
            {QUANTITY value 4 5 6}
        [/set_variable]
        [store_locations]
            {SW_HTE06_EVAC_HEXES}
            variable=sw_hte06_evac
        [/store_locations]
        [foreach]
            array=sw_hte06_evac
            [do]
                # Prop art: Transport (Codex, production/tools/gen_codex_interior_art.py).
                [item]
                    x,y=$this_item.x,$this_item.y
                    image=misc/sw-prop-transport.png
                [/item]
                [item]
                    x,y=$this_item.x,$this_item.y
                    image=misc/sw-objective.png
                [/item]
                [label]
                    x,y=$this_item.x,$this_item.y
                    text= _ "Transport"
                [/label]
            [/do]
        [/foreach]
        {CLEAR_VARIABLE sw_hte06_evac}
        [objectives]
            side=1
            [objective]
                description= _ "Get Karrde's people to the transports on the landing field" + " ($sw_hte06_needed)"
                condition=win
            [/objective]
            [objective]
                description= _ "Then bring Han to the transports (with Lando, if he is still in the fight)"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Han"
                condition=lose
            [/objective]
            [note]
                description= _ "If Karrde falls, he withdraws from the fight badly wounded. If Lando falls, he withdraws too and returns for the next mission."
            [/note]
            {TURNS_RUN_OUT}
            {SW_NOTE_GOLD_CARRYOVER}
            {SW_NOTE_ENEMY_AIR}
            [note]
                description= _ "Karrde and his smugglers leave the battle when they reach a transport. Karrde counts as an evacuee."
            [/note]
            [note]
                description= _ "The transports' engines are cold: they cannot launch before turn" + " $sw_hte06_ready_turn. " + _ "Anyone already aboard leaves as soon as they are ready."
            [/note]
            {SW_BONUS_OBJECTIVE ( _ "Get all six of Karrde's people aboard, Karrde included") 50}
        [/objectives]
        # Air support (lua/sw_air.lua). The raiders have TIE cover from the Chimaera: one strafing run and one bombing run.
        {SW_AIR_SUPPORT 2 strafe 1 sw_unit_im_tie_fighter}
        {SW_AIR_SUPPORT 2 bombing 1 sw_unit_im_tie_bomber}
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_hero_karrde
            message= _ "An Imperial assault force, at my front gate. Someone has been very indiscreet about my guest."
        [/message]
        [message]
            speaker=sw_hero_han
            message= _ "Guest? You had Luke here?"
        [/message]
        [message]
            speaker=sw_hero_karrde
            message= _ "Had, Captain Solo. He left last night, with my second-in-command close behind him. We can argue about it later. My people need to reach the transports."
        [/message]
        [message]
            speaker=sw_hero_lando
            message= _ "Then let's give them a reason to keep their heads down. Han, you take the house; I'll take the yard."
        [/message]
    [/event]

    # Evacuation: Karrde's people leave the field when they reach a transport,
    # once its engines are warm (sw_hte06_ready).
    [event]
        name=moveto
        first_time_only=no
        [filter]
            side=1
            type=sw_unit_sm_smuggler,sw_unit_sm_veteran,sw_hero_karrde
            [filter_location]
                {SW_HTE06_EVAC_HEXES}
            [/filter_location]
        [/filter]
        [if]
            [variable]
                name=sw_hte06_ready
                boolean_equals=yes
            [/variable]
            [then]
                [fire_event]
                    name=sw_hte06_board
                    [primary_unit]
                        x,y=$x1,$y1
                    [/primary_unit]
                [/fire_event]
            [/then]
            [else]
                [floating_text]
                    x,y=$x1,$y1
                    text="<span color='#ffc04a'>" + _ "Engines warming up" + "</span>"
                [/floating_text]
            [/else]
        [/if]
    [/event]

    [event]
        name=sw_hte06_board
        first_time_only=no
        [set_variable]
            name=sw_hte06_evacuated
            add=1
        [/set_variable]
        [if]
            [variable]
                name=sw_hte06_evacuated
                greater_than_equal_to=6
            [/variable]
            [then]
                [set_variable]
                    name=sw_hte06_all_out
                    value=yes
                [/set_variable]
            [/then]
        [/if]
        [floating_text]
            x,y=$x1,$y1
            text="<span color='#80ff80'>" + _ "Evacuated" + "</span>"
        [/floating_text]
        [kill]
            x,y=$x1,$y1
            animate=no
            fire_event=no
        [/kill]
        [if]
            [variable]
                name=sw_hte06_evacuated
                numerical_equals=$sw_hte06_needed
            [/variable]
            [then]
                [message]
                    speaker=sw_hero_han
                    message= _ "That's enough of them aboard. Lando, time to go!"
                [/message]
            [/then]
        [/if]
        [fire_event]
            name=sw_hte06_check_win
        [/fire_event]
    [/event]

    # The engines are warm: everyone already waiting at a transport boards.
    [event]
        name=side 1 turn
        first_time_only=no
        [filter_condition]
            [variable]
                name=turn_number
                greater_than_equal_to=$sw_hte06_ready_turn
            [/variable]
            [not]
                [variable]
                    name=sw_hte06_ready
                    boolean_equals=yes
                [/variable]
            [/not]
        [/filter_condition]
        [set_variable]
            name=sw_hte06_ready
            value=yes
        [/set_variable]
        [message]
            speaker=sw_hero_karrde
            message= _ "The transports' engines are hot. Everyone at the landing field, get aboard!"
        [/message]
        [store_unit]
            [filter]
                side=1
                type=sw_unit_sm_smuggler,sw_unit_sm_veteran,sw_hero_karrde
                [filter_location]
                    {SW_HTE06_EVAC_HEXES}
                [/filter_location]
            [/filter]
            variable=sw_hte06_waiting
        [/store_unit]
        [foreach]
            array=sw_hte06_waiting
            [do]
                [fire_event]
                    name=sw_hte06_board
                    [primary_unit]
                        x,y=$this_item.x,$this_item.y
                    [/primary_unit]
                [/fire_event]
            [/do]
        [/foreach]
        {CLEAR_VARIABLE sw_hte06_waiting}
        [fire_event]
            name=sw_hte06_check_win
        [/fire_event]
    [/event]

    # The flank: Imperials who circled through the forest come out north and
    # south of the landing field, between Karrde's people and the transports.
#define SW_HTE06_FLANKER TYPE X Y
        [unit]
            side=2
            type={TYPE}
            x,y={X},{Y}
            animate=yes
        [/unit]
#enddef
    [event]
        # At the end of side 2's turn, so the player sees each wave a full turn
        # before it can attack (no surprise strike on a Han who ran ahead).
        name=side 2 turn 2 end
        # At the forest edge north and south of the landing field.
        {SW_HTE06_FLANKER sw_unit_im_scout_trooper 26 4}
        {SW_HTE06_FLANKER sw_unit_im_stormtrooper 28 5}
        {SW_HTE06_FLANKER sw_unit_im_stormtrooper 26 17}
#ifndef EASY
        {SW_HTE06_FLANKER sw_unit_im_scout_trooper 28 16}
#endif
#ifdef HARD
        {SW_HTE06_FLANKER sw_unit_im_stormtrooper 27 4}
#endif
        [message]
            speaker=sw_hero_karrde
            message= _ "Movement in the trees east of the landing field. They've circled round to cut us off from the transports."
        [/message]
        [message]
            speaker=sw_hero_lando
            message= _ "Then we hold that field until the engines are warm. Nobody boards a ship that can't fly."
        [/message]
    [/event]

    [event]
        name=side 2 turn 3 end
        {SW_HTE06_FLANKER sw_unit_im_stormtrooper 27 4}
#ifndef EASY
        {SW_HTE06_FLANKER sw_unit_im_stormtrooper 27 17}
#endif
#ifdef HARD
        {SW_HTE06_FLANKER sw_unit_im_stormtrooper_sergeant 26 4}
        {SW_HTE06_FLANKER sw_unit_im_scout_trooper 28 16}
#endif
    [/event]
#undef SW_HTE06_FLANKER

    [event]
        name=moveto
        first_time_only=no
        [filter]
            id=sw_hero_han,sw_hero_lando
            [filter_location]
                {SW_HTE06_EVAC_HEXES}
            [/filter_location]
        [/filter]
        [fire_event]
            name=sw_hte06_check_win
        [/fire_event]
    [/event]

    [event]
        name=sw_hte06_check_win
        first_time_only=no
        [if]
            [variable]
                name=sw_hte06_evacuated
                greater_than_equal_to=$sw_hte06_needed
            [/variable]
            [have_unit]
                id=sw_hero_han
                [filter_location]
                    {SW_HTE06_EVAC_HEXES}
                [/filter_location]
            [/have_unit]
            # Lando at a transport too, unless he has withdrawn wounded.
            [and]
                [have_unit]
                    id=sw_hero_lando
                    [filter_location]
                        {SW_HTE06_EVAC_HEXES}
                    [/filter_location]
                [/have_unit]
                [or]
                    [not]
                        [have_unit]
                            id=sw_hero_lando
                        [/have_unit]
                    [/not]
                [/or]
            [/and]
            [then]
                [message]
                    speaker=sw_hero_lando
                    message= _ "Karrde says the Imperials have speeder bikes out in the forest. They're still hunting Luke."
                [/message]
                [message]
                    speaker=sw_hero_han
                    message= _ "Then Luke's alive and they haven't caught him. That's the best news I've had all week. Punch it."
                [/message]
                [endlevel]
                    result=victory
                    bonus=yes
                    {NEW_GOLD_CARRYOVER 40}
                [/endlevel]
            [/then]
        [/if]
    [/event]

    [event]
        name=victory
        # Karrde's people are allies of circumstance: they do not carry over.
        [store_unit]
            [filter]
                side=1
                type=sw_unit_sm_smuggler,sw_unit_sm_veteran,sw_hero_karrde
            [/filter]
            variable=sw_hte06_discard
            kill=yes
        [/store_unit]
        {CLEAR_VARIABLE sw_hte06_discard}
        {SW_VICTORY_HOUSEKEEPING}
        {CLEAR_VARIABLE sw_hte06_evacuated,sw_hte06_needed,sw_hte06_ready,sw_hte06_ready_turn}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_han}
    {SW_HERO_WITHDRAWS sw_hero_lando}
    {SW_HERO_WITHDRAWS_TEMPORARY sw_hero_karrde}
[/scenario]

#undef SW_HTE06_EVAC_HEXES
