#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Mission 3 - Adrift (space survival).
# Design: production/campaigns/heir_to_the_empire/DESIGN.md section 4.3.
# Luke's X-wing is caught by an Imperial patrol with a damaged hyperdrive. He
# survives until the freighter Wild Karrde arrives (the "time over" event).
# Luke keeps one unit identity (sw_hero_luke) for the whole campaign: in space
# missions he is transformed into his X-wing form and changed back at victory.
#
# Variables:
#   sw_hte03_spawned / sw_hte03_killed - TIE counts for the optional
#       "destroy the patrol" bonus. Cleared at victory.
#   sw_hte_bonus_adrift - campaign flag (persists) when the bonus is earned.

[scenario]
    id=sw_hte_03_adrift
    name= _ "Adrift"
    next_scenario=sw_hte_04_shadows_of_kashyyyk
    map_file=hte_03_adrift.map
    {SW_MUSIC sw-space sw-tension sw-heroic}
    {SW_FIELD_MANUAL}
    {SW_TACTICAL_SYSTEMS}
    {QUANTITY turns 9 10 11}
    victory_when_enemies_defeated=no
    # Deep space: no day and night.
    {UNDERGROUND}

    [story]
        [part]
            {SW_STORY_BACKDROP asteroids}
            story= _ "Far from Bpfassh, Luke Skywalker flies alone toward a meeting he was told the New Republic had arranged."
        [/part]
        [part]
            {SW_STORY_BACKDROP asteroids}
            story= _ "The message was false. A gravity-well trap pulls his X-wing out of hyperspace beside a drifting asteroid cluster, and a patrol of TIE fighters is already waiting."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        # Fixed save_id: carryover is matched by save_id, which would otherwise
        # default to the leader id and change whenever the leader changes.
        save_id=sw_player
        persistent=yes
        # Defeat comes only from the scenario's explicit hero-death and
        # objective events. A carried-over leader is recalled with the
        # canrecruit flag it had at the previous victory (cleared there), so
        # the default no_leader_left rule would end the mission at once.
        defeat_condition=never
        team_name=republic
        user_team_name= _ "Luke Skywalker"
        id=sw_hero_luke
        type=sw_hero_xwing_luke
        name= _ "Luke Skywalker"
        canrecruit=yes
        random_traits=no
        recruit=
        gold=0
        income=0
        fog=yes
    [/side]

    [side]
        side=2
        controller=ai
        no_leader=yes
        team_name=imperial
        user_team_name= _ "Imperial Patrol"
        gold=0
        income=0
        [ai]
            aggression=0.7
            [goal]
                name=target
                [criteria]
                    id=sw_hero_luke
                [/criteria]
                value=5
            [/goal]
        [/ai]
    [/side]

    [event]
        name=prestart
        # Replace (not extend) the recruit list carried over from earlier
        # missions, so Imperial or ground recruits never leak into this one.
        [set_recruit]
            side=1
            recruit=
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_luke
            [/filter]
            canrecruit=yes
        [/modify_unit]
        # Heroes not in this mission wait off the recall list.
        {SW_STASH_HEROES sw_hero_leia,sw_hero_han,sw_hero_chewbacca}
        # If Luke was carried over in ground form, put him in his X-wing.
        [transform_unit]
            id=sw_hero_luke
            transform_to=sw_hero_xwing_luke
        [/transform_unit]
        # The astromech riding behind the cockpit patches damage each turn.
        [object]
            id=sw_hte03_astromech
            duration=scenario
            silent=yes
            [filter]
                id=sw_hero_luke
            [/filter]
            [effect]
                apply_to=new_ability
                [abilities]
                    [regenerate]
                        id=sw_ability_astromech_repairs
                        value=6
                        name= _ "astromech repairs"
                        description= _ "Luke's astromech droid repairs 6 HP of damage at the start of each turn."
                        affect_self=yes
                    [/regenerate]
                [/abilities]
            [/effect]
        [/object]

        [set_variable]
            name=sw_hte03_spawned
            value=0
        [/set_variable]
        [set_variable]
            name=sw_hte03_killed
            value=0
        [/set_variable]
        [fire_event]
            name=sw_hte03_wave
            [primary_unit]
                x,y=22,8
            [/primary_unit]
        [/fire_event]

        [objectives]
            side=1
            [objective]
                description= _ "Survive until the end of the last turn"
                condition=win
            [/objective]
            [objective]
                description= _ "Destroy every TIE fighter in the patrol"
                condition=win
                [show_if]
                    [variable]
                        name=sw_hte03_spawned
                        greater_than=0
                    [/variable]
                [/show_if]
            [/objective]
            [objective]
                description= _ "Death of Luke Skywalker"
                condition=lose
            [/objective]
            [note]
                description= _ "Asteroid fields give your X-wing cover (60% defense) but cost 2 movement."
            [/note]
            [note]
                description= _ "Destroying the whole patrol earns a bonus: the Wild Karrde's crew will be more impressed."
            [/note]
        [/objectives]
    [/event]

    # Each wave spawns TIEs along the eastern edge.
#define SW_HTE03_TIE TYPE X Y
    [unit]
        side=2
        type={TYPE}
        x,y={X},{Y}
        animate=yes
    [/unit]
    [set_variable]
        name=sw_hte03_spawned
        add=1
    [/set_variable]
#enddef

    [event]
        name=sw_hte03_wave
        {SW_HTE03_TIE sw_unit_im_tie_fighter 22 7}
        {SW_HTE03_TIE sw_unit_im_tie_fighter 22 9}
    [/event]

    [event]
        name=turn 3
        {SW_HTE03_TIE sw_unit_im_tie_fighter 22 2}
#ifndef EASY
        {SW_HTE03_TIE sw_unit_im_tie_fighter 22 15}
#endif
        [message]
            speaker=sw_hero_luke
            message= _ "More of them. They knew I was coming. Somebody set this up."
        [/message]
    [/event]

    [event]
        name=turn 5
        {SW_HTE03_TIE sw_unit_im_tie_fighter 22 8}
#ifdef HARD
        {SW_HTE03_TIE sw_unit_im_tie_interceptor 22 3}
#endif
    [/event]

    [event]
        name=turn 7
        {SW_HTE03_TIE sw_unit_im_tie_fighter 22 14}
#ifndef EASY
        {SW_HTE03_TIE sw_unit_im_tie_interceptor 22 6}
#endif
    [/event]
#undef SW_HTE03_TIE

    [event]
        name=start
        [message]
            speaker=sw_hero_luke
            message= _ "Hyperdrive's out, and the motivator is smoking. Easy. Let's see what they've got."
        [/message]
        [message]
            speaker=narrator
            caption= _ "Astromech"
            message= _ "<i>(Luke's astromech whistles a long, unhappy string of notes.)</i>"
        [/message]
        [message]
            speaker=sw_hero_luke
            message= _ "I know. Use the rocks for cover and keep the shields patched. Somebody will have heard the distress call."
        [/message]
    [/event]

    [event]
        name=die
        first_time_only=no
        [filter]
            side=2
        [/filter]
        [set_variable]
            name=sw_hte03_killed
            add=1
        [/set_variable]
        [if]
            [variable]
                name=sw_hte03_killed
                greater_than_equal_to=$sw_hte03_spawned
            [/variable]
            [variable]
                name=turn_number
                greater_than_equal_to=7
            [/variable]
            [then]
                [set_variable]
                    name=sw_hte_bonus_adrift
                    value=yes
                [/set_variable]
                [message]
                    speaker=sw_hero_luke
                    message= _ "That's the last of them. Now I just have to wait."
                [/message]
                [fire_event]
                    name=sw_hte03_rescue
                [/fire_event]
            [/then]
        [/if]
    [/event]

    [event]
        name=time over
        [fire_event]
            name=sw_hte03_rescue
        [/fire_event]
    [/event]

    [event]
        name=sw_hte03_rescue
        [message]
            speaker=narrator
            image=portraits/sw-hero-mara.png
            caption= _ "Wild Karrde"
            message= _ "Unidentified X-wing, this is the freighter Wild Karrde. Your drive signature is a mess and your friends are leaving. Stand by for tractor beam."
        [/message]
        [message]
            speaker=sw_hero_luke
            message= _ "Wild Karrde, I appreciate the help. Who am I talking to?"
        [/message]
        [message]
            speaker=narrator
            image=portraits/sw-hero-mara.png
            caption= _ "Wild Karrde"
            message= _ "Someone who's going to have a lot of questions for you, Skywalker. Power down your weapons."
        [/message]
        [endlevel]
            result=victory
            bonus=no
            carryover_report=no
            {NEW_GOLD_CARRYOVER 40}
        [/endlevel]
    [/event]

    [event]
        name=victory
        [transform_unit]
            id=sw_hero_luke
            transform_to=sw_hero_luke
        [/transform_unit]
        {SW_VICTORY_HOUSEKEEPING}
        {CLEAR_VARIABLE sw_hte03_spawned}
        {CLEAR_VARIABLE sw_hte03_killed}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_luke}
[/scenario]
