#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Mission 4 - Shadows of Kashyyyk (night defense).
# Design: production/campaigns/heir_to_the_empire/DESIGN.md section 4.4.
# Leia and Chewbacca shelter in a Wookiee tree city. Noghri commandos attack
# in waves through the night. Wookiee lookouts (keen senses) reveal Noghri.
# Key hexes (gen_hte_maps.py m04): Leia's keep 12,10; Noghri entry points on
# each map edge: 1,10 / 26,10 / 13,1 / 13,20.
#
# Variables: sw_hte04_spawned / sw_hte04_killed (Noghri counts, cleared at
# victory).

[scenario]
    id=sw_hte_04_shadows_of_kashyyyk
    name= _ "Shadows of Kashyyyk"
    next_scenario=sw_hte_05_prisoner_of_myrkr
    map_file=hte_04_shadows_of_kashyyyk.map
    {SW_MUSIC sw-tension sw-jungle sw-heroic}
    {SW_FIELD_MANUAL}
    {SW_TACTICAL_SYSTEMS}
    {QUANTITY turns 13 14 15}
    victory_when_enemies_defeated=no
    # A long night under the wroshyr canopy; dawn comes on the final turns.
    {DUSK}
    {FIRST_WATCH}
    {FIRST_WATCH}
    {FIRST_WATCH}
    {FIRST_WATCH}
    {SECOND_WATCH}
    {SECOND_WATCH}
    {SECOND_WATCH}
    {SECOND_WATCH}
    {SECOND_WATCH}
    {SECOND_WATCH}
    {SECOND_WATCH}
    {DAWN}
    {MORNING}

    [story]
        [part]
            story= _ "Han sent Leia and Chewbacca to the one place he trusted to hide her: Kashyyyk, where an entire world owes Chewbacca's friends a debt."
        [/part]
        [part]
            story= _ "High in the branches of the wroshyr trees, the Wookiees gave them shelter. The Noghri followed anyway."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        # Fixed save_id: carryover is matched by save_id, which would otherwise
        # default to the leader id and change whenever the leader changes.
        save_id=sw_player
        persistent=yes
        # Defeat comes only from the scenario's explicit hero-death and
        # objective events. A carried-over leader is recalled with the
        # canrecruit flag it had at the previous victory (cleared there), so
        # the default no_leader_left rule would end the mission at once.
        defeat_condition=never
        team_name=republic
        user_team_name= _ "New Republic"
        id=sw_hero_leia
        type=sw_hero_leia
        name= _ "Leia Organa Solo"
        canrecruit=yes
        random_traits=no
        recruit=sw_unit_wk_warrior,sw_unit_wk_lookout,sw_unit_nr_field_medic
        {QUANTITY gold 120 100 80}
        fog=yes
    [/side]

    [side]
        side=2
        controller=ai
        no_leader=yes
        team_name=imperial
        user_team_name= _ "Noghri Commandos"
        gold=0
        income=0
        [ai]
            aggression=0.7
            caution=0.2
            [goal]
                name=target
                [criteria]
                    id=sw_hero_leia
                [/criteria]
                value=8
            [/goal]
        [/ai]
    [/side]

    [side]
        side=3
        controller=ai
        no_leader=yes
        team_name=republic
        user_team_name= _ "Wookiees of Rwookrrorro"
        gold=0
        income=0
        [unit]
            id=sw_hte04_ralrra
            type=sw_unit_wk_lookout
            name= _ "Ralrra"
            x,y=14,13
            random_traits=no
        [/unit]
        [unit]
            type=sw_unit_wk_warrior
            x,y=9,8
        [/unit]
        [unit]
            type=sw_unit_wk_warrior
            x,y=16,8
        [/unit]
        [unit]
            type=sw_unit_wk_lookout
            x,y=5,5
        [/unit]
    [/side]

    [event]
        name=prestart
        # Replace (not extend) the recruit list carried over from earlier
        # missions, so Imperial or ground recruits never leak into this one.
        [set_recruit]
            side=1
            recruit=sw_unit_wk_warrior,sw_unit_wk_lookout,sw_unit_nr_field_medic
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_leia
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_STASH_HEROES sw_hero_han,sw_hero_luke}
        {SW_HERO sw_hero_chewbacca sw_hero_chewbacca ( _ "Chewbacca") 12 11}
        [set_variable]
            name=sw_hte04_spawned
            value=0
        [/set_variable]
        [set_variable]
            name=sw_hte04_killed
            value=0
        [/set_variable]
        [objectives]
            side=1
            [objective]
                description= _ "Survive until dawn"
                condition=win
            [/objective]
            [objective]
                description= _ "Defeat every Noghri commando"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Leia"
                condition=lose
            [/objective]
            [note]
                description= _ "If Chewbacca falls, he withdraws from the fight badly wounded and returns for the next mission."
            [/note]
            {SW_NOTE_GOLD_CARRYOVER}
            [note]
                description= _ "Noghri are invisible in forest and at night. A Wookiee Lookout reveals every Noghri within two hexes."
            [/note]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_hte04_ralrra
            message= _ "<i>(Ralrra speaks in the Wookiee tongue; Chewbacca translates in growls and gestures.)</i> The trees are quiet tonight. Too quiet. My lookouts will watch the branches."
        [/message]
        [message]
            speaker=sw_hero_leia
            message= _ "Thank you, Ralrra. If they come, they'll come for me. Keep your people back from the edges."
        [/message]
        [message]
            speaker=sw_hero_chewbacca
            message= _ "<i>(Chewbacca rumbles a refusal and plants himself beside her.)</i>"
        [/message]
    [/event]

    # Noghri waves. Each arrival is counted for the "defeat them all" objective.
#define SW_HTE04_NOGHRI X Y
    [unit]
        side=2
        type=sw_unit_im_noghri
        x,y={X},{Y}
    [/unit]
    [set_variable]
        name=sw_hte04_spawned
        add=1
    [/set_variable]
#enddef

    [event]
        name=turn 2
        {SW_HTE04_NOGHRI 1 10}
        {SW_HTE04_NOGHRI 26 10}
    [/event]
    [event]
        name=turn 4
        {SW_HTE04_NOGHRI 13 1}
#ifndef EASY
        {SW_HTE04_NOGHRI 13 20}
#endif
    [/event]
    [event]
        name=turn 6
        {SW_HTE04_NOGHRI 1 10}
        {SW_HTE04_NOGHRI 26 10}
#ifdef HARD
        {SW_HTE04_NOGHRI 13 1}
#endif
        [message]
            speaker=sw_hte04_ralrra
            message= _ "More of them in the lower branches. They move like smoke."
        [/message]
    [/event]
    [event]
        name=turn 9
        {SW_HTE04_NOGHRI 13 20}
        {SW_HTE04_NOGHRI 26 10}
#ifndef EASY
        {SW_HTE04_NOGHRI 1 10}
#endif
        [set_variable]
            name=sw_hte04_last_wave
            value=yes
        [/set_variable]
    [/event]
#undef SW_HTE04_NOGHRI

    [event]
        name=sighted
        [filter]
            type=sw_unit_im_noghri
        [/filter]
        [message]
            speaker=sw_hero_leia
            message= _ "There, in the branches. The same gray commandos from Bpfassh."
        [/message]
    [/event]

    [event]
        name=die
        first_time_only=no
        [filter]
            type=sw_unit_im_noghri
        [/filter]
        [set_variable]
            name=sw_hte04_killed
            add=1
        [/set_variable]
        [if]
            [variable]
                name=sw_hte04_last_wave
                boolean_equals=yes
            [/variable]
            [variable]
                name=sw_hte04_killed
                greater_than_equal_to=$sw_hte04_spawned
            [/variable]
            [then]
                [fire_event]
                    name=sw_hte04_win
                [/fire_event]
            [/then]
        [/if]
    [/event]

    [event]
        name=time over
        [fire_event]
            name=sw_hte04_win
        [/fire_event]
    [/event]

    [event]
        name=sw_hte04_win
        [message]
            speaker=sw_hero_leia
            message= _ "They're withdrawing. One of them looked at me before it went, almost as if it recognized me. I don't understand them."
        [/message]
        [message]
            speaker=sw_hte04_ralrra
            message= _ "Whatever they are, they will not find you so easily in our trees again."
        [/message]
        [endlevel]
            result=victory
            bonus=yes
            {NEW_GOLD_CARRYOVER 40}
        [/endlevel]
    [/event]

    [event]
        name=victory
        {SW_VICTORY_HOUSEKEEPING}
        {CLEAR_VARIABLE sw_hte04_spawned}
        {CLEAR_VARIABLE sw_hte04_killed}
        {CLEAR_VARIABLE sw_hte04_last_wave}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_leia}
    {SW_HERO_WITHDRAWS sw_hero_chewbacca}
[/scenario]
