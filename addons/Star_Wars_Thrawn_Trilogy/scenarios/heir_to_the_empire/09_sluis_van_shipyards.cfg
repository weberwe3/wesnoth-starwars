#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Mission 9 - The Sluis Van Shipyards (space defense).
# Design: production/campaigns/heir_to_the_empire/DESIGN.md section 4.9.
# Key hexes (gen_hte_maps.py m09): Wedge's hangar keep 4,10; docked warships
# at 10,4 / 10,16 / 6,7 / 6,13; Imperial entry along the east edge.
#
# Hijacked mole miners fly at the docked warships and cut into them with
# plasma jets (melee; the warships' point-defense guns cannot answer in
# melee). A warship reduced to zero hit points is captured.
# Variables: sw_hte09_miners_spawned / _killed, sw_hte09_last_wave,
# sw_hte09_ships_lost (cleared at victory).

[scenario]
    id=sw_hte_09_sluis_van_shipyards
    name= _ "The Sluis Van Shipyards"
    next_scenario=sw_hte_10_thrawns_gambit
    map_file=hte_09_sluis_van_shipyards.map
    {SW_MUSIC sw-space sw-heroic sw-thrawn}
    {SW_FIELD_MANUAL}
    {SW_TACTICAL_SYSTEMS}
    # Thrawn commands side 2 in person: his forces learn the player's habits.
    {SW_THRAWN_DOCTRINE 2}
    {QUANTITY turns 16 14 13}
    victory_when_enemies_defeated=no
    {UNDERGROUND}

    [story]
        [part]
            story= _ "The Sluis Van shipyards are crowded with warships of a relief fleet, docked for refit with skeleton crews. Han's warning reached Rogue Squadron's commander, Wedge Antilles, only hours before the sensors lit up."
        [/part]
        [part]
            story= _ "Luke Skywalker, back from Myrkr, took his X-wing out with them."
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        # Fixed save_id: carryover is matched by save_id, which would otherwise
        # default to the leader id and change whenever the leader changes.
        save_id=sw_player
        persistent=yes
        # Defeat comes only from the scenario's explicit hero-death and
        # objective events. A carried-over leader is recalled with the
        # canrecruit flag it had at the previous victory (cleared there), so
        # the default no_leader_left rule would end the mission at once.
        defeat_condition=never
        team_name=republic
        user_team_name= _ "Sluis Van Defense"
        id=sw_hero_wedge
        type=sw_hero_wedge
        name= _ "Wedge Antilles"
        canrecruit=yes
        random_traits=no
        recruit=sw_unit_nr_xwing,sw_unit_nr_awing,sw_unit_nr_ywing
        {QUANTITY gold 170 140 120}
        fog=no
    [/side]

    [side]
        side=2
        controller=ai
        no_leader=yes
        team_name=imperial
        user_team_name= _ "Imperial Strike Group"
        gold=0
        income=0
        [ai]
            aggression=0.8
            [goal]
                name=target
                [criteria]
                    type=sw_unit_nr_docked_warship
                [/criteria]
                value=6
            [/goal]
        [/ai]
    [/side]

    [event]
        name=prestart
        # Replace (not extend) the recruit list carried over from earlier
        # missions, so Imperial or ground recruits never leak into this one.
        [set_recruit]
            side=1
            recruit=sw_unit_nr_xwing,sw_unit_nr_awing,sw_unit_nr_ywing
        [/set_recruit]
        [modify_unit]
            [filter]
                id=sw_hero_wedge
            [/filter]
            canrecruit=yes
        [/modify_unit]
        {SW_STASH_HEROES sw_hero_leia,sw_hero_han,sw_hero_chewbacca,sw_hero_lando}
        {SW_HERO sw_hero_luke sw_hero_xwing_luke ( _ "Luke Skywalker") 5 10}
        [transform_unit]
            id=sw_hero_luke
            transform_to=sw_hero_xwing_luke
        [/transform_unit]
#define SW_HTE09_WARSHIP ID NAME X Y
        [unit]
            side=1
            id={ID}
            type=sw_unit_nr_docked_warship
            name={NAME}
            x,y={X},{Y}
            random_traits=no
            [modifications]
                {TRAIT_LOYAL}
            [/modifications]
        [/unit]
#enddef
        {SW_HTE09_WARSHIP sw_hte09_ship_1 ( _ "Corsair's Pride") 10 4}
        {SW_HTE09_WARSHIP sw_hte09_ship_2 ( _ "Liberty's Hope") 10 16}
        {SW_HTE09_WARSHIP sw_hte09_ship_3 ( _ "Kestrel") 6 7}
        {SW_HTE09_WARSHIP sw_hte09_ship_4 ( _ "Valiant") 6 13}
#undef SW_HTE09_WARSHIP
        [set_variable]
            name=sw_hte09_miners_spawned
            value=0
        [/set_variable]
        [set_variable]
            name=sw_hte09_miners_killed
            value=0
        [/set_variable]
        [set_variable]
            name=sw_hte09_ships_lost
            value=0
        [/set_variable]
        [objectives]
            side=1
            [objective]
                description= _ "Destroy every hijacked mole miner"
                condition=win
            [/objective]
            [objective]
                description= _ "Two docked warships captured"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of Wedge Antilles"
                condition=lose
            [/objective]
            [note]
                description= _ "If Luke falls, he withdraws from the fight badly wounded and returns for the next mission."
            [/note]
            {TURNS_RUN_OUT}
            {SW_NOTE_GOLD_CARRYOVER}
            [note]
                description= _ "Mole miners must reach a warship and cut into it at close range. Warships cannot fire back at them."
            [/note]
        [/objectives]
    [/event]

#define SW_HTE09_MINER X Y
    [unit]
        side=2
        type=sw_unit_im_mole_miner
        x,y={X},{Y}
        animate=yes
    [/unit]
    [set_variable]
        name=sw_hte09_miners_spawned
        add=1
    [/set_variable]
#enddef
#define SW_HTE09_TIE TYPE X Y
    [unit]
        side=2
        type={TYPE}
        x,y={X},{Y}
        animate=yes
    [/unit]
#enddef

    [event]
        name=start
        {SW_HTE09_MINER 28 4}
        {SW_HTE09_MINER 28 16}
        {SW_HTE09_TIE sw_unit_im_tie_fighter 28 9}
        {SW_HTE09_TIE sw_unit_im_tie_fighter 28 11}
        [message]
            speaker=sw_hero_wedge
            message= _ "Rogue Squadron, we have TIEs and something else on the scopes. Big, slow, and heading straight for the docks."
        [/message]
        [message]
            speaker=sw_hero_luke
            message= _ "Mole miners. Han was right. They're going to cut into the warships and fly them out with boarding crews."
        [/message]
        [message]
            speaker=sw_hero_wedge
            message= _ "Not today. Fighters, screen the docks. Bombers, go for the miners."
        [/message]
    [/event]

    [event]
        name=turn 3
        {SW_HTE09_MINER 28 3}
        {SW_HTE09_MINER 28 17}
        {SW_HTE09_TIE sw_unit_im_tie_fighter 28 10}
#ifdef HARD
        {SW_HTE09_TIE sw_unit_im_tie_interceptor 28 8}
#endif
    [/event]

    [event]
        name=turn 5
        {SW_HTE09_MINER 28 5}
#ifndef EASY
        {SW_HTE09_MINER 28 15}
#endif
        {SW_HTE09_TIE sw_unit_im_tie_bomber 28 10}
    [/event]

    [event]
        name=turn 7
        {SW_HTE09_MINER 28 10}
#ifndef EASY
        {SW_HTE09_TIE sw_unit_im_tie_interceptor 28 12}
#endif
        [set_variable]
            name=sw_hte09_last_wave
            value=yes
        [/set_variable]
        [message]
            speaker=sw_hero_wedge
            message= _ "Last group coming in. Take out those miners and this is over."
        [/message]
    [/event]
#undef SW_HTE09_MINER
#undef SW_HTE09_TIE

    [event]
        name=die
        first_time_only=no
        [filter]
            type=sw_unit_im_mole_miner
        [/filter]
        [set_variable]
            name=sw_hte09_miners_killed
            add=1
        [/set_variable]
        [if]
            [variable]
                name=sw_hte09_last_wave
                boolean_equals=yes
            [/variable]
            [variable]
                name=sw_hte09_miners_killed
                greater_than_equal_to=$sw_hte09_miners_spawned
            [/variable]
            [then]
                [message]
                    speaker=sw_hero_wedge
                    message= _ "That's the last mole miner. The docks are secure."
                [/message]
                [message]
                    speaker=sw_hero_luke
                    message= _ "The docks, yes. But the Star Destroyers are still out there, and they haven't committed yet."
                [/message]
                [endlevel]
                    result=victory
                    bonus=yes
                    {NEW_GOLD_CARRYOVER 40}
                [/endlevel]
            [/then]
        [/if]
    [/event]

    # A warship reaching zero hit points has been boarded and captured.
    [event]
        name=die
        first_time_only=no
        [filter]
            type=sw_unit_nr_docked_warship
        [/filter]
        [set_variable]
            name=sw_hte09_ships_lost
            add=1
        [/set_variable]
        [message]
            speaker=sw_hero_wedge
            message= _ "They've cut into the $unit.name|! Boarding crews are aboard. We've lost her."
        [/message]
        [if]
            [variable]
                name=sw_hte09_ships_lost
                greater_than_equal_to=2
            [/variable]
            [then]
                [endlevel]
                    result=defeat
                [/endlevel]
            [/then]
        [/if]
    [/event]

    [event]
        name=victory
        # Surviving warships are counted for the finale's starting forces.
        [store_unit]
            [filter]
                side=1
                type=sw_unit_nr_docked_warship
            [/filter]
            variable=sw_hte09_survivors
            kill=yes
        [/store_unit]
        [set_variable]
            name=sw_hte_warships_saved
            value=$sw_hte09_survivors.length
        [/set_variable]
        {CLEAR_VARIABLE sw_hte09_survivors}
        [transform_unit]
            id=sw_hero_luke
            transform_to=sw_hero_luke
        [/transform_unit]
        {SW_VICTORY_HOUSEKEEPING}
        {CLEAR_VARIABLE sw_hte09_miners_spawned,sw_hte09_miners_killed,sw_hte09_last_wave,sw_hte09_ships_lost}
    [/event]

    {SW_HERO_DEATH_IS_DEFEAT sw_hero_wedge}
    {SW_HERO_WITHDRAWS sw_hero_luke}
[/scenario]
