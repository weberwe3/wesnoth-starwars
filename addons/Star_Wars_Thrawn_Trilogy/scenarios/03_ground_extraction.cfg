#textdomain wesnoth-Star_Wars_Thrawn_Trilogy
# Bounded ground scenario — Ground Extraction
# New Republic extraction mission: hold the extraction point and
# reach it with the hero commander while Imperial forces advance.
# Uses the reusable reinforcement macro from utils/mission_events.cfg.
# No branching campaign state, new units, art, Lua, or broad framework.

[scenario]
    id=sw_03_ground_extraction
    name=_"Ground Extraction"
    # 8x6 compact map with a central defensive complex (castle)
    # and flanking forest/grass terrain. Extraction point is at
    # the top-right (x=8,y=1). Imperial forces approach from the
    # right and bottom.
    map_data="Gg,Ff,Ff,Ff,Ff,Ff,Ff,Gg
Gg,Ff,Cc,Cc,Cc,Cc,Ff,Gg
Gg,Ff,Cc,Cc,Cc,Cc,Ff,Gg
Gg,Ff,Cc,Cc,Cc,Cc,Ff,Gg
Gg,Ff,Ff,Ff,Ff,Ff,Ff,Gg
Gg,Gg,Ff,Ff,Ff,Ff,Gg,Gg"
    victory_when_enemies_defeated=no

    # --- Side 1: New Republic Extraction Force (Player) ---
    [side]
        side=1
        controller=human
        team_name=player
        user_team_name=_"New Republic Extraction"
        type=sw_unit_nr_hero_commander
        id=sw_leader
        name=_"Republic Commander"
        x=1
        y=1
        leader=yes
        canrecruit=yes
        gold=100
        recruit=sw_unit_nr_hero_commander,Thrawn_Phalanx

        # Representative hero unit — the recruit-capable leader
        # who must reach the extraction point to complete the mission.
        [unit]
            type=sw_unit_nr_hero_commander
            id=sw_hero_commander
            name=_"Republic Commander"
            x=1
            y=1
            side=1
            leader=no
            canrecruit=no
        [/unit]

        # sw_unit_irm_ground_assault_vehicle — the representative
        # vehicle placed as an NPC escort; not recruitable since
        # its alignment is impressive, but it provides heavy firepower
        # for the defensive hold.
        [unit]
            type=sw_unit_irm_ground_assault_vehicle
            id=sw_vehicle_escort
            name=_"Ground Assault Vehicle"
            x=2
            y=1
            side=1
            leader=no
            canrecruit=no
        [/unit]

        # Two Thrawn_Phalanx infantry squads for the defensive hold.
        [unit]
            type=Thrawn_Phalanx
            id=sw_infantry_squad_1
            name=_"Phalanx Squad"
            x=1
            y=2
            side=1
            leader=no
            canrecruit=no
        [/unit]
        [unit]
            type=Thrawn_Phalanx
            id=sw_infantry_squad_2
            name=_"Phalanx Squad"
            x=3
            y=1
            side=1
            leader=no
            canrecruit=no
        [/unit]
    [/side]

    # --- Side 2: Imperial Remnant Interdiction Force (AI) ---
    [side]
        side=2
        controller=ai
        team_name=enemy
        user_team_name=_"Imperial Remnant Interdiction"
        type=Thrawn_Phalanx
        id=sw_enemy_leader
        name=_"Imperial Blockade Commander"
        x=7
        y=5
        leader=yes
        canrecruit=yes
        gold=100
        recruit=Thrawn_Phalanx

        # Two enemy infantry squads positioned to attack
        # the extraction point from the right flank.
        [unit]
            type=Thrawn_Phalanx
            id=sw_enemy_squad_1
            name=_"Imperial Squad"
            x=6
            y=5
            side=2
            leader=no
            canrecruit=no
        [/unit]
        [unit]
            type=Thrawn_Phalanx
            id=sw_enemy_squad_2
            name=_"Imperial Squad"
            x=7
            y=6
            side=2
            leader=no
            canrecruit=no
        [/unit]
    [/side]

    # --- Pre-start: Objectives and variable initialization ---
    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                description=_"Move the Republic Commander to the extraction point at top-right"
                condition=win
            [/objective]
            [objective]
                description=_"Defeat the Imperial Blockade Commander"
                condition=win
            [/objective]
            [objective]
                description=_"Death of your leader"
                condition=lose
            [/objective]
            [objective]
                description=_"Imperial reinforcements overwhelm the position"
                condition=lose
            [/objective]
        [/objectives]
        [command]
            # sw_turn_limit: number of turns before Imperial
            # reinforcements overwhelm the defensive position.
            # Set to 10 to give the player a limited window.
            [variable]
                name=sw_turn_limit
                operation=assign
                value=10
            [/variable]
            # sw_extraction_reached: tracks whether the hero
            # has reached the extraction point. Initialized to no.
            [variable]
                name=sw_extraction_reached
                operation=assign
                value=no
            [/variable]
        [/command]
    [/event]

    # --- Reinforcements arrive on turn 5 via reusable macro.
    # The sw_deploy_reinforcement macro from utils/mission_events.cfg
    # deploys an additional unit for side 1 at the extraction area
    # to support the defensive hold. ---
    [event]
        name=turn
        turn=5
        [command]
            {sw_deploy_reinforcement 1 sw_unit_nr_hero_commander 8 1 100}
            [message]_Reinforcements have arrived at the extraction point![/message]
        [/command]
    [/event]

    # --- Victory: Hero reaches the extraction point (x=8,y=1).
    # The moveto event fires only if the hero survived combat
    # at that hex, so reaching it directly means mission success. ---
    [event]
        name=moveto
        [filter]
            side=1
            id=sw_hero_commander
        [/filter]
        [filter_location]
            x=8
            y=1
        [/filter_location]
        [then]
            [variable]
                name=sw_extraction_reached
                operation=assign
                value=yes
            [/variable]
            [message]_The Republic Commander has reached the extraction point!_[/message]
            [message]_Hold this position — the New Republic extraction is underway!_[/message]
            [endlevel]
                result=victory
            [/endlevel]
        [/then]
    [/event]

    # --- Victory condition: Enemy leader defeated ---
    [event]
        name=die
        [filter]
            side=2
            canrecruit=yes
        [/filter]
        [endlevel]
            result=victory
        [/endlevel]
    [/event]

    # --- Defeat condition: Player leader killed ---
    [event]
        name=die
        [filter]
            side=1
            canrecruit=yes
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    # --- Defeat condition: Turn limit exceeded.
    # Imperial reinforcements arrive and overwhelm the position
    # if the mission is not completed within sw_turn_limit turns. ---
    [event]
        name=turn
        turn=10
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    # --- Defeat condition: Hero escort unit destroyed before
    # reaching the extraction point. This handles the case where
    # the hero dies en route. ---
    [event]
        name=die
        [filter]
            side=1
            id=sw_hero_commander
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    # --- Defeat condition: Vehicle destroyed ---
    [event]
        name=die
        [filter]
            side=1
            id=sw_vehicle_escort
        [/filter]
        [message]_The Ground Assault Vehicle is destroyed — extraction compromised!_[/message]
    [/event]
[/scenario]
