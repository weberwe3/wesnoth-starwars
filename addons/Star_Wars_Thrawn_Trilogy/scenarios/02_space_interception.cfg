#textdomain wesnoth-Star_Wars_Thrawn_Trilogy
# Bounded space scenario — Space Interception
# Centered on one escort/interception interaction: the player's escort unit
# must reach the interception point to screen and stop the Imperial blockade
# runner. The outcome of that single engagement determines victory or defeat.

[scenario]
    id=sw_02_space_interception
    name=_"Space Interception"
    # 8x6 starship corridor map. Terrain codes use existing default Wesnoth tiles.
    map_data="Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg^Fp,Gg^Fp,Gg^Fp,Gg^Fp,Gg,Gg
Gg,Gg,Gg^Fp,Gg^Fp,Gg^Fp,Gg^Fp,Gg,Gg
Gg,Gg,Gg,Gg^Fp,Gg^Fp,Gg^Fp,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg"
    victory_when_enemies_defeated=no

    # --- Side 1: New Republic Escort Force (Player) ---
    [side]
        side=1
        controller=human
        team_name=player
        user_team_name=_"New Republic Escort"
        type=Thrawn_Phalanx
        id=sw_leader
        name=_"Grand Admiral Thrawn"
        x=1
        y=1
        leader=yes
        canrecruit=yes
        gold=100
        recruit=Thrawn_Phalanx

        # Registered spacecraft type: the New Republic Starwing assigned to
        # screen the extraction corridor at the interception point.
        [unit]
            type=sw_unit_nr_starwing_escape
            id=sw_escort_unit
            name=_"NR Starwing Escort"
            x=2
            y=1
            side=1
            leader=no
            canrecruit=no
        [/unit]
    [/side]

    # --- Side 2: Imperial Remnant Interdiction Force (AI) ---
    [side]
        side=2
        controller=ai
        team_name=enemy
        user_team_name=_"Imperial Remnant Interdiction"
        type=Thrawn_Phalanx
        id=sw_enemy_leader
        name=_"Imperial Blockade Commander"
        x=7
        y=5
        leader=yes
        canrecruit=yes
        gold=100
        recruit=Thrawn_Phalanx

        # Registered spacecraft type: the Imperial interceptor squadron at
        # the interception point (x=5,y=3) that challenges the screen.
        [unit]
            type=sw_unit_im_venator_interceptor
            id=sw_interceptor_block
            name=_"Imperial Interceptor Squadron"
            x=5
            y=3
            side=2
            leader=no
            canrecruit=no
        [/unit]
    [/side]

    # --- Pre-start: Objectives and variable initialization ---
    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                description=_"Move the New Republic Starwing Escort to the interception point to screen the extraction corridor"
                condition=win
            [/objective]
            [objective]
                description=_"Death of your leader"
                condition=lose
            [/objective]
            [objective]
                description=_"The escorted New Republic Starwing is destroyed"
                condition=lose
            [/objective]
            [objective]
                description=_"The Imperial Remnant commander reaches the extraction point"
                condition=lose
            [/objective]
        [/objectives]
        [command]
            # sw_interception_complete: tracks whether the escort reached
            # the interception point. Initialized to no, set to yes by the
            # moveto event when the escort arrives at the interception hex.
            [variable]
                name=sw_interception_complete
                operation=assign
                value=no
            [/variable]
            # sw_escort_alive: tracks escort survival for outcome determination.
            # Initialized to yes; set to no if the escort is destroyed.
            [variable]
                name=sw_escort_alive
                operation=assign
                value=yes
            [/variable]
            # sw_turn_limit: number of turns before Imperial reinforcements
            # arrive and the scenario is lost. Set to 12 to give the player
            # a limited window to execute the interception.
            [variable]
                name=sw_turn_limit
                operation=assign
                value=12
            [/variable]
        [/command]
    [/event]

    # --- Core interaction: Escort reaches the interception point ---
    # When the player's escort unit moves to the interception hex (x=5,y=3),
    # the Imperial interceptor engages. In Wesnoth, the moveto event fires
    # only if the moving unit survived combat at that hex, so the escort's
    # survival here directly determines the outcome:
    #   - Escort survived → VICTORY (interception successful)
    #   - Escort destroyed → the die event fires instead, resulting in DEFEAT
    [event]
        name=moveto
        [filter]
            side=1
            id=sw_escort_unit
        [/filter]
        [filter_location]
            x=5
            y=3
        [/filter_location]
        [variable]
            name=sw_interception_complete
            operation=assign
            value=yes
        [/variable]
        [message]
            speaker=sw_escort_unit
            message=_"Starwing holding at the interception point. Our screen seals the corridor before the Imperial squadron can break through."
        [/message]
        [message]
            speaker=sw_leader
            message=_"Interception confirmed. Keep the escorted craft intact; its survival secures the New Republic withdrawal."
        [/message]
        [endlevel]
            result=victory
            next_scenario=sw_03_ground_extraction
        [/endlevel]
    [/event]

    # --- Victory condition: Enemy leader defeated ---
    # Consistent with the first battle, eliminating the enemy commander
    # is an alternative path to victory.
    [event]
        name=die
        [filter]
            side=2
            canrecruit=yes
        [/filter]
        [endlevel]
            result=victory
            next_scenario=sw_03_ground_extraction
        [/endlevel]
    [/event]

    # --- Defeat condition: Player leader killed ---
    [event]
        name=die
        [filter]
            side=1
            canrecruit=yes
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    # --- Defeat condition: Imperial reinforcements reach extraction point (8,6).
    # If the enemy leader moves to the extraction hex, the mission is lost. ---
    [event]
        name=moveto
        [filter]
            side=2
            id=sw_enemy_leader
        [/filter]
        [filter_location]
            x=8
            y=6
        [/filter_location]
        [message]
            speaker=sw_enemy_leader
            message=_"The extraction point is under Imperial control. The New Republic screen has failed."
        [/message]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    # --- Turn limit: Imperial reinforcements arrive after sw_turn_limit turns.
    # The [turn] event fires at the start of the specified turn,
    # resulting in defeat if the interception has not yet succeeded. ---
    [event]
        name=turn
        turn=12
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    # --- Escort destroyed: Defeat if the escort unit dies before reaching
    # the interception point. This is a separate die event because the
    # moveto event above only fires if the escort reaches the hex;
    # if the escort is destroyed en route, this event handles it. ---
    [event]
        name=die
        [filter]
            side=1
            id=sw_escort_unit
        [/filter]
        [variable]
            name=sw_escort_alive
            operation=assign
            value=no
        [/variable]
        [message]
            speaker=sw_leader
            message=_"The escorted Starwing has been lost. Without it, the screen cannot hold the extraction corridor."
        [/message]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]
