#textdomain wesnoth-Star_Wars_Thrawn_Trilogy
# Bounded playable scenario skeleton — First Battle

[scenario]
    id=01_First_Battle
    name=_"First Battle"
    # A compact perimeter: woods and hills provide cover, while the open
    # central lane lets each fixed squad contest the Imperial approach.
    map_data="Gg^Fp,Gg^Fp,Gg,Gg,Ch,Kh,Ch,Gg,Gg,Gg,Gg^Fp,Gg^Fp
Gg^Fp,Gg,Gg,Gg,Ch,Ch,Ch,Gg,Gg,Gg,Gg,Gg^Fp
Gg,Gg,Gg^Fp,Gg,Gg,Gg,Gg,Gg,Gg,Gg^Fp,Gg,Gg
Gg,Gg,Gg,Gg,Ch,Gg,Gg,Ch,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Ch,Gg,Gg,Ch,Gg,Gg,Gg,Gg
Gg,Gg,Gg^Fp,Gg,Gg,Gg,Gg,Gg,Gg,Gg^Fp,Gg,Gg
Gg^Fp,Gg,Gg,Gg,Ch,Ch,Ch,Gg,Gg,Gg,Gg,Gg^Fp
Gg^Fp,Gg^Fp,Gg,Gg,Ch,Kh,Ch,Gg,Gg,Gg,Gg^Fp,Gg^Fp"
    victory_when_enemies_defeated=yes
    turns=20

    [side]
        side=1
        controller=human
        team_name=new_republic
        user_team_name=_"New Republic"
        type=sw_unit_nr_hero_commander
        id=leader1
        name=_"New Republic Commander"
        x=3
        y=5
        leader=yes
        canrecruit=yes
        gold=0

        # Fixed defenders give the player a small combined-arms perimeter.
        [unit]
            type=sw_unit_nr_perimeter_guard_squad
            id=sw_nr_perimeter_guard
            name=_"Perimeter Guard Squad"
            x=4
            y=4
        [/unit]
        [unit]
            type=sw_unit_nr_recon_squad
            id=sw_nr_recon_squad
            name=_"Recon Squad"
            x=3
            y=6
        [/unit]
        [unit]
            type=sw_unit_nr_rifle_squad
            id=sw_nr_rifle_squad
            name=_"Rifle Squad"
            x=2
            y=5
        [/unit]

    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial_remnant
        user_team_name=_"Imperial Remnant"
        type=sw_unit_im_rem_stormtrooper
        id=leader2
        name=_"Imperial Remnant Captain"
        x=10
        y=6
        leader=yes
        canrecruit=yes
        gold=0

        # The Remnant mirrors the defender count but attacks from open ground.
        [unit]
            type=sw_unit_im_rem_stormtrooper
            id=sw_im_assault_squad
            name=_"Imperial Assault Squad"
            x=9
            y=5
        [/unit]
        [unit]
            type=sw_unit_im_recon_squad
            id=sw_im_recon_squad
            name=_"Imperial Recon Squad"
            x=9
            y=7
        [/unit]
    [/side]

    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                description=_"Eliminate the Imperial Remnant Captain"
                condition=win
            [/objective]
            [objective]
                description=_"Optional: move the Recon Squad to the eastern observation post (12,4) to secure sensor data"
                condition=win
            [/objective]
            [objective]
                description=_"Optional: destroy the Imperial Remnant Signal Jammer Team"
                condition=win
            [/objective]
            [objective]
                description=_"Death of your leader"
                condition=lose
            [/objective]
            [objective]
                description=_"Turns run out (20 turns)"
                condition=lose
            [/objective]
            [note]
                description=_"New Republic forces: use forest and hill cover to hold the perimeter. Rifle Squad blaster rifles fire effectively at 2–4 hexes and cannot fire at adjacent targets; you have three air-support sorties for critical targets."
            [/note]
        [/objectives]
        # Variable lifecycle: sw_air_support_remaining tracks remaining
        # sortie charges. It is initialized at scenario start and decremented
        # by the air-support menu command only after a valid target is chosen.
        # Initialize sw_air_support_remaining to 3 at scenario start.
        # Decremented by the air support menu command.
        [set_variable]
            name=sw_air_support_remaining
            value=3
        [/set_variable]
        # This optional reconnaissance result persists only after the squad
        # reaches the eastern observation post during this battle.
        [set_variable]
            name=sw_first_battle_sensor_data
            value=no
        [/set_variable]
        # This optional electronic-warfare result changes only when the
        # specifically deployed Signal Jammer Team is defeated.
        [set_variable]
            name=sw_first_battle_jammer_destroyed
            value=no
        [/set_variable]

        # A menu item is used instead of a unit [ability] command: menu commands
        # are valid event actions and receive the clicked hex through $x1/$y1.
        [set_menu_item]
            id=sw_air_support_sortie
            description= _ "Call Air Support Sortie"
            [show_if]
                [variable]
                    name=sw_air_support_remaining
                    greater_than=0
                [/variable]
            [/show_if]
            [filter_location]
                [filter]
                    side=2
                [/filter]
            [/filter_location]
            [command]
                [set_variable]
                    name=sw_air_support_remaining
                    add=-1
                [/set_variable]
                [harm_unit]
                    [filter]
                        x=$x1
                        y=$y1
                        side=2
                    [/filter]
                    amount=10
                    damage_type=impact
                    animate=yes
                [/harm_unit]
                [message]
                    speaker=narrator
                    message= _ "Air support sortie incoming! Orbital strike locked on target."
                [/message]
            [/command]
        [/set_menu_item]
    [/event]

    [event]
        id=sw_first_battle_eastern_observation
        name=moveto
        first_time_only=yes
        [filter]
            id=sw_nr_recon_squad
        [/filter]
        [filter_location]
            x=12
            y=4
        [/filter_location]
        [set_variable]
            name=sw_first_battle_sensor_data
            value=yes
        [/set_variable]
        [message]
            speaker=sw_nr_recon_squad
            message= _ "Eastern observation post secured. We have a clear sensor sweep of the Imperial Remnant approach."
        [/message]
        [message]
            speaker=leader1
            message= _ "Transmit the readings to the New Republic command net. That intelligence may guide the next engagement."
        [/message]
    [/event]

    [event]
        name=start
        [message]
            speaker=leader1
            message= _ "New Republic perimeter, hold the forest and hills. Keep the Remnant captain in sight and let your blasters work from range."
        [/message]
        [message]
            speaker=leader2
            message= _ "Imperial Remnant forces, break their line before their air-support sorties can turn this field against us."
        [/message]
    [/event]

    # One-shot electronic-warfare deployment on the eastern approach.
    [event]
        id=sw_first_battle_signal_jammer_deployment
        name=turn
        turn=2
        first_time_only=yes
        [unit]
            side=2
            type=sw_unit_im_signal_jammer_team
            id=sw_first_battle_signal_jammer_team
            name= _ "Imperial Remnant Signal Jammer Team"
            x=12
            y=6
        [/unit]
        [message]
            speaker=narrator
            message= _ "A Signal Jammer Team arrives on the eastern approach, flooding the New Republic perimeter with interference."
        [/message]
    [/event]

    # The ID filter prevents other Imperial casualties from completing this
    # optional objective. The variable is retained for later scenario use.
    [event]
        id=sw_first_battle_signal_jammer_destroyed
        name=die
        first_time_only=yes
        [filter]
            id=sw_first_battle_signal_jammer_team
        [/filter]
        [set_variable]
            name=sw_first_battle_jammer_destroyed
            value=yes
        [/set_variable]
        [message]
            speaker=narrator
            message= _ "The jammer's carrier wave falls silent. New Republic sensors can read the eastern approach again."
        [/message]
    [/event]

    # This one-shot arrival pressures the perimeter after the opening turns.
    [event]
        id=sw_imperial_remnant_reinforcements
        name=turn
        turn=4
        first_time_only=yes
        [unit]
            side=2
            type=sw_unit_im_rem_stormtrooper
            id=sw_im_reinforcement_stormtrooper
            name= _ "Imperial Reinforcement Squad"
            x=12
            y=5
        [/unit]
        [message]
            speaker=narrator
            message= _ "Imperial Remnant reinforcements have reached the eastern approach!"
        [/message]
    [/event]

    [event]
        id=sw_first_battle_jammer_debrief
        name=die
        [filter]
            side=2
            canrecruit=yes
        [/filter]
        [message]
            speaker=leader1
            message= _ "The Imperial Remnant captain is down. The perimeter holds; prepare for the next contact."
        [/message]
        # Debrief the optional jammer result before it carries into Mission 2.
        [if]
            [variable]
                name=sw_first_battle_jammer_destroyed
                equals=yes
            [/variable]
            [then]
                [message]
                    speaker=leader1
                    message= _ "With the Imperial jammer silenced, the Starwing crews can launch with a clean sensor picture."
                [/message]
            [/then]
        [/if]
        # Preserve the optional reconnaissance outcome for the next scenario.
        [if]
            [have_unit]
                id=sw_nr_recon_squad
            [/have_unit]
            [then]
                [set_variable]
                    name=sw_first_battle_recon_survived
                    value=yes
                [/set_variable]
            [/then]
        [/if]
        [endlevel]
            result=victory
            next_scenario=sw_02_space_interception
        [/endlevel]
    [/event]

    [event]
        name=die
        [filter]
            side=1
            canrecruit=yes
        [/filter]
        [message]
            speaker=narrator
            message= _ "The New Republic commander has fallen, and the perimeter collapses."
        [/message]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        id=sw_first_battle_time_over
        name=time over
        first_time_only=yes
        [message]
            speaker=narrator
            message= _ "The engagement has run too long. Imperial Remnant reinforcements overrun the New Republic perimeter."
        [/message]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]
