#textdomain wesnoth-Star_Wars_Thrawn_Trilogy
# Bounded playable scenario skeleton — First Battle

[scenario]
    id=01_First_Battle
    name=_"First Battle"
    map_data="Kh,Ch,Gg,Gg,Gg,Gg
Gg,Gg^Fp,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg^Fp,Gg
Gg,Gg,Gg,Gg,Ch,Kh"
    victory_when_enemies_defeated=yes

    [side]
        side=1
        controller=human
        team_name=player
        user_team_name=_"Player"
        type=Thrawn_Phalanx
        id=leader1
        name=_"Player Leader"
        x=1
        y=1
        leader=yes
        canrecruit=yes
        gold=100
        recruit=Thrawn_Phalanx

    [/side]

    [side]
        side=2
        controller=ai
        team_name=enemy
        user_team_name=_"Enemy"
        type=Thrawn_Phalanx
        id=leader2
        name=_"Enemy Leader"
        x=6
        y=6
        leader=yes
        canrecruit=yes
        gold=100
        recruit=Thrawn_Phalanx
    [/side]

    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                description=_"Defeat the enemy leader"
                condition=win
            [/objective]
            [objective]
                description=_"Death of your leader"
                condition=lose
            [/objective]
            [objective]
                description=_"Turns run out"
                condition=lose
            [/objective]
        [/objectives]
        # Variable lifecycle: sw_air_support_remaining tracks remaining
        # sortie charges. It is initialized at scenario start and decremented
        # by the air-support menu command only after a valid target is chosen.
        # Initialize sw_air_support_remaining to 3 at scenario start.
        # Decremented by the air support menu command.
        [set_variable]
            name=sw_air_support_remaining
            value=3
        [/set_variable]

        # A menu item is used instead of a unit [ability] command: menu commands
        # are valid event actions and receive the clicked hex through $x1/$y1.
        [set_menu_item]
            id=sw_air_support_sortie
            description= _ "Call Air Support Sortie"
            [show_if]
                [variable]
                    name=sw_air_support_remaining
                    greater_than=0
                [/variable]
            [/show_if]
            [filter_location]
                [filter]
                    side=2
                [/filter]
            [/filter_location]
            [command]
                [set_variable]
                    name=sw_air_support_remaining
                    add=-1
                [/set_variable]
                [harm_unit]
                    [filter]
                        x=$x1
                        y=$y1
                        side=2
                    [/filter]
                    amount=10
                    damage_type=impact
                    animate=yes
                [/harm_unit]
                [message]
                    speaker=narrator
                    message= _ "Air support sortie incoming! Orbital strike locked on target."
                [/message]
            [/command]
        [/set_menu_item]
    [/event]

    [event]
        name=die
        [filter]
            side=2
            canrecruit=yes
        [/filter]
        [endlevel]
            result=victory
            next_scenario=sw_02_space_interception
        [/endlevel]
    [/event]

    [event]
        name=die
        [filter]
            side=1
            canrecruit=yes
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=turn
        turn=20
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]
