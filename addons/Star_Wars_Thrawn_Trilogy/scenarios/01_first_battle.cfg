#textdomain wesnoth-Star_Wars_Thrawn_Trilogy
# Bounded playable scenario skeleton — First Battle

[scenario]
    id=01_First_Battle
    name=_"First Battle"
    map_data="Kh,Ch,Gg,Gg,Gg,Gg
Gg,Ff,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Ff,Gg
Gg,Gg,Gg,Gg,Ch,Kh"
    victory_when_enemies_defeated=yes

    [side]
        side=1
        controller=human
        team_name=player
        user_team_name=_"Player"
        type=Thrawn_Phalanx
        id=leader1
        name=_"Player Leader"
        x=1
        y=1
        leader=yes
        canrecruit=yes
        gold=100
        recruit=Thrawn_Phalanx

        # sw_air_support_sortie: Off-map orbital bombardment sortie.
        # Activated by clicking an enemy hex with the leader selected.
        # Variable lifecycle: sw_air_support_remaining is initialized in
        # the prestart event and decremented each time the ability fires.
        # The ability is bounded to enemy-unit targets only.
        [abilities]
            [ability]
                id=sw_air_support_sortie
                name=_"Call Air Support Sortie"
                description=_"Request an off-map orbital strike on an enemy position. Costs one charge from your limited sortie quota."
                [filter]
                    [filter_location]
                        # Only enemy units at the clicked location are valid targets.
                        [filter_unit]
                            side=2
                        [/filter_unit]
                    [/filter_location]
                [/filter]
                [command]
                    # Check whether charges remain before firing.
                    [if]
                        [variable]
                            name=sw_air_support_remaining
                            comparison=greater_than
                            value=0
                        [/variable]
                        [then]
                            # Deduct one sortie charge. Variable starts at 3
                            # and decreases each successful activation.
                            [variable]
                                name=sw_air_support_remaining
                                operation=subtract
                                value=1
                            [/variable]
                            [message]_Air support sortie incoming! Orbital strike locked on target._[/message]
                            [damage]
                                [filter]
                                    [filter_side]
                                        side=2
                                    [/filter_side]
                                [/filter]
                                amount=10
                                type=impact
                            [/damage]
                        [/then]
                        [else]
                            # No charges remain — reject the sortie request.
                            [message]_All air support charges expended. Request denied._[/message]
                        [/else]
                    [/if]
                [/command]
            [/ability]
        [/abilities]
    [/side]

    [side]
        side=2
        controller=ai
        team_name=enemy
        user_team_name=_"Enemy"
        type=Thrawn_Phalanx
        id=leader2
        name=_"Enemy Leader"
        x=6
        y=6
        leader=yes
        canrecruit=yes
        gold=100
        recruit=Thrawn_Phalanx
    [/side]

    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                description=_"Defeat the enemy leader"
                condition=win
            [/objective]
            [objective]
                description=_"Death of your leader"
                condition=lose
            [/objective]
            [objective]
                description=_"Turns run out"
                condition=lose
            [/objective]
            [objective]
                description=_"Use up all 3 air support sortie charges"
                condition=win
            [/objective]
        [/objectives]
        # Variable lifecycle: sw_air_support_remaining tracks remaining
        # sortie charges. Initialized to 3 at scenario start, decremented
        # by the air support sortie ability command. Zero charges block
        # further activation (handled by the ability's [if]/[else] block).
        [command]
            # Initialize sw_air_support_remaining to 3 at scenario start.
            # Decremented by the air support sortie ability [command] block.
            [variable]
                name=sw_air_support_remaining
                operation=assign
                value=3
            [/variable]
        [/command]
    [/event]

    [event]
        name=die
        [filter]
            side=2
            canrecruit=yes
        [/filter]
        [endlevel]
            result=victory
            next_scenario=02_space_interception
        [/endlevel]
    [/event]

    [event]
        name=die
        [filter]
            side=1
            canrecruit=yes
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=turn
        turn=20
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]
