#textdomain wesnoth-Star_Wars_Thrawn_Trilogy
# Small playable scenario skeleton

[scenario]
    id=01_First_Battle
    name=_"First Battle"
    map_data="Kh,Ch,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Ch,Kh"
    victory_when_enemies_defeated=yes
    turns=20

    [side]
        side=1
        controller=human
        team_name=player
        user_team_name=_"Player"
        type=Spearman
        id=leader1
        name=_"Player Leader"
        x=1
        y=1
        canrecruit=yes
        gold=100
        recruit=Spearman
    [/side]

    [side]
        side=2
        controller=ai
        team_name=enemy
        user_team_name=_"Enemy"
        type=Spearman
        id=leader2
        name=_"Enemy Leader"
        x=6
        y=6
        canrecruit=yes
        gold=100
        recruit=Spearman
    [/side]

    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                description=_"Defeat the enemy leader"
                condition=win
            [/objective]
            [objective]
                description= _"Death of your leader"
                condition=lose
            [/objective]
            [objective]
                description= _"Turns run out"
                condition=lose
            [/objective]
        [/objectives]
    [/event]
    [event]
        name=die
        [filter]
            side=2
            canrecruit=yes
        [/filter]
        [endlevel]
            result=victory
        [/endlevel]
    [/event]
    [event]
        name=die
        [filter]
            side=1
            canrecruit=yes
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
    [event]
        name=turn
        turn=20
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]
