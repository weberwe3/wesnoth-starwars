#textdomain wesnoth-Star_Wars_Thrawn_Trilogy
# Bounded playable scenario skeleton — First Battle

[scenario]
    id=01_First_Battle
    name=_"First Battle"
    # The staged archive perimeter keeps terrain layout separate from mission
    # logic. Western cover faces several open firing lanes to the east.
    map_data="{~add-ons/Star_Wars_Thrawn_Trilogy/maps/01_first_battle.map}"
    # Mission victory is staged explicitly: defeating the Captain alone must
    # not bypass returning the recovered archive records to command.
    victory_when_enemies_defeated=no
    turns=20

    [side]
        side=1
        controller=human
        team_name=new_republic
        user_team_name=_"New Republic"
        type=sw_unit_nr_hero_commander
        id=leader1
        name=_"New Republic Commander"
        x=3
        y=6
        leader=yes
        canrecruit=yes
        gold=0

        # Fixed defenders give the player a small combined-arms perimeter.
        [unit]
            type=sw_unit_nr_perimeter_guard_squad
            id=sw_nr_perimeter_guard
            name=_"Perimeter Guard Squad"
            x=4
            y=5
        [/unit]
        [unit]
            type=sw_unit_nr_recon_squad
            id=sw_nr_recon_squad
            name=_"Recon Squad"
            x=3
            y=7
        [/unit]
        [unit]
            type=sw_unit_nr_rifle_squad
            id=sw_nr_rifle_squad
            name=_"Rifle Squad"
            x=2
            y=6
        [/unit]
        [unit]
            type=sw_unit_nr_heavy_weapons_squad
            id=sw_nr_heavy_weapons_squad
            name=_"New Republic Heavy Weapons Squad"
            x=6
            y=6
        [/unit]
        [unit]
            type=sw_unit_nr_field_engineer_team
            id=sw_nr_field_engineer_team
            name=_"New Republic Field Engineer Team"
            x=4
            y=7
        [/unit]

    [/side]

    [side]
        side=2
        controller=ai
        team_name=imperial_remnant
        user_team_name=_"Imperial Remnant"
        type=sw_unit_im_rem_stormtrooper
        id=leader2
        name=_"Imperial Remnant Captain"
        x=13
        y=7
        leader=yes
        canrecruit=yes
        gold=0

        # The Remnant mirrors the defender count but attacks from open ground.
        [unit]
            type=sw_unit_im_rem_stormtrooper
            id=sw_im_assault_squad
            name=_"Imperial Assault Squad"
            x=12
            y=6
        [/unit]
        [unit]
            type=sw_unit_im_recon_squad
            id=sw_im_recon_squad
            name=_"Imperial Recon Squad"
            x=12
            y=8
        [/unit]
        [unit]
            type=sw_unit_im_rem_stormtrooper
            id=sw_first_battle_archive_security
            name=_"Imperial Remnant Archive-Security Squad"
            x=14
            y=4
        [/unit]
    [/side]

    [event]
        id=sw_first_battle_air_support_configuration
        name=prestart
        [objectives]
            side=1
            [objective]
                description=_"Recover the Obroa-skai archive records with the Recon Squad at (15,4)"
                condition=win
            [/objective]
            [objective]
                description=_"Return the archive records to the New Republic command position at (3,7)"
                condition=win
            [/objective]
            [objective]
                description=_"Eliminate the Imperial Remnant Captain"
                condition=win
            [/objective]
            [objective]
                description=_"Optional: destroy the Imperial Remnant Signal Jammer Team"
                condition=win
            [/objective]
            [objective]
                description=_"Optional: move the Recon Squad to the eastern observation post at (15,2) to collect sensor data"
                condition=win
            [/objective]
            [objective]
                description=_"Death of your leader"
                condition=lose
            [/objective]
            [objective]
                description=_"Turns run out (20 turns)"
                condition=lose
            [/objective]
            [note]
                description=_"Tactical guidance: anchor the Heavy Weapons Squad on the long firing lane, while the Field Engineer Team protects the command position."
            [/note]
            [note]
                description=_"Securing the archive records provokes an Imperial Remnant counterattack."
            [/note]
            [note]
                description=_"New Republic forces: use forest and hill cover to hold the perimeter. Anchor the Heavy Weapons Squad on the long firing lane, while the Field Engineer Team protects the command position. Native forest defense reduces the Rifle Squad's chance of being hit compared with open ground. Rifle Squad blaster rifles fire effectively at 2–4 hexes and cannot fire at adjacent targets. Select an occupied Imperial Remnant hex to spend one of your three air-support sorties; a valid strike damages only the clicked enemy unit for exactly 10 impact damage and reports the remaining sortie count."
            [/note]
            [note]
                description=_"Securing the archive records provokes an Imperial counterattack from the east."
            [/note]
        [/objectives]
        # Variable lifecycle: sw_air_support_remaining tracks remaining
        # sortie charges. It is initialized at scenario start and decremented
        # by the air-support menu command only after a valid target is chosen.
        # Initialize sw_air_support_remaining to 3 at scenario start.
        # Decremented by the air support menu command.
        [set_variable]
            name=sw_air_support_remaining
            value=3
        [/set_variable]
        # This optional reconnaissance result persists only after the squad
        # reaches the eastern observation post during this battle.
        [set_variable]
            name=sw_first_battle_sensor_data
            value=no
        [/set_variable]
        # Archive-record recovery is a required two-stage state: acquisition
        # at the eastern access point, then delivery to the command position.
        [set_variable]
            name=sw_first_battle_archive_records_acquired
            value=no
        [/set_variable]
        [set_variable]
            name=sw_first_battle_archive_records_delivered
            value=no
        [/set_variable]
        [set_variable]
            name=sw_first_battle_captain_defeated
            value=no
        [/set_variable]
        # This optional electronic-warfare result changes only when the
        # specifically deployed Signal Jammer Team is defeated.
        [set_variable]
            name=sw_first_battle_jammer_destroyed
            value=no
        [/set_variable]

        # A menu item is used instead of a unit [ability] command: menu commands
        # are valid event actions and receive the clicked hex through $x1/$y1.
        [set_menu_item]
            id=sw_air_support_sortie
            description= _ "Call Air Support Sortie (select an occupied Imperial Remnant hex; spends 1 sortie and deals exactly 10 impact damage)"
            [show_if]
                [and]
                    [variable]
                        name=sw_air_support_remaining
                        greater_than=0
                    [/variable]
                    [not]
                        [have_unit]
                            id=sw_first_battle_signal_jammer_team
                        [/have_unit]
                    [/not]
                [/and]
            [/show_if]
            [filter_location]
                [filter]
                    side=2
                [/filter]
            [/filter_location]
            [command]
                [set_variable]
                    name=sw_air_support_remaining
                    add=-1
                [/set_variable]
                [harm_unit]
                    [filter]
                        x=$x1
                        y=$y1
                        side=2
                    [/filter]
                    amount=10
                    damage_type=impact
                    animate=yes
                [/harm_unit]
                [message]
                    speaker=narrator
                    message= _ "Air support strike hits only the selected Imperial Remnant unit for exactly 10 impact damage. One sortie spent; remaining sorties: $sw_air_support_remaining."
                [/message]
            [/command]
        [/set_menu_item]
    [/event]

    # Record the staged map setup for gameplay-contract validation and later UI.
    [event]
        id=sw_first_battle_obroa_skai_map_setup
        name=prestart
        [set_variable]
            name=sw_first_battle_obroa_skai_map_setup
            value=yes
        [/set_variable]
    [/event]

    # Mark the Rifle Squad's forest hex as its covered firing position. The
    # terrain supplies native defense; this explicit scenario state preserves
    # the intended position for deterministic gameplay contracts and later UI.
    [event]
        id=sw_first_battle_rifle_cover_position
        name=prestart
        [set_variable]
            name=sw_first_battle_rifle_cover_position
            value=yes
        [/set_variable]
        [set_variable]
            name=sw_first_battle_rifle_cover_x
            value=2
        [/set_variable]
        [set_variable]
            name=sw_first_battle_rifle_cover_y
            value=6
        [/set_variable]
    [/event]

    [event]
        id=sw_first_battle_eastern_observation
        name=moveto
        first_time_only=yes
        [filter]
            id=sw_nr_recon_squad
        [/filter]
        [filter_location]
            x=15
            y=2
        [/filter_location]
        [set_variable]
            name=sw_first_battle_sensor_data
            value=yes
        [/set_variable]
        [set_variable]
            name=sw_air_support_remaining
            add=1
        [/set_variable]
        [message]
            speaker=sw_nr_recon_squad
            message= _ "Archive access is open. I have a sensor sweep of the Imperial Remnant approach."
        [/message]
        [message]
            speaker=sw_nr_recon_squad
            message= _ "The sweep has marked a clear approach lane. New Republic air support has one additional sortie available."
        [/message]
        [message]
            speaker=leader1
            message= _ "Secure the archive records and bring them back to command. Their route data may expose the Remnant's next move."
        [/message]
    [/event]

    # Archive acquisition is a separate mission state from the optional
    # observation result above. Keeping the states in distinct events makes
    # the acquisition contract explicit while preserving the same objective
    # location and one-shot behavior.
    [event]
        id=sw_first_battle_archive_records_acquisition
        name=moveto
        first_time_only=yes
        [filter]
            id=sw_nr_recon_squad
        [/filter]
        [filter_location]
            x=15
            y=4
        [/filter_location]
        [set_variable]
            name=sw_first_battle_archive_records_acquired
            value=yes
        [/set_variable]
        [message]
            speaker=sw_nr_recon_squad
            message= _ "The Obroa-skai archive records are secured. I am bringing them back to New Republic command."
        [/message]
    [/event]

    # The archive alarm deploys one reserve to close the immediate exit route.
    [event]
        id=sw_first_battle_archive_alarm_reserve
        name=moveto
        first_time_only=yes
        [filter]
            id=sw_nr_recon_squad
        [/filter]
        [filter_location]
            x=15
            y=4
        [/filter_location]
        [unit]
            side=2
            type=sw_unit_im_rem_stormtrooper
            id=sw_first_battle_archive_alarm_reserve
            x=16
            y=3
        [/unit]
        [message]
            speaker=sw_first_battle_archive_alarm_reserve
            message= _ "Archive alarm transmitted. Seal the route before those records reach New Republic command."
        [/message]
    [/event]

    # Archive acquisition provokes one immediate Imperial pursuit deployment.
    # first_time_only keeps this response tied to the initial record recovery.
    [event]
        id=sw_first_battle_archive_pursuit
        name=moveto
        first_time_only=yes
        [filter]
            id=sw_nr_recon_squad
        [/filter]
        [filter_location]
            x=15
            y=4
        [/filter_location]
        [filter_condition]
            [variable]
                name=sw_first_battle_archive_records_acquired
                equals=yes
            [/variable]
        [/filter_condition]
        [unit]
            side=2
            type=sw_unit_im_rem_stormtrooper
            id=sw_archive_pursuit_stormtrooper
            x=16
            y=5
        [/unit]
        [message]
            speaker=sw_archive_pursuit_stormtrooper
            message=_"Remnant pursuit inbound. You will not carry those records out of here."
        [/message]
    [/event]

    # Securing the archive records also triggers a one-shot roadblock on the
    # return route. The acquisition condition keeps this deployment tied to
    # the Recon Squad's successful recovery rather than an early visit.
    [event]
        id=sw_first_battle_archive_return_roadblock
        name=moveto
        first_time_only=yes
        [filter]
            id=sw_nr_recon_squad
        [/filter]
        [filter_location]
            x=15
            y=4
        [/filter_location]
        [filter_condition]
            [variable]
                name=sw_first_battle_archive_records_acquired
                equals=yes
            [/variable]
        [/filter_condition]
        [unit]
            side=2
            type=sw_unit_im_rem_stormtrooper
            id=sw_archive_return_roadblock
            x=10
            y=5
        [/unit]
        [message]
            speaker=sw_archive_return_roadblock
            message= _ "An Imperial Remnant roadblock seals the archive route. The records will not leave this outpost."
        [/message]
    [/event]

    # The records become mission-complete only after the same Recon Squad
    # returns them to the protected command position.
    [event]
        id=sw_first_battle_archive_records_delivery
        name=moveto
        # This remains active until acquisition, so an early return to command
        # cannot consume the delivery trigger before the records are carried.
        first_time_only=no
        [filter]
            id=sw_nr_recon_squad
        [/filter]
        [filter_location]
            x=3
            y=7
        [/filter_location]
        [if]
            [variable]
                name=sw_first_battle_archive_records_acquired
                equals=yes
            [/variable]
            [then]
                [set_variable]
                    name=sw_first_battle_archive_records_delivered
                    value=yes
                [/set_variable]
                [message]
                    speaker=leader1
                    message= _ "Records received. New Republic command can turn this archive trail into a warning for the fleet."
                [/message]
                [if]
                    [variable]
                        name=sw_first_battle_captain_defeated
                        equals=yes
                    [/variable]
                    [then]
                        [endlevel]
                            result=victory
                            next_scenario=sw_02_space_interception
                        [/endlevel]
                    [/then]
                [/if]
            [/then]
        [/if]
    [/event]

    # Losing the Recon Squad before delivery ends the archive-recovery
    # operation; this one-shot defeat does not alter the normal victory path.
    [event]
        id=sw_first_battle_recon_squad_lost
        name=die
        first_time_only=yes
        [filter]
            id=sw_nr_recon_squad
        [/filter]
        [filter_condition]
            [not]
                [variable]
                    name=sw_first_battle_archive_records_delivered
                    equals=yes
                [/variable]
            [/not]
        [/filter_condition]
        [message]
            speaker=narrator
            message= _ "The Recon Squad is lost. The archive-recovery operation cannot continue."
        [/message]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        id=sw_first_battle_mission_briefing
        name=start
        [message]
            speaker=leader1
            message= _ "Recon Squad, recover the records at (15,4), return them to command at (3,7), and eliminate the Imperial Remnant Captain."
        [/message]
        [message]
            speaker=leader1
            message= _ "New Republic perimeter, hold the forest and hills. The Rifle Squad's blaster rifles are effective at 2–4 hexes, but cannot fire at an adjacent target; keep the Remnant captain in sight and let your blasters work from range."
        [/message]
        [message]
            speaker=leader2
            message= _ "Imperial Remnant forces, break their line before their air-support sorties can turn this field against us."
        [/message]
    [/event]

    # One-shot electronic-warfare deployment on the eastern approach.
    [event]
        id=sw_first_battle_signal_jammer_deployment
        name=turn
        turn=2
        first_time_only=yes
        [unit]
            side=2
            type=sw_unit_im_signal_jammer_team
            id=sw_first_battle_signal_jammer_team
            name= _ "Imperial Remnant Signal Jammer Team"
            x=16
            y=7
        [/unit]
        [message]
            speaker=narrator
            message= _ "A Signal Jammer Team arrives on the eastern approach, flooding the New Republic perimeter with interference."
        [/message]
        [message]
            speaker=narrator
            message= _ "Warning: the Signal Jammer Team is disrupting sortie coordination. Air support remains unavailable until this unit is destroyed."
        [/message]
    [/event]

    # The ID filter prevents other Imperial casualties from completing this
    # optional objective. The variable is retained for later scenario use.
    [event]
        id=sw_first_battle_signal_jammer_destroyed
        name=die
        first_time_only=yes
        [filter]
            id=sw_first_battle_signal_jammer_team
        [/filter]
        [set_variable]
            name=sw_first_battle_jammer_destroyed
            value=yes
        [/set_variable]
        [message]
            speaker=narrator
            message= _ "The jammer's carrier wave falls silent. New Republic sensors can read the eastern approach again."
        [/message]
    [/event]

    # This one-shot arrival pressures the perimeter after the opening turns.
    [event]
        id=sw_imperial_remnant_reinforcements
        name=turn
        turn=4
        first_time_only=yes
        [unit]
            side=2
            type=sw_unit_im_rem_stormtrooper
            id=sw_im_reinforcement_stormtrooper
            name= _ "Imperial Reinforcement Squad"
            x=16
            y=6
        [/unit]
        [message]
            speaker=narrator
            message= _ "Imperial Remnant reinforcements have reached the eastern approach!"
        [/message]
    [/event]

    # A delayed patrol joins the search only if the archive records remain lost.
    [event]
        id=sw_first_battle_delayed_search_patrol
        name=turn
        turn=7
        first_time_only=yes
        [if]
            [variable]
                name=sw_first_battle_archive_records_acquired
                equals=no
            [/variable]
            [then]
                [unit]
                    side=2
                    type=sw_unit_im_recon_squad
                    id=sw_first_battle_delayed_search_patrol
                    name= _ "Imperial Remnant Search Patrol"
                    x=16
                    y=9
                [/unit]
                [message]
                    speaker=narrator
                    message= _ "An Imperial Remnant search patrol has joined the hunt for the missing archive records."
                [/message]
            [/then]
        [/if]
    [/event]

    [event]
        id=sw_first_battle_jammer_debrief
        name=die
        # The Captain's defeat is a single persistent prerequisite for
        # victory; do not re-enter this state transition if a die event is
        # emitted again while the delivery objective is still pending.
        first_time_only=yes
        [filter]
            id=leader2
            canrecruit=yes
        [/filter]
        [set_variable]
            name=sw_first_battle_captain_defeated
            value=yes
        [/set_variable]
        [message]
            speaker=leader1
            message= _ "The Imperial Remnant captain is down. The perimeter holds; prepare for the next contact."
        [/message]
        # Debrief the optional jammer result before it carries into Mission 2.
        [if]
            [variable]
                name=sw_first_battle_jammer_destroyed
                equals=yes
            [/variable]
            [then]
                [message]
                    speaker=leader1
                    message= _ "With the Imperial jammer silenced, the Starwing crews can launch with a clean sensor picture."
                [/message]
            [/then]
        [/if]
        # Preserve the optional reconnaissance outcome for the next scenario.
        [if]
            [have_unit]
                id=sw_nr_recon_squad
            [/have_unit]
            [then]
                [set_variable]
                    name=sw_first_battle_recon_survived
                    value=yes
                [/set_variable]
            [/then]
        [/if]
        [if]
            [variable]
                name=sw_first_battle_archive_records_delivered
                equals=yes
            [/variable]
            [then]
                [endlevel]
                    result=victory
                    next_scenario=sw_02_space_interception
                [/endlevel]
            [/then]
            [else]
                [message]
                    speaker=leader1
                    message= _ "The captain is down, but the archive records are still in the field. Recon Squad, return them to command."
                [/message]
            [/else]
        [/if]
    [/event]

    [event]
        name=die
        [filter]
            side=1
            canrecruit=yes
        [/filter]
        [message]
            speaker=narrator
            message= _ "The New Republic commander has fallen, and the perimeter collapses."
        [/message]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        id=sw_first_battle_time_over
        name=time over
        first_time_only=yes
        [message]
            speaker=narrator
            message= _ "The engagement has run too long. Imperial Remnant reinforcements overrun the New Republic perimeter."
        [/message]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]
