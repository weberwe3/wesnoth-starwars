#textdomain wesnoth-Star_Wars_Thrawn_Trilogy
# A compact single-hex infiltration mission against an Imperial listening post.

[scenario]
    id=sw_06_listening_post_infiltration
    name= _ "Listening Post Infiltration"
    map_data="Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg^Fp,Gg^Fp,Gg^Fp,Gg^Fp,Gg^Fp,Gg
Gg,Gg,Gg,Cc,Ch,Cc,Gg
Gg,Gg^Fp,Gg^Fp,Gg^Fp,Gg^Fp,Gg^Fp,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg"
    turns=8
    victory_when_enemies_defeated=no

    [label]
        x=5
        y=3
        text= _ "Listening Post Terminal"
    [/label]

    [side]
        side=1
        controller=human
        team_name=player
        user_team_name= _ "New Republic Recon Squad"
        type=sw_unit_nr_hero_commander
        id=sw_listening_post_leader
        name= _ "New Republic Commander"
        x=1
        y=3
        canrecruit=yes
        gold=0
        [unit]
            type=sw_unit_nr_recon_squad
            id=sw_listening_post_recon
            name= _ "New Republic Recon Squad"
            x=2
            y=3
            side=1
        [/unit]
    [/side]

    [side]
        side=2
        controller=ai
        team_name=enemy
        user_team_name= _ "Imperial Remnant Listening Post"
        type=Thrawn_Phalanx
        id=sw_listening_post_guard_leader
        name= _ "Listening Post Guard"
        x=6
        y=3
        canrecruit=yes
        gold=0
        [unit]
            type=Thrawn_Phalanx
            id=sw_listening_post_guard_one
            name= _ "Imperial Remnant Sentry"
            x=4
            y=3
            side=2
        [/unit]
    [/side]

    [event]
        name=prestart
        # This flag belongs only to this scenario and is set by the reusable terminal macro.
        [clear_variable]
            name=sw_listening_post_terminal_active
        [/clear_variable]
        [objectives]
            side=1
            [objective]
                description= _ "Move the New Republic Recon Squad onto the Listening Post Terminal"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of the New Republic Commander"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of the New Republic Recon Squad"
                condition=lose
            [/objective]
            [objective]
                description= _ "Turns run out"
                condition=lose
            [/objective]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_listening_post_leader
            message= _ "The relay raid opened a narrow window. Get our recon squad to that terminal and copy the Remnant's patrol schedules before they notice the intrusion."
        [/message]
    [/event]

    # The macro makes terminal activation one-time and records it before this
    # matching movement handler resolves the deterministic victory.
    {sw_one_time_moveto_event sw_listening_post_recon 5 3 sw_listening_post_terminal_active}

    [event]
        name=moveto
        [filter]
            id=sw_listening_post_recon
            x=5
            y=3
        [/filter]
        [if]
            [variable]
                name=sw_listening_post_terminal_active
                numerical_equals=1
            [/variable]
            [then]
                [message]
                    speaker=sw_listening_post_recon
                    message= _ "Terminal access is ours. The patrol routes are copied; we can disappear before the Imperial Remnant seals the post."
                [/message]
                [endlevel]
                    result=victory
                [/endlevel]
            [/then]
        [/if]
    [/event]

    # The commander directs the operation, while the recon squad is required to use the terminal.
    [event]
        name=die
        [filter]
            id=sw_listening_post_leader,sw_listening_post_recon
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=time over
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]
