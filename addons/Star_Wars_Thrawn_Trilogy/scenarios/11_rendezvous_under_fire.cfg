#textdomain wesnoth-Star_Wars_Thrawn_Trilogy
# A single-hex transport must reach the fixed New Republic rendezvous point.

[scenario]
    id=sw_11_rendezvous_under_fire
    name= _ "Rendezvous Under Fire"
    map_data="Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg^Fp,Gg^Fp,Gg,Gg,Gg,Gg^Fp,Gg^Fp,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg^Fp,Gg,Gg,Gg,Gg,Gg,Gg^Fp,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg^Fp,Gg^Fp,Gg,Gg,Gg,Gg^Fp,Gg^Fp,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg"
    turns=11
    victory_when_enemies_defeated=no

    [label]
        x=10
        y=4
        text= _ "New Republic Rendezvous"
    [/label]

    # The named leader and cargo are ordinary, single-hex Wesnoth units.
    [side]
        side=1
        controller=human
        team_name=player
        user_team_name= _ "New Republic Rendezvous Force"
        type=sw_unit_nr_hero_commander
        id=sw_rendezvous_commander
        name= _ "New Republic Rendezvous Commander"
        x=1
        y=4
        canrecruit=yes
        gold=30
        recruit=Thrawn_Phalanx
        [unit]
            type=sw_unit_nr_evacuation_transport
            id=sw_rendezvous_transport
            name= _ "New Republic Evacuation Transport"
            x=2
            y=4
            side=1
        [/unit]
    [/side]

    [side]
        side=2
        controller=ai
        team_name=enemy
        user_team_name= _ "Imperial Remnant Interdiction Force"
        type=Thrawn_Phalanx
        id=sw_rendezvous_interdiction_leader
        name= _ "Imperial Remnant Interdiction Commander"
        x=9
        y=2
        canrecruit=yes
        gold=55
        recruit=Thrawn_Phalanx
        [unit]
            type=Thrawn_Phalanx
            id=sw_rendezvous_interdictor
            name= _ "Imperial Remnant Interdictor"
            x=7
            y=5
            side=2
        [/unit]
    [/side]

    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                description= _ "Escort the New Republic Evacuation Transport to the New Republic Rendezvous"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of the New Republic Rendezvous Commander"
                condition=lose
            [/objective]
            [objective]
                description= _ "Destruction of the New Republic Evacuation Transport"
                condition=lose
            [/objective]
            [objective]
                description= _ "Turns run out"
                condition=lose
            [/objective]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=sw_rendezvous_commander
            message= _ "The border crossing scattered our signal. Keep the transport moving; the rendezvous beacon is our only safe channel."
        [/message]
        [message]
            speaker=sw_rendezvous_interdiction_leader
            message= _ "Let the convoy see the beacon. Once it commits to the open ground, the Imperial Remnant will close the net."
        [/message]
    [/event]

    # Victory is deterministic: only this named transport entering this fixed hex ends the scenario.
    [event]
        name=moveto
        [filter]
            id=sw_rendezvous_transport
            x=10
            y=4
        [/filter]
        [message]
            speaker=sw_rendezvous_commander
            message= _ "Rendezvous confirmed. Get the passengers aboard the waiting column before the interdiction line reforms."
        [/message]
        [endlevel]
            result=victory
            next_scenario=sw_12_breakout_at_the_rendezvous
        [/endlevel]
    [/event]

    # The leader and transport are both explicit defeat conditions for this escort mission.
    [event]
        name=die
        [filter]
            id=sw_rendezvous_commander
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=die
        [filter]
            id=sw_rendezvous_transport
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=time over
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]
