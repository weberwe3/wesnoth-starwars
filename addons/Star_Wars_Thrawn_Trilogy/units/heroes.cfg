#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# One original, balanced New Republic hero unit.
# Uses native Wesnoth mechanics: leadership ability, standard attacks,
# and defense values. Image references match the Republic Commander asset set.
# Do not add campaign story prose; this is a roster unit definition only.

[unit_type]
    id=sw_unit_nr_hero_commander
    name=_"Republic Commander"
    description=_"A seasoned New Republic field commander whose tactical acumen and combat prowess make them a decisive presence on the battlefield. Trained in the era of the New Republic, they coordinate allied forces with precision and wield a dependable blaster sidearm in close quarters."
    undead=no
    race=human
    image=~add-ons/Star_Wars_Thrawn_Trilogy/images/units/sw-unit-nr-hero-commander/standing.png
    icon=~add-ons/Star_Wars_Thrawn_Trilogy/images/units/sw-unit-nr-hero-commander/standing.png
    profile=~add-ons/Star_Wars_Thrawn_Trilogy/images/portraits/sw-unit-nr-hero-commander.png
    hitpoints=56
    movement=1
    movement_type=foot
    level=1
    experience=0
    alignment=neutral
    cost=22
    usage=hero
    [standing_anim]
        [frame]
            image=~add-ons/Star_Wars_Thrawn_Trilogy/images/units/sw-unit-nr-hero-commander/standing.png
            duration=1000
        [/frame]
    [/standing_anim]
    [idle_anim]
        [frame]
            image=~add-ons/Star_Wars_Thrawn_Trilogy/images/units/sw-unit-nr-hero-commander/idle-1.png
            duration=250
        [/frame]
        [frame]
            image=~add-ons/Star_Wars_Thrawn_Trilogy/images/units/sw-unit-nr-hero-commander/idle-2.png
            duration=250
        [/frame]
    [/idle_anim]
    [movement_anim]
        [frame]
            image=~add-ons/Star_Wars_Thrawn_Trilogy/images/units/sw-unit-nr-hero-commander/move-1.png
            duration=150
        [/frame]
        [frame]
            image=~add-ons/Star_Wars_Thrawn_Trilogy/images/units/sw-unit-nr-hero-commander/move-2.png
            duration=150
        [/frame]
    [/movement_anim]
    [attack_anim]
        [filter_attack]
            name=blaster_pistol
        [/filter_attack]
        [frame]
            image=~add-ons/Star_Wars_Thrawn_Trilogy/images/units/sw-unit-nr-hero-commander/melee-1.png
            duration=150
        [/frame]
        [frame]
            image=~add-ons/Star_Wars_Thrawn_Trilogy/images/units/sw-unit-nr-hero-commander/melee-2.png
            duration=200
        [/frame]
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=blaster_rifle
        [/filter_attack]
        [frame]
            image=~add-ons/Star_Wars_Thrawn_Trilogy/images/units/sw-unit-nr-hero-commander/ranged-1.png
            duration=150
        [/frame]
        [frame]
            image=~add-ons/Star_Wars_Thrawn_Trilogy/images/units/sw-unit-nr-hero-commander/ranged-2.png
            duration=120
        [/frame]
    [/attack_anim]
    [defend]
        [frame]
            image=~add-ons/Star_Wars_Thrawn_Trilogy/images/units/sw-unit-nr-hero-commander/defend.png
            duration=200
        [/frame]
    [/defend]
    [death]
        [frame]
            image=~add-ons/Star_Wars_Thrawn_Trilogy/images/units/sw-unit-nr-hero-commander/death-1.png
            duration=200
        [/frame]
        [frame]
            image=~add-ons/Star_Wars_Thrawn_Trilogy/images/units/sw-unit-nr-hero-commander/death-2.png
            duration=500
        [/frame]
    [/death]
    [attack]
        name=blaster_pistol
        description=_"blaster pistol"
        type=impact
        range=melee
        damage=10
        number=2
    [/attack]
    [attack]
        name=blaster_rifle
        description=_"blaster rifle"
        type=impact
        range=ranged
        min_range=2
        max_range=4
        damage=7
        number=2
    [/attack]
    [defense]
        deep_water=60
        reef=60
        flat=70
        sand=70
        forest=80
        rough=80
        wall=90
        castle=90
        village=90
        unwalkable=100
        frost=70
        swamp=75
    [/defense]
    [defense]
        terrain=forest
        bonus=15
        description=_"Cover bonus from forest terrain: the Commander's tactical awareness provides additional protection among trees."
    [/defense]
    [defense]
        terrain=rough
        bonus=15
        description=_"Cover bonus from rough terrain: the Commander's boots and formations gain stability on uneven ground."
    [/defense]
    [abilities]
        [leadership]
            name=_"Leadership"
            description=_"The Commander's presence inspires nearby allied units, boosting their confidence and combat effectiveness. Adjacent friendly units gain a +10% damage increase."
        [/leadership]
    [/abilities]
[/unit_type]
