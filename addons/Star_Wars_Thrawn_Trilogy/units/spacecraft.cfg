#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Two spacecraft unit definitions for the Star Wars: Thrawn Trilogy add-on.
# Both are single-hex units with distinct combat roles:
# - New Republic escort craft: balanced support/escort flyer
# - Imperial Remnant interceptor squadron: fast aggressive striker
# Native Wesnoth mechanics: standard attacks and defense values.
# Image references match existing add-on placeholders.

[unit_type]
    id=sw_unit_nr_starwing_escape
    name=_"New Republic Starwing Escort"
    description=_"A nimble New Republic escort craft tasked with protecting convoys and capital ships. Armed with twin laser cannons and shielding technology, it weaves through danger zones to shield allied transports and engage enemy fighters before they reach their targets."
    undead=no
    race=human
    icon=~add-ons/Star_Wars_Thrawn_Trilogy/images/units/human/militiaman.png
    profile=~add-ons/Star_Wars_Thrawn_Trilogy/images/portraits/human/militiaman.png
    hitpoints=46
    movement=6
    movement_type=fly
    level=0
    experience=0
    alignment=neutral
    cost=17
    usage=fighter
    [attack]
        name=dual_laser_cannons
        description=_"dual laser cannons"
        type=impact
        range=ranged
        min_range=2
        max_range=5
        damage=8
        number=2
    [/attack]
    [attack]
        name=proton_torpedoes
        description=_"proton torpedoes"
        type=pierce
        range=ranged
        min_range=1
        max_range=3
        damage=14
        number=1
    [/attack]
    [defense]
        deep_water=60
        reef=60
        flat=70
        sand=70
        forest=80
        rough=80
        wall=90
        castle=90
        village=90
        unwalkable=100
        frost=70
        swamp=75
    [/defense]
    [defense]
        terrain=flat
        bonus=10
        description=_"Open terrain bonus: the Escort's agile thrusters perform best on open ground, maintaining maneuverability and clear firing lines."
    [/defense]
    [defense]
        terrain=rough
        bonus=10
        description=_"Rough terrain bonus: the Escort's repulsor lift absorbs shock on uneven terrain, maintaining stable weapon platforms."
    [/defense]
[/unit_type]

# Imperial Remnant interceptor squadron.
# Fast, aggressive striker with high speed and a concentrated burst attack
# designed to hit hard before the enemy can respond.
[unit_type]
    id=sw_unit_im_venator_interceptor
    name=_"Imperial Remnant Interceptor Squadron"
    description=_"A squadron of Imperial Remnant interceptors that spearhead hit-and-run strikes against enemy formations. Built for speed and devastating precision, these vessels dive into vulnerable targets with concentrated laser fire and rip them apart before reinforcements can arrive."
    undead=no
    race=human
    icon=~add-ons/Star_Wars_Thrawn_Trilogy/images/units/human/militiaman.png
    profile=~add-ons/Star_Wars_Thrawn_Trilogy/images/portraits/human/militiaman.png
    hitpoints=38
    movement=7
    movement_type=fly
    level=0
    experience=0
    alignment=enemy
    cost=15
    usage=skirmisher
    [attack]
        name=lightning_lasers
        description=_"lightning lasers"
        type=impact
        range=ranged
        min_range=1
        max_range=4
        damage=10
        number=2
    [/attack]
    [attack]
        name=ion_burst
        description=_"ion burst"
        type=impact
        range=ranged
        min_range=2
        max_range=5
        damage=6
        number=3
    [/attack]
    [defense]
        deep_water=60
        reef=60
        flat=70
        sand=70
        forest=80
        rough=80
        wall=90
        castle=90
        village=90
        unwalkable=100
        frost=70
        swamp=75
    [/defense]
    [defense]
        terrain=flat
        bonus=10
        description=_"Open terrain bonus: the Interceptor Squadron's speed allows it to exploit open terrain for flanking positions and clear shots."
    [/defense]
    [defense]
        terrain=frost
        bonus=10
        description=_"Frost terrain bonus: the Interceptors' reinforced hulls resist cold, maintaining engine performance in frozen conditions."
    [/defense]
[/unit_type]
