[unit_type]
    id=sw_hero_han
    name= _ "Smuggler General"
    race=human
    gender=male
    image=units/sw-hero-han/standing.png
    profile=portraits/sw-hero-han.png
    hitpoints=46
    movement_type=sw_infantry
    movement=6
    experience=100
    level=2
    alignment=neutral
    advances_to=null
    cost=40
    usage=fighter
    description= _ "Han Solo, captain of the Millennium Falcon and a general of the New Republic, is quicker on the draw than anyone he has met.

Rank abilities — Veteran: trick shot; Seasoned veteran: smuggler's nerve; Elite: fearless."
    {AMLA_DEFAULT}
    [advancement]
        id=sw_amla_hero_blaster
        strict_amla=yes
        max_times=2
        description= _ "DL-44 calibration (normal and aimed): +1 damage; full heal and cure, Max XP +20% (up to 2 times)"
        image="icons/crossed_sword_and_hammer.png"
        [effect]
            apply_to=attack
            name=heavy_blaster_pistol,heavy_blaster_pistol_aimed
            increase_damage=1
        [/effect]
        {AMLA_EFFECTS_HEAL_AND_RAISE_XP}
    [/advancement]
    [advancement]
        id=sw_amla_hero_mobility
        strict_amla=yes
        max_times=1
        description= _ "Blockade running: +1 movement, vision unchanged; full heal and cure, Max XP +20% (once)"
        image="icons/boots_elven.png"
        [effect]
            apply_to=movement
            increase=1
            apply_to_vision=no
        [/effect]
        {AMLA_EFFECTS_HEAL_AND_RAISE_XP}
    [/advancement]
    # Named character: scenarios place the single instance and keep
    # it out of recruit lists.
    do_not_list=yes
    [abilities]
        {ABILITY_SKIRMISHER}
        [dummy]
            id=sw_ability_overwatch
            weapons=heavy_blaster_pistol
            range=1
            reactions=1
            accuracy=-10
            damage=100
            name= _ "overwatch"
            description= _ "Goes on overwatch automatically when it could still attack but ends its turn without attacking (or earlier from the right-click menu, committing this turn's attack). Until its next turn, it fires 1 reaction volley(s) at enemies that move within 1 hex(es) in sight. Hidden units cannot be targeted; a moving unit that is fired on stops but keeps its remaining moves."
        [/dummy]
        [dummy]
            id=sw_ability_forward_observer
            range=6
            name= _ "forward observer"
            description= _ "Can call the side's air sorties (right-click a hex within 6 hexes that your side can see or track on sensors, then Call air support). Calling uses this unit's attack. Strafing runs hit a line of hexes at once; bombing runs hit an area at the start of your next turn. Sorties never finish off a unit."
        [/dummy]
    [/abilities]
    [attack]
        name=fists
        description= _ "fists"
        icon=attacks/fist-human.png
        type=impact
        range=melee
        damage=6
        number=2
        [specials]
            {SW_SPECIAL_FLANKING}
        [/specials]
    [/attack]
    [attack]
