[unit_type]
    id=sw_hero_lando
    name= _ "Baron Administrator"
    race=human
    gender=male
    image=units/sw-hero-lando/standing.png
    profile=portraits/sw-hero-lando.png
    hitpoints=42
    movement_type=sw_infantry
    movement=6
    experience=100
    level=2
    alignment=neutral
    advances_to=null
    cost=40
    usage=fighter
    description= _ "Lando Calrissian, gambler, general, and businessman, runs the mobile mining city on Nkllon and still enjoys long odds.

Rank abilities — Veteran: gambler's nerve; Seasoned veteran: fire discipline; Elite: expert marksman."
    {AMLA_DEFAULT}
    [advancement]
        id=sw_amla_hero_sidearm
        strict_amla=yes
        max_times=2
        description= _ "Sidearm discipline: +1 damage; full heal and cure, Max XP +20% (up to 2 times)"
        image="icons/crossed_sword_and_hammer.png"
        [effect]
            apply_to=attack
            name=blaster_pistol
            increase_damage=1
        [/effect]
        {AMLA_EFFECTS_HEAL_AND_RAISE_XP}
    [/advancement]
    [advancement]
        id=sw_amla_hero_field_care
        strict_amla=yes
        max_times=1
        description= _ "Field coordination: adjacent allies recover 4 HP/turn, slows poison (no stacking); full heal and cure, Max XP +20% (once)"
        image="icons/potion_green_medium.png"
        [effect]
            apply_to=new_ability
            [abilities]
                [heals]
                    id=sw_ability_hero_field_care
                    value=4
                    max_value=4
                    affect_allies=yes
                    affect_self=no
                    poison=slowed
                    name= _ "field coordination"
                    description= _ "Coordinates battlefield recovery: adjacent allies recover up to 4 HP at the start of this unit's turn. Slows poison; does not heal the commander or stack with other healers."
                    [affect_adjacent]
                    [/affect_adjacent]
                [/heals]
            [/abilities]
        [/effect]
        {AMLA_EFFECTS_HEAL_AND_RAISE_XP}
    [/advancement]
    # Named character: scenarios place the single instance and keep
    # it out of recruit lists.
    do_not_list=yes
    [abilities]
