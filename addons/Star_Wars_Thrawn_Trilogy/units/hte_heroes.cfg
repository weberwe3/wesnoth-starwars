            weapons=blaster_pistol
            range=1
            reactions=1
            accuracy=-10
            damage=100
            name= _ "overwatch"
            description= _ "Goes on overwatch automatically when it could still attack but ends its turn without attacking (or earlier from the right-click menu, committing this turn's attack). Until its next turn, it fires 1 reaction volley(s) at enemies that move within 1 hex(es) in sight. Hidden units cannot be targeted; a moving unit that is fired on stops but keeps its remaining moves."
        [/dummy]
        [dummy]
            id=sw_ability_forward_observer
            range=6
            name= _ "forward observer"
            description= _ "Can call the side's air sorties (right-click a hex within 6 hexes that your side can see or track on sensors, then Call air support). Calling uses this unit's attack. Strafing runs hit a line of hexes at once; bombing runs hit an area at the start of your next turn. Sorties never finish off a unit."
        [/dummy]
    [/abilities]
    [attack]
        name=fists
        description= _ "fists"
        icon=attacks/fist-human.png
        type=impact
        range=melee
        damage=5
        number=2
