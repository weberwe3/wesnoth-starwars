        description= _ "heavy blaster pistol"
        icon=attacks/sw-heavy-blaster-pistol.png
        type=fire
        range=ranged
        damage=9
        number=3
        min_range=1
        max_range=2
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
            [chance_to_hit]
