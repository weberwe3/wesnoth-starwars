    profile=portraits/sw-hero-chewbacca.png
    hitpoints=62
    movement_type=sw_wookiee
    movement=5
    experience=100
    level=2
    alignment=neutral
    advances_to=null
    cost=40
    usage=fighter
    description= _ "Chewbacca, Han Solo's Wookiee partner and copilot, has sworn a life debt and defends his friends with ferocious strength.

Rank abilities — Veteran: battle roar; Seasoned veteran: thick hide; Elite: wookiee recovery."
    {AMLA_DEFAULT}
    [advancement]
        id=sw_amla_hero_strength
        strict_amla=yes
        max_times=2
        description= _ "Close combat training: +1 damage; full heal and cure, Max XP +20% (up to 2 times)"
        image="icons/crossed_sword_and_hammer.png"
        [effect]
            apply_to=attack
            name=wookiee_strength
            increase_damage=1
        [/effect]
        {AMLA_EFFECTS_HEAL_AND_RAISE_XP}
    [/advancement]
    [advancement]
        id=sw_amla_hero_bowcaster
        strict_amla=yes
        max_times=2
        description= _ "Bowcaster calibration (normal and aimed): +1 damage; full heal and cure, Max XP +20% (up to 2 times)"
        image="icons/crossed_sword_and_hammer.png"
        [effect]
            apply_to=attack
            name=bowcaster,bowcaster_aimed
            increase_damage=1
        [/effect]
        {AMLA_EFFECTS_HEAL_AND_RAISE_XP}
    [/advancement]
    # Named character: scenarios place the single instance and keep
    # it out of recruit lists.
    do_not_list=yes
    [abilities]
        [dummy]
            id=sw_ability_overwatch
            weapons=bowcaster
            range=2
            reactions=1
            accuracy=-10
            damage=100
            name= _ "overwatch"
            description= _ "Goes on overwatch automatically when it could still attack but ends its turn without attacking (or earlier from the right-click menu, committing this turn's attack). Until its next turn, it fires 1 reaction volley(s) at enemies that move within 2 hex(es) in sight. Hidden units cannot be targeted; a moving unit that is fired on stops but keeps its remaining moves."
        [/dummy]
    [/abilities]
    [attack]
        name=wookiee_strength
        description= _ "Wookiee strength"
        icon=attacks/fist-troll.png
        type=impact
        range=melee
        damage=10
        number=3
        [specials]
            [damage]
                id=sw_special_wookiee_rage
                name= _ "Wookiee rage"
                description= _ "A wounded Wookiee's temper is legendary: +25% damage while this unit has less than half of its hit points."
                multiply=1.25
                [filter_self]
                    formula="hitpoints < max_hitpoints / 2"
                [/filter_self]
            [/damage]
            {SW_SPECIAL_FLANKING}
        [/specials]
    [/attack]
    [attack]
        name=bowcaster
        description= _ "bowcaster"
        icon=attacks/sw-bowcaster.png
        type=pierce
        range=ranged
        damage=13
        number=2
        min_range=1
        max_range=2
        [specials]
            [chance_to_hit]
                id=sw_special_range
                name= _ "range 2"
                description= _ "Reaches targets up to 2 hexes away. Each hex beyond the first lowers the chance to hit by 10%."
                sub="(10 * (distance_between(attacker.loc, defender.loc) - 1))"
                cumulative=yes
            [/chance_to_hit]
            {SW_SPECIAL_FLANKING}
        [/specials]
    [/attack]
    [attack]
