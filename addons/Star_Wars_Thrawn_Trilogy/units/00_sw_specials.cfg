# Flanking: when attacking, +10% chance to hit for each unit hostile to the
# target that stands adjacent to it on its far side -- farther from the
# attacker than the target is (for a melee attack, the three hexes behind
# the target). At most +20%. Petrified and unarmed units do not count, and
# it never applies to return fire. One special per tier, so the attack
# dialog names the exact bonus, and neither is listed when inactive.
#define SW_SPECIAL_FLANKING
    [chance_to_hit]
        id=sw_special_flanking
        name= _ "flanking +10%"
        # Empty inactive name and description: shown only while it applies.
        name_inactive=""
        description= _ "The target is flanked: allies stand on its far side. +10% chance to hit for each, up to +20%."
        description_inactive=""
        add=10
        cumulative=yes
        active_on=offense
        [filter_opponent]
            formula="(size(filter(filter(map(filter(adjacent_locs(sw_here), 'sw_l', distance_between(sw_l, sw_from) > sw_dist), 'sw_l', unit_at(sw_l)), 'sw_u', sw_u != null()), 'sw_u', enemy_of(sw_target, sw_u) and not sw_u.petrified and size(sw_u.attacks) > 0)) = 1) where sw_target = self, sw_here = loc, sw_from = other.loc, sw_dist = distance_between(loc, other.loc)"
        [/filter_opponent]
    [/chance_to_hit]
    [chance_to_hit]
        id=sw_special_flanking
        name= _ "flanking +20%"
        # Empty inactive name and description: shown only while it applies.
        name_inactive=""
        description= _ "The target is flanked: allies stand on its far side. +10% chance to hit for each, up to +20%."
        description_inactive=""
        add=20
        cumulative=yes
        active_on=offense
        [filter_opponent]
            formula="(size(filter(filter(map(filter(adjacent_locs(sw_here), 'sw_l', distance_between(sw_l, sw_from) > sw_dist), 'sw_l', unit_at(sw_l)), 'sw_u', sw_u != null()), 'sw_u', enemy_of(sw_target, sw_u) and not sw_u.petrified and size(sw_u.attacks) > 0)) >= 2) where sw_target = self, sw_here = loc, sw_from = other.loc, sw_dist = distance_between(loc, other.loc)"
        [/filter_opponent]
    [/chance_to_hit]
#enddef
