            formula="if(other = null(), false, if(unit_at(direction_from(loc, other.facing)) = null(), false, enemy_of(self, unit_at(direction_from(loc, other.facing))) and not unit_at(direction_from(loc, other.facing)).petrified))"
        [/filter_opponent]
    [/damage]
#enddef
