# Weapon specials shared by every unit file. Named 00_* so the directory
# include loads it first: a macro must be defined before it is used.

# Flanking: when attacking, +10% chance to hit for each unit hostile to the
# target that stands adjacent to it on its far side -- farther from the
# attacker than the target is (for a melee attack, the three hexes behind
# the target). At most +20%. Petrified and unarmed units do not count, and
# it never applies to return fire. One unnamed special per +10% tier; units
# list flanking once as an ability.
#define SW_SPECIAL_FLANKING
    [chance_to_hit]
        id=sw_special_flanking
        # +10% with 1 or more flankers.
        add=10
        cumulative=yes
        active_on=offense
        [filter_opponent]
            formula="if(sw_from = null() or sw_here = null(), false, size(filter(filter(map(filter(adjacent_locs(sw_here), 'sw_l', distance_between(sw_l, sw_from) > sw_dist), 'sw_l', unit_at(sw_l)), 'sw_u', sw_u != null()), 'sw_u', enemy_of(sw_target, sw_u) and not sw_u.petrified and size(sw_u.attacks) > 0)) >= 1) where sw_target = self, sw_here = loc, sw_from = if(other = null(), null(), other.loc), sw_dist = if(other = null() or loc = null(), 0, distance_between(loc, other.loc))"
        [/filter_opponent]
    [/chance_to_hit]
    [chance_to_hit]
        id=sw_special_flanking_2
        # +10% with 2 or more flankers.
        add=10
        cumulative=yes
        active_on=offense
        [filter_opponent]
            formula="if(sw_from = null() or sw_here = null(), false, size(filter(filter(map(filter(adjacent_locs(sw_here), 'sw_l', distance_between(sw_l, sw_from) > sw_dist), 'sw_l', unit_at(sw_l)), 'sw_u', sw_u != null()), 'sw_u', enemy_of(sw_target, sw_u) and not sw_u.petrified and size(sw_u.attacks) > 0)) >= 2) where sw_target = self, sw_here = loc, sw_from = if(other = null(), null(), other.loc), sw_dist = if(other = null() or loc = null(), 0, distance_between(loc, other.loc))"
        [/filter_opponent]
    [/chance_to_hit]
#enddef

# Keep core backstab identity, text and numbers. Its empty rear-hex lookup
# needs lazy if guards: WFL and/or evaluate both operands.
#define SW_SPECIAL_BACKSTAB
