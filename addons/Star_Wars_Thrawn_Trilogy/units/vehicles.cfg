#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# One original Imperial Remnant ground vehicle unit.
# Single-hex, no transport, multi-hex, or vehicle-system infrastructure.
# Uses native Wesnoth mechanics: standard attacks and defense values.
# Image references match existing add-on placeholders.

[unit_type]
    id=sw_unit_irm_ground_assault_vehicle
    name=_"Imperial Ground Assault Vehicle"
    description=_"A compact, heavily armored repulsor-based assault vehicle fielded by the Imperial Remnant. Swift and devastating in close quarters, it barrels across the battlefield delivering concentrated blaster cannon fire and crushing opposition with its reinforced hull."
    undead=no
    race=human
    icon=~add-ons/Star_Wars_Thrawn_Trilogy/images/units/human/militiaman.png
    profile=~add-ons/Star_Wars_Thrawn_Trilogy/images/portraits/human/militiaman.png
    hitpoints=52
    movement_type=foot
    level=0
    experience=0
    alignment=impressive
    cost=18
    usage=melee_fighter
    [attack]
        name=blaster_cannon
        description=_"blaster cannon"
        type=impact
        range=ranged
        min_range=2
        max_range=4
        damage=10
        number=2
    [/attack]
    [attack]
        name=reinforced_hull
        description=_"reinforced hull ram"
        type=pierce
        range=melee
        damage=12
        number=1
    [/attack]
    [defense]
        deep_water=60
        reef=60
        flat=70
        sand=70
        forest=80
        rough=80
        wall=90
        castle=90
        village=90
        unwalkable=100
        frost=70
        swamp=75
    [/defense]
    [defense]
        terrain=flat
        bonus=10
        description=_"Open terrain bonus: the Assault Vehicle's repulsor engines perform best on flat ground, maintaining stability and line of fire."
    [/defense]
    [defense]
        terrain=sand
        bonus=10
        description=_"Sand terrain bonus: the vehicle's weight distributes evenly on sandy ground, providing a stable firing platform."
    [/defense]
[/unit_type]

