#textdomain wesnoth-Star_Wars_Thrawn_Trilogy

# Bounded ranged-combat POC: Thrawn Phalanx has a melee pike and a ranged blaster.
# Native min_range/max_range demonstrate distance-band combat; engine UI may not
# fully visualize min/max range bands in the targeting overlay — see comments
# in the attack definition below where relevant.
[unit_type]
    id=Thrawn_Phalanx
    name=_"Thrawn Phalanx"
    description=_"A disciplined line infantry unit trained in coordinated shield and weapon formations. The Phalanx serves as the backbone of frontline ground operations, relying on teamwork and resilience rather than individual heroics."
    undead=no
    race=human
    icon=~add-ons/Star_Wars_Thrawn_Trilogy/images/units/human/militiaman.png
    profile=~add-ons/Star_Wars_Thrawn_Trilogy/images/portraits/human/militiaman.png
    hitpoints=48
    movement_type=foot
    level=0
    experience=0
    alignment=neutral
    cost=13
    usage=fighter
    [attack]
        name=pike
        description=_"pike"
        type=pierce
        range=melee
        damage=9
        number=2
    [/attack]
    [attack]
        name=blaster
        description=_"blaster"
        type=impact
        range=ranged
        min_range=2
        max_range=4
        damage=6
        number=2
    [/attack]
    [defense]
        deep_water=60
        reef=60
        flat=70
        sand=70
        forest=80
        rough=80
        wall=90
        castle=90
        village=90
        unwalkable=100
        frost=70
        swamp=75
    [/defense]
    [defense]
        terrain=forest
        bonus=15
        description=_"Cover bonus from forest terrain: the Phalanx's shield wall provides additional protection among trees."
    [/defense]
    [defense]
        terrain=rough
        bonus=15
        description=_"Cover bonus from rough terrain: the Phalanx's boots and formations gain stability on uneven ground."
    [/defense]
[/unit_type]

# Imperial Remnant basic infantry unit.
# Compact skirmisher with single-hex mobility and a short-range blaster
# for close-quarters engagements. Distinct from the New Republic Phalanx.
[unit_type]
    id=sw_unit_im_rem_stormtrooper
    name=_"Imperial Remnant Stormtrooper"
    description=_"A disciplined line soldier of the Imperial Remnant, enforcing order through coordinated firepower. Equipped with a compact blaster rifle and standardized armor, the Stormtrooper excels at holding key terrain and delivering accurate fire at close to medium range."
    undead=no
    race=human
    icon=~add-ons/Star_Wars_Thrawn_Trilogy/images/units/human/militiaman.png
    profile=~add-ons/Star_Wars_Thrawn_Trilogy/images/portraits/human/militiaman.png
    hitpoints=42
    movement=1
    movement_type=foot
    level=0
    experience=0
    alignment=enemy
    cost=10
    usage=skirmisher
    [attack]
        name=blaster_rifle
        description=_"blaster rifle"
        type=impact
        range=ranged
        min_range=1
        max_range=3
        damage=5
        number=2
    [/attack]
    [attack]
        name=blaster_carbine
        description=_"blaster carbine"
        type=impact
        range=melee
        damage=6
        number=2
    [/attack]
    [defense]
        deep_water=60
        reef=60
        flat=70
        sand=70
        forest=80
        rough=80
        wall=90
        castle=90
        village=90
        unwalkable=100
        frost=70
        swamp=75
    [/defense]
    [defense]
        terrain=forest
        bonus=15
        description=_"Cover bonus from forest terrain: the Stormtrooper's hardened armor provides additional protection among trees."
    [/defense]
    [defense]
        terrain=rough
        bonus=15
        description=_"Cover bonus from rough terrain: the Stormtrooper's boots and stance gain stability on uneven ground."
    [/defense]
[/unit_type]
