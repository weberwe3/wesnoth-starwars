    race=human
    icon=~add-ons/Star_Wars_Thrawn_Trilogy/images/units/human/militiaman.png
    profile=~add-ons/Star_Wars_Thrawn_Trilogy/images/portraits/human/militiaman.png
    hitpoints=42
    movement=1
    movement_type=foot
    level=0
    experience=0
    # Team affiliation is assigned by the scenario side; neutral is the
    # valid Wesnoth time-of-day alignment for this non-Force-sensitive squad.
    alignment=neutral
    cost=10
    usage=skirmisher
    [attack]
        name=blaster_rifle
        description=_"blaster rifle"
        type=impact
        range=ranged
        min_range=1
        max_range=3
        damage=5
        number=2
    [/attack]
    [attack]
        name=blaster_carbine
        description=_"blaster carbine"
        type=impact
        range=melee
        damage=6
        number=2
    [/attack]
    [defense]
        deep_water=60
        reef=60
        flat=70
        sand=70
        forest=80
        rough=80
        wall=90
        castle=90
        village=90
        unwalkable=100
        frost=70
        swamp=75
    [/defense]
    [defense]
        terrain=forest
        bonus=15
        description=_"Cover bonus from forest terrain: the Stormtrooper's hardened armor provides additional protection among trees."
    [/defense]
    [defense]
        terrain=rough
        bonus=15
        description=_"Cover bonus from rough terrain: the Stormtrooper's boots and stance gain stability on uneven ground."
    [/defense]
[/unit_type]

