# Imperial Remnant Signal Jammer Team.
# Single-hex electronic warfare unit specializing in signal disruption
# and sensor jamming. Armed with a blaster and jamming equipment,
# the Signal Jammer Team hinders enemy targeting systems and
# communications across the battlefield.
[unit_type]
    id=sw_unit_im_signal_jammer_team
    name=_"Imperial Remnant Signal Jammer Team"
    description=_"A specialized Imperial electronic warfare unit equipped with signal-jamming equipment and a blaster sidearm. The Signal Jammer Team disrupts enemy communications, degrades targeting systems, and blinds hostile sensors from a secure position. Their lightweight armor and jamming gear make them effective at denying enemy coordination, though they are vulnerable if isolated from supporting forces."
