#textdomain wesnoth-Star_Wars_Thrawn_Trilogy
[textdomain]
    name="wesnoth-Star_Wars_Thrawn_Trilogy"
    path="data/add-ons/Star_Wars_Thrawn_Trilogy/translations"
[/textdomain]

[campaign]
    id=Star_Wars_Thrawn_Trilogy
    name=_"Star Wars: Thrawn Trilogy"
    define=CAMPAIGN_STAR_WARS_THRAWN_TRILOGY
    first_scenario=01_First_Battle
[/campaign]

[campaign]
    id=Star_Wars_Thrawn_Trilogy_Dark_Force_Rising
    name= _ "Star Wars: Dark Force Rising"
    define=CAMPAIGN_STAR_WARS_DARK_FORCE_RISING
    first_scenario=sw_13_dark_force_rising_recon
[/campaign]

#ifdef CAMPAIGN_STAR_WARS_THRAWN_TRILOGY
    [binary_path]
        path=data/add-ons/Star_Wars_Thrawn_Trilogy
    [/binary_path]
    # Wesnoth registers custom types only when they are loaded through the
    # campaign's [+units] container. This must precede scenario parsing.
    [+units]
        {~add-ons/Star_Wars_Thrawn_Trilogy/units}
    [/units]
    # Define reusable macros before parsing scenarios that invoke them.
    {~add-ons/Star_Wars_Thrawn_Trilogy/utils/mission_events.cfg}
    {~add-ons/Star_Wars_Thrawn_Trilogy/scenarios}
#endif

#ifdef CAMPAIGN_STAR_WARS_DARK_FORCE_RISING
    [binary_path]
        path=data/add-ons/Star_Wars_Thrawn_Trilogy
    [/binary_path]
    [+units]
        {~add-ons/Star_Wars_Thrawn_Trilogy/units}
    [/units]
    # Campaign II has its own scenario set but shares the project's units and
    # reusable mission actions with Campaign I.
    {~add-ons/Star_Wars_Thrawn_Trilogy/utils/mission_events.cfg}
    {~add-ons/Star_Wars_Thrawn_Trilogy/scenarios/dark_force_rising}
#endif
