#textdomain wesnoth-Star_Wars_Thrawn_Trilogy
[textdomain]
    name="wesnoth-Star_Wars_Thrawn_Trilogy"
    path="data/add-ons/Star_Wars_Thrawn_Trilogy/translations"
[/textdomain]

[campaign]
    id=Star_Wars_Thrawn_Trilogy
    name= _ "Star Wars: Heir to the Empire"
    abbrev= _ "HttE"
    define=CAMPAIGN_STAR_WARS_THRAWN_TRILOGY
    first_scenario=sw_hte_01_ysalamiri_harvest
    rank=10
    year= _ "9 ABY"
    description= _ "Five years after Endor, Grand Admiral Thrawn takes command of the Imperial Remnant. Follow Luke Skywalker, Leia Organa Solo, Han Solo, and their allies from the forests of Myrkr to the shipyards of Sluis Van as the Grand Admiral's plans unfold.

Campaign I of an original, fan-made Thrawn Trilogy total conversion. Ten missions: ground battles, escapes, and space combat.

" + _ "(Intermediate level, 10 scenarios.)"
    [difficulty]
        define=EASY
        label= _ "Cadet"
        description= _ "Easy"
    [/difficulty]
    [difficulty]
        define=NORMAL
        label= _ "Officer"
        description= _ "Normal"
        default=yes
    [/difficulty]
    [difficulty]
        define=HARD
        label= _ "Veteran"
        description= _ "Hard"
    [/difficulty]
[/campaign]

[campaign]
    id=Star_Wars_Thrawn_Trilogy_Dark_Force_Rising
    name= _ "Star Wars: Dark Force Rising"
    abbrev= _ "DFR"
    define=CAMPAIGN_STAR_WARS_DARK_FORCE_RISING
    first_scenario=sw_dfr_01_the_noghri_prisoner
    rank=11
    year= _ "9 ABY"
    description= _ "Leia seeks the truth about the Noghri on their ruined homeworld. Luke meets the unstable Jedi Master Joruus C'baoth. Han and Lando search for a lost fleet of two hundred Dreadnaughts, and so does Grand Admiral Thrawn.

Campaign II of an original, fan-made Thrawn Trilogy total conversion. Ten missions." + _ "(Intermediate level, 10 scenarios.)"
    [difficulty]
        define=EASY
        label= _ "Cadet"
        description= _ "Easy"
    [/difficulty]
    [difficulty]
        define=NORMAL
        label= _ "Officer"
        description= _ "Normal"
        default=yes
    [/difficulty]
    [difficulty]
        define=HARD
        label= _ "Veteran"
        description= _ "Hard"
    [/difficulty]
[/campaign]

#ifdef CAMPAIGN_STAR_WARS_THRAWN_TRILOGY
    [binary_path]
        path=data/add-ons/Star_Wars_Thrawn_Trilogy
    [/binary_path]
    # Custom space terrains must exist before any map is parsed.
    {~add-ons/Star_Wars_Thrawn_Trilogy/utils/hte_terrain.cfg}
    # Wesnoth registers custom types only when they are loaded through the
    # campaign's [+units] container. This must precede scenario parsing.
    [+units]
        {~add-ons/Star_Wars_Thrawn_Trilogy/units}
    [/units]
    # Define reusable macros before parsing scenarios that invoke them.
    {~add-ons/Star_Wars_Thrawn_Trilogy/utils/mission_events.cfg}
    {~add-ons/Star_Wars_Thrawn_Trilogy/utils/hte_macros.cfg}
    # Campaign I (Heir to the Empire) scenarios. The retired placeholder
    # scenarios that used to live directly in scenarios/ are listed in
    # tests/retired-content.json.
    {~add-ons/Star_Wars_Thrawn_Trilogy/scenarios/heir_to_the_empire}
#endif

#ifdef CAMPAIGN_STAR_WARS_DARK_FORCE_RISING
    [binary_path]
        path=data/add-ons/Star_Wars_Thrawn_Trilogy
    [/binary_path]
    {~add-ons/Star_Wars_Thrawn_Trilogy/utils/hte_terrain.cfg}
    [+units]
        {~add-ons/Star_Wars_Thrawn_Trilogy/units}
    [/units]
    # Campaign II shares the project's units and mission macros with Campaign I.
    {~add-ons/Star_Wars_Thrawn_Trilogy/utils/mission_events.cfg}
    {~add-ons/Star_Wars_Thrawn_Trilogy/utils/hte_macros.cfg}
    {~add-ons/Star_Wars_Thrawn_Trilogy/scenarios/dark_force_rising}
#endif
